:root{--ink:#173a40;--muted:#607579;--green:#176b61;--lime:#e2f0b4;--paper:#f4f6f1;--line:#d8e3dc;--amber:#9d571d;--red:#a6373c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 system-ui,-apple-system,"Noto Sans JP","Yu Gothic",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:10px 16px;min-height:44px}button:hover{border-color:var(--green);background:#eff5ef}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--green);color:white;border-color:var(--green)}button.primary:hover{background:#12564f}button.danger{color:var(--red)}a{color:var(--green);text-underline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #d38a2e;outline-offset:3px}header{background:var(--ink);color:white;padding:25px 28px 20px}.brand{font-size:23px;font-weight:800;letter-spacing:.08em}.brand span{color:var(--lime)}.sub{font-size:13px;opacity:.82}nav{display:flex;gap:8px;overflow:auto;padding:12px 20px;background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}nav button{white-space:nowrap;border:0;padding:8px 13px;color:var(--muted)}nav button[aria-current=page]{background:#e6eee4;color:var(--green);font-weight:700}main{max-width:1160px;margin:25px auto;padding:0 24px 70px}h1{font-size:30px;line-height:1.4;margin:0 0 12px}h2{font-size:23px;margin:0 0 16px;line-height:1.5}h3{font-size:18px;line-height:1.5;margin:16px 0 10px}p{margin:10px 0 18px}.muted{color:var(--muted)}.small{font-size:13px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--green)}.hero{background:var(--ink);color:white;padding:32px;border-radius:20px;display:grid;grid-template-columns:1fr auto;gap:25px}.hero .eyebrow{color:var(--lime)}.hero h1{font-size:35px}.hero p{max-width:690px;color:#d9e8e4}.hero .big{color:var(--lime);font-size:64px;font-weight:800;line-height:1}.hero button{border:0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:20px 0}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:23px;margin-bottom:18px}.grid .card{margin:0}.metric{font-size:32px;font-weight:800;line-height:1.4}.pill{display:inline-block;border-radius:30px;background:#e8f0e6;color:var(--green);font-size:12px;padding:3px 10px;margin:0 5px 5px 0}.alert{border-left:4px solid #c78933;background:#fff3df;padding:12px 16px;margin:15px 0;border-radius:7px}.info{border-left:4px solid var(--green);background:#edf4ed;padding:14px 18px;margin:15px 0;border-radius:7px}.good{color:var(--green)}.bad{color:var(--red)}.unitlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.unitrow{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:17px;background:white}.num{font-size:22px;font-weight:800;color:#799886;min-width:35px}.unitrow strong{display:block}.filters{margin:20px 0}input,select,textarea{border:1px solid #b9cbc1;border-radius:8px;background:white;color:var(--ink);padding:10px;max-width:100%}input[type=search]{flex:1;min-width:180px}textarea{width:100%;min-height:100px}.lecture{max-width:850px}.lecture p{line-height:2.1}.lecture .section{padding:24px 0;border-bottom:1px solid var(--line)}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px;vertical-align:top}th{background:#eef3eb}.tablewrap{overflow-x:auto}details{border:1px solid var(--line);border-radius:10px;margin:12px 0;background:white}summary{padding:14px;cursor:pointer;font-weight:650}details .inside{padding:0 17px 17px}.option{display:flex;gap:12px;width:100%;text-align:left;align-items:flex-start;margin:12px 0;padding:17px 18px}.option .badge{border-radius:50%;background:#edf2e9;min-width:29px;height:29px;text-align:center;line-height:29px;font-weight:800}.option.selected{border:2px solid var(--green);background:#edf5ee}.option.right{border-color:var(--green);background:#e7f3e8}.option.wrong{border-color:#bb6064;background:#fff1ee}.explain{background:white;border-left:4px solid #b4cbbd;padding:16px 18px;margin:12px 0}.timer{font-variant-numeric:tabular-nums;font-size:25px;font-weight:800}.timer.urgent{color:var(--red)}.qnav{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin:15px 0}.qnav button{padding:5px;min-width:0}.qnav .answered{background:#e2efe5}.qnav .flag{box-shadow:inset 0 -4px #d6983b}.qnav .current{border:2px solid var(--green)}.progress{height:8px;background:#e7eee5;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:#50917a}.cardface{padding:35px 24px;text-align:center;min-height:220px;display:grid;place-content:center}.cardface h2{font-size:26px}.source{font-size:12px;color:var(--muted)}.source a{overflow-wrap:anywhere}.actions{margin:20px 0}.empty{padding:40px;text-align:center;background:white;border:1px dashed var(--line);border-radius:14px}#saveStatus{padding:7px 24px;font-size:12px;background:#e7efe5}#saveStatus.warn{background:#ffe7c9;color:#7d3711}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;max-width:92%;background:var(--ink);color:white;border-radius:10px;z-index:20;box-shadow:0 8px 30px #0002}footer{padding:22px;text-align:center;color:var(--muted);font-size:12px}.chartrow{display:grid;grid-template-columns:150px 1fr 65px;gap:12px;align-items:center;margin:12px 0}.split{display:grid;grid-template-columns:1fr 270px;gap:24px}.sticky{position:sticky;top:82px;align-self:start}.notes{font-size:14px}.pagehead{margin:25px 0}.check{color:var(--green)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:760px){header{padding:20px}.brand{font-size:21px}main{padding:0 14px 60px;margin-top:18px}h1{font-size:25px}.hero{padding:24px;grid-template-columns:1fr}.hero h1{font-size:29px}.hero .count{display:flex;gap:12px;align-items:baseline}.hero .big{font-size:48px}.grid,.two,.unitlist,.split{grid-template-columns:1fr}.card{padding:18px}.sticky{position:static}.qnav{grid-template-columns:repeat(10,1fr);gap:4px}.qnav button{font-size:13px;min-height:38px}.option{padding:14px 12px;font-size:15px}.chartrow{grid-template-columns:105px 1fr 52px;font-size:13px}nav{padding:9px 10px}nav button{font-size:14px;padding:8px 10px}.row>label{max-width:100%}td,th{padding:9px}.source{overflow-wrap:anywhere}}@media print{header,nav,#saveStatus,.actions,button,footer{display:none!important}main{max-width:none;padding:0}.card{border:0}.lecture{max-width:none}details{display:block}.inside{display:block!important}.grid{display:block}body{background:white}}
.term-help{color:#68765c;font-size:.86em;font-weight:400}.visual-intro{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;margin:22px 0}.visual-intro h2{margin-top:18px}.concept-map{display:grid;gap:12px;margin:20px 0}.map-route{display:grid;grid-template-columns:minmax(0,1fr) 32px minmax(0,1.4fr);align-items:center;gap:10px}.map-start,.map-end{padding:15px;border-radius:14px;overflow-wrap:anywhere}.map-start{background:#fff2d5}.map-end{background:#e9f3e8;border:1px solid #c8deca}.map-number{display:inline-grid;place-items:center;border-radius:50%;background:#e9c679;width:25px;height:25px;margin-right:7px;font-weight:700}.map-arrow{font-size:28px;text-align:center;color:var(--green)}.mascot{width:72px;height:72px;flex-shrink:0}.talk{display:flex;gap:14px;align-items:flex-start;margin:20px 0}.talk>div{min-width:0;flex:1}.speaker{font-size:12px;font-weight:700;margin-bottom:4px}.bubble{border-radius:3px 18px 18px 18px;padding:15px 18px;background:#edf5e9;line-height:1.9}.learner .bubble{background:#fff2d5}.tiny-mission{padding:16px;background:#f4f6ef;border-radius:12px;border-left:4px solid #d8a54b}.step-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.step-tabs button{font-size:14px;padding:8px 12px}.step-tabs button[aria-pressed=true]{background:#176b61;color:white;border-color:#176b61}.people-diagram{display:grid;grid-template-columns:minmax(0,1fr) 95px minmax(0,1fr);align-items:center;text-align:center;margin:20px 0;background:#f9f8ed;padding:18px;border-radius:16px}.people-diagram>div{min-width:0}.people-diagram .mascot{display:block;margin:0 auto 8px}.people-diagram strong{display:block}.support-arrow{color:var(--green);font-size:14px}.case-result{background:#eaf3e9;border-radius:14px;padding:18px}.case-result p{margin-bottom:0}.lecture .section{padding:18px 0}.deep-reading>summary{font-size:17px}.deep-reading>.inside{padding:5px 22px 22px}.wordbar{margin-bottom:16px}@media(max-width:760px){.visual-intro{padding:16px;border-radius:17px}.mascot{width:54px;height:54px}.talk{gap:9px}.bubble{padding:12px}.map-route{grid-template-columns:minmax(0,1fr) 22px minmax(0,1.15fr);gap:6px}.map-start,.map-end{padding:10px;font-size:14px}.map-arrow{font-size:23px}.people-diagram{grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr);padding:12px 8px;font-size:14px}.support-arrow{font-size:12px}.deep-reading>.inside{padding:0 12px 16px}}@media print{.deep-reading>.inside{display:block!important}.step-tabs{display:none}.term-help{color:#555}}

'use strict';
const DATA={"version": "2026.2", "exam": "2026-10-18", "standard": "2026-04-01", "checked": "2026-10-08", "units": [{"id": "01", "title": "制限行為能力・契約の入口", "group": "権利関係", "sources": ["civil"], "article": "3条の2・4〜21条", "facts": [{"tag": "意思能力", "yes": "意思表示をした時に意思能力がなければ、その法律行為は無効である。", "no": "意思能力を欠いていても、売買契約は取り消されるまでは有効である。", "why": "意思能力の欠如は無効の問題であり、制限行為能力による取消しとは異なる。", "ref": "3条の2"}, {"tag": "未成年の売却", "yes": "未成年者の同意のない土地売却は、原則として取り消すことができる。", "no": "法定代理人の同意なく未成年者がした土地売却は、必ず初めから無効である。", "why": "取消し得る行為であって当然無効ではない。単に権利を得、義務を免れる行為等は別扱い。", "ref": "5条"}, {"tag": "後見と生活", "yes": "成年被後見人が行った日用品の購入は、行為能力を理由には取り消せない。", "no": "成年被後見人が日用品を購入した場合も、後見人は常に取り消せる。", "why": "日用品の購入その他日常生活に関する行為には取消しの例外がある。", "ref": "9条"}, {"tag": "保佐の土地処分", "yes": "被保佐人が不動産を処分するには、原則として保佐人の同意が必要である。", "no": "被保佐人の不動産処分には、保佐人の同意は一切必要ない。", "why": "不動産その他重要な財産に関する権利の得喪は同意を要する重要行為。", "ref": "13条"}, {"tag": "相手方の催告", "yes": "未成年者の法定代理人への追認催告は、1か月以上の期間を定めて行う。", "no": "未成年者の法定代理人に3日間の期限で催告すれば、沈黙は法定の追認とみなされる。", "why": "法定の催告期間は1か月以上。催告先と返答の効果を一緒に確認する。", "ref": "20条"}, {"tag": "能力を偽る行為", "yes": "制限行為能力者が行為能力者だと信じさせるため詐術を用いた場合、当該行為を取り消せない。", "no": "制限行為能力者は、能力者だと信じさせる詐術を用いても必ず取り消せる。", "why": "取引相手を積極的に欺いた者には行為能力の保護による取消しを認めない。", "ref": "21条"}, {"tag": "権利だけを得る行為", "yes": "未成年者は、負担のない贈与を受ける契約を法定代理人の同意なく行える。", "no": "未成年者が負担のない贈与を受けるにも、例外なく法定代理人の同意が必要である。", "why": "単に権利を得、又は義務を免れる行為は同意不要。負担付贈与とは分ける。", "ref": "5条"}], "lecture": ["家を売る契約では、署名があるかより先に「その人が判断できたか」「法律上の保護が必要な人か」を考えます。意思能力を欠く時の契約は無効、制限行為能力者の契約は原則として取消しの対象です。この二つは効果が違います。無効は初めから効力がなく、取消しは取り消すまでは一応有効で、取消しによって初めから無効だった扱いになります。", "未成年者には法定代理人の同意、成年被後見人には後見人の代理という保護が基本です。保佐と補助は保護の範囲が異なるので、年齢や成年後見の名称だけで決めず、対象行為と同意権の範囲を確認します。相手方の催告や詐術は取引の安定を守る制度であり、保護される人がどこまで自分で確答できるかが鍵です。"], "example": "17歳の売主が親の同意を得ず土地を売った。意思能力があっても、未成年を理由とする取消しの問題が残る。成人後の追認と契約時の同意を分けて確認する。", "compare": "意思能力なし→無効／同意のない未成年者の契約→原則取消可能／単に未成年と告げなかった→直ちに詐術ではない", "memory": "成年18歳・催告は1か月以上・成年被後見人の日用品購入は取消不可", "trap": "「未成年ならすべて取消し」「被保佐人は単独契約が一切できない」は広げすぎ。", "supplement": [["保佐と補助を一段深く", "保佐は民法13条の重要行為に同意を要し、借財・保証、不動産の権利得喪、訴訟、相続の承認放棄や遺産分割等が含まれます。補助は本人の同意の下で家庭裁判所が特定の行為に同意権を付与する仕組みです。どちらも単に名称だけで契約能力を全部失うわけではありません。取消権者は本人や法定代理人等。追認をする場合は取消原因が解消した後等の要件も確認します。催告では、未成年者の法定代理人への沈黙は原則追認、無権代理の本人への沈黙は追認拒絶という違いがあります。"]]}, {"id": "02", "title": "意思表示・錯誤・詐欺・強迫", "group": "権利関係", "sources": ["civil"], "article": "93〜96条・121条", "facts": [{"tag": "真意でない表示", "yes": "心裡留保でも、相手方が真意でないことを知らず知ることもできなかった場合、原則として有効である。", "no": "冗談のつもりで行った意思表示は、相手方の認識にかかわらず常に無効である。", "why": "心裡留保は原則有効。相手方が知り又は知ることができた場合は無効となる。", "ref": "93条"}, {"tag": "仮装の売買", "yes": "通謀虚偽表示の無効は、善意の第三者に対抗できない。", "no": "通謀虚偽表示の無効は、善意の第三者にも常に対抗できる。", "why": "虚偽の外観を自ら作った当事者より、それを信じた第三者を保護する。", "ref": "94条"}, {"tag": "重要な錯誤", "yes": "法律行為の目的と社会通念に照らして重要な錯誤による意思表示は、要件を満たせば取り消せる。", "no": "現行民法では、重要な錯誤による意思表示は取消しではなく当然無効である。", "why": "2020年施行改正で錯誤の効果は無効から取消しに変わった。", "ref": "95条"}, {"tag": "第三者による詐欺", "yes": "第三者が詐欺をした場合、相手方がその事実を知り又は知ることができたときに取り消せる。", "no": "第三者による詐欺は、相手方が善意無過失でも常に取り消せる。", "why": "相手方にも悪意又は過失がある場合に取消しが認められる。", "ref": "96条2項"}, {"tag": "転売先の保護", "yes": "詐欺による取消しは、善意かつ無過失の第三者に対抗できない。", "no": "詐欺による取消しは、悪意の第三者にも対抗できない。", "why": "保護されるのは善意無過失の第三者。悪意の転売先には取消しを対抗できる。", "ref": "96条3項"}, {"tag": "脅迫と取消し", "yes": "強迫による意思表示は、相手方に過失がなくても取り消せる。", "no": "第三者の強迫による意思表示は、相手方が悪意の場合だけ取り消せる。", "why": "第三者詐欺の相手方要件を強迫に持ち込まない。", "ref": "96条"}, {"tag": "動機の食い違い", "yes": "基礎とした事情に関する錯誤では、その事情が法律行為の基礎とされていることの表示が必要である。", "no": "将来値上がりすると心の中で期待していれば、その期待だけで必ず錯誤取消しができる。", "why": "単なる内心の期待では足りない。基礎事情の表示と重要性等が必要。", "ref": "95条2項"}], "lecture": ["契約書の価格を見間違えた人、騙された人、脅された人は同じ「気の毒な買主」でも法律の扱いが異なります。錯誤では法律行為の目的や取引上の社会通念に照らして重要か、基礎事情が表示されているかを判断します。詐欺では第三者による詐欺と契約相手による詐欺を分けます。", "第三者保護の条件も制度ごとに違います。通謀虚偽表示は善意の第三者、詐欺取消しと錯誤取消しは善意かつ無過失の第三者を保護します。強迫取消しにはこの第三者保護の規定がありません。まず当事者間の効力を決め、その後に転売先との関係を検討すると整理できます。"], "example": "売主と買主が差押え逃れのため売ったふりをし、買主から事情を知らない第三者が取得した。仮装売買は当事者間で無効でも、善意の第三者への主張は制限される。", "compare": "虚偽表示→当事者間無効・善意第三者保護／詐欺→取消し・善意無過失第三者保護／強迫→取消し・同じ保護規定なし", "memory": "錯誤は現在「取消し」・動機の錯誤は基礎事情の表示・第三者詐欺は相手の悪意又は有過失", "trap": "善意だけで足りる制度と無過失も必要な制度を混ぜない。", "supplement": [["錯誤の重過失・到達", "表意者に重大な過失があると錯誤取消しは原則できません。ただし相手方が錯誤を知り又は重大な過失で知らなかった場合や、同一の錯誤に陥っていた場合には例外があります。意思表示は原則相手方に到達した時に効力を生じます。通知を相手が正当な理由なく妨げた場合等の扱いは別です。取消しの意思表示は原則到達主義ですが、宅建業法のクーリング・オフは書面の発信時に効力が生じる特則です。強迫の第三者保護を、詐欺と同じ善意無過失で整理しないでください。"]]}, {"id": "03", "title": "代理・無権代理・表見代理", "group": "権利関係", "sources": ["civil"], "article": "99〜118条", "facts": [{"tag": "代理の法律効果", "yes": "権限内で本人のためにすることを示した代理行為の効果は、原則として本人に直接帰属する。", "no": "適法な代理による売買の効果は、まず代理人に帰属し、その後本人に移転する。", "why": "代理人を経由して権利が移るのではなく、本人が契約当事者になる。", "ref": "99条"}, {"tag": "代理人の能力", "yes": "代理人は、行為能力者であることを要しない。", "no": "未成年者を売買の代理人に選任すると、その代理行為は年齢だけを理由に常に取り消せる。", "why": "代理人の行為能力と本人の行為能力は区別する。", "ref": "102条"}, {"tag": "本人の返事待ち", "yes": "無権代理の相手方は、本人に相当の期間を定めて追認するか催告できる。", "no": "無権代理の相手方は、本人に追認の催告をすることが法律上禁止される。", "why": "相手方を不安定な状態から解放するため催告権がある。", "ref": "114条"}, {"tag": "沈黙の効果", "yes": "追認の催告に本人が期間内に確答しないときは、追認を拒絶したものとみなされる。", "no": "無権代理の追認催告に本人が沈黙した場合、追認したものとみなされる。", "why": "制限行為能力の法定代理人への催告と逆の効果。", "ref": "114条"}, {"tag": "相手方の取消し", "yes": "無権代理であることを契約時に知らなかった相手方は、本人の追認前なら契約を取り消せる。", "no": "無権代理と知らなかった相手方も、本人の追認前に契約を取り消すことはできない。", "why": "契約時に無権代理を知っていた相手方にはこの取消権がない。", "ref": "115条"}, {"tag": "追認の時点", "yes": "本人の追認は、別段の意思表示がなければ契約時に遡って効力を生ずるが、第三者の権利を害せない。", "no": "無権代理の追認は必ず追認時からだけ有効であり、契約時に遡らない。", "why": "遡及が原則で、第三者保護が限界になる。", "ref": "116条"}, {"tag": "双方の代理", "yes": "双方代理は原則禁止されるが、本人があらかじめ許諾した行為等は例外となる。", "no": "本人があらかじめ許諾しても、双方代理は例外なく無権代理になる。", "why": "債務の履行と本人の事前許諾は例外。単なる便宜だけで例外にはならない。", "ref": "108条"}], "lecture": ["営業担当者が売主の代理として契約すると、法律効果は代理人ではなく売主に直接帰属します。そのためには代理権があり、本人のためにすることを示す顕名が原則です。仲介は契約成立を助ける仕事、代理は本人に代わって意思表示をする仕事です。実務の名称ではなく権限の中身を見ます。", "権限のない人が署名した場合は、本人が追認しなければ原則として本人に効力がありません。相手方の催告・取消し、無権代理人の責任を分けて検討します。表見代理は「本人が作った外観」と「相手方の信頼の正当性」を一定要件で保護する仕組みなので、無権代理なら必ず表見代理というわけではありません。"], "example": "管理だけ任されたAが売却契約まで締結した。管理の権限があることと売却権限があることは別。本人の追認又は表見代理の要件を調べる。", "compare": "有権代理→本人に効果／無権代理→本人の追認待ち／表見代理→外観と相手方保護要件を個別判断", "memory": "追認は原則契約時に遡る・無権代理の催告への沈黙は追認拒絶", "trap": "本人が沈黙したら承諾、という誤解に注意。", "supplement": [["代理権の範囲と利益相反", "本人のためと示さない代理人の意思表示は原則自己のためにしたものとみなしますが、相手方が代理と知り又は知ることができた場合は別です。代理権の範囲が定まらないときは保存行為と物・権利の性質を変えない利用改良ができます。復代理は任意代理と法定代理で選任要件が異なり、任意代理では本人の許諾又はやむを得ない事由が基本です。表見代理には代理権授与表示、権限外、消滅後の類型があり、本人の外観作出や基本代理権、相手方の善意無過失又は正当理由等の要件を類型ごとに検討します。"]]}, {"id": "04", "title": "時効・期間・権利の消滅", "group": "権利関係", "sources": ["civil"], "article": "144〜169条", "facts": [{"tag": "一般債権の時効", "yes": "一般の債権は、権利を行使できることを知った時から5年間行使しないと消滅時効が完成し得る。", "no": "一般債権は、権利行使できると知った時から必ず20年間は時効にならない。", "why": "主観的起算点5年と客観的起算点10年の二本立て。", "ref": "166条"}, {"tag": "取得時効の短期", "yes": "所有の意思をもつ平穏公然の占有が始まった時に善意無過失なら、10年で所有権を時効取得し得る。", "no": "占有開始時に善意なら、過失があっても必ず10年で所有権を取得できる。", "why": "10年には善意と無過失の双方が必要。", "ref": "162条"}, {"tag": "裁判と援用", "yes": "時効は、当事者等が援用しなければ裁判所がそれに基づいて裁判できない。", "no": "裁判所は時効期間の経過を発見したら、援用がなくても必ず時効を適用する。", "why": "期間経過と訴訟での援用を分ける。", "ref": "145条"}, {"tag": "督促状の限界", "yes": "催告があると、その時から6か月を経過するまで時効の完成が猶予される。", "no": "催告状を送れば、時効期間は常に最初から5年間に更新される。", "why": "催告は完成猶予であり更新ではない。", "ref": "150条"}, {"tag": "借りを認めた場合", "yes": "債務者による権利の承認があると、時効はその時から新たに進行する。", "no": "債務者が債務を承認しても、消滅時効には一切影響しない。", "why": "一部弁済等が承認と評価される場合もある。具体的事実の判断が必要。", "ref": "152条"}, {"tag": "事前の放棄", "yes": "時効の利益は、あらかじめ放棄できない。", "no": "契約時に将来の消滅時効の利益を放棄する約束は、常に有効である。", "why": "時効完成前の利益の事前放棄は禁止。完成後とは分ける。", "ref": "146条"}, {"tag": "所有権の扱い", "yes": "所有権は、権利を行使しないという理由だけでは消滅時効にかからない。", "no": "所有権も使用しなければ、一般債権と同じく5年で当然に消滅する。", "why": "他人による取得時効は別問題。所有権それ自体の消滅時効とは異なる。", "ref": "166条2項"}], "lecture": ["長く権利を使わないと、証拠が失われ、取引関係も変わります。時効はこうした状態を安定させる制度です。取得時効は他人の物を自分の物として占有した人の問題、消滅時効は債権者が請求しない問題です。取得と消滅で要件や期間は違います。", "債権の消滅時効は「権利行使できると知った時から5年」と「権利行使できる時から10年」の二つの経路を意識します。時効が完成しても裁判所が自動的に使うわけではなく、援用が必要です。催告は永遠に時効を止める制度ではありません。承認による更新と、催告による完成猶予を言葉から区別しましょう。"], "example": "買主の残代金が支払われない。支払期を知ってから放置した期間と、途中の債務承認の有無を時系列で書くと、時効の判断がしやすい。", "compare": "取得時効→占有／消滅時効→不行使／承認→更新／催告→6か月の完成猶予", "memory": "取得20年・善意無過失なら10年／一般債権は知った時5年・行使可能時10年", "trap": "催告の繰り返しで無期限に延長できるとは考えない。", "supplement": [["取得時効を時系列で解く", "20年の取得時効では占有開始時の善意無過失を必要としませんが、所有の意思・平穏公然等の要件は必要です。借りて使うだけの占有は、自分が所有者であるとしての占有と同じではありません。占有の承継では前主の占有を併せて主張する場合にその瑕疵も承継します。裁判上の請求等は完成猶予や更新の効果があり、取り下げた場合と確定判決で権利が確定した場合で違います。催告の完成猶予中に再度催告しても、その再催告による追加の完成猶予は生じません。"]]}, {"id": "05", "title": "不動産物権・登記・登記義務", "group": "権利関係", "sources": ["civil", "registration", "address"], "article": "176・177条／不動産登記法", "facts": [{"tag": "登記前の売買", "yes": "不動産の所有権移転は、原則として当事者の意思表示だけで効力を生ずる。", "no": "不動産売買では、登記が完了するまで当事者間でも所有権移転が法律上絶対に生じない。", "why": "民法176条の意思主義。契約の特約による移転時期の調整は別。", "ref": "176条"}, {"tag": "二重売買", "yes": "不動産物権の得喪変更は、原則として登記がなければ第三者に対抗できない。", "no": "二重売買では、先に代金を全額払った買主が登記なしで常に優先する。", "why": "代金支払の先後ではなく登記が原則の対抗要件。", "ref": "177条"}, {"tag": "登記への信頼", "yes": "不動産登記には原則として公信力がない。", "no": "真の権利者でない登記名義人から善意無過失で買えば、登記の公信力により必ず所有権を取得する。", "why": "登記を信じたことだけで無権利者からの取得が保護されるわけではない。", "ref": "177条の解釈"}, {"tag": "住所等の変更", "yes": "2026年4月1日以後の所有権登記名義人の住所等変更は、原則として変更日から2年以内に変更登記が必要である。", "no": "2026年4月1日以後も、所有権登記名義人の住所変更登記は完全に任意である。", "why": "2026年4月1日施行の義務化。正当な理由のない違反は5万円以下の過料の対象。", "ref": "不動産登記法76条の5・164条"}, {"tag": "相続を知った日", "yes": "相続により所有権を取得したことを知った日から、原則3年以内に相続登記を申請する義務がある。", "no": "相続登記の申請期限は、相続による取得を知った日から一律2年である。", "why": "相続は3年、住所等変更は2年。相続人申告登記等の制度もある。", "ref": "不動産登記法76条の2"}, {"tag": "古い住所の変更", "yes": "2026年4月1日前に住所を変更して未登記だった場合も義務化の対象となり、原則2028年3月31日までに申請する。", "no": "住所変更が2026年4月1日前なら、未登記でも新しい義務の対象から永久に除外される。", "why": "施行前変更にも経過措置を伴って義務が適用される。", "ref": "改正法附則・法務省Q&A"}, {"tag": "共同申請の原則", "yes": "権利に関する登記は、法律に別段の定めがある場合を除き、登記権利者と登記義務者が共同申請する。", "no": "通常の売買による所有権移転登記は、買主が常に単独で申請しなければならない。", "why": "売買移転の共同申請が原則。相続や確定判決等には単独申請の例外がある。", "ref": "不動産登記法60・63条"}], "lecture": ["不動産売買は、当事者の意思表示だけで所有権が移るのが民法の原則です。一方、別の買主など第三者に「自分が所有者だ」と主張するには登記が必要です。契約の成立要件、所有権移転の時期、第三者への対抗要件を三段階に分けます。登記がなくても売主には契約上の権利を主張できます。", "登記には原則として公信力がありません。名義人が真の所有者でないなら、それを信じたという理由だけで所有権を取得できるわけではありません。さらに2024年の相続登記義務化、2026年の住所等変更登記義務化は、対抗要件とは別の行政上の義務です。起算点と過料を混同しないことが重要です。"], "example": "二重売買で先に契約したAと後に買ったBが争う。原則は登記の先後だが、Bが背信的悪意者かという事情によって結論が変わる。単に先の売買を知っているだけとは区別する。", "compare": "売主との関係→原則意思表示／第三者との関係→登記／相続登記→知った日から3年／住所変更→変更日から2年", "memory": "相続登記の過料10万円以下・住所等変更の過料5万円以下・施行前の未登記住所変更は2028年3月31日まで", "trap": "「悪意ならすべて登記不要」ではない。背信的悪意者の例外を広げない。", "supplement": [["登記の各欄と仮登記", "表題部には土地建物の物理的状況等、権利部の甲区には所有権、乙区には抵当権等の所有権以外の権利が記録されます。仮登記は将来の本登記の順位を保全しますが、仮登記の段階で本登記と同じ対抗力を得るものではありません。登記の順位と真実の権利の有無は別です。二重売買の後の買主が先の売買を知っているだけでは一般に第三者性は否定されず、背信的悪意者かを検討します。相続登記と住所変更登記の義務化は、売主への請求に登記が必要かという民法177条の問題とは別に整理します。"]]}, {"id": "06", "title": "共有・相隣関係", "group": "権利関係", "sources": ["civil"], "article": "209〜264条", "facts": [{"tag": "保存と管理", "yes": "共有物の保存行為は、各共有者が単独でできる。", "no": "共有物の保存行為にも、常に共有者全員の同意が必要である。", "why": "現状を維持する保存は各自可能。管理や変更とは要件が違う。", "ref": "252条5項"}, {"tag": "共有地の管理", "yes": "通常の共有物の管理は、持分価格の過半数で決める。", "no": "共有地の管理は、持分割合にかかわらず共有者の人数の過半数で決める。", "why": "基準は人頭数ではなく持分価格。", "ref": "252条1項"}, {"tag": "軽い変更", "yes": "形状又は効用の著しい変更を伴わない共有物の変更は、持分価格の過半数で決められる。", "no": "共有物は、著しくない変更でも例外なく全員同意が必要である。", "why": "2023年施行改正で軽微変更を管理の規律で処理する。", "ref": "251・252条"}, {"tag": "持分の売却", "yes": "各共有者は、原則として自己の持分を他の共有者の承諾なく譲渡できる。", "no": "土地の共有持分だけを売る場合も、常に全共有者の承諾が必要である。", "why": "自分の持分の処分と共有物全体の処分を分ける。", "ref": "206・249条の解釈"}, {"tag": "分割請求", "yes": "共有物分割をしない旨の契約は、5年以内の期間で定められる。", "no": "共有物の分割を永久に禁止する契約を、民法の原則どおり自由に締結できる。", "why": "不分割契約は5年以内、更新もその時から5年以内。", "ref": "256条"}, {"tag": "越境した枝", "yes": "越境した枝は、竹木の所有者に切除を催告して相当期間内に切除しない場合、土地所有者が切除できる。", "no": "越境した枝は、催告や急迫事情などに関係なく土地所有者が常に直ちに切除できる。", "why": "催告後不履行、所有者又は所在不明、急迫事情等の法定要件が必要。", "ref": "233条3項"}, {"tag": "越境した根", "yes": "隣地の竹木の根が境界線を越えるときは、土地所有者がその根を切り取れる。", "no": "越境した根を切り取るには、枝と全く同じく必ず催告後の待機が必要である。", "why": "根と枝は規律が異なる。枝に関する例外を根にそのまま当てはめない。", "ref": "233条4項"}], "lecture": ["相続した土地を兄弟で共有すると、持分を持っていることと土地全体を自由に売れることは別になります。共有物の保存は各共有者ができますが、管理は持分価格の過半数、形状又は効用の著しい変更は原則として全員の同意が必要です。人数だけを数えると間違えます。", "隣地関係では、境界の所有者がそれぞれ自分の権利を持ちながら、土地を使えるよう最低限の調整が行われます。公道に通じない土地の通行、枝や根の越境、隣地使用は別の制度です。2023年施行の民法改正で枝の切除等が変わりました。「隣地の木は自由に切れる」という極端な理解は禁物です。"], "example": "持分Aが3分の2、Bが3分の1なら、通常の管理はAの賛成で過半数を満たす。しかし土地全体の売却はAの多数だけでは進められない。", "compare": "保存→各自／管理→持分価格の過半数／著しい変更→原則全員／軽微変更→管理扱い", "memory": "枝は催告後相当期間・所有者不明・急迫事情の例外／根は自ら切除可", "trap": "人数の過半数と持分価格の過半数を取り違えない。", "supplement": [["相隣関係と共有の解除", "公道に通じない土地の所有者には周囲の土地を通行する権利が認められ得ますが、場所と方法は必要性と損害の少なさで調整され、原則償金の問題があります。分割で囲まれた場合等には特則があるので、すべて無償としません。建物築造・修繕や境界調査等のための隣地使用も目的と必要範囲、通知等の要件があり、隣人の住家へは承諾なく立ち入れません。共有者は原則分割請求でき、協議がまとまらなければ裁判で現物分割、賠償分割、競売等が検討されます。持分の譲渡だけと土地全体の処分は分けてください。"]]}, {"id": "07", "title": "抵当権・担保・物上代位", "group": "権利関係", "sources": ["civil"], "article": "369〜398条の22", "facts": [{"tag": "家の使用継続", "yes": "抵当権設定者は、原則として抵当不動産の占有を移さず使用を続けられる。", "no": "抵当権は、必ず銀行に住宅の占有を移さなければ成立しない。", "why": "抵当権は非占有型の担保権。", "ref": "369条"}, {"tag": "火災保険金", "yes": "抵当権の物上代位では、保険金等の払渡し前に差押えをすることが必要である。", "no": "抵当権者は、保険金が所有者へ払い渡された後でも差押え不要で常に物上代位できる。", "why": "払渡し等前の差押えにより代替価値を確保する。", "ref": "372条・304条"}, {"tag": "建物を残す権利", "yes": "抵当権設定時に土地と建物が同一所有者に属し、実行で所有者が異なった場合、法定地上権が成立し得る。", "no": "抵当権設定時に更地であった土地に後から家を建てれば、土地競売時に必ず法定地上権が成立する。", "why": "設定時の建物存在と同一所有等が必要。更地への後築とは違う。", "ref": "388条"}, {"tag": "順位の確認", "yes": "同一不動産に複数の抵当権がある場合、その順位は原則として登記の前後による。", "no": "抵当権の優先順位は、融資金額の大きい順に決まる。", "why": "金額の大小ではなく登記の先後が原則。", "ref": "373条"}, {"tag": "第三者の担保提供", "yes": "物上保証人は、担保を提供したという理由だけでは、原則として債務全額の人的支払義務を負わない。", "no": "物上保証人は抵当権を設定しただけで、当然に連帯保証人と同じ全額の人的債務を負う。", "why": "担保物で責任を負うことと、個人として保証債務を負うことは別。", "ref": "372条・351条"}, {"tag": "賃借人の猶予", "yes": "抵当権に対抗できない一定の建物賃借人は、買受けから6か月間の明渡猶予を受けられる。", "no": "抵当権に対抗できないすべての土地賃借人に、買受けから6か月の建物明渡猶予が適用される。", "why": "民法395条は一定の建物使用者を対象にする。土地賃貸借に一般化しない。", "ref": "395条"}, {"tag": "根抵当の限度", "yes": "根抵当権は、一定範囲に属する不特定債権を極度額の限度で担保する。", "no": "根抵当権は極度額を超えて無制限に債権を担保する。", "why": "極度額が担保責任の上限。普通抵当の特定債権への付従性と対比する。", "ref": "398条の2・398条の3"}], "lecture": ["住宅ローンの抵当権は、銀行が家を占有せず、返済が止まった時に競売代金から優先弁済を受ける権利です。所有者は通常の使用を続けられます。質権のように引渡しを基本とする担保とは違います。売却を考える営業では、抵当権の登記と残債を把握し、引渡し時にどう抹消するかを確認します。", "担保が火災保険金など別の価値に姿を変えた場合には、物上代位が問題になります。建物の賃貸借との優劣、法定地上権、根抵当権も基本の仕組みから考えます。法定地上権は建物を残すための制度ですが、抵当権設定時の土地・建物の所有関係など要件があります。どの競売でも当然に発生するわけではありません。"], "example": "土地とその上の家を同じ人が所有し、土地だけに抵当権を設定。その実行で所有者が分かれた場合は、建物利用のため法定地上権の成立を検討する。", "compare": "抵当権→占有移転なし／質権→原則引渡し／普通抵当→特定債権／根抵当→極度額内の一定範囲の債権", "memory": "物上代位は払渡し等前の差押え・建物明渡猶予は一定の場合6か月", "trap": "抵当権設定後の賃貸借がすべて銀行に対抗できるわけではない。", "supplement": [["留置権・質権・付従性", "留置権は他人の物を占有し、その物に関して生じた弁済期にある債権等の要件の下で、弁済まで留置できる担保です。原則として占有を失えば消滅し、抵当権のように登記して占有なしで保持する制度ではありません。質権は目的物の引渡しが基本で、動産質権と不動産質権を分けます。普通抵当権は担保する債権が消滅すると原則ともに消滅する付従性を持ちます。根抵当権の元本確定前は個別債権と単純に連動しません。法定地上権は設定時の建物存在・同一所有関係等を確認し、土地と建物が初めから別所有の事例へ無条件に使わないでください。"]]}, {"id": "08", "title": "債務不履行・保証・弁済・相殺", "group": "権利関係", "sources": ["civil", "rate"], "article": "404〜520条", "facts": [{"tag": "金銭の支払遅延", "yes": "金銭債務の不履行の損害賠償について、債務者は不可抗力を抗弁にできない。", "no": "金銭債務は、不可抗力があれば常に遅延損害金を免れる。", "why": "金銭債務について民法419条が特則を置く。", "ref": "419条"}, {"tag": "保証書の形式", "yes": "保証契約は、書面又は内容を記録した電磁的記録によらなければ効力を生じない。", "no": "保証契約は口頭だけでも、書面と同じく必ず有効である。", "why": "主債務契約が諾成でも保証契約には方式が必要。", "ref": "446条"}, {"tag": "個人の根保証", "yes": "個人根保証契約は、極度額を定めなければ効力を生じない。", "no": "個人が家賃を根保証する場合、極度額を定めなくても常に有効である。", "why": "個人保証人に想定外の無限定責任を負わせないための要件。", "ref": "465条の2"}, {"tag": "連帯保証の抗弁", "yes": "連帯保証人には、催告の抗弁権と検索の抗弁権がない。", "no": "連帯保証人も普通保証人と同じく、まず主債務者へ請求せよと催告の抗弁を主張できる。", "why": "連帯保証は催告・検索の抗弁がない。保証自体の付従性とは別。", "ref": "454条"}, {"tag": "2026年の利率", "yes": "2026年4月1日から2029年3月31日までの法定利率は年3％である。", "no": "2026年4月1日から法定利率は自動的に年5％へ戻った。", "why": "法務省公表の第3期法定利率は年3％のまま。約定利率とは区別する。", "ref": "404条・法務省告示説明"}, {"tag": "相殺の通知", "yes": "相殺は、相手方に対する意思表示によって行い、その意思表示には条件又は期限を付けられない。", "no": "相殺の意思表示には、任意の停止条件を自由に付けられる。", "why": "相殺適状の要件と相殺の意思表示を分ける。", "ref": "506条"}, {"tag": "受領できない債権者", "yes": "債権者が受領を拒む場合等に、債務者は法定要件の下で弁済供託によって債務を免れられる。", "no": "債権者が受領を拒むと、債務者は供託をしても永久に債務を免れない。", "why": "供託は弁済の代替手段となる。受領拒否等の要件が必要。", "ref": "494条"}], "lecture": ["代金を払わない、引渡しが遅れる、履行できなくなる。契約上の義務が果たされない場面では、履行の請求、損害賠償、解除を分けます。損害賠償には帰責事由の判断が関わり、解除には別の要件があります。金銭債務の遅滞は不可抗力を理由に免責されないのが重要な特徴です。", "保証は主たる債務に付随しますが、普通保証と連帯保証で催告・検索の抗弁が異なります。個人の根保証は極度額を明確にしないと効力を生じません。相殺は「自分が相手に持つ債権」と「相手が自分に持つ債権」をぶつける制度なので、第三者の債権を勝手に使えません。2026年4月からの法定利率も年3％で変わりません。"], "example": "貸主が個人の父親に家賃の根保証を頼むなら、保証書の存在だけでなく極度額の定めが必要。上限のない「全部責任を持つ」では足りない。", "compare": "普通保証→催告・検索の抗弁あり／連帯保証→両抗弁なし／解除→損害賠償と別判断", "memory": "法定利率年3％・個人根保証は極度額・保証契約は書面又は電磁的記録", "trap": "解除できるなら必ず損害賠償もできる、とは限らない。", "supplement": [["連帯債務・債権譲渡", "連帯債務では債権者は一人に全部の履行を請求できます。弁済等で共同免責を得た連帯債務者には内部負担に応じた求償の問題があります。現行法は相対的効力が原則で、更改、相殺、混同等の例外を個別に整理します。債権譲渡は原則可能で、譲渡制限の意思表示があっても譲渡が直ちに無効になるわけではありません。債務者への対抗は譲渡人の通知又は債務者の承諾、第三者対抗には原則確定日付のある証書等が必要です。自働債権と受働債権の弁済期や差押えとの関係など、相殺にも追加の要件があります。"]]}, {"id": "09", "title": "売買・解除・契約不適合", "group": "権利関係", "sources": ["civil"], "article": "533・541〜572条", "facts": [{"tag": "修理の請求", "yes": "引き渡された物が種類・品質・数量について契約に適合しない場合、買主は原則として追完を請求できる。", "no": "契約不適合があっても、買主は修補や代替物の引渡しを一切請求できない。", "why": "追完は修補、代替物、不足分の引渡し等。買主の帰責事由がある場合は別。", "ref": "562条"}, {"tag": "催告後の解除", "yes": "債務不履行の催告解除は、債務者に帰責事由がない場合でも要件を満たせば可能である。", "no": "契約の解除には、例外なく債務者の故意又は過失が必要である。", "why": "解除と損害賠償で帰責事由の扱いが違う。軽微な不履行では催告解除できない。", "ref": "541条"}, {"tag": "通知の起算点", "yes": "種類又は品質の不適合は、原則として買主が知った時から1年以内に売主へ通知する必要がある。", "no": "種類又は品質の不適合の通知期限は、民法上例外なく引渡しから1年である。", "why": "起算点は知った時。売主の悪意又は重過失の場合は通知期間の制限が適用されない。", "ref": "566条"}, {"tag": "手付と履行着手", "yes": "別段の定めのない解約手付では、相手方が履行に着手するまで、買主は手付放棄で解除できる。", "no": "解約手付による解除は、相手方が履行に着手した後も買主が自由にできる。", "why": "判断は解除する者自身ではなく相手方の履行着手。", "ref": "557条"}, {"tag": "全部履行不能", "yes": "債務全部の履行が不能となったとき、債権者は原則として催告なく解除できる。", "no": "全部履行不能でも、解除には必ず相当期間の催告をしなければならない。", "why": "催告をしても目的が達成できないため無催告解除の類型となる。", "ref": "542条"}, {"tag": "知っていた不具合", "yes": "売主は、知りながら告げなかった事実については、免責特約があっても責任を免れない。", "no": "売主が雨漏りを知りながら黙っていても、免責特約があれば必ず免責される。", "why": "免責特約にも法定の限界がある。", "ref": "572条"}, {"tag": "減額と追完", "yes": "買主は原則として相当期間を定めて追完を催告し、期間内に追完がなければ不適合に応じた代金減額を請求できる。", "no": "代金減額請求は、追完の可能性にかかわらず常に催告なしでのみ行う。", "why": "原則催告が必要。追完不能等には無催告減額の例外がある。", "ref": "563条"}], "lecture": ["契約不適合は、購入した物件が契約で約束した種類・品質・数量に合っていない問題です。「欠陥があるか」だけでなく、何を合意したかが出発点です。追完、代金減額、損害賠償、解除はそれぞれ要件が違います。買主の責任で生じた不適合を売主に押し付けることはできません。", "解除は原則として相当期間の催告をしてからですが、全部履行不能などでは無催告解除が認められます。解除に債務者の帰責事由は必須ではありません。売主が宅建業者で買主が非業者なら宅建業法の8種制限も重ねて確認します。民法の原則だけで特約の有効性を決めると間違えます。"], "example": "契約書に雨漏りなしと書いた中古住宅で雨漏りが判明。修補が可能か、通知をいつしたか、売主が知っていたかを整理して買主の請求を検討する。", "compare": "追完→修補等／減額→原則催告後／賠償→帰責事由の検討／解除→帰責事由不要だが解除要件必要", "memory": "種類・品質の不適合通知は原則知った時から1年・数量不足とは扱いが異なる", "trap": "知った時から1年は「訴えを起こす期限」ではなく原則通知期間。", "supplement": [["委任・請負・危険負担", "請負は仕事の完成に対して報酬を払う契約、委任は法律行為を委託する契約で、準委任は法律行為でない事務の委託です。請負では完成前の注文者の解除と損害賠償、委任では各当事者の任意解除と不利な時期の解除等の責任を分けます。受任者には善管注意義務があり、無報酬だから注意義務がないとは言えません。売買で双方の責めに帰せない事由により引渡し前の家が滅失した場合、買主は原則代金支払を拒めます。危険負担、履行不能、損害賠償、解除をそれぞれ別に判断し、引渡し後の危険移転の特則も確認します。"]]}, {"id": "10", "title": "不法行為・損害賠償", "group": "権利関係", "sources": ["civil"], "article": "709〜724条の2", "facts": [{"tag": "基本の責任", "yes": "故意又は過失によって他人の権利等を侵害した者は、要件を満たすと損害賠償責任を負う。", "no": "不法行為責任は、加害者と被害者に契約がある場合だけ成立する。", "why": "契約の存在は一般不法行為責任の必須要件ではない。", "ref": "709条"}, {"tag": "被害者にも過失", "yes": "被害者に過失があるとき、裁判所は損害賠償額を定めるに当たりこれを考慮できる。", "no": "被害者に少しでも過失があれば、加害者の責任は必ず全部消える。", "why": "過失相殺は減額等を判断する制度であり自動的な全免責ではない。", "ref": "722条2項"}, {"tag": "倒れた塀", "yes": "工作物の占有者が必要な注意を尽くしたときは、所有者が損害を賠償する。", "no": "工作物の占有者が注意を尽くした場合、所有者も必ず免責される。", "why": "所有者の責任はこの場合無過失責任となる。", "ref": "717条"}, {"tag": "通常の短期時効", "yes": "通常の不法行為の賠償請求権は、損害及び加害者を知った時から3年で時効消滅し得る。", "no": "物的損害だけの通常の不法行為でも、短期時効は知った時から一律10年である。", "why": "生命・身体の侵害の5年特則と区別。", "ref": "724条"}, {"tag": "けがをした場合", "yes": "生命又は身体の侵害による不法行為の短期消滅時効は、損害及び加害者を知った時から5年である。", "no": "生命又は身体の侵害でも、短期消滅時効は必ず知った時から3年である。", "why": "被害者保護のため5年とする特則。", "ref": "724条の2"}, {"tag": "共同の加害", "yes": "共同不法行為の各加害者は、原則として連帯して損害賠償責任を負う。", "no": "共同不法行為の各加害者は、被害者に対して常に頭数で割った額だけ負担する。", "why": "被害者に対する連帯責任と加害者間の内部負担は別。", "ref": "719条"}, {"tag": "使用者の求償", "yes": "使用者責任を負った使用者は、被用者に対する求償権を当然に失うわけではない。", "no": "使用者が被害者へ賠償すると、被用者に対する求償は法律上すべて禁止される。", "why": "求償は認められ得るが、信義則による制限等の個別判断がある。", "ref": "715条3項"}], "lecture": ["仲介中の事故や説明上の違法行為で損害を与えた場合、契約がなくても不法行為責任を負うことがあります。故意又は過失、権利・法律上保護される利益の侵害、損害、因果関係を順に見ます。契約責任と不法行為責任は根拠が違うので、取引相手以外への責任も考えられます。", "建物の塀が倒れた場合には工作物責任、従業員の業務中の行為には使用者責任、複数の加害者には共同不法行為が問題になります。工作物の占有者が必要な注意を尽くした場合に所有者が責任を負う点は、単純な過失責任と違います。期間も通常の不法行為と生命・身体の被害で異なります。"], "example": "管理中の建物の塀が倒れて通行人が負傷した。設置・保存の瑕疵、占有者の注意、所有者の責任を順に判断し、修理業者への求償とは分けて考える。", "compare": "一般不法行為→故意過失／工作物占有者→注意で免責余地／工作物所有者→占有者免責時は無過失責任", "memory": "通常は損害・加害者を知って3年、行為から20年／生命身体は知って5年", "trap": "すべての不法行為の短期時効を3年で覚えない。", "supplement": [["使用者責任・未成年の責任能力", "事業の執行について被用者が損害を与えた場合、使用者責任が問題になります。選任及び監督に相当の注意をした場合等の法定免責があり、求償にも信義則上の制限があります。未成年でも自己の行為の責任を弁識する知能があれば当然免責ではありません。責任能力を欠く者の監督義務者の責任は別の規定で判断します。一般の不法行為では行為時から20年という長期の消滅時効もあり、短期期間だけで判断しません。生命・身体侵害の債務不履行についても長期20年の特則があるので、契約責任と不法行為責任の期限を分けます。"]]}, {"id": "11", "title": "相続・遺言・遺留分", "group": "権利関係", "sources": ["civil"], "article": "887〜1049条", "facts": [{"tag": "配偶者と子", "yes": "配偶者と子が共同相続する場合、法定相続分は配偶者2分の1、子全体2分の1である。", "no": "配偶者と子が共同相続する場合、子の人数にかかわらず全員が同じ法定相続分になる。", "why": "子が複数なら子全体の2分の1を均等に分けるのが原則。", "ref": "900条"}, {"tag": "相続放棄の手続", "yes": "相続放棄は、原則として自己のために相続開始があったことを知った時から3か月以内に家庭裁判所へ申述する。", "no": "相続放棄は、兄弟間の口約束だけで家庭裁判所の手続なく法律上完了する。", "why": "熟慮期間と家庭裁判所への申述を確認する。期間伸長の制度もある。", "ref": "915・938条"}, {"tag": "兄弟の遺留分", "yes": "兄弟姉妹には遺留分がない。", "no": "兄弟姉妹にも、子と同じ割合の遺留分が必ず認められる。", "why": "遺留分権利者は兄弟姉妹以外の相続人。", "ref": "1042条"}, {"tag": "現在の請求方法", "yes": "遺留分侵害額請求は、原則として金銭の支払を求めるものである。", "no": "遺留分を請求すると、不動産は現行法でも必ず当然に共有になる。", "why": "2019年改正後は金銭債権化。旧来の減殺と混同しない。", "ref": "1046条"}, {"tag": "子が先に死亡", "yes": "被相続人の子が相続開始前に死亡した場合、その子の子は要件を満たせば代襲相続する。", "no": "被相続人の子が相続放棄した場合、その子の子は放棄だけを理由に代襲相続する。", "why": "放棄は代襲原因ではない。先死亡、欠格、廃除等と区別。", "ref": "887条"}, {"tag": "自筆証書の目録", "yes": "自筆証書遺言に添付する財産目録は、自書しなくてもよいが各ページの署名押印等の要件がある。", "no": "自筆証書遺言は、財産目録を含む全書類を例外なくすべて自書しなければならない。", "why": "財産目録には方式緩和がある。本文の自書原則は残る。", "ref": "968条"}, {"tag": "兄弟と配偶者", "yes": "配偶者と兄弟姉妹が共同相続する場合、法定相続分は配偶者4分の3、兄弟姉妹全体4分の1である。", "no": "配偶者と兄弟姉妹が共同相続する場合、配偶者の法定相続分は必ず2分の1である。", "why": "相手が子か直系尊属か兄弟姉妹かで配偶者の割合が変わる。", "ref": "900条"}], "lecture": ["相続物件の売却では、亡くなった人の名義だけを見て話を進められません。配偶者は常に相続人となり、子、直系尊属、兄弟姉妹には順位があります。法定相続分は法律上の目安で、遺言や遺産分割によって実際の取得は変わります。取得の内容を確定してから登記や売却の段階へ進みます。", "相続放棄は家庭裁判所への申述で行い、兄弟間の「自分はいらない」という話だけとは違います。遺留分は一定の相続人を保護しますが、兄弟姉妹にはありません。現在の遺留分侵害額請求は金銭請求であり、当然に物件の共有状態を作る制度ではありません。遺言の方式や自筆証書の財産目録の例外も整理します。"], "example": "妻と子2人がいる売主が死亡。法定相続分は妻2分の1、子は残り2分の1を等分する。家を妻が取得する合意は別途遺産分割として検討する。", "compare": "配偶者＋子→1/2ずつ／＋直系尊属→2/3と1/3／＋兄弟姉妹→3/4と1/4", "memory": "放棄は原則知って3か月・遺留分は兄弟姉妹なし・侵害額請求は金銭", "trap": "遺産分割で何も取得しないことと家庭裁判所の相続放棄は別。", "supplement": [["承認・限定承認・配偶者居住権", "相続には単純承認、限定承認、放棄があり、限定承認は共同相続人全員で行う必要があります。放棄者は初めから相続人でなかったものとみなされるため、代襲原因とは異なります。遺産分割の対第三者関係、法定相続分を超える権利承継の対抗要件は登記と合わせて確認します。配偶者居住権は、建物所有権を取得しなくても居住を保護する法定の権利であり、相続開始時の居住等と遺産分割・遺言等の成立要件が必要です。短期居住権とは期間・成立・登記の扱いが異なります。公正証書遺言と法務局保管の自筆証書遺言では検認の扱いも確認します。"]]}, {"id": "12", "title": "借地権・定期借地", "group": "権利関係", "sources": ["lease"], "article": "2〜25条", "facts": [{"tag": "借地権の目的", "yes": "借地借家法の借地権は、建物所有を目的とする地上権又は土地賃借権である。", "no": "建物所有目的のない駐車場の土地賃貸借にも、必ず普通借地の30年存続期間が適用される。", "why": "適用は建物所有目的かどうかで判断。", "ref": "2条"}, {"tag": "普通借地の期間", "yes": "普通借地権の存続期間は原則30年であり、これより長い期間は契約で定められる。", "no": "普通借地権は、当事者が10年と定めれば必ず10年で終了する。", "why": "短い定めは原則30年となる。定期借地の特則とは別。", "ref": "3条"}, {"tag": "建物登記で対抗", "yes": "借地権の登記がなくても、借地人が登記された建物を所有する場合、原則として第三者に対抗できる。", "no": "借地権は土地賃借権の登記がなければ、借地人名義の建物登記があっても絶対に対抗できない。", "why": "建物登記による対抗力が借地人を保護する。", "ref": "10条"}, {"tag": "一般定期借地", "yes": "一般定期借地権は、存続期間50年以上で更新等を排除する特約を所定の方式で定める。", "no": "一般定期借地権は、期間20年であっても一般定期借地として有効に設定できる。", "why": "50年以上という期間要件。特約の書面又は法定電磁的記録等の方式も必要。", "ref": "22条"}, {"tag": "事業用の住宅", "yes": "事業用定期借地権は、居住用建物の所有を目的として設定できない。", "no": "賃貸マンション経営は事業なので、居住用マンションにも事業用定期借地権を設定できる。", "why": "事業という語より「居住用を除く建物」の要件が重要。", "ref": "23条"}, {"tag": "公正証書の意味", "yes": "事業用定期借地権の設定契約は、公正証書によってしなければならない。", "no": "事業用定期借地権は、普通の私署契約書だけで公正証書と同じく設定できる。", "why": "事業用は公正証書必須。一般定期との方式差を覚える。", "ref": "23条3項"}, {"tag": "更新を拒む地主", "yes": "普通借地の更新拒絶には、土地利用の必要性、従前の経過、利用状況、財産給付の申出等を考慮した正当事由が必要である。", "no": "普通借地の地主は、期限が来れば理由を問わず常に更新を拒める。", "why": "契約終了の主張だけでは足りず正当事由が必要。", "ref": "6条"}], "lecture": ["借地借家法の借地権は、建物所有を目的とする地上権又は土地賃借権です。駐車場として借りるだけの契約に、建物所有目的の借地の保護をそのまま当てはめません。普通借地は長い利用を守り、更新拒絶には正当事由が必要です。土地賃借権の譲渡には原則地主の承諾が必要で、建物売却とセットで考えます。", "定期借地は更新しない制度ですが、種類によって期間と方式が異なります。一般定期借地、事業用定期借地、建物譲渡特約付借地を比較し、事業用に居住用建物は含まれないことを確認します。借地権の登記がなくても借地人名義の建物登記で対抗できるという実務上重要な保護もあります。"], "example": "借地上の住宅を売る相談では、土地の所有権売却ではなく建物売却と借地権譲渡を検討する。地主承諾がない場合の裁判所の許可制度も確認する。", "compare": "普通→当初30年・初回更新20年・以後10年／一般定期→50年以上／事業用→10年以上50年未満・公正証書", "memory": "建物譲渡特約は30年以上・事業用は専ら事業用で居住用除外", "trap": "「借地」ならすべて借地借家法が適用される、とは限らない。", "supplement": [["定期借地の三つの型", "一般定期借地は50年以上で、更新、再築による期間延長、建物買取請求をしない旨を所定の方式で定めます。事業用定期借地は10年以上50年未満、公正証書が必要で、30年以上50年未満の型と10年以上30年未満の型には更新排除等の規律に違いがあります。建物譲渡特約付借地は30年以上で、一定時期に相当対価で建物を地主へ譲渡する特約により借地権を消滅させます。普通借地の更新後期間は最初20年、次から10年で、より長い合意は可能です。借地権譲渡の裁判所許可、建物買取請求等も承諾問題と合わせて確認してください。"]]}, {"id": "13", "title": "借家・定期借家・賃貸借", "group": "権利関係", "sources": ["lease", "civil"], "article": "借地借家法26〜40条・民法601〜622条の2", "facts": [{"tag": "引渡しと対抗力", "yes": "建物賃貸借は、登記がなくても建物の引渡しがあれば原則第三者に対抗できる。", "no": "建物賃貸借は、引渡しを受けても賃借権登記がない限り絶対に第三者に対抗できない。", "why": "借家の対抗要件は建物の引渡し。借地の建物登記とは違う。", "ref": "31条"}, {"tag": "短い普通借家", "yes": "期間を1年未満と定めた普通建物賃貸借は、期間の定めがないものとみなされる。", "no": "普通建物賃貸借を6か月と定めれば、必ず6か月で更新なく終了する。", "why": "定期借家にはこのみなし規定を適用しない。", "ref": "29・38条"}, {"tag": "貸主からの解約", "yes": "期間の定めのない普通借家に対する貸主の解約申入れは、原則6か月後に効力を生じ、正当事由も必要である。", "no": "期間の定めのない普通借家は、貸主が通知した翌日に理由なく終了する。", "why": "期間と正当事由の二つを確認する。", "ref": "27・28条"}, {"tag": "定期借家の説明", "yes": "定期借家では、契約前に更新がなく期間満了で終了する旨を法定の方法で説明する必要がある。", "no": "定期借家では、契約書に期間があれば事前の更新なし説明は一切不要である。", "why": "説明を欠くと更新がない旨の定めが無効となる。", "ref": "38条"}, {"tag": "終了通知の期間", "yes": "期間1年以上の定期借家では、貸主は原則満了の1年前から6か月前までに終了通知をする。", "no": "期間1年以上の定期借家でも、終了通知は満了前日に行えば常に満了時の終了を対抗できる。", "why": "通知を遅れてした場合は、通知から6か月後に終了を対抗できる。", "ref": "38条6項"}, {"tag": "敷金の返還", "yes": "賃貸借が終了して賃貸物を返還したとき、貸主は未払債務を差し引いた敷金を返還する。", "no": "敷金は、未払家賃があっても常に全額を無条件で返還しなければならない。", "why": "敷金は担保であり、残債務を控除した残額を返す。", "ref": "民法622条の2"}, {"tag": "通常損耗", "yes": "通常の使用収益による損耗と経年変化は、民法の原則では借主の原状回復義務から除かれる。", "no": "退去時は、通常損耗や経年変化も民法の原則により借主が必ず全額負担する。", "why": "特約の有効性は別途検討。原則と特約を分ける。", "ref": "民法621条"}], "lecture": ["借家では、賃借人の生活や事業を守るため、普通借家の更新拒絶と解約申入れに制約があります。一方、賃料不払でも小さな遅れだけで即座に明渡しが認められるとは限らず、判例の信頼関係破壊の考え方が重要です。試験では条文の期限と、解除を認める具体的事情を分けて読んでください。", "定期借家は期間満了で終了する制度なので、契約とは別に更新がないことの事前説明が必要です。借主に不利益な特約が何でも有効というわけではありません。敷金は家賃等を担保し、退去時に未払債務を差し引いて返還します。通常損耗と借主の故意過失による損傷を区別すると原状回復の理解が進みます。"], "example": "定期借家の書面に署名をもらっただけで、更新なしの事前説明をしていない。契約書があることだけで更新排除を有効にできるとは限らない。", "compare": "普通借家→更新拒絶に正当事由／定期借家→法定方式と事前説明／1年未満の普通借家→期間の定めなし扱い", "memory": "貸主解約申入れ6か月・定期借家1年以上は終了通知1年前〜6か月前", "trap": "定期借家契約書そのものと事前説明書の役割を混同しない。", "supplement": [["賃料・修繕・中途解約", "普通借家では、経済事情等により不相当になった賃料の増減請求が問題になります。定期借家で賃料改定の特約がある場合には法32条の適用除外があります。賃貸人は原則必要な修繕義務を負い、賃借人の責めに帰すべき事由によるものは別です。借主の責任でない一部使用不能では賃料が割合に応じ当然減額される民法の規定があります。定期借家の居住用200㎡未満では、転勤・療養・介護等のやむを得ない事情で生活本拠として使えなくなったとき、解約申入れから1か月で終了する特則があります。一般の途中解約自由とは違います。"]]}, {"id": "14", "title": "区分所有・マンションの決議【2026改正】", "group": "権利関係", "sources": ["condo", "condochanges"], "article": "4・17・18・22・31・39・62条", "facts": [{"tag": "共用廊下の扱い", "yes": "構造上区分所有者全員の共用に供される廊下は、専有部分の目的とならない。", "no": "共用廊下は、規約で定めれば必ず一人の専有部分に変更できる。", "why": "法定共用部分は構造上の共用性により専有部分にできない。", "ref": "4条"}, {"tag": "規約変更の母数", "yes": "2026年4月1日以後の法定原則では、規約変更は所定の定足数の下で出席した区分所有者と議決権の各4分の3以上で決する。", "no": "2026年4月1日以後も規約変更の賛成要件は、例外なく全区分所有者と全議決権の各4分の3以上のままである。", "why": "改正により出席者基準へ。定足数や特別影響者の承諾を省略してはいけない。", "ref": "31条"}, {"tag": "敷地利用権の分離", "yes": "敷地利用権が数人で有する所有権等の場合、原則として専有部分と分離して処分できない。", "no": "マンションの敷地利用権は、規約の定めに関係なく常に専有部分と自由に分離処分できる。", "why": "分離処分禁止が原則で、規約による別段の定め等には例外がある。", "ref": "22条"}, {"tag": "買主への規約効力", "yes": "規約及び集会の決議は、区分所有者の特定承継人にも効力を生ずる。", "no": "中古マンションの買主は、前の所有者の時代の規約に一切拘束されない。", "why": "売買で取得した買主も規約等の効力を受ける。", "ref": "46条"}, {"tag": "保存行為", "yes": "共用部分の保存行為は、原則として各共有者ができるが、規約で別段の定めを置ける。", "no": "共用部分の保存行為は、必ず建替えと同じ総数5分の4の決議が必要である。", "why": "保存、管理、著しい変更、建替えを分ける。", "ref": "18条"}, {"tag": "建替えの原則", "yes": "建替え決議の多数要件は原則区分所有者と議決権の各5分の4以上で、所定の客観的事由がある場合に緩和される。", "no": "2026年改正で、すべての建替えは出席者の単純過半数だけで可能になった。", "why": "総数基準の原則5分の4を維持。耐震性不足等の法定事由で各4分の3等へ緩和する。", "ref": "62条"}, {"tag": "欠席者と定足数", "yes": "改正後の規約変更では、法定原則として区分所有者数と議決権それぞれの過半数が出席する必要がある。", "no": "改正後は出席者基準になったので、規約変更に法定の定足数は一切ない。", "why": "出席者基準と定足数はセット。規約で法定原則より重い定足数を定められる。", "ref": "31条"}], "lecture": ["マンションでは一住戸の所有権だけでなく、共用部分と敷地利用権を一体として理解します。廊下など構造上の共用部分は規約で専有部分にできません。共用部分の持分と専有部分は原則分離して処分できず、買主は規約の内容にも拘束されます。規約は住民全体の生活ルールですが、法律に反する定めまで自由に作れるわけではありません。", "2026年4月1日施行改正では、管理関係の集会決議を原則出席者の多数で行う仕組みに変え、特別決議には法定の定足数を設けました。普通決議の定足数は規約等を確認します。規約の設定・変更・廃止は、原則として区分所有者と議決権それぞれ過半数の出席を要し、出席した区分所有者と議決権それぞれ4分の3以上で決します。建替えの原則5分の4は総数を基準にするので、何でも出席者基準にしないでください。"], "example": "所有者数・議決権が各100で全員同じ議決権、60人が出席する規約変更では、法定原則なら45人の賛成で4分の3を満たす。規約の加重要件や特別の影響を受ける者の承諾は別に確認する。", "compare": "管理関係決議→原則出席者基準／規約変更→定足数各過半数・賛成各3/4／建替え→原則総数各4/5・法定事由で緩和", "memory": "基準日当日の施行なので新法対象・人数と議決権の両方・建替え緩和は一律でない", "trap": "旧法の総数4分の3を規約変更に使わない。標準管理規約は法律そのものではない。", "supplement": [["改正の例外まで確認", "普通決議には法39条の原則として出席者の各過半数を用いますが、普通決議に特別決議と同じ法定定足数があるわけではありません。規約等の別段の定めを確認します。共用部分の著しい変更は法定原則として定足数各過半数・出席者各4分の3で、規約による緩和等もあります。瑕疵除去やバリアフリー化の所定変更では各3分の2へ緩和する特則があります。所在等不明区分所有者は、裁判所の決定で集会決議の母数から除外できる制度が新設されました。管理者が独断で欠席者を除外してよいわけではありません。建替えの4分の3緩和は耐震性・火災安全性不足等の法定事由と基準を満たす場合です。"]]}, {"id": "15", "title": "宅建業の範囲・免許", "group": "宅建業法", "sources": ["takken", "takkenrules", "takkenorder"], "article": "2・3・11条", "facts": [{"tag": "賃貸の取引形態", "yes": "自ら所有建物を賃貸する行為は、宅建業法の宅建業に含まれない。", "no": "自らマンションを反復して賃貸するには、そのことだけで必ず宅建業免許が必要である。", "why": "自己賃貸は対象外。賃貸の代理又は媒介は対象になる。", "ref": "2条2号"}, {"tag": "免許を分ける場所", "yes": "二つ以上の都道府県に事務所を設けて宅建業を営む場合、大臣免許が必要である。", "no": "二つ以上の都道府県に所在する物件を扱うだけで、必ず大臣免許が必要である。", "why": "判断基準は物件所在地ではなく事務所設置。", "ref": "3条"}, {"tag": "営業できる地域", "yes": "知事免許の宅建業者も、原則として全国の宅地建物を取り扱える。", "no": "知事免許業者は、その都道府県内の物件しか取り扱えない。", "why": "免許区分は営業対象地域を制限するものではない。", "ref": "3条の解釈"}, {"tag": "有効期間", "yes": "宅建業免許の有効期間は5年である。", "no": "宅建業免許の有効期間は、宅建士登録と同じく無期限である。", "why": "免許5年、宅建士登録は更新制ではない。", "ref": "3条2項"}, {"tag": "免許の更新申請", "yes": "免許更新申請は、原則有効期間満了日の90日前から30日前までに行う。", "no": "免許更新申請は、満了日の翌日から30日以内に行えば必ず間に合う。", "why": "期限前の更新申請が必要。適法申請後の処分待ちには効力継続の規定がある。", "ref": "3条・施行規則3条"}, {"tag": "国の取引", "yes": "国及び地方公共団体には、宅建業法の規定を適用しない。", "no": "地方公共団体も、宅地分譲には常に知事免許が必要である。", "why": "適用除外の主体。民間会社一般やすべての公的法人へ広げない。", "ref": "78条"}, {"tag": "名義を貸す行為", "yes": "宅建業者は、自己の名義をもって他人に宅建業を営ませてはならない。", "no": "免許業者の承諾があれば、無免許者がその名義で宅建業を営んでよい。", "why": "免許制度を潜脱する名義貸しは禁止。", "ref": "13条"}], "lecture": ["宅建業に当たるかは、物件、取引の形、業として行うかの三つで判断します。宅地は現在の地目だけでは決まりません。建物の敷地に供する土地等と、用途地域内の一定の土地が含まれます。自ら賃貸する行為は宅建業に含まれず、賃貸を代理・媒介する行為は含まれます。", "免許は人や会社に与えられ、事務所の置き方で大臣免許と知事免許を分けます。物件の所在地で分けるわけではありません。営業地域は全国なので、大阪の知事免許業者が東京の物件を仲介することも可能です。免許を持つだけでは営業開始できず、保証金等の準備も必要です。"], "example": "大阪だけに事務所を置く会社が東京の中古住宅を媒介する。東京に事務所を設けないなら、物件が東京という理由だけで大臣免許にはならない。", "compare": "自ら売買→対象／自ら賃貸→対象外／賃貸媒介→対象／事務所1都道府県→知事・2以上→大臣", "memory": "免許有効期間5年・更新申請は満了90日前〜30日前", "trap": "物件の数・場所と事務所の数・場所を分ける。", "supplement": []}, {"id": "16", "title": "免許の欠格・届出・監督", "group": "宅建業法", "sources": ["takken", "takkenrules", "takkenorder"], "article": "5・9・11・65〜70条", "facts": [{"tag": "復権と免許", "yes": "破産手続開始決定を受けた者でも、復権を得ればその破産による免許欠格は解消する。", "no": "復権を得た破産者も、破産だけを理由に一生宅建業免許を受けられない。", "why": "欠格は復権を得ない者。5年待機の刑罰等とは違う。", "ref": "5条"}, {"tag": "刑罰と期間", "yes": "拘禁刑以上の刑に処せられた者は、原則として刑の執行終了等から5年経過するまで免許欠格となる。", "no": "拘禁刑以上でも宅建業に関係のない罪なら、執行終了直後から必ず免許を受けられる。", "why": "拘禁刑以上は罪名を宅建業関連に限定しない。執行猶予等は別途要件を確認。", "ref": "5条"}, {"tag": "変更の届出", "yes": "商号、役員、事務所等の所定の変更は、原則30日以内に免許権者へ届け出る。", "no": "役員変更は、次の免許更新まで届け出なくてよい。", "why": "更新を待つのではなく変更届を行う。", "ref": "9条"}, {"tag": "業務停止の長さ", "yes": "業務停止処分は、1年以内の期間を定めて行われる。", "no": "業務停止処分は、法律上最長5年間である。", "why": "指示・停止・取消しの違いと期間を整理する。", "ref": "65条"}, {"tag": "取消しの権限", "yes": "大臣免許業者の免許を取り消すのは、原則として国土交通大臣である。", "no": "大臣免許業者の免許を、物件所在地の知事が自由に取り消せる。", "why": "知事の指示・停止権限と免許取消し権限を混同しない。", "ref": "66条"}, {"tag": "免許後の未開業", "yes": "免許を受けてから1年以内に事業を開始しない場合は、原則として免許取消しの対象となる。", "no": "免許取得後10年間営業を始めなくても、それを理由とする取消しはない。", "why": "1年以上継続した休止にも取消し規定がある。", "ref": "66条"}, {"tag": "死亡後の届出", "yes": "個人業者が死亡した場合、相続人は死亡を知った日から30日以内に届け出る。", "no": "個人業者死亡の届出は、相続人が知った日から5年以内でよい。", "why": "死亡そのもので免許失効。届出期限の起算点は知った日。", "ref": "11条"}], "lecture": ["免許は誰にでも与えられるわけではなく、一定の刑罰や不正行為、役員の事情等が欠格要件になります。刑の名称は2025年に拘禁刑へ改められたため、古い教材の懲役・禁錮だけの表現にも注意します。会社の場合は役員や政令使用人の要件も見ます。", "処分は指示、業務停止、免許取消しで重さが異なります。指示や業務停止は免許権者以外の知事も一定の場合に行えますが、免許取消しは免許権者が行います。事務所移転や役員変更等の変更届、廃業の届出、免許換えを「何が変わったか」で整理すると判断しやすくなります。"], "example": "大臣免許会社が大阪で違反した。大阪府知事が監督できる場合があることと、大臣免許を大阪府知事が取り消せることは別。", "compare": "指示→改善／停止→最長1年／取消し→免許権者／変更届→原則30日以内", "memory": "拘禁刑以上は刑執行終了等から5年・破産者は復権で欠格解消", "trap": "罰金ならどんな罪でも欠格、と広げない。", "supplement": []}, {"id": "17", "title": "宅建士の登録・宅建士証", "group": "宅建業法", "sources": ["takken", "takkenrules", "takkenorder"], "article": "18〜22条の4", "facts": [{"tag": "証の有効期間", "yes": "宅建士証の有効期間は5年である。", "no": "宅建士登録をした人の宅建士証は、交付後永久に更新不要である。", "why": "登録と証は別。有効期限を過ぎると証が必要な業務を行えない。", "ref": "22条の2"}, {"tag": "申請する知事", "yes": "資格登録は、原則として試験を受けた都道府県の知事に申請する。", "no": "資格登録は、全国どの知事にも無条件で自由に申請できる。", "why": "試験を行った都道府県への登録が原則。移転制度は別。", "ref": "18条"}, {"tag": "合格直後の交付", "yes": "試験合格後1年以内に宅建士証交付を受けようとする者は、法定講習が免除される。", "no": "試験合格直後でも、宅建士証交付前の法定講習は例外なく必須である。", "why": "原則講習、合格1年以内の免除をセットで理解。登録要件は別途必要。", "ref": "22条の2"}, {"tag": "説明時の提示", "yes": "重要事項説明を行う宅建士は、相手方の請求がなくても宅建士証を提示しなければならない。", "no": "宅建士は、重要事項説明でも相手から請求された時だけ宅建士証を提示すればよい。", "why": "35条説明時は積極的提示義務。その他の取引関係者からの請求時提示とは区別。", "ref": "35条4項・22条の4"}, {"tag": "登録事項の変更", "yes": "登録した氏名や住所等に変更があるときは、遅滞なく変更登録を申請する。", "no": "宅建士の住所変更登録は、次の5年更新時まで待てばよい。", "why": "登録の変更は遅滞なく。宅建業者の変更届30日との違い。", "ref": "20条"}, {"tag": "登録の移転", "yes": "登録先以外の都道府県の事務所で業務に従事する者等は、要件を満たして登録移転を申請できる。", "no": "宅建士は、単に引っ越すだけで必ず登録移転をしなければならない。", "why": "事務所での従事等が移転の要件。住所変更登録は必要でも移転とは別。", "ref": "19条の2"}, {"tag": "合格者の説明", "yes": "試験合格だけで登録も宅建士証交付も受けていない者は、宅建士として重要事項説明を行えない。", "no": "試験合格証を提示すれば、登録なしでも宅建士として重要事項説明を行える。", "why": "宅建士の法定業務には有効な宅建士証等が必要。", "ref": "2条4号・35条"}], "lecture": ["試験合格、宅建士登録、宅建士証の交付は別の段階です。試験に合格しただけでは重要事項説明を行う宅建士になれません。登録には実務経験又は登録実務講習等の要件があり、試験を受けた都道府県に申請します。登録自体に5年更新はありませんが、宅建士証には有効期間があります。", "転居すると登録事項の変更、他県の事務所に従事するなら登録移転の選択、宅建士証をなくしたなら再交付というように手続を分けます。重要事項説明時は宅建士証を提示する義務があり、相手方からの請求を待ちません。契約書への記名をする宅建士も、有効な証を持つ必要があります。"], "example": "合格証書を持つ新人に重要事項説明を頼む。登録と宅建士証交付まで確認しなければ、合格証書だけで担当できるとはいえない。", "compare": "試験合格→資格取得の入口／登録→知事登録／証→業務で宅建士として行為・有効5年", "memory": "原則実務2年又は代替要件・法定講習は原則申請前6か月以内・合格1年以内は免除", "trap": "転居だけで登録移転が必須になるわけではない。", "supplement": []}, {"id": "18", "title": "事務所・専任宅建士・案内所", "group": "宅建業法", "sources": ["takken", "takkenrules", "takkenorder"], "article": "31条の3・50条", "facts": [{"tag": "人数の端数", "yes": "事務所の宅建業従事者11人には、原則として専任宅建士3人以上が必要である。", "no": "事務所の従事者11人なら、専任宅建士は端数を切り捨てて2人で足りる。", "why": "5人に1人以上を満たすには切上げ。", "ref": "31条の3・施行令"}, {"tag": "不足の是正", "yes": "専任宅建士の法定数が不足した場合、2週間以内に基準に適合させる措置を執る必要がある。", "no": "専任宅建士が不足しても、半年以内に補充すれば法の期限を満たす。", "why": "補充等の法定期間は2週間。", "ref": "31条の3"}, {"tag": "申込みを受ける案内所", "yes": "契約締結又は申込みを受ける法定の案内所等には、成年者である専任宅建士1人以上を置くのが原則である。", "no": "申込みを受ける案内所には、宅建士の配置は一切不要である。", "why": "事務所の5分の1と案内所の1人以上を区別。", "ref": "31条の3・施行規則"}, {"tag": "開始前の届出", "yes": "所定の案内所等の届出は、業務開始の10日前までに行う。", "no": "所定の案内所等の届出は、業務終了後10日以内に行えばよい。", "why": "免許権者と所在地知事への届出が必要。", "ref": "50条2項・施行規則"}, {"tag": "現地の標識", "yes": "宅建業者は、法定の事務所や案内所等に標識を掲示しなければならない。", "no": "専任宅建士を置かない案内所では、法定の標識も常に不要である。", "why": "標識義務の範囲と専任設置義務の範囲は一致しない。", "ref": "50条1項"}, {"tag": "事務所の定義", "yes": "継続して業務を行い宅建業の契約締結権限を有する支店等は、法定の事務所となり得る。", "no": "登記に支店として記録されていない場所は、契約締結権限があっても絶対に事務所にならない。", "why": "実態と権限に着目する。", "ref": "3条・施行令1条の2"}, {"tag": "名義だけの配置", "yes": "専任宅建士は、原則としてその事務所に常勤して専ら業務に従事する者である。", "no": "別会社に常勤する人の氏名を借りるだけで、常に専任宅建士の配置要件を満たす。", "why": "専任性の実態が必要。法令・運用上の特例は要件を確認する。", "ref": "31条の3・解釈運用"}], "lecture": ["事務所は登記上の本店という形式だけでなく、継続して業務を行い契約締結権限を有する支店等も含みます。取引の窓口ごとに責任ある体制を置くため、事務所には業務従事者数に応じた専任宅建士が必要です。専任とは、その場所に常勤して専ら業務をすることが基本で、名義だけの配置ではありません。", "案内所は仕事の内容で義務が変わります。契約締結又は申込みを受ける案内所等には専任宅建士の配置と事前届出が必要です。現地に看板を置くだけの場所、物件案内だけをする場所と区別します。標識の掲示義務は専任宅建士が不要な場所にも生じるので、一つの義務から他を決めないでください。"], "example": "従事者11人の事務所は専任宅建士が3人必要。端数を切り捨てず、5人ごとに1人以上となるよう切り上げて計算する。", "compare": "事務所→5人に1人以上／契約・申込み案内所→1人以上／不足是正→2週間以内／案内所届出→開始10日前まで", "memory": "専任は成年者が原則・法定例外あり・標識と届出と設置を別々に判定", "trap": "案内所に必ず5分の1配置、という覚え方は誤り。", "supplement": []}, {"id": "19", "title": "営業保証金", "group": "宅建業法", "sources": ["takken", "takkenrules", "takkenorder", "guaranteerules"], "article": "25〜30条", "facts": [{"tag": "本店の保証額", "yes": "営業保証金は主たる事務所につき1,000万円である。", "no": "営業保証金は、主たる事務所につき60万円である。", "why": "60万円は保証協会の弁済業務保証金分担金。", "ref": "25条・施行令"}, {"tag": "支店を置く額", "yes": "営業保証金はその他の事務所1か所につき500万円である。", "no": "営業保証金は、支店1か所につき30万円である。", "why": "30万円は保証協会の分担金。", "ref": "25条・施行令"}, {"tag": "営業開始の順序", "yes": "営業保証金を供託した旨を免許権者へ届け出た後でなければ、事業を開始できない。", "no": "免許が交付されれば、保証金の供託と届出をしないまま必ず営業を開始できる。", "why": "免許、供託、届出、営業開始の順。協会加入の場合は別の制度。", "ref": "25条5項"}, {"tag": "国債の評価", "yes": "営業保証金に充てる国債証券は、額面金額の100％で評価する。", "no": "営業保証金に充てる国債証券は、すべて額面の80％でしか評価されない。", "why": "国債100、地方債等90、その他所定債券80を比較する。", "ref": "25条・営業保証金規則"}, {"tag": "取引相手が業者", "yes": "宅建業者である取引相手は、営業保証金からの還付を受ける者から除かれる。", "no": "宅建業者同士の売買取引でも、買主業者は常に営業保証金から還付を受けられる。", "why": "一般取引者保護の制度。工事業者の工事代金等も取引債権とは別。", "ref": "27条"}, {"tag": "還付後の補充", "yes": "還付で不足が生じたとき、通知を受けた日から2週間以内に不足額を供託する。", "no": "還付による保証金不足は、通知を受けてから2年以内に補充すればよい。", "why": "補充2週間。補充後の届出も必要。", "ref": "28条"}, {"tag": "供託する場所", "yes": "営業保証金は、主たる事務所の最寄りの供託所に供託する。", "no": "各支店は、その支店の最寄りの供託所に営業保証金を必ず別々に供託する。", "why": "主たる事務所を基準にまとめて供託する。", "ref": "25条"}], "lecture": ["宅建業者との取引で損害を受けた顧客を守るため、営業保証金を供託します。これは業者が自由に使える営業資金ではありません。主たる事務所とその他の事務所で金額が違い、金銭だけでなく一定の有価証券でも供託できます。供託した後に免許権者へ届出をしてから営業を開始します。", "還付を受けられる債権と、取引に伴わない債権を分けます。また、業者自身は保護対象から除かれます。還付で保証金が不足すると補充義務があり、通知を受けた日からの期限で動きます。廃業や移転後の取戻しでは原則公告が必要ですが、二重供託等の例外があります。"], "example": "主たる事務所と支店1か所なら1,500万円を供託。支店を追加したら営業開始前の追加供託を確認する。", "compare": "主たる事務所→1,000万円／その他→各500万円／国債評価100％・地方債政府保証債90％・その他所定債券80％", "memory": "還付不足は通知から2週間以内に補充・供託は主たる事務所最寄りの供託所", "trap": "不動産業者同士の取引債権は営業保証金の還付対象ではない。", "supplement": []}, {"id": "20", "title": "保証協会・分担金", "group": "宅建業法", "sources": ["takken", "takkenrules", "takkenorder"], "article": "64条の2〜64条の25", "facts": [{"tag": "加入時の金額", "yes": "弁済業務保証金分担金は、主たる事務所60万円、その他の事務所各30万円である。", "no": "保証協会加入時の分担金は、本店1,000万円、支店500万円である。", "why": "直接供託と分担金の額が逆。", "ref": "64条の9・施行令"}, {"tag": "納付の時期", "yes": "新たに協会の社員となる者は、加入しようとする日までに分担金を納付する。", "no": "分担金は、協会加入後5年以内に納付すればよい。", "why": "加入前納付と事務所新設時の2週間を区別。", "ref": "64条の9"}, {"tag": "還付の限度", "yes": "社員との取引による還付限度は、原則としてその社員が直接供託すべき営業保証金相当額である。", "no": "還付の限度は、常にその社員が払った分担金60万円又は30万円だけである。", "why": "保護額を分担金の額と混同しない。", "ref": "64条の8"}, {"tag": "協会の必須業務", "yes": "保証協会は、苦情解決、研修、弁済業務を行う。", "no": "保証協会の法定必須業務は、社員への住宅ローン融資だけである。", "why": "必須業務と任意業務を区別。", "ref": "64条の3"}, {"tag": "認証の手続", "yes": "弁済業務保証金から還付を受けるには、原則として保証協会の認証を受ける必要がある。", "no": "保証協会の認証は、どの還付請求でも法律上禁止されている。", "why": "協会が取引債権と額を認証する。", "ref": "64条の8"}, {"tag": "資格を失った後", "yes": "社員資格を失った宅建業者は、原則1週間以内に営業保証金を供託しなければならない。", "no": "保証協会の社員資格を失っても、保証金を供託せずいつまでも営業できる。", "why": "直接供託への移行期限は1週間。", "ref": "64条の15"}, {"tag": "還付充当金の期限", "yes": "社員が還付充当金の納付通知を受けたときは、通知の日から2週間以内に納付しなければならない。", "no": "還付充当金の納付期限は、通知の日から6か月以内である。", "why": "2週間の不納付は社員資格喪失につながる。", "ref": "64条の10"}], "lecture": ["保証協会へ加入した業者は、営業保証金を直接供託する代わりに分担金を納付します。協会が弁済業務保証金を供託することで、顧客に対する保護を支えます。業者の出す分担金は少額でも、顧客が還付を受ける限度は直接供託の場合に対応する額です。", "協会の認証を受けて還付を請求する流れ、還付充当金の納付、不納付による社員資格喪失を整理します。ここでいう社員は従業員ではなく協会の会員である業者です。資格を失ったら直接供託へ移る必要があります。協会の必須業務には苦情解決、研修、弁済業務があり、すべての資金貸付が必須というわけではありません。"], "example": "本店と支店1か所の加入時分担金は90万円。しかし顧客保護の限度は90万円ではなく、直接供託に対応する1,500万円を基準とする。", "compare": "分担金→本店60万円・支店30万円／直接保証金→本店1,000万円・支店500万円", "memory": "加入前に分担金納付・新設事務所は設置から2週間以内・資格喪失後は1週間以内に直接供託", "trap": "保証協会の社員と会社の従業員を混同しない。", "supplement": []}, {"id": "21", "title": "広告・取引態様・販売開始", "group": "宅建業法", "sources": ["takken", "takkenrules", "takkenorder"], "article": "32・33・34・36条", "facts": [{"tag": "誇大広告の効果", "yes": "著しく事実と異なる広告は、契約が成立しなくても誇大広告の禁止に違反し得る。", "no": "誇大広告は、その広告を見た人と売買契約が成立した場合にだけ違反になる。", "why": "禁止の対象は広告行為そのもの。", "ref": "32条"}, {"tag": "広告の開始時期", "yes": "未完成建物の広告は、必要な建築確認等の処分があった後でなければできない。", "no": "建築確認申請を提出しただけで、必要な確認前でも未完成建物の広告を自由に開始できる。", "why": "申請と処分は異なる。", "ref": "33条"}, {"tag": "注文時の明示", "yes": "宅建業者は、広告で示していても注文を受けたときに取引態様を明らかにしなければならない。", "no": "広告に媒介と書いた場合、注文を受けた時の取引態様明示は常に不要である。", "why": "広告時と注文時は別の義務。", "ref": "34条"}, {"tag": "媒介業者の広告", "yes": "広告開始時期の規制は、自ら売主である業者だけでなく媒介する業者にも適用される。", "no": "未完成物件の媒介業者は、売主でないので確認前広告の規制を受けない。", "why": "業者の取引態様で広告規制を除外しない。", "ref": "33条"}, {"tag": "未完成の賃貸広告", "yes": "未完成建物の貸借の広告にも、必要な建築確認等の処分後という広告時期規制が適用される。", "no": "未完成建物の賃貸広告は、広告時期規制から常に除外される。", "why": "広告は売買、交換、貸借を含む。契約締結時期との違い。", "ref": "33条"}, {"tag": "契約時期の範囲", "yes": "36条の契約締結時期の制限は、未完成物件の売買又は交換に関するものである。", "no": "36条の未完成物件の契約締結時期制限は、貸借契約にも売買と全く同じように適用される。", "why": "36条は売買・交換、33条広告は貸借も含む。", "ref": "36条"}, {"tag": "事実より有利な表示", "yes": "実際より著しく有利な条件だと誤認させる広告は、誇大広告禁止の対象となる。", "no": "価格条件の誇大表示は、物件品質の表示ではないので宅建業法では一切規制されない。", "why": "価格・支払方法等の取引条件も規制対象。", "ref": "32条"}], "lecture": ["広告は顧客が購入判断を始める入口です。著しく事実と違う内容や実際より著しく優良・有利に誤認させる表示は禁止され、契約に至らなくても違反になります。自社売主、代理、媒介という取引態様は広告で示し、注文を受けた時にも明示します。", "未完成物件は、開発許可や建築確認等の必要な処分があった後でなければ広告できません。契約締結時期の規制は売買・交換に関するもので、広告規制より範囲が狭い点が重要です。広告を作る担当者と契約担当者が別でも、事業者として時期と表示を管理する必要があります。"], "example": "建築確認申請中の新築を「近日着工、予約受付」と掲載する。実際に契約しなくても広告開始時期の規制を確認しなければならない。", "compare": "広告→必要な確認等後・貸借も対象／契約時期→未完成の売買交換／取引態様→広告時＋注文時", "memory": "誇大広告は契約成立不要・媒介業者にも広告規制", "trap": "予告広告だから確認前でよい、とは考えない。", "supplement": []}, {"id": "22", "title": "媒介契約・一般と専任", "group": "宅建業法", "sources": ["takken", "takkenrules", "takkenorder"], "article": "34条の2", "facts": [{"tag": "一般媒介の依頼先", "yes": "一般媒介契約では、依頼者は原則として他の業者にも重ねて媒介を依頼できる。", "no": "一般媒介契約でも、他の宅建業者への依頼は法律で必ず禁止される。", "why": "一般と専任の根本的な違い。", "ref": "34条の2"}, {"tag": "専任の自己発見", "yes": "専任媒介契約では、依頼者が自ら発見した相手と直接取引することは原則として認められる。", "no": "専任媒介契約では、専属専任と同じく自己発見取引が必ず禁止される。", "why": "専任と専属専任の違い。", "ref": "34条の2・標準約款"}, {"tag": "期間の上限", "yes": "専任媒介契約の有効期間は3か月を超えられず、長い定めは3か月となる。", "no": "専任媒介契約は、1年の期間を定めれば法律上そのまま1年間有効となる。", "why": "依頼者の拘束を短くし、更新時に見直す。", "ref": "34条の2"}, {"tag": "専属の報告頻度", "yes": "専属専任媒介契約では、業務処理状況を1週間に1回以上報告する。", "no": "専属専任媒介契約の報告は、1か月に1回で法定頻度を満たす。", "why": "専任2週間、専属専任1週間。", "ref": "34条の2"}, {"tag": "更新の申出", "yes": "専任媒介契約の更新は、依頼者の申出によって行う。", "no": "専任媒介契約は、依頼者の申出なく業者だけの判断で必ず自動更新できる。", "why": "更新後も3か月以内。依頼者に不利な特約は無効となる。", "ref": "34条の2"}, {"tag": "一般媒介の期間", "yes": "一般媒介契約には、宅建業法上の3か月という有効期間上限はない。", "no": "一般媒介契約にも、宅建業法上必ず専任と同じ3か月上限がある。", "why": "標準約款等の扱いと法律上の義務を分ける。", "ref": "34条の2"}, {"tag": "書面義務の対象", "yes": "34条の2の媒介契約書面交付等の義務は、宅地建物の売買又は交換の媒介契約を対象とする。", "no": "建物の賃貸媒介契約にも、34条の2の書面義務が売買と同じく当然に適用される。", "why": "賃貸では別の説明・37条等の義務はあるが、この条文の対象は売買交換。", "ref": "34条の2"}], "lecture": ["売主から仲介を頼まれた時点で媒介契約が始まります。物件の売買契約とは別の契約です。宅地・建物の売買又は交換の媒介契約では、内容を記載した書面の交付等が必要です。一般媒介では複数の業者に頼めるのに対し、専任は他業者への重複依頼を禁止します。", "専属専任はさらに自己発見取引を制限するため、業者にも頻繁な報告と早い登録を求めます。独占的な依頼を得る代わりに業者の活動責任を重くする関係だと理解できます。更新は依頼者の申出によって行うので、何も言わなければ自動更新という特約は使えません。"], "example": "専任で頼んだ売主が自分で知人の買主を見つけた。専任なら自己発見取引は可能、専属専任なら原則媒介業者を通す。この違いを説明する。", "compare": "一般→複数依頼可／専任→複数不可・自己発見可／専属専任→複数不可・自己発見不可", "memory": "専任系有効3か月以内・報告専任2週に1回以上、専属1週に1回以上", "trap": "賃貸媒介に34条の2の売買交換書面義務をそのまま適用しない。", "supplement": []}, {"id": "23", "title": "指定流通機構・媒介の記録", "group": "宅建業法", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"], "article": "34条の2・施行規則", "facts": [{"tag": "専任の登録日数", "yes": "専任媒介の登録は、業者の休業日を除き契約締結日から7日以内に行う。", "no": "専任媒介の登録期限は、休業日を含めて一律30日以内である。", "why": "専任7日、専属5日。休業日除外の規定。", "ref": "34条の2・施行規則15条の10"}, {"tag": "専属の登録日数", "yes": "専属専任媒介の登録は、業者の休業日を除き5日以内に行う。", "no": "専属専任媒介の登録は、業者の休業日を除き7日以内で足りる。", "why": "専属は依頼者の拘束が強いため5日。", "ref": "34条の2・施行規則"}, {"tag": "証明書面の交付", "yes": "登録した業者は、登録を証する書面を遅滞なく依頼者に交付する必要がある。", "no": "指定流通機構に登録すれば、依頼者への登録証明書面交付は不要である。", "why": "登録と依頼者への証明は別の義務。承諾による電磁的方法の特則あり。", "ref": "34条の2"}, {"tag": "買受申込みの報告", "yes": "売買又は交換の申込みがあったときは、依頼者に遅滞なく報告しなければならない。", "no": "専任の買受申込みは、次の2週間ごとの定期報告まで必ず放置してよい。", "why": "申込み報告は定期報告と別。一般媒介でも対象。", "ref": "34条の2"}, {"tag": "一般媒介の登録", "yes": "一般媒介契約には、宅建業法上の指定流通機構への登録義務はない。", "no": "一般媒介でも、法律上一律5日以内に登録しなければならない。", "why": "任意登録や約款上の約束と法定義務は分ける。", "ref": "34条の2"}, {"tag": "成約時の通知", "yes": "登録物件の契約が成立したときは、遅滞なく指定流通機構へ所定事項を通知する。", "no": "登録物件が成約しても、指定流通機構への通知は法律上一切不要である。", "why": "成約情報も適切に共有する。", "ref": "34条の2"}, {"tag": "価格意見の根拠", "yes": "媒介価額について意見を述べるときは、根拠を明らかにしなければならない。", "no": "査定価格は業者の勘だけで示してよく、依頼者へ根拠を明らかにする義務はない。", "why": "価格についての判断根拠を示す義務がある。", "ref": "34条の2"}], "lecture": ["指定流通機構への登録は、専任で預かった物件を広く流通させるための義務です。依頼を独占して情報を囲い込むことを防ぎます。専任と専属専任では登録までの日数が違い、業者の休業日を数えない点を忘れやすいので、暦を一日ずつ確認してください。", "登録したら依頼者へ登録を証する書面を渡し、成約時にも通知します。申込みがあったときの報告は定期報告とは別で、遅滞なく依頼者に知らせる必要があります。2025年からの取引状況の登録等は、正確な情報共有のための運用を確認します。勝手に販売中止状態にして他社を排除する対応は避けるべきです。"], "example": "専属専任を月曜日に締結して水曜日が業者の定休日なら、登録期限の日数計算からその休業日を除く。登録したら売主への証明書面交付も忘れない。", "compare": "登録→専任7日以内・専属5日以内（休業日除外）／報告→定期報告と申込時報告は別", "memory": "登録証明は遅滞なく交付・成約は遅滞なく機構へ通知", "trap": "登録しただけで定期報告や申込報告の義務はなくならない。", "supplement": []}, {"id": "24", "title": "35条重要事項説明・基本手順", "group": "宅建業法", "sources": ["takken", "electronic", "takkenrules", "takkenorder"], "article": "35条", "facts": [{"tag": "説明する時期", "yes": "重要事項説明は、売買等の契約が成立するまでの間に行う。", "no": "重要事項説明は、契約成立後1週間以内に行えば必ず適法である。", "why": "契約判断の前に必要な情報を渡す制度。", "ref": "35条"}, {"tag": "担当者の資格", "yes": "重要事項説明は宅建士に行わせる必要があるが、その宅建士が専任であることまでは要しない。", "no": "重要事項説明を行えるのは、その事務所の専任宅建士だけである。", "why": "宅建士であることと専任配置の義務は別。", "ref": "35条"}, {"tag": "業者が買主", "yes": "相手方が宅建業者のときは、35条の説明は省略できるが書面交付等の義務は残る。", "no": "買主が宅建業者なら、35条の説明も書面交付等も必ず全部不要である。", "why": "説明免除と書面義務を区別。", "ref": "35条6項"}, {"tag": "誰の記名か", "yes": "35条書面には、宅建士が記名しなければならない。", "no": "35条書面は、無資格の営業担当者の記名だけで法の要件を満たす。", "why": "押印は不要になっても宅建士の記名は必要。", "ref": "35条5項"}, {"tag": "電子交付の前提", "yes": "相手方の承諾等の法定要件を満たせば、35条書面に代えて電磁的方法による提供ができる。", "no": "相手方が拒否しても、業者の判断だけで35条書面を電子提供に切り替えてよい。", "why": "相手方の承諾と方法・技術要件を満たす。", "ref": "35条8項・施行規則"}, {"tag": "誰に説明するか", "yes": "売買の35条説明は、原則として買主となろうとする者に対して行う。", "no": "売買の35条説明は、必ず売主だけに行い買主には行わない。", "why": "取得者等を保護する説明。37条書面の双方交付とは対象が違う。", "ref": "35条"}, {"tag": "押印の現在ルール", "yes": "現在の35条書面は宅建士の記名が必要だが、宅建業法上その押印は要求されない。", "no": "現在も35条書面は、宅建士が押印しない限り必ず法違反となる。", "why": "2022年施行の書面電子化と合わせて押印義務が廃止された。", "ref": "35条5項"}], "lecture": ["重要事項説明は、契約に入る前に購入・賃借の判断に必要な情報を伝える手続です。契約成立後の37条書面とは目的と時期が違います。業者は宅建士に説明させ、書面を交付等し、宅建士が記名します。専任である必要はありませんが、有効な宅建士証が必要です。", "相手が宅建業者なら35条の説明を省ける一方、書面交付等は残ります。書面の電子提供は2022年から可能ですが、相手方の承諾等の要件があります。IT重説は単に動画を送ることではなく、双方向の映像音声、本人確認、書面の事前送付等の運用を満たす必要があります。"], "example": "買主が一般消費者なら契約前に宅建士が説明する。買主が宅建業者なら説明省略の特則を検討するが、35条書面まで不要にはならない。", "compare": "35条→契約前・取得者等へ説明／37条→契約後・双方へ書面／相手業者→35条説明省略・書面必要", "memory": "宅建士の記名・押印は現在不要・専任でなくても説明可", "trap": "営業担当者が説明して宅建士が後で押印すればよい、という旧来の誤解を捨てる。", "supplement": []}, {"id": "25", "title": "重要事項・物件調査", "group": "宅建業法", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"], "article": "35条1項・施行規則16条の2ほか", "facts": [{"tag": "水害情報の説明", "yes": "市町村から提供された水害ハザードマップがある場合、対象物件の所在地を示して説明する。", "no": "水害ハザードマップが提供されていても、物件所在地の説明は35条では常に不要である。", "why": "所在地を示す説明義務。災害安全の保証ではない。", "ref": "施行規則16条の4の3"}, {"tag": "石綿記録の扱い", "yes": "石綿使用の有無の調査結果の記録がある場合、その内容が重要事項説明の対象となる。", "no": "宅建業者は、すべての中古住宅で自ら石綿調査を実施しなければ売買を媒介できない。", "why": "記録の内容説明と一律調査実施義務は違う。", "ref": "35条・施行規則"}, {"tag": "既存住宅の調査", "yes": "既存建物の説明では、建物状況調査の実施の有無と所定期間内の結果概要等を説明する。", "no": "中古住宅は、建物状況調査未実施なら法律上必ず販売禁止となる。", "why": "調査実施自体を一律義務にする規定ではない。", "ref": "35条1項6号の2"}, {"tag": "共同住宅の期間", "yes": "RC造又はSRC造の共同住宅等の建物状況調査結果は、過去2年以内のものが説明対象となる。", "no": "RC造共同住宅等の建物状況調査も、結果の説明対象期間は例外なく6か月以内である。", "why": "2024年4月施行改正でこの類型は2年。一般は1年。", "ref": "35条・施行規則・解釈運用"}, {"tag": "未完成物件の説明", "yes": "未完成物件では、完成時の形状や構造等の所定事項を説明する必要がある。", "no": "未完成物件は現物がないため、完成時の構造について一切説明不要である。", "why": "図面等により完成後の姿を説明する。", "ref": "35条1項5号"}, {"tag": "災害区域の区別", "yes": "土砂災害警戒区域内にある旨は、所定の取引で重要事項説明の対象となる。", "no": "土砂災害警戒区域は特別警戒区域でない限り、35条で必ず説明不要である。", "why": "警戒と特別警戒の制度を分け、説明対象を勝手に狭めない。", "ref": "35条・施行規則"}, {"tag": "管理者方式の改正", "yes": "2026年4月1日以後、マンションが管理業者管理者方式を採用している場合の所定事項は重要事項説明の対象となる。", "no": "マンション管理業者が管理者を務める方式は、2026年4月1日基準の重要事項説明で一切触れなくてよい。", "why": "2026年施行の施行規則・解釈運用に合わせた追加事項。", "ref": "施行規則16条の2・2026年解釈運用"}], "lecture": ["物件調査では登記、法令制限、道路、設備、災害情報等を別の資料から確認します。登記簿に書いてあることだけでは建築できるとは限りません。未完成物件では完成時の形状・構造等、既存建物では建物状況調査等の説明事項を見ます。取引種類により必要事項が変わるので、共通事項と特有事項を分けるのが実務でも試験でも有効です。", "水害ハザードマップでは対象物件の所在地を示して説明します。災害区域に入っていないことと安全であることは同じではありません。建物状況調査の実施が一律義務化されたわけではなく、実施の有無と一定期間内の結果が説明対象です。2026年からはマンションの管理業者管理者方式に関する説明も確認します。"], "example": "中古マンションを案内する時、管理会社がいるだけか、管理会社が管理者も務める方式かを分ける。管理委託先の説明だけで追加事項まで済むとは限らない。", "compare": "既存調査→実施の有無・法定期間内の結果／石綿→記録があれば内容／水害→提供マップの所在地", "memory": "調査結果原則1年・RC/SRC共同住宅等2年・管理業者管理者方式は2026年4月から", "trap": "調査がない物件は取引不可、ではない。説明事項と調査実施義務を分ける。", "supplement": [["売買と貸借で違う事項", "借地上の建物売買では敷地の権利の種類・内容等、区分所有建物では共用部分、専有部分の用途制限、修繕積立金、管理委託等の所定事項を確認します。貸借では用途その他の利用制限、契約期間・更新、敷金等の精算、管理委託先等が問題になります。宅地売買と建物貸借では同じ項目を丸ごと説明するわけではありません。水害ハザードマップは市町村提供の法定対象地図の所在地を示すもので、浸水の有無を保証する説明ではありません。私道負担、飲用水・電気・ガス等の整備状況、法令制限、登記された権利等を取引種別に合わせて整理します。"]]}, {"id": "26", "title": "37条書面・契約成立後", "group": "宅建業法", "sources": ["takken", "takkenrules", "takkenorder"], "article": "37条", "facts": [{"tag": "双方への交付", "yes": "売買を媒介した宅建業者は、37条書面を売主と買主の双方に交付等する。", "no": "売買媒介の37条書面は、買主だけに交付等すれば常に足りる。", "why": "契約内容を当事者双方で明確化する制度。", "ref": "37条1項"}, {"tag": "交付する時期", "yes": "37条書面は、契約成立後遅滞なく交付等しなければならない。", "no": "37条書面は、契約成立後1年以内ならいつ交付しても適法である。", "why": "固定日数ではなく遅滞なく。", "ref": "37条"}, {"tag": "宅建士の説明", "yes": "37条書面には宅建士の記名が必要だが、37条は宅建士による説明までは義務付けない。", "no": "37条書面は、必ず宅建士が全項目を口頭説明しないと交付義務を果たせない。", "why": "法定説明は35条。37条の記名義務と分ける。", "ref": "37条3項"}, {"tag": "引渡しの日", "yes": "売買の37条書面では、物件の引渡し時期は必須記載事項である。", "no": "売買の37条書面に引渡し時期を書くかは、常に業者の自由である。", "why": "代金支払、移転登記申請時期等とともに基本事項。", "ref": "37条1項"}, {"tag": "業者間の契約", "yes": "業者間売買にも37条書面の交付等義務は適用される。", "no": "業者間なら8種制限と同じく37条書面の義務も当然に免除される。", "why": "8種制限の適用除外を一般義務に広げない。", "ref": "37・78条"}, {"tag": "違約金の記載", "yes": "違約金に関する定めがあるときは、その内容を37条書面に記載する。", "no": "違約金に関する定めがあっても、37条書面にその内容を記載してはならない。", "why": "定めがある場合の記載事項。", "ref": "37条1項"}, {"tag": "登記時期の記載", "yes": "売買の37条書面には、移転登記の申請時期を記載しなければならない。", "no": "移転登記の申請時期は、売買の37条書面の記載事項ではない。", "why": "民法の対抗要件と契約上の申請時期の明確化を結び付ける。", "ref": "37条1項"}], "lecture": ["37条書面は、成立した契約の内容を明確にして紛争を防ぐためのものです。契約前に判断材料を説明する35条と違い、成立後遅滞なく当事者へ交付等します。売買の媒介では買主だけでなく売主にも必要です。相手が宅建業者でもこの義務はなくなりません。", "必ず記載する事項と、定めがある場合に記載する事項を分けます。代金や支払時期、物件の引渡し時期は基本事項。損害賠償予定・違約金等は定めがある場合の事項です。宅建士の記名は必要ですが、37条自体は宅建士による説明までを要求しません。実務で説明することが望ましくても法の義務とは分けて覚えます。"], "example": "売買成立後、買主へだけ契約書を渡して売主へは口頭で伝えた。媒介なら双方への37条書面交付等が必要であり、買主だけでは足りない。", "compare": "35条→説明あり・契約前／37条→説明義務なし・成立後遅滞なく／業者間→37条も必要", "memory": "宅建士記名・引渡し時期は基本事項・天災その他不可抗力の損害負担は定めがある場合", "trap": "35条の事項を全部37条にも書くという覚え方は避ける。", "supplement": []}, {"id": "27", "title": "8種制限・他人物売買", "group": "宅建業法", "sources": ["takken", "takkenrules", "takkenorder"], "article": "33条の2・78条", "facts": [{"tag": "対象となる売主", "yes": "8種制限は、原則として宅建業者が自ら売主となる取引で買主が宅建業者でない場合に適用される。", "no": "一般個人が売主でも、媒介業者が宅建業者なら常にその売買に8種制限が適用される。", "why": "売主が業者かを先に判断。媒介者の免許だけでは足りない。", "ref": "各規定・78条"}, {"tag": "業者間の適用", "yes": "宅建業者相互間の取引には、8種制限は適用されない。", "no": "買主も宅建業者である売買には、すべての8種制限が非業者買主と同じく適用される。", "why": "業者間の除外は一般的な広告・書面義務等の除外ではない。", "ref": "78条2項"}, {"tag": "他人物売買の民法", "yes": "他人の物の売買契約は、民法上直ちに無効になるわけではない。", "no": "他人物売買は、民法上も例外なく契約そのものが当然無効である。", "why": "売主は権利を取得して移転する義務を負う。業法上の規制とは別。", "ref": "民法561条・33条の2"}, {"tag": "取得契約の例外", "yes": "業者が物件を取得する契約を締結している場合等には、所定の要件の下で他人物売買制限の例外となる。", "no": "業者がまだ物件を所有していない場合、取得契約があっても他人物売買は一切例外なく禁止される。", "why": "法定の取得契約等の例外がある。停止条件付は除外される。", "ref": "33条の2"}, {"tag": "停止条件の注意", "yes": "他人物売買の取得契約による例外では、停止条件付取得契約は除かれる。", "no": "停止条件付取得契約さえ締結すれば、33条の2の取得契約例外を必ず満たす。", "why": "取得の確実性を考慮した要件。", "ref": "33条の2"}, {"tag": "中古物件への適用", "yes": "売主が宅建業者、買主が非業者なら、中古住宅にも8種制限が適用され得る。", "no": "8種制限は新築専用であり、中古住宅は常に全部適用除外である。", "why": "完成未完成は各規定の条件や閾値で関わるが、全体を除外しない。", "ref": "各規定"}, {"tag": "自社の賃貸", "yes": "宅建業者が自ら貸主となる建物賃貸借に、売買の8種制限はそのまま適用されない。", "no": "業者が貸主の賃貸借にも、売買の手付20％上限が当然に適用される。", "why": "売買に固有の規制を賃貸へ広げない。", "ref": "38〜43条"}], "lecture": ["8種制限は、宅建業者が自ら売主となり、業者でない買主へ販売する場面の特別な保護です。仲介の場合に売主が一般個人ならそのまま適用されません。反対に業者が売主なら中古物件でも対象になり得ます。まず売主の立場と買主の属性を確認してから各規定を当てはめます。", "他人物売買は民法では契約として成立し得ますが、宅建業法では自ら売主となる業者に厳しい制限があります。取得契約等の法定例外や未完成物件の保全を確認します。自社で登記を持っているかだけでなく、取得の確実性を法律がどう扱うかが判断の鍵です。"], "example": "一般個人同士の売買を仲介するだけなら、仲介業者が宅建業者でも8種制限の売主業者にはならない。手付や不適合の特約は民法等で別途検討する。", "compare": "自ら売主＋非業者買主→8種制限／媒介だけ→当該業者には売主規制なし／業者間→8種制限適用除外", "memory": "他人物売買の取得契約例外は停止条件付を除く・民法上の契約有効性と業法違反は別", "trap": "違反した契約が何でも当然無効になるという結論に飛ばない。", "supplement": []}, {"id": "28", "title": "クーリング・オフ", "group": "宅建業法", "sources": ["takken", "takkenrules", "takkenorder"], "article": "37条の2", "facts": [{"tag": "8日の起算", "yes": "クーリング・オフの8日は、法定の書面で解除権等を告げられた日から数える。", "no": "クーリング・オフの8日は、説明を受けなくても契約締結日から必ず進む。", "why": "契約日ではなく告知日。告知がなければ期間開始の要件を満たさない。", "ref": "37条の2"}, {"tag": "発信と到達", "yes": "クーリング・オフは、解除の書面を発した時に効力を生ずる。", "no": "クーリング・オフは、業者が書面を受領した時にだけ効力を生ずる。", "why": "法定の発信主義で期限内の権利行使を保護。", "ref": "37条の2"}, {"tag": "完了した履行", "yes": "買主が物件の引渡しを受け、かつ代金全額を支払った場合はクーリング・オフできない。", "no": "買主が代金の一部を支払っただけで、クーリング・オフは必ずできなくなる。", "why": "引渡しと全額支払の双方が必要。", "ref": "37条の2"}, {"tag": "違約金の請求", "yes": "適法なクーリング・オフに対し、業者は損害賠償又は違約金を請求できない。", "no": "クーリング・オフした買主には、必ず売買代金の20％の違約金を請求できる。", "why": "20％上限の規定は解除権行使への請求を認めるものではない。", "ref": "37条の2"}, {"tag": "買主の自宅指定", "yes": "買主が自ら指定した自宅で買受申込みをした場合、原則クーリング・オフの対象外となる。", "no": "買主が自ら希望した自宅で申込みをしても、自宅だから常にクーリング・オフできる。", "why": "誰が場所を指定したかが重要。", "ref": "施行規則16条の5"}, {"tag": "申込み場所が先", "yes": "事務所等以外で買受申込みをした場合、後に事務所で契約してもクーリング・オフが認められ得る。", "no": "喫茶店で申込み後、店舗で契約すれば、それだけで必ずクーリング・オフできなくなる。", "why": "申込みをした場所が基準となる。", "ref": "37条の2"}, {"tag": "手付の返還", "yes": "適法なクーリング・オフがあれば、業者は受領した手付その他の金銭を速やかに返還する。", "no": "クーリング・オフでは、業者は手付を必ず没収できる。", "why": "解約手付の放棄とは別の保護制度。", "ref": "37条の2"}], "lecture": ["購入を急がせる勧誘から買主を守るのがクーリング・オフです。宅建業者が売主の取引で、事務所等以外の場所で買受申込みをした場合等が対象となります。後で正式な契約を事務所でしたとしても、申込み場所が対象なら保護が残り得ます。買主自身が指定した自宅・勤務先は対象から除かれるので、場所の由来も確認します。", "8日の起算は契約日ではなく、法定の方法で解除権等を告げられた日です。解除は書面を発した時に効力を生じます。引渡しを受けたうえ代金全額を支払った場合は利用できません。業者は違約金や損害賠償を請求できず、受領済みの手付等を返します。"], "example": "喫茶店で勧誘され申込み、翌日店舗で契約。店舗で契約した事実だけでクーリング・オフ不可とはいえない。申込みの場所と告知日を確認する。", "compare": "起算→法定告知日／効力→書面発信／終了条件→引渡し＋全額支払／手付解除→別制度", "memory": "告げられた日から8日・買主指定の自宅又は勤務先は除外", "trap": "引渡しだけ、全額支払だけで常に解除不可としない。", "supplement": []}, {"id": "29", "title": "手付・違約金・割賦販売", "group": "宅建業法", "sources": ["takken", "takkenrules", "takkenorder"], "article": "38・39・42・43条", "facts": [{"tag": "手付の上限", "yes": "業者売主・非業者買主の売買では、代金20％を超える手付を受領できない。", "no": "業者売主は、保全措置さえすれば代金50％を手付として受領できる。", "why": "保全しても20％受領上限は残る。", "ref": "39条"}, {"tag": "違約金の合算", "yes": "損害賠償予定と違約金の合計は、代金20％を超えて定められない。", "no": "損害賠償予定20％と違約金20％を別々に定めれば、合計40％でもすべて有効である。", "why": "名目を分けても合算する。", "ref": "38条"}, {"tag": "超過した部分", "yes": "38条の20％上限を超えた特約は、その超過部分が無効となる。", "no": "違約金が20％を超えると、売買契約全体が必ず無効になる。", "why": "無効の範囲は超過部分。", "ref": "38条"}, {"tag": "手付の性質", "yes": "業者売主・非業者買主では、手付の名称にかかわらず解約手付としての解除が保護される。", "no": "証約手付と書けば、非業者買主の手付放棄による解除を常に排除できる。", "why": "買主に不利な特約は無効。", "ref": "39条2・3項"}, {"tag": "売主の手付解除", "yes": "売主業者が手付解除するには、原則として手付の倍額を現実に提供する。", "no": "売主業者は「倍額を払うつもり」と口頭で告げるだけで必ず手付解除できる。", "why": "現実の提供を要求する。相手方履行着手等の限界もある。", "ref": "39条"}, {"tag": "割賦の不払", "yes": "所定の割賦販売で支払遅滞を理由に解除等するには、30日以上の期間を定め書面で催告する必要がある。", "no": "割賦代金を1日遅延しただけで、書面催告なく常に全残額を請求できる。", "why": "買主保護の特則。一般売買の催告期間と混同しない。", "ref": "42条"}, {"tag": "不利な解除特約", "yes": "買主の手付解除を、相手方の履行着手前なのに一律禁止する不利な特約は無効である。", "no": "業者売主は、手付解除を全部禁止する特約を置けば常に有効に買主を拘束できる。", "why": "買主保護に反する特約を認めない。", "ref": "39条3項"}], "lecture": ["業者売主と一般買主の売買では、受け取れる手付は代金の20％以下です。また、その手付は性質の名称にかかわらず解約手付としての保護が働きます。「証約手付だから放棄解除できない」と買主に不利な特約を置くことはできません。", "損害賠償予定と違約金は合算して代金20％までです。上限を超えると超過部分が無効であり、契約全体が直ちに無効になるわけではありません。割賦販売では小さな不払で直ちに残額全額請求や解除をすることを防ぎ、30日以上の書面催告を要求します。手付上限、保全基準、違約金上限は似た数字でも別の規制です。"], "example": "代金3,000万円で違約金450万円、損害賠償予定300万円と定める。合計750万円は20％600万円を超え、超過150万円が無効となる。", "compare": "手付上限→20％／違約金＋賠償予定→合計20％／未完成保全免除→5％以下かつ1,000万円以下", "memory": "割賦の解除等は30日以上の書面催告・手付解除は相手方の履行着手まで", "trap": "「20％なら保全不要」は誤り。保全と受領上限は別。", "supplement": []}, {"id": "30", "title": "手付金等の保全", "group": "宅建業法", "sources": ["takken", "takkenrules", "takkenorder"], "article": "41・41条の2", "facts": [{"tag": "未完成の免除", "yes": "未完成物件では、手付金等の額が代金5％以下かつ1,000万円以下なら原則保全措置が免除される。", "no": "未完成物件は、手付金等が代金10％以下なら額にかかわらず保全不要である。", "why": "未完成は5％と1,000万円の両条件。", "ref": "41条"}, {"tag": "完成済の免除", "yes": "完成物件では、手付金等が代金10％以下かつ1,000万円以下なら原則保全措置が免除される。", "no": "完成物件なら、手付金等が1,000万円以下であるだけで割合を問わず保全不要となる。", "why": "完成も割合と絶対額の両条件。", "ref": "41条の2"}, {"tag": "中間金の合算", "yes": "保全の要否は、代金に充当される中間金等も含めた手付金等で判断する。", "no": "中間金と名付ければ、手付金等の保全対象から必ず外れる。", "why": "名目ではなく金銭の性質と受領時期で判断。", "ref": "41条"}, {"tag": "実施の時期", "yes": "必要な保全措置は、手付金等を受領する前に講じなければならない。", "no": "必要な保全措置は、手付受領後1か月以内にすれば必ず適法である。", "why": "受領前に買主を保護する。", "ref": "41・41条の2"}, {"tag": "支払拒絶の保護", "yes": "必要な保全措置を講じないとき、買主は手付金等の支払を拒め、その拒絶を理由に解除等をされない。", "no": "業者が必要な保全をしなくても、買主が支払を拒めば必ず違約金を負担する。", "why": "支払拒絶に法定の保護がある。", "ref": "41条4項等"}, {"tag": "保管方式の範囲", "yes": "指定保管機関による保管方式は、完成物件の手付金等保全の方法として認められる。", "no": "未完成物件でも、指定保管機関の保管方式を完成物件と同じく自由に利用できる。", "why": "未完成は銀行等保証・保険等、完成は保管方式も可。", "ref": "41・41条の2"}, {"tag": "割合の境界", "yes": "未完成物件で5％ちょうど、かつ1,000万円以下なら、原則として割合による保全義務の境界を超えない。", "no": "未完成物件では、5％ちょうどでも必ず5％超として保全が必要である。", "why": "「超える」と「以上」は違う。登記等の例外や受領上限も別途判断。", "ref": "41条"}], "lecture": ["手付金等の保全は、引渡し前に業者が倒産しても買主のお金が戻るようにする制度です。銀行等の保証、保険等の所定方法を使います。手付の名称だけでなく、契約締結後、引渡し前に受け取る代金に充当される金銭を合計します。中間金と名付けても判定から外れません。", "未完成は代金5％、完成は10％という免除基準がありますが、どちらも1,000万円以下という条件も同時に満たさなければなりません。境界の「以下」と「超える」を正確に読みます。買主への登記がある場合等の例外も確認し、保全しない業者への支払拒絶は債務不履行にならない扱いを覚えます。"], "example": "未完成の代金4,000万円、手付200万円なら5％以下かつ1,000万円以下で免除範囲。中間金100万円を追加で受けるなら累計300万円となり、受領前の保全が必要。", "compare": "未完成→5％以下かつ1,000万円以下で原則免除／完成→10％以下かつ1,000万円以下／判定→累計", "memory": "「割合以下」と「額以下」の両方・未完成は指定保管機関方式不可", "trap": "手付だけを保全して中間金を保全しない、では足りない。", "supplement": []}, {"id": "31", "title": "契約不適合特約・住宅瑕疵担保", "group": "宅建業法", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"], "article": "40条・品確法・履行法", "facts": [{"tag": "中古の2年特約", "yes": "業者売主・非業者買主では、種類品質の不適合通知期間を引渡しから2年以上とする特約は認められる。", "no": "業者売主は、不適合通知期間を引渡しから3か月とする不利な特約を常に有効にできる。", "why": "40条の例外は2年以上。民法より不利な特約の限界。", "ref": "40条"}, {"tag": "全部免責", "yes": "業者売主が非業者買主に対し、種類品質の不適合責任を全部免除する不利な特約は無効となる。", "no": "中古住宅なら、業者売主は一般買主に対する不適合責任を常に全部免除できる。", "why": "中古という理由で40条が除外されない。", "ref": "40条"}, {"tag": "新築の主要部分", "yes": "新築住宅の構造耐力上主要な部分等には、品確法による原則引渡しから10年の責任がある（請負に基づく住宅は請負人から売主への引渡しが起算）。", "no": "品確法の新築住宅責任は、構造主要部分でも引渡しから1年だけである。", "why": "雨水浸入防止部分も対象。請負人から売主への引渡しがある場合はその時から10年。民法や40条と別の強行規定。", "ref": "品確法95条"}, {"tag": "資力を確保する方法", "yes": "新築住宅を引き渡す対象事業者は、所定の保険又は保証金供託で資力確保をする。", "no": "対象となる新築住宅売主業者は、口頭で補修を約束すれば保険も供託も一切不要である。", "why": "責任の存在と履行を支える資力確保は別。", "ref": "履行法11条等"}, {"tag": "新築の意味", "yes": "品確法の新築住宅は、新たに建設され未使用で、工事完了から1年を経過していない住宅である。", "no": "築5年の未入居住宅も、品確法上は必ず新築住宅である。", "why": "未使用だけでなく完成後の期間要件がある。", "ref": "品確法2条"}, {"tag": "設備の対象", "yes": "品確法の法定10年責任は、すべての住宅設備のあらゆる故障を一律に対象とするものではない。", "no": "新築住宅のエアコンや食洗機のどんな故障にも、品確法の法定10年責任が当然に適用される。", "why": "対象は構造耐力上主要部分・雨水浸入防止部分。別の契約責任等は検討する。", "ref": "品確法95条"}, {"tag": "業者間との違い", "yes": "40条の8種制限は業者間では適用除外だが、新築住宅の品確法責任は同じ理由だけで当然に除外されない。", "no": "買主が宅建業者なら、品確法の新築住宅主要部分の10年責任も必ず全部免除される。", "why": "異なる法律の適用範囲を別々に判断する。", "ref": "78条・品確法95条"}], "lecture": ["売主業者が責任を全部免除する中古住宅販売は、一般買主に対する8種制限で問題になります。種類又は品質の不適合について、民法の規定より買主に不利な特約は原則無効です。ただし通知期間を引渡しから2年以上とする特約は認められます。通知期間であることと、すべての請求が消える期間でないことを意識します。", "新築住宅は別の品確法で構造耐力上主要な部分と雨水の浸入を防止する部分について原則引渡しから10年の責任（請負に基づく住宅では請負人から売主への引渡しが起算）があり、業者には履行法による保険又は供託の資力確保も求められます。中古の2年特約と新築の10年を同じ話として覚えると、対象部分や売主の違いを落とします。"], "example": "業者売主の中古住宅契約に「引渡しから半年で雨漏り責任終了」と記載。一般買主に不利なので40条の問題になる。新築住宅の主要部分なら品確法の10年も検討する。", "compare": "中古業者売主→40条の特約制限／新築主要部分等→品確法10年／資力確保→履行法の保険又は供託", "memory": "40条の例外は引渡しから2年以上・新築は未使用かつ完成から1年未満", "trap": "新築なら設備故障もすべて法定10年、とはいえない。", "supplement": []}, {"id": "32", "title": "報酬計算・売買・代理", "group": "宅建業法", "sources": ["takken", "reward", "takkenrules", "takkenorder"], "article": "46条・報酬告示", "facts": [{"tag": "速算式の条件", "yes": "通常の売買媒介で価格400万円超の場合、依頼者一方の税抜報酬上限は価格3％＋6万円で求められる。", "no": "価格100万円の売買にも、特例を使わず常に3％＋6万円の速算式を使える。", "why": "速算式の適用範囲は400万円超。小額は段階料率。", "ref": "報酬告示"}, {"tag": "価格の消費税", "yes": "売買報酬の計算の基礎となる価格からは、物件価格に含まれる消費税等相当額を除く。", "no": "建物価格に含まれる消費税も、必ず報酬計算の基礎価格へ含める。", "why": "物件の税と報酬の税は別。", "ref": "報酬告示"}, {"tag": "双方からの媒介報酬", "yes": "売買媒介では、原則として売主と買主それぞれから一方の上限内の報酬を受けられる。", "no": "売買媒介では、売主から上限を受けたら買主からは法律上一切受けられない。", "why": "賃貸の双方合計上限とは違う。", "ref": "報酬告示"}, {"tag": "代理の上限", "yes": "売買代理の依頼者からの報酬は、原則として売買媒介の一方上限の2倍以内である。", "no": "売買代理は、どんな価格でも売買媒介上限の10倍まで受けられる。", "why": "相手方からも受ける場合は合計の規制がある。", "ref": "報酬告示"}, {"tag": "特別な広告実費", "yes": "依頼者の特別な依頼によって行う広告の実費等は、所定の扱いにより通常報酬とは別に受領し得る。", "no": "業者が自ら決めた通常の広告費は、上限報酬とは別に常に無制限請求できる。", "why": "特別依頼と通常の営業経費を区別。", "ref": "報酬告示・解釈運用"}, {"tag": "交換の価格", "yes": "交換の媒介報酬の基礎は、交換物件の価格の高い方である。", "no": "交換の媒介報酬は、交換する両物件価格の合計を必ず基礎にする。", "why": "二つを足すのではなく高額側を用いる。", "ref": "報酬告示"}, {"tag": "2,000万円の計算", "yes": "課税事業者が税抜価格2,000万円を通常売買媒介した場合、一方からの税込上限は72万6,000円である。", "no": "同条件の通常売買媒介では、一方からの税込上限は132万円である。", "why": "2,000万円×3％＋6万円＝66万円、1.1倍＝72.6万円。", "ref": "報酬告示"}], "lecture": ["仲介手数料には上限があります。税込みと税抜き、物件価格に含まれる建物消費税と報酬への消費税を分けて計算します。通常の売買媒介は200万円以下の部分5％、200万円超400万円以下の部分4％、400万円超の部分3％を合算し、課税事業者なら報酬へ消費税を加えます。", "速算式は価格400万円超で3％＋6万円です。これを低価格へ無条件に使わないでください。代理は媒介の上限の2倍までが原則ですが、相手方からも報酬を受ける時の合計制限を確認します。通常の広告費は別請求できず、依頼者の特別依頼による広告等の実費は別の扱いです。"], "example": "税抜価格2,000万円の売買媒介なら、一方からの税抜上限66万円、課税事業者の税込上限72万6,000円。依頼者双方からそれぞれ上限まで受けることは可能。", "compare": "売買400万円超→価格×3％＋6万円（税抜）／代理→原則媒介の2倍／通常広告→報酬内", "memory": "価格は建物消費税相当額を除く・課税報酬は1.1倍・交換は高い方の価格", "trap": "別途事務手数料と名付けても報酬上限を潜脱できない。", "supplement": []}, {"id": "33", "title": "賃貸報酬・低廉な空家等【改正】", "group": "宅建業法", "sources": ["reward", "takken", "takkenrules", "takkenorder"], "article": "46条・2024年7月改正報酬告示", "facts": [{"tag": "通常賃貸の総額", "yes": "課税事業者の通常賃貸媒介報酬は、双方合計で借賃1か月分の1.1倍以内である。", "no": "通常の賃貸媒介は、貸主と借主それぞれから1.1か月分を無条件に受けられる。", "why": "双方合計の上限。長期空家特例とは別。", "ref": "報酬告示"}, {"tag": "居住用の一方", "yes": "居住用建物の通常媒介は、一方から0.55か月分以内が原則だが、依頼を受けるに当たって承諾がある場合は例外となる。", "no": "居住用賃貸では、依頼時承諾がなくても借主から必ず1.1か月分受けてよい。", "why": "一方上限と双方合計上限を併せて確認。", "ref": "報酬告示"}, {"tag": "低廉な価格の境界", "yes": "2024年7月以後の低廉な空家等の売買媒介特例は、物件価格800万円以下が対象となる。", "no": "低廉な空家等の売買特例は、現在も物件価格400万円以下だけが対象である。", "why": "旧400万円基準から800万円以下へ拡大。価格は税抜基準。", "ref": "2024年改正報酬告示"}, {"tag": "買主側の特例", "yes": "低廉な空家等の売買媒介特例は、所定条件を満たせば買主側の依頼者にも適用される。", "no": "低廉な空家等の売買特例は、改正後も売主側だけにしか適用されない。", "why": "売主側だけだった旧制度と区別する。", "ref": "2024年改正報酬告示"}, {"tag": "33万円の条件", "yes": "低廉な空家等の特例で課税事業者が受ける一方の上限は税込33万円で、事前の説明・合意が必要である。", "no": "800万円以下なら、依頼者の合意なく必ず33万円を請求してよい。", "why": "上限額は自動的な請求権ではない。", "ref": "報酬告示・解釈運用"}, {"tag": "長期空家の貸主", "yes": "長期の空家等の貸借特例は、貸主側への上乗せを認め、課税事業者の双方合計上限は借賃2.2か月分となる。", "no": "長期の空家等では、借主だけから無条件に2.2か月分を受けてよい。", "why": "貸主への特例であり借主側へ転嫁しない。", "ref": "2024年改正報酬告示"}, {"tag": "未使用の条件", "yes": "低廉な空家等の売買特例は、現に未使用の空家だけに限定されるものではない。", "no": "800万円以下でも現に居住している中古住宅は、売買報酬特例から必ず除外される。", "why": "名称から要件を推測せず告示の価格・対象要件を読む。", "ref": "報酬告示・国交省案内"}], "lecture": ["賃貸の通常報酬は、双方からの合計が借賃1か月分の1.1倍以内です。居住用建物の媒介では、一方から0.55か月分以内が原則で、依頼を受けるに当たって承諾を得ると例外があります。売買と違い、双方から各1.1か月という計算はできません。", "2024年7月の改正で、価格800万円以下の宅地建物について、一方につき税抜30万円、課税事業者なら税込33万円まで受ける特例が設けられました。空家という名前でも現に空いていることだけを条件にしません。長期の空家等の賃貸は貸主側へ上乗せでき、双方合計2.2か月分以内となります。いずれも事前説明と合意を確認します。"], "example": "700万円の中古住宅を媒介。通常速算なら税込29万7,000円だが、低廉な空家等の要件と事前合意を満たす特例では一方から33万円以内となる。", "compare": "通常賃貸→合計1.1か月／居住用一方→原則0.55／低廉売買→800万円以下・一方33万円／長期空家賃貸→合計2.2か月", "memory": "数字は課税事業者・税率10％を前提・特例は自動徴収ではなく説明合意が必要", "trap": "800万円「未満」ではなく以下。買主側も対象となる。", "supplement": []}, {"id": "34", "title": "業務上の禁止・帳簿・従業者証明", "group": "宅建業法", "sources": ["takken", "takkenrules", "takkenorder"], "article": "45・47〜49条・施行規則", "facts": [{"tag": "断定的な利益", "yes": "宅建業者等は、利益が確実だと誤解させる断定的判断を提供して契約を勧誘してはならない。", "no": "将来の地価上昇を「絶対」と断言しても、広告でなければ宅建業法では常に適法である。", "why": "勧誘行為への規制。広告禁止とは別。", "ref": "47条の2"}, {"tag": "秘密を守る期間", "yes": "業務上知り得た秘密についての守秘義務は、業者をやめた後も原則として続く。", "no": "宅建業を廃業したら、過去の顧客の秘密を正当理由なく自由に公表できる。", "why": "正当な理由の有無を判断。廃業で自動消滅しない。", "ref": "45条"}, {"tag": "証明書の携帯", "yes": "業者は従業者に従業者証明書を携帯させ、取引関係者の請求時に提示させなければならない。", "no": "従業者証明書は事務所に保管しておくだけで、外出時の携帯は常に不要である。", "why": "宅建士証との目的と提示場面の違い。", "ref": "48条"}, {"tag": "名簿の保存", "yes": "従業者名簿は、最終の記載をした日から10年間保存する。", "no": "従業者名簿は、最終記載から1年で必ず廃棄しなければならない。", "why": "帳簿原則5年と区別。", "ref": "48条・施行規則17条の2"}, {"tag": "帳簿の保存", "yes": "取引帳簿は原則閉鎖後5年間、自ら売主となる新築住宅の売買の帳簿は10年間保存する。", "no": "すべての取引帳簿は、閉鎖後1年間だけ保存すればよい。", "why": "新築売主の長期責任に合わせた特則。", "ref": "49条・施行規則18条"}, {"tag": "名簿の閲覧", "yes": "取引関係者から従業者名簿の閲覧請求があった場合、業者は閲覧させなければならない。", "no": "従業者名簿は、取引関係者からの請求でも法律上一切閲覧させてはならない。", "why": "法定の閲覧義務。帳簿について同じ一般閲覧義務があるとはしない。", "ref": "48条"}, {"tag": "故意の不告知", "yes": "重要な事項について故意に事実を告げず、又は不実のことを告げる行為は禁止される。", "no": "重要な雨漏りを知りながら隠しても、契約書へ免責と書けば業法上常に適法である。", "why": "契約の免責特約と業務上の禁止は別。", "ref": "47条"}], "lecture": ["営業現場では、告げない、断定する、長時間迫るといった行為が規制されます。重要な事実を故意に隠すことや将来の利益を断定して契約を勧めることは、顧客の判断をゆがめます。「仕事だから仕方ない」では済みません。守秘義務は退職や廃業後にも続き、正当な理由なく秘密を漏らせません。", "業者は従業者証明書を携帯させ、取引関係者の請求があれば示します。従業者名簿は事務所ごとに備え、取引関係者の請求に対して閲覧させます。帳簿と名簿で保存期間が違い、業者自ら売主の新築住宅の帳簿には10年の特則があります。取引記録と個人情報を適切に扱うための義務として結び付けます。"], "example": "営業員が「絶対値上がりする」と購入を迫る。予測の根拠を示すことと断定的判断を提供することは違い、後者は規制対象となる。", "compare": "帳簿→原則閉鎖後5年・自ら売主の新築は10年／従業者名簿→最終記載から10年／証明書→請求時提示", "memory": "守秘義務は退職・廃業後も継続・重要事実の故意不告知は禁止", "trap": "帳簿と名簿の保存年数を一つにまとめない。", "supplement": []}, {"id": "35", "title": "都市計画・区域区分・用途地域", "group": "法令上の制限", "sources": ["planning", "planningorder"], "article": "4〜13条", "facts": [{"tag": "調整区域の目的", "yes": "市街化調整区域は、市街化を抑制すべき区域である。", "no": "市街化調整区域は、おおむね10年以内に優先して市街化する区域である。", "why": "後者は市街化区域の説明。", "ref": "7条"}, {"tag": "市街化区域の用途", "yes": "市街化区域には、少なくとも用途地域を定めるものとされる。", "no": "市街化区域では、用途地域を定めることが法律上一切禁止される。", "why": "区域区分と用途地域の組合せを覚える。", "ref": "13条"}, {"tag": "調整区域の用途", "yes": "市街化調整区域には、原則として用途地域を定めない。", "no": "市街化調整区域には、必ずすべて13種類の用途地域を同時に定める。", "why": "抑制区域なので原則用途地域なし。", "ref": "13条"}, {"tag": "地域の数", "yes": "2026年4月1日基準の用途地域は13種類である。", "no": "2026年4月1日基準の用途地域は、田園住居地域を含めても12種類である。", "why": "田園住居地域を含む13種類。基準日後の改正とは分ける。", "ref": "8条"}, {"tag": "準都市計画区域", "yes": "準都市計画区域では、市街化区域と市街化調整区域の区域区分を定めない。", "no": "準都市計画区域は、必ず市街化区域と調整区域に二分される。", "why": "準都市計画区域と線引き都市計画区域は別。", "ref": "5条の2・7条"}, {"tag": "地区計画の役割", "yes": "地区計画は、地区の特性に応じて建築物等や公共施設を一体的に定める計画である。", "no": "地区計画は、個人間の売買代金を国が一律に決める制度である。", "why": "地区単位のまちづくりのルール。", "ref": "12条の5"}, {"tag": "非線引き区域", "yes": "区域区分を定めない都市計画区域でも、用途地域を定めることができる。", "no": "非線引き都市計画区域には、用途地域を一切定められない。", "why": "線引きの有無と用途地域の有無を別々に確認。", "ref": "7・8条"}], "lecture": ["都市計画は、個別の土地の売買を禁じる制度ではなく、まち全体で道路・公園・建物用途などを調整する計画です。都市計画区域、準都市計画区域、区域外を分け、区域区分がある場合の市街化区域と市街化調整区域を確認します。調整区域は原則として市街化を抑える区域です。", "用途地域は建物の用途を調整する13種類の地域です。市街化区域には少なくとも用途地域を定め、調整区域では原則定めません。非線引き区域でも用途地域があることはあります。地区計画、都市計画施設、都市計画事業は別の段階なので、予定道路内の土地と事業認可後の土地で必要な許可が変わります。"], "example": "同じ都市計画区域内でも、住宅を建てる土地が市街化区域か調整区域かで開発許可の判断は異なる。「都市計画区域だから自由に住宅を建てられる」とは言えない。", "compare": "市街化区域→既成市街地・おおむね10年以内優先計画市街化／調整区域→市街化抑制／用途地域→13種類", "memory": "準都市計画区域は区域区分なし・調整区域は原則用途地域なし", "trap": "都市計画区域と市街化区域を同じ意味で使わない。", "supplement": []}, {"id": "36", "title": "開発許可・建築の制限", "group": "法令上の制限", "sources": ["planning", "planningorder"], "article": "29〜43条", "facts": [{"tag": "開発の定義", "yes": "主として建築物建築等のための土地の区画形質変更は、開発行為に当たり得る。", "no": "土地の売買契約は、造成しなくても必ずそれ自体が開発行為である。", "why": "取引と土地改変の行為を分ける。", "ref": "4条12項"}, {"tag": "調整区域の小規模", "yes": "市街化調整区域の開発は、一般に面積が小さいことだけでは許可不要にならない。", "no": "市街化調整区域でも、1,000㎡未満なら目的を問わず必ず開発許可不要である。", "why": "市街化区域の規模免除を調整区域に転用しない。", "ref": "29条"}, {"tag": "区域外の面積", "yes": "都市計画区域及び準都市計画区域外では、原則1ha以上の開発行為が許可対象となる。", "no": "都市計画区域外の開発は、100haであっても絶対に許可対象にならない。", "why": "区域外にも大規模開発の規制がある。", "ref": "29条2項・施行令"}, {"tag": "公告前の建築", "yes": "開発許可区域内では、工事完了公告前の建築等は原則として制限される。", "no": "開発許可を得た直後なら、完了公告前でもどんな建物も自由に建てられる。", "why": "工事用仮設建築物等の例外や承認がある。", "ref": "37条"}, {"tag": "農業施設の例外", "yes": "調整区域の一定の農林漁業用建築物等のための開発には、許可不要の例外がある。", "no": "市街化区域でも調整区域でも、農業用と名付ければすべて無条件で許可不要になる。", "why": "区域と法定の施設等の要件を個別判断。", "ref": "29条1項2号"}, {"tag": "完了後の用途", "yes": "開発工事完了公告後も、予定建築物等以外の建築等には原則として制限がある。", "no": "開発の完了公告後は、予定建築物の用途と違う建築も一切制限されない。", "why": "開発許可内容に対応する規制が残る。", "ref": "42条"}, {"tag": "許可の承継", "yes": "相続等の一般承継人は、開発許可に基づく地位を承継する。", "no": "開発許可の地位は、相続でも必ず承継できず最初から取り直すしかない。", "why": "一般承継と特定承継で手続が異なる。", "ref": "44・45条"}], "lecture": ["開発行為とは、主に建築物の建築等のために行う土地の区画形質の変更です。単なる売買契約ではありません。許可の要否は区域、規模、目的、例外で決まります。市街化調整区域は小面積でも原則許可の対象となるため、市街化区域の面積基準を持ち込まないでください。", "農業用施設や公共公益施設、都市計画事業等には例外がありますが、すべての公益施設が無条件に免除されるわけではありません。開発許可を受けた区域内では工事完了公告前の建築等が原則制限され、完了後も予定建築物と違う建築には制限が残ります。許可、検査、公告を時系列で整理するとわかりやすくなります。"], "example": "調整区域の500㎡を宅地造成して一般住宅を建てる相談。小規模だから無許可と決めず、許可の要否と許可基準の双方を確認する。", "compare": "市街化区域→原則1,000㎡以上・三大都市圏等500㎡以上／非線引き・準区域→原則3,000㎡以上／区域外→1ha以上", "memory": "条例で別基準の場合あり・調整区域は面積による一般免除なし・完了公告前は原則建築制限", "trap": "許可不要と建築自由は同じではない。", "supplement": []}, {"id": "37", "title": "建築確認・2025改正・単体規定", "group": "法令上の制限", "sources": ["building", "buildingchanges"], "article": "6〜20条", "facts": [{"tag": "2階の確認対象", "yes": "2025年4月以後、階数2以上の建築物は、構造によらず原則として全国で建築確認対象となる。", "no": "都市計画区域外なら、木造2階建て住宅の新築は現在も必ず建築確認不要である。", "why": "改正後の規模基準で判定。", "ref": "6条"}, {"tag": "面積の条件", "yes": "平屋でも延べ面積200㎡を超える建築物は、原則として全国で確認対象となる。", "no": "平屋なら延べ面積1,000㎡でも、全国どこでも確認不要である。", "why": "階数と面積は「又は」で結ばれる。", "ref": "6条"}, {"tag": "小規模増築の例外", "yes": "防火・準防火地域外の10㎡以内の増築等には、建築確認不要の例外がある。", "no": "防火地域内でも10㎡以内の増築なら、例外なく建築確認不要である。", "why": "区域と増築等の工事種類が条件。新築へ一般化しない。", "ref": "6条2項"}, {"tag": "完了検査の証", "yes": "工事完了後の検査に適合した場合に交付されるのが、検査済証である。", "no": "検査済証は、工事着手前の計画確認だけで必ず交付される。", "why": "確認済証と検査済証を区別。", "ref": "7条"}, {"tag": "既存不適格", "yes": "適法に建てられた建物が後の規制改正で不適合となる既存不適格は、直ちに違反建築と同じではない。", "no": "既存不適格建築物は、建設当初から必ず違法だった建築物を意味する。", "why": "増改築時等には適用関係を別途判断する。", "ref": "3条"}, {"tag": "単体規定の場所", "yes": "建築物の構造等の単体規定は、原則として都市計画区域外にも適用される。", "no": "都市計画区域外では、構造安全や衛生の基準は一切適用されない。", "why": "確認手続と基準の適用範囲は別。", "ref": "第2章"}, {"tag": "用途変更の注意", "yes": "所定の特殊建築物用途への変更で対象部分が200㎡を超える場合等には、確認が必要となり得る。", "no": "建物の用途変更は、ホテル等への大規模変更でも確認が法律上一切不要である。", "why": "類似用途相互間等の例外もある。", "ref": "87条・6条"}], "lecture": ["建築
