", "takken", "takkenrules", "takkenorder"]}, {"text": "低廉な空家等の特例で課税事業者が受ける一方の上限は税込33万円で、事前の説明・合意が必要である。", "truth": true, "why": "上限額は自動的な請求権ではない。", "ref": "報酬告示・解釈運用", "unit": "33", "sources": ["reward", "takken", "takkenrules", "takkenorder"]}, {"text": "低廉な空家等の売買特例は、現に未使用の空家だけに限定されるものではない。", "truth": true, "why": "名称から要件を推測せず告示の価格・対象要件を読む。", "ref": "報酬告示・国交省案内", "unit": "33", "sources": ["reward", "takken", "takkenrules", "takkenorder"]}, {"text": "取引関係者から従業者名簿の閲覧請求があった場合、業者は閲覧させなければならない。", "truth": true, "why": "法定の閲覧義務。帳簿について同じ一般閲覧義務があるとはしない。", "ref": "48条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M3-33-7", "unit": "33", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：33）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：未使用の条件〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "800万円以下なら、依頼者の合意なく必ず33万円を請求してよい。", "truth": false, "why": "上限額は自動的な請求権ではない。", "ref": "報酬告示・解釈運用", "unit": "33", "sources": ["reward", "takken", "takkenrules", "takkenorder"]}, {"text": "低廉な空家等の売買特例は、現に未使用の空家だけに限定されるものではない。", "truth": true, "why": "名称から要件を推測せず告示の価格・対象要件を読む。", "ref": "報酬告示・国交省案内", "unit": "33", "sources": ["reward", "takken", "takkenrules", "takkenorder"]}, {"text": "重要な雨漏りを知りながら隠しても、契約書へ免責と書けば業法上常に適法である。", "truth": false, "why": "契約の免責特約と業務上の禁止は別。", "ref": "47条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "長期の空家等では、借主だけから無条件に2.2か月分を受けてよい。", "truth": false, "why": "貸主への特例であり借主側へ転嫁しない。", "ref": "2024年改正報酬告示", "unit": "33", "sources": ["reward", "takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-34-1", "unit": "34", "group": "宅建業法", "bank": "practice", "stem": "業務上の禁止・帳簿・従業者証明に関する次の記述のうち、正しいものはどれか。〔検討テーマ：断定的な利益〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "宅建業を廃業したら、過去の顧客の秘密を正当理由なく自由に公表できる。", "truth": false, "why": "正当な理由の有無を判断。廃業で自動消滅しない。", "ref": "45条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "従業者名簿は、最終記載から1年で必ず廃棄しなければならない。", "truth": false, "why": "帳簿原則5年と区別。", "ref": "48条・施行規則17条の2", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "従業者証明書は事務所に保管しておくだけで、外出時の携帯は常に不要である。", "truth": false, "why": "宅建士証との目的と提示場面の違い。", "ref": "48条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建業者等は、利益が確実だと誤解させる断定的判断を提供して契約を勧誘してはならない。", "truth": true, "why": "勧誘行為への規制。広告禁止とは別。", "ref": "47条の2", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-34-2", "unit": "34", "group": "宅建業法", "bank": "practice", "stem": "業務上の禁止・帳簿・従業者証明に関する次の記述のうち、正しいものはどれか。〔検討テーマ：秘密を守る期間〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "従業者証明書は事務所に保管しておくだけで、外出時の携帯は常に不要である。", "truth": false, "why": "宅建士証との目的と提示場面の違い。", "ref": "48条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "将来の地価上昇を「絶対」と断言しても、広告でなければ宅建業法では常に適法である。", "truth": false, "why": "勧誘行為への規制。広告禁止とは別。", "ref": "47条の2", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "従業者名簿は、最終記載から1年で必ず廃棄しなければならない。", "truth": false, "why": "帳簿原則5年と区別。", "ref": "48条・施行規則17条の2", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業務上知り得た秘密についての守秘義務は、業者をやめた後も原則として続く。", "truth": true, "why": "正当な理由の有無を判断。廃業で自動消滅しない。", "ref": "45条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-34-3", "unit": "34", "group": "宅建業法", "bank": "practice", "stem": "業務上の禁止・帳簿・従業者証明に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：証明書の携帯〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "業務上知り得た秘密についての守秘義務は、業者をやめた後も原則として続く。", "truth": true, "why": "正当な理由の有無を判断。廃業で自動消滅しない。", "ref": "45条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建業者等は、利益が確実だと誤解させる断定的判断を提供して契約を勧誘してはならない。", "truth": true, "why": "勧誘行為への規制。広告禁止とは別。", "ref": "47条の2", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "従業者名簿は、最終の記載をした日から10年間保存する。", "truth": true, "why": "帳簿原則5年と区別。", "ref": "48条・施行規則17条の2", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "従業者証明書は事務所に保管しておくだけで、外出時の携帯は常に不要である。", "truth": false, "why": "宅建士証との目的と提示場面の違い。", "ref": "48条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-34-4", "unit": "34", "group": "宅建業法", "bank": "practice", "stem": "業務上の禁止・帳簿・従業者証明に関する次の記述のうち、正しいものはどれか。〔検討テーマ：名簿の保存〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "従業者名簿は、最終の記載をした日から10年間保存する。", "truth": true, "why": "帳簿原則5年と区別。", "ref": "48条・施行規則17条の2", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建業を廃業したら、過去の顧客の秘密を正当理由なく自由に公表できる。", "truth": false, "why": "正当な理由の有無を判断。廃業で自動消滅しない。", "ref": "45条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "従業者証明書は事務所に保管しておくだけで、外出時の携帯は常に不要である。", "truth": false, "why": "宅建士証との目的と提示場面の違い。", "ref": "48条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "将来の地価上昇を「絶対」と断言しても、広告でなければ宅建業法では常に適法である。", "truth": false, "why": "勧誘行為への規制。広告禁止とは別。", "ref": "47条の2", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M1-34-5", "unit": "34", "group": "宅建業法", "bank": "mock1", "stem": "宅建業法の総合判断（関連単元：34）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：帳簿の保存〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "従業者名簿は、取引関係者からの請求でも法律上一切閲覧させてはならない。", "truth": false, "why": "法定の閲覧義務。帳簿について同じ一般閲覧義務があるとはしない。", "ref": "48条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "取引帳簿は原則閉鎖後5年間、自ら売主となる新築住宅の売買の帳簿は10年間保存する。", "truth": true, "why": "新築売主の長期責任に合わせた特則。", "ref": "49条・施行規則18条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "免許更新申請は、満了日の翌日から30日以内に行えば必ず間に合う。", "truth": false, "why": "期限前の更新申請が必要。適法申請後の処分待ちには効力継続の規定がある。", "ref": "3条・施行規則3条", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "重要な雨漏りを知りながら隠しても、契約書へ免責と書けば業法上常に適法である。", "truth": false, "why": "契約の免責特約と業務上の禁止は別。", "ref": "47条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M2-34-6", "unit": "34", "group": "宅建業法", "bank": "mock2", "stem": "宅建業法の総合判断（関連単元：34）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：名簿の閲覧〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "取引帳簿は原則閉鎖後5年間、自ら売主となる新築住宅の売買の帳簿は10年間保存する。", "truth": true, "why": "新築売主の長期責任に合わせた特則。", "ref": "49条・施行規則18条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "重要な事項について故意に事実を告げず、又は不実のことを告げる行為は禁止される。", "truth": true, "why": "契約の免責特約と業務上の禁止は別。", "ref": "47条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "国及び地方公共団体には、宅建業法の規定を適用しない。", "truth": true, "why": "適用除外の主体。民間会社一般やすべての公的法人へ広げない。", "ref": "78条", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "従業者名簿は、取引関係者からの請求でも法律上一切閲覧させてはならない。", "truth": false, "why": "法定の閲覧義務。帳簿について同じ一般閲覧義務があるとはしない。", "ref": "48条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M3-34-7", "unit": "34", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：34）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：故意の不告知〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "免許業者の承諾があれば、無免許者がその名義で宅建業を営んでよい。", "truth": false, "why": "免許制度を潜脱する名義貸しは禁止。", "ref": "13条", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "従業者名簿は、取引関係者からの請求でも法律上一切閲覧させてはならない。", "truth": false, "why": "法定の閲覧義務。帳簿について同じ一般閲覧義務があるとはしない。", "ref": "48条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "重要な事項について故意に事実を告げず、又は不実のことを告げる行為は禁止される。", "truth": true, "why": "契約の免責特約と業務上の禁止は別。", "ref": "47条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "すべての取引帳簿は、閉鎖後1年間だけ保存すればよい。", "truth": false, "why": "新築売主の長期責任に合わせた特則。", "ref": "49条・施行規則18条", "unit": "34", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-35-1", "unit": "35", "group": "法令上の制限", "bank": "practice", "stem": "都市計画・区域区分・用途地域に関する次の記述のうち、正しいものはどれか。〔検討テーマ：調整区域の目的〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "市街化区域では、用途地域を定めることが法律上一切禁止される。", "truth": false, "why": "区域区分と用途地域の組合せを覚える。", "ref": "13条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "市街化調整区域は、市街化を抑制すべき区域である。", "truth": true, "why": "後者は市街化区域の説明。", "ref": "7条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "2026年4月1日基準の用途地域は、田園住居地域を含めても12種類である。", "truth": false, "why": "田園住居地域を含む13種類。基準日後の改正とは分ける。", "ref": "8条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "市街化調整区域には、必ずすべて13種類の用途地域を同時に定める。", "truth": false, "why": "抑制区域なので原則用途地域なし。", "ref": "13条", "unit": "35", "sources": ["planning", "planningorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-35-2", "unit": "35", "group": "法令上の制限", "bank": "practice", "stem": "都市計画・区域区分・用途地域に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：市街化区域の用途〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "市街化区域では、用途地域を定めることが法律上一切禁止される。", "truth": false, "why": "区域区分と用途地域の組合せを覚える。", "ref": "13条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "市街化調整区域には、原則として用途地域を定めない。", "truth": true, "why": "抑制区域なので原則用途地域なし。", "ref": "13条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "市街化調整区域は、市街化を抑制すべき区域である。", "truth": true, "why": "後者は市街化区域の説明。", "ref": "7条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "2026年4月1日基準の用途地域は13種類である。", "truth": true, "why": "田園住居地域を含む13種類。基準日後の改正とは分ける。", "ref": "8条", "unit": "35", "sources": ["planning", "planningorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-35-3", "unit": "35", "group": "法令上の制限", "bank": "practice", "stem": "都市計画・区域区分・用途地域に関する次の記述のうち、正しいものはどれか。〔検討テーマ：調整区域の用途〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "市街化区域では、用途地域を定めることが法律上一切禁止される。", "truth": false, "why": "区域区分と用途地域の組合せを覚える。", "ref": "13条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "2026年4月1日基準の用途地域は、田園住居地域を含めても12種類である。", "truth": false, "why": "田園住居地域を含む13種類。基準日後の改正とは分ける。", "ref": "8条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "市街化調整区域には、原則として用途地域を定めない。", "truth": true, "why": "抑制区域なので原則用途地域なし。", "ref": "13条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "市街化調整区域は、おおむね10年以内に優先して市街化する区域である。", "truth": false, "why": "後者は市街化区域の説明。", "ref": "7条", "unit": "35", "sources": ["planning", "planningorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-35-4", "unit": "35", "group": "法令上の制限", "bank": "practice", "stem": "都市計画・区域区分・用途地域に関する次の記述のうち、正しいものはどれか。〔検討テーマ：地域の数〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "2026年4月1日基準の用途地域は13種類である。", "truth": true, "why": "田園住居地域を含む13種類。基準日後の改正とは分ける。", "ref": "8条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "市街化区域では、用途地域を定めることが法律上一切禁止される。", "truth": false, "why": "区域区分と用途地域の組合せを覚える。", "ref": "13条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "市街化調整区域は、おおむね10年以内に優先して市街化する区域である。", "truth": false, "why": "後者は市街化区域の説明。", "ref": "7条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "市街化調整区域には、必ずすべて13種類の用途地域を同時に定める。", "truth": false, "why": "抑制区域なので原則用途地域なし。", "ref": "13条", "unit": "35", "sources": ["planning", "planningorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M1-35-5", "unit": "35", "group": "法令上の制限", "bank": "mock1", "stem": "法令上の制限の総合判断（関連単元：35）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：準都市計画区域〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "準都市計画区域では、市街化区域と市街化調整区域の区域区分を定めない。", "truth": true, "why": "準都市計画区域と線引き都市計画区域は別。", "ref": "5条の2・7条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "市街化区域でも調整区域でも、農業用と名付ければすべて無条件で許可不要になる。", "truth": false, "why": "区域と法定の施設等の要件を個別判断。", "ref": "29条1項2号", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "地区計画は、個人間の売買代金を国が一律に決める制度である。", "truth": false, "why": "地区単位のまちづくりのルール。", "ref": "12条の5", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "非線引き都市計画区域には、用途地域を一切定められない。", "truth": false, "why": "線引きの有無と用途地域の有無を別々に確認。", "ref": "7・8条", "unit": "35", "sources": ["planning", "planningorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M2-35-6", "unit": "35", "group": "法令上の制限", "bank": "mock2", "stem": "法令上の制限の総合判断（関連単元：35）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：地区計画の役割〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "区域区分を定めない都市計画区域でも、用途地域を定めることができる。", "truth": true, "why": "線引きの有無と用途地域の有無を別々に確認。", "ref": "7・8条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "準都市計画区域では、市街化区域と市街化調整区域の区域区分を定めない。", "truth": true, "why": "準都市計画区域と線引き都市計画区域は別。", "ref": "5条の2・7条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "地区計画は、個人間の売買代金を国が一律に決める制度である。", "truth": false, "why": "地区単位のまちづくりのルール。", "ref": "12条の5", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "開発工事完了公告後も、予定建築物等以外の建築等には原則として制限がある。", "truth": true, "why": "開発許可内容に対応する規制が残る。", "ref": "42条", "unit": "36", "sources": ["planning", "planningorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "M3-35-7", "unit": "35", "group": "法令上の制限", "bank": "mock3", "stem": "法令上の制限の総合判断（関連単元：35）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：非線引き区域〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "開発許可の地位は、相続でも必ず承継できず最初から取り直すしかない。", "truth": false, "why": "一般承継と特定承継で手続が異なる。", "ref": "44・45条", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "準都市計画区域は、必ず市街化区域と調整区域に二分される。", "truth": false, "why": "準都市計画区域と線引き都市計画区域は別。", "ref": "5条の2・7条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "区域区分を定めない都市計画区域でも、用途地域を定めることができる。", "truth": true, "why": "線引きの有無と用途地域の有無を別々に確認。", "ref": "7・8条", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "地区計画は、個人間の売買代金を国が一律に決める制度である。", "truth": false, "why": "地区単位のまちづくりのルール。", "ref": "12条の5", "unit": "35", "sources": ["planning", "planningorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-36-1", "unit": "36", "group": "法令上の制限", "bank": "practice", "stem": "開発許可・建築の制限に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：開発の定義〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "都市計画区域及び準都市計画区域外では、原則1ha以上の開発行為が許可対象となる。", "truth": true, "why": "区域外にも大規模開発の規制がある。", "ref": "29条2項・施行令", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "土地の売買契約は、造成しなくても必ずそれ自体が開発行為である。", "truth": false, "why": "取引と土地改変の行為を分ける。", "ref": "4条12項", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "市街化調整区域の開発は、一般に面積が小さいことだけでは許可不要にならない。", "truth": true, "why": "市街化区域の規模免除を調整区域に転用しない。", "ref": "29条", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "開発許可区域内では、工事完了公告前の建築等は原則として制限される。", "truth": true, "why": "工事用仮設建築物等の例外や承認がある。", "ref": "37条", "unit": "36", "sources": ["planning", "planningorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-36-2", "unit": "36", "group": "法令上の制限", "bank": "practice", "stem": "開発許可・建築の制限に関する次の記述のうち、正しいものはどれか。〔検討テーマ：調整区域の小規模〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "土地の売買契約は、造成しなくても必ずそれ自体が開発行為である。", "truth": false, "why": "取引と土地改変の行為を分ける。", "ref": "4条12項", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "市街化調整区域の開発は、一般に面積が小さいことだけでは許可不要にならない。", "truth": true, "why": "市街化区域の規模免除を調整区域に転用しない。", "ref": "29条", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "都市計画区域外の開発は、100haであっても絶対に許可対象にならない。", "truth": false, "why": "区域外にも大規模開発の規制がある。", "ref": "29条2項・施行令", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "開発許可を得た直後なら、完了公告前でもどんな建物も自由に建てられる。", "truth": false, "why": "工事用仮設建築物等の例外や承認がある。", "ref": "37条", "unit": "36", "sources": ["planning", "planningorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-36-3", "unit": "36", "group": "法令上の制限", "bank": "practice", "stem": "開発許可・建築の制限に関する次の記述のうち、正しいものはどれか。〔検討テーマ：区域外の面積〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "開発許可を得た直後なら、完了公告前でもどんな建物も自由に建てられる。", "truth": false, "why": "工事用仮設建築物等の例外や承認がある。", "ref": "37条", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "都市計画区域及び準都市計画区域外では、原則1ha以上の開発行為が許可対象となる。", "truth": true, "why": "区域外にも大規模開発の規制がある。", "ref": "29条2項・施行令", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "市街化調整区域でも、1,000㎡未満なら目的を問わず必ず開発許可不要である。", "truth": false, "why": "市街化区域の規模免除を調整区域に転用しない。", "ref": "29条", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "土地の売買契約は、造成しなくても必ずそれ自体が開発行為である。", "truth": false, "why": "取引と土地改変の行為を分ける。", "ref": "4条12項", "unit": "36", "sources": ["planning", "planningorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-36-4", "unit": "36", "group": "法令上の制限", "bank": "practice", "stem": "開発許可・建築の制限に関する次の記述のうち、正しいものはどれか。〔検討テーマ：公告前の建築〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "土地の売買契約は、造成しなくても必ずそれ自体が開発行為である。", "truth": false, "why": "取引と土地改変の行為を分ける。", "ref": "4条12項", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "都市計画区域外の開発は、100haであっても絶対に許可対象にならない。", "truth": false, "why": "区域外にも大規模開発の規制がある。", "ref": "29条2項・施行令", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "市街化調整区域でも、1,000㎡未満なら目的を問わず必ず開発許可不要である。", "truth": false, "why": "市街化区域の規模免除を調整区域に転用しない。", "ref": "29条", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "開発許可区域内では、工事完了公告前の建築等は原則として制限される。", "truth": true, "why": "工事用仮設建築物等の例外や承認がある。", "ref": "37条", "unit": "36", "sources": ["planning", "planningorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M1-36-5", "unit": "36", "group": "法令上の制限", "bank": "mock1", "stem": "法令上の制限の総合判断（関連単元：36）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：農業施設の例外〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "開発許可の地位は、相続でも必ず承継できず最初から取り直すしかない。", "truth": false, "why": "一般承継と特定承継で手続が異なる。", "ref": "44・45条", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "既存不適格建築物は、建設当初から必ず違法だった建築物を意味する。", "truth": false, "why": "増改築時等には適用関係を別途判断する。", "ref": "3条", "unit": "37", "sources": ["building", "buildingchanges"]}, {"text": "開発の完了公告後は、予定建築物の用途と違う建築も一切制限されない。", "truth": false, "why": "開発許可内容に対応する規制が残る。", "ref": "42条", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "調整区域の一定の農林漁業用建築物等のための開発には、許可不要の例外がある。", "truth": true, "why": "区域と法定の施設等の要件を個別判断。", "ref": "29条1項2号", "unit": "36", "sources": ["planning", "planningorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M2-36-6", "unit": "36", "group": "法令上の制限", "bank": "mock2", "stem": "法令上の制限の総合判断（関連単元：36）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：完了後の用途〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "建築物の構造等の単体規定は、原則として都市計画区域外にも適用される。", "truth": true, "why": "確認手続と基準の適用範囲は別。", "ref": "第2章", "unit": "37", "sources": ["building", "buildingchanges"]}, {"text": "開発の完了公告後は、予定建築物の用途と違う建築も一切制限されない。", "truth": false, "why": "開発許可内容に対応する規制が残る。", "ref": "42条", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "相続等の一般承継人は、開発許可に基づく地位を承継する。", "truth": true, "why": "一般承継と特定承継で手続が異なる。", "ref": "44・45条", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "調整区域の一定の農林漁業用建築物等のための開発には、許可不要の例外がある。", "truth": true, "why": "区域と法定の施設等の要件を個別判断。", "ref": "29条1項2号", "unit": "36", "sources": ["planning", "planningorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M3-36-7", "unit": "36", "group": "法令上の制限", "bank": "mock3", "stem": "法令上の制限の総合判断（関連単元：36）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：許可の承継〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "市街化区域でも調整区域でも、農業用と名付ければすべて無条件で許可不要になる。", "truth": false, "why": "区域と法定の施設等の要件を個別判断。", "ref": "29条1項2号", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "相続等の一般承継人は、開発許可に基づく地位を承継する。", "truth": true, "why": "一般承継と特定承継で手続が異なる。", "ref": "44・45条", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "開発の完了公告後は、予定建築物の用途と違う建築も一切制限されない。", "truth": false, "why": "開発許可内容に対応する規制が残る。", "ref": "42条", "unit": "36", "sources": ["planning", "planningorder"]}, {"text": "建物の用途変更は、ホテル等への大規模変更でも確認が法律上一切不要である。", "truth": false, "why": "類似用途相互間等の例外もある。", "ref": "87条・6条", "unit": "37", "sources": ["building", "buildingchanges"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-37-1", "unit": "37", "group": "法令上の制限", "bank": "practice", "stem": "建築確認・2025改正・単体規定に関する次の記述のうち、正しいものはどれか。〔検討テーマ：2階の確認対象〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "2025年4月以後、階数2以上の建築物は、構造によらず原則として全国で建築確認対象となる。", "truth": true, "why": "改正後の規模基準で判定。", "ref": "6条", "unit": "37", "sources": ["building", "buildingchanges"]}, {"text": "防火地域内でも10㎡以内の増築なら、例外なく建築確認不要である。", "truth": false, "why": "区域と増築等の工事種類が条件。新築へ一般化しない。", "ref": "6条2項", "unit": "37", "sources": ["building", "buildingchanges"]}, {"text": "検査済証は、工事着手前の計画確認だけで必ず交付される。", "truth": false, "why": "確認済証と検査済証を区別。", "ref": "7条", "unit": "37", "sources": ["building", "buildingchanges"]}, {"text": "平屋なら延べ面積1,000㎡でも、全国どこでも確認不要である。", "truth": false, "why": "階数と面積は「又は」で結ばれる。", "ref": "6条", "unit": "37", "sources": ["building", "buildingchanges"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-37-2", "unit": "37", "group": "法令上の制限", "bank": "practice", "stem": "建築確認・2025改正・単体規定に関する次の記述のうち、正しいものはどれか。〔検討テーマ：面積の条件〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "防火地域内でも10㎡以内の増築なら、例外なく建築確認不要である。", "truth": false, "why": "区域と増築等の工事種類が条件。新築へ一般化しない。", "ref": "6条2項", "unit": "37", "sources": ["building", "buildingchanges"]}, {"text": "平屋でも延べ面積200㎡を超える建築物は、原則として全国で確認対象となる。", "truth": true, "why": "階数と面積は「又は」で結ばれる。", "ref": "6条", "unit": "37", "sources": ["building", "buildingchanges"]}, {"text": "都市計画区域外なら、木造2階建て住宅の新築は現在も必ず建築確認不要である。", "truth": false, "why": "改正後の規模基準で判定。", "ref": "6条", "unit": "37", "sources": ["building", "buildingchanges"]}, {"text": "検査済証は、工事着手前の計画確認だけで必ず交付される。", "truth": false, "why": "確認済証と検査済証を区別。", "ref": "7条", "unit": "37", "sources": ["building", "buildingchanges"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-37-3", "unit": "37", "group": "法令上の制限", "bank": "practice", "stem": "建築確認・2025改正・単体規定に関する次の記述のうち、正しいものはどれか。〔検討テーマ：小規模増築の例外〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "防火・準防火地域外の10㎡以内の増築等には、建築確認不要の例外がある。", "truth": true, "why": "区域と増築等の工事種類が条件。新築へ一般化しない。", "ref": "6条2項", "unit": "37", "sources": ["building", "buildingchanges"]}, {"text": "検査済証は、工事着手前の計画確認だけで必ず交付される。", "truth": false, "why": "確認済証と検査済証を区別。", "ref": "7条", "unit": "37", "sources": ["building", "buildingchanges"]}, {"text": "平屋なら延べ面積1,000㎡でも、全国どこでも確認不要である。", "truth": false, "why": "階数と面積は「又は」で結ばれる。", "ref": "6条", "unit": "37", "sources": ["building", "buildingchanges"]}, {"text": "都市計画区域外なら、木造2階建て住宅の新築は現在も必ず建築確認不要である。", "truth": false, "why": "改正後の規模基準で判定。", "ref": "6条", "unit": "37", "sources": ["building", "buildingchanges"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-37-4", "unit": "37", "group": "法令上の制限", "bank": "practice", "stem": "建築確認・2025改正・単体規定に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：完了検査の証〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "平屋でも延べ面積200㎡ ]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-40-2", "unit": "40", "group": "法令上の制限", "bank": "practice", "stem": "農地法・転用・権利移動に関する次の記述のうち、正しいものはどれか。〔検討テーマ：自分の農地を転用〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "農地を買って転用する場合は、権利移動を無視して必ず4条だけで処理する。", "truth": false, "why": "権利移動と転用を併せて規制する。", "ref": "5条", "unit": "40", "sources": ["farm"]}, {"text": "農地を耕作目的のまま売る場合は、必ず5条の転用許可となる。", "truth": false, "why": "権利移動と転用の有無で分類する。", "ref": "3条", "unit": "40", "sources": ["farm"]}, {"text": "自己所有の農地を自ら駐車場へ転用する場合は、原則4条の対象となる。", "truth": true, "why": "権利移動を伴わない転用は4条。", "ref": "4条", "unit": "40", "sources": ["farm"]}, {"text": "市街化区域内の農地転用は、届出も許可も一切不要である。", "truth": false, "why": "事前届出の要件を省略しない。3条の移動に一般化しない。", "ref": "4・5条", "unit": "40", "sources": ["farm"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-40-3", "unit": "40", "group": "法令上の制限", "bank": "practice", "stem": "農地法・転用・権利移動に関する次の記述のうち、正しいものはどれか。〔検討テーマ：転用目的の購入〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "市街化区域内の農地転用は、届出も許可も一切不要である。", "truth": false, "why": "事前届出の要件を省略しない。3条の移動に一般化しない。", "ref": "4・5条", "unit": "40", "sources": ["farm"]}, {"text": "農地を耕作目的のまま売る場合は、必ず5条の転用許可となる。", "truth": false, "why": "権利移動と転用の有無で分類する。", "ref": "3条", "unit": "40", "sources": ["farm"]}, {"text": "自己所有農地の自己転用は、原則3条だけの対象である。", "truth": false, "why": "権利移動を伴わない転用は4条。", "ref": "4条", "unit": "40", "sources": ["farm"]}, {"text": "農地を買って住宅敷地へ転用する場合は、原則5条の対象となる。", "truth": true, "why": "権利移動と転用を併せて規制する。", "ref": "5条", "unit": "40", "sources": ["farm"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-40-4", "unit": "40", "group": "法令上の制限", "bank": "practice", "stem": "農地法・転用・権利移動に関する次の記述のうち、正しいものはどれか。〔検討テーマ：市街化区域の特例〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "農地を耕作目的のまま売る場合は、必ず5条の転用許可となる。", "truth": false, "why": "権利移動と転用の有無で分類する。", "ref": "3条", "unit": "40", "sources": ["farm"]}, {"text": "市街化区域内の農 : true, "why": "法の農地定義と登記地目を分ける。", "ref": "2条", "unit": "40", "sources": ["farm"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "M3-40-7", "unit": "40", "group": "法令上の制限", "bank": "mock3", "stem": "法令上の制限の総合判断（関連単元：40）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：無許可の効力〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "規制区域でも、契約後2週間以内の届出さえすれば許可は一切不要である。", "truth": false, "why": "許可制と届出制を区別する。", "ref": "14条", "unit": "41", "sources": ["national"]}, {"text": "農地を相続するには、例外なく取得前の3条許可が必要である。", "truth": false, "why": "相続等の一般承継と通常の売買を区別。", "ref": "3・3条の3", "unit": "40", "sources": ["farm"]}, {"text": "3条許可を要する権利移動を無許可で行っても、その権利移動は効力を生じない。", "truth": true, "why": "農地法の効力規定。業法違反一般の効果と混同しない。", "ref": "3条7項", "unit": "40", "sources": ["farm"]}, {"text": "登記地目が宅地なら、現に耕作されていても絶対に農地法の農地にならない。", "truth": false, "why": "法の農地定義と登記地目を分ける。", "ref": "2条", "unit": "40", "sources": ["farm"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-41-1", "unit": "41", "group": "法令上の制限", "bank": "practice", "stem": "国土利用計画法・届出と許可に関する次の記述のうち、正しいものはどれか。〔検討テーマ：市街化区域の境界〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "市街化調整区域の通常届出面積は、一律2,000㎡以上である。", "truth": false, "why": "その他都市計画区域は5,000㎡。", "ref": "23条・施行令", "unit": "41", "sources": ["national"]}, {"text": "通常の事後届出は、代金全額支払日から2か月以内でよい。", "truth": false, "why": "登記や決済日ではなく契約日。", "ref": "23条", "unit": "41", "sources": ["national"]}, {"text": "通常の事後届出は、市街化区域で2,000㎡以上の土地取引契約が原則対象となる。", "truth": true, "why": "区域で閾値が違う。", "ref": "23条・施行令", "unit": "41", "sources": ["national"]}, {"text": "通常の事後届出は、売主だけが行い買主には一切義務がない。", "truth": false, "why": "取得者の利用目的等を把握する制度。", "ref": "23条", "unit": "41", "sources": ["national"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-41-2", "unit": "41", "group": "法令上の制限", "bank": "practice", "stem": "国土利用計画法・届出と許可に関する次の記述のうち、正しいものはどれか。〔検討テーマ：非線引き区域の面積〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "通常の事後届出は、代金全 41", "sources": ["national"]}, {"text": "通常の事後届出は、代金全額支払日から2か月以内でよい。", "truth": false, "why": "登記や決済日ではなく契約日。", "ref": "23条", "unit": "41", "sources": ["national"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M1-41-5", "unit": "41", "group": "法令上の制限", "bank": "mock1", "stem": "法令上の制限の総合判断（関連単元：41）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：一団の土地〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "同一の利用目的に供する一団の土地を買い集める場合、所定の面積判定で合算が必要となる。", "truth": true, "why": "分割して規制を回避できない。", "ref": "23条の解釈", "unit": "41", "sources": ["national"]}, {"text": "通常の事後届出を怠ると、売買契約は必ず当然無効になる。", "truth": false, "why": "罰則等と私法効力を分ける。規制区域の許可制とは違う。", "ref": "23・47条", "unit": "41", "sources": ["national"]}, {"text": "盛土規制区域の土地は、工事を自分でした人以外に法定の責務が一切ない。", "truth": false, "why": "工事許可と土地の継続的な安全確保を区別。", "ref": "盛土規制法16・21条等", "unit": "42", "sources": ["readjustment", "embankment", "landscape"]}, {"text": "規制区域でも、契約後2週間以内の届出さえすれば許可は一切不要である。", "truth": false, "why": "許可制と届出制を区別する。", "ref": "14条", "unit": "41", "sources": ["national"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M2-41-6", "unit": "41", "group": "法令上の制限", "bank": "mock2", "stem": "法令上の制限の総合判断（関連単元：41）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：無届の売買〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "規制区域内の所定の土地取引は許可制であり、通常の事後届出とは異なる。", "truth": true, "why": "許可制と届出制を区別する。", "ref": "14条", "unit": "41", "sources": ["national"]}, {"text": "景観計画区域内の所定の行為は、原則として着手30日前までに届出をする。", "truth": true, "why": "原則30日間の着手制限。適用除外や短縮等を別途確認。", "ref": "景観法16・18条", "unit": "42", "sources": ["readjustment", "embankment", "landscape"]}, {"text": "通常の事後届出を怠ると、売買契約は必ず当然無効になる。", "truth": false, "why": "罰則等と私法効力を分ける。規制区域の許可制とは違う。", "ref": "23・47条", "unit": "41", "sources": ["national"]}, {"text": "同一の利用目的に供する一団の土地を買い集める場合、所定の面積判定で合算が必要となる。", "truth": true, "why": "分割して規制を回避できない。", "ref": "23条の解釈", "unit": "41", "sources": ["national"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "M3-41-7", "un 。", "ref": "景観法16・18条", "unit": "42", "sources": ["readjustment", "embankment", "landscape"]}, {"text": "地区計画は、地区の特性に応じて建築物等や公共施設を一体的に定める計画である。", "truth": true, "why": "地区単位のまちづくりのルール。", "ref": "12条の5", "unit": "35", "sources": ["planning", "planningorder"]}, {"text": "土地区画整理組合の設立認可には、原則所有者と借地権者それぞれの3分の2以上等の同意が必要である。", "truth": true, "why": "人数要件に加えて面積要件等もある。", "ref": "区画整理法18条", "unit": "42", "sources": ["readjustment", "embankment", "landscape"]}, {"text": "盛土規制区域の土地の所有者等には、所定の災害防止措置に関する責務がある。", "truth": true, "why": "工事許可と土地の継続的な安全確保を区別。", "ref": "盛土規制法16・21条等", "unit": "42", "sources": ["readjustment", "embankment", "landscape"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M3-42-7", "unit": "42", "group": "法令上の制限", "bank": "mock3", "stem": "法令上の制限の総合判断（関連単元：42）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：組合の同意〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "盛土規制区域の土地は、工事を自分でした人以外に法定の責務が一切ない。", "truth": false, "why": "工事許可と土地の継続的な安全確保を区別。", "ref": "盛土規制法16・21条等", "unit": "42", "sources": ["readjustment", "embankment", "landscape"]}, {"text": "土地区画整理組合の設立認可には、原則所有者と借地権者それぞれの3分の2以上等の同意が必要である。", "truth": true, "why": "人数要件に加えて面積要件等もある。", "ref": "区画整理法18条", "unit": "42", "sources": ["readjustment", "embankment", "landscape"]}, {"text": "景観計画区域の所定行為の届出は、工事終了後にだけ行う。", "truth": false, "why": "原則30日間の着手制限。適用除外や短縮等を別途確認。", "ref": "景観法16・18条", "unit": "42", "sources": ["readjustment", "embankment", "landscape"]}, {"text": "非線引き都市計画区域には、用途地域を一切定められない。", "truth": false, "why": "線引きの有無と用途地域の有無を別々に確認。", "ref": "7・8条", "unit": "35", "sources": ["planning", "planningorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-43-1", "unit": "43", "group": "税・価格評定", "bank": "practice", "stem": "不動産取得税・固定資産税・登録免許税等に関する次の記述のうち、正しいものはどれか。〔検討テーマ：取得税の課税主体〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "相続で土地を取得すると、売買と同じく必ず不動産取得税が課税される。", "truth": false, "why": "登記に対する登録免許税は別に判断。", "ref": "地方税法73条の7", "unit": "43 "newhousetax", "registrationrates", "stamprates"]}, {"text": "相続で土地を取得すると、売買と同じく必ず不動産取得税が課税される。", "truth": false, "why": "登記に対する登録免許税は別に判断。", "ref": "地方税法73条の7", "unit": "43", "sources": ["localtax", "registrationtax", "stamp", "specialtax", "acquisition", "newhousetax", "registrationrates", "stamprates"]}, {"text": "不動産取得税は、国だけが課す国税である。", "truth": false, "why": "固定資産税は原則市町村、登録免許税は国税。", "ref": "地方税法73条の2", "unit": "43", "sources": ["localtax", "registrationtax", "stamp", "specialtax", "acquisition", "newhousetax", "registrationrates", "stamprates"]}, {"text": "小規模住宅用地の固定資産税の課税標準は、所定の範囲で価格の6分の1となる。", "truth": true, "why": "原則住宅1戸につき200㎡まで等の条件。都市計画税は別割合。", "ref": "地方税法349条の3の2", "unit": "43", "sources": ["localtax", "registrationtax", "stamp", "specialtax", "acquisition", "newhousetax", "registrationrates", "stamprates"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M1-43-5", "unit": "43", "group": "税・価格評定", "bank": "mock1", "stem": "税・価格評定の総合判断（関連単元：43）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：取得税の新免税点〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "2026年4月の3,000万円の紙の不動産売買契約書は、軽減後の印紙税が必ず1通100万円である。", "truth": false, "why": "1,000万円超5,000万円以下は軽減1万円。2027年3月31日まで。電子記録そのものは同じ課税文書ではない。", "ref": "租税特別措置法91条・国税庁7108", "unit": "43", "sources": ["localtax", "registrationtax", "stamp", "specialtax", "acquisition", "newhousetax", "registrationrates", "stamprates"]}, {"text": "2026年4月1日以後に取得する土地の不動産取得税の免税点は16万円未満である。", "truth": true, "why": "免税点は「未満」。家屋は新築等66万円未満、その他34万円未満へ変更。", "ref": "地方税法73条の15の2・東京都主税局", "unit": "43", "sources": ["localtax", "registrationtax", "stamp", "specialtax", "acquisition", "newhousetax", "registrationrates", "stamprates"]}, {"text": "取得費が不明なら、売却収入の全額を必ず取得費として差し引ける。", "truth": false, "why": "概算取得費の割合は5％。実額との扱いも確認。", "ref": "租税特別措置法31条の4", "unit": "44", "sources": ["income", "home", "specialtax", "taxloss"]}, {"text": "土地売買の所有権移転登記の登録免許税率1.5％は、2026年3月31日で終了し2026年4月は適用できない。", "truth": false, "why": "2026年改正で期限延長。本則2％と軽減1.5％を区別。相続移転の本則0.4％や免税措置は別に判断。", "ref": "租税特別措置法72条・国税庁7191", "unit": "43", "sources": ["localtax", "registrationtax", "stamp", "specialtax", "acquisition", "newhousetax", "registrationrates", "stamprates"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M2-43-6", "unit": "43", "group": "税・価格評定", "bank": "mock2", "stem": "税・価格評定の総合判断（関連単元：43）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：契約書の軽減税額〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "2026年4月の3,000万円の紙の不動産売買契約書は、軽減後の印紙税が必ず1通100万円である。", "truth": false, "why": "1,000万円超5,000万円以下は軽減1万円。2027年3月31日まで。電子記録そのものは同じ課税文書ではない。", "ref": "租税特別措置法91条・国税庁7108", "unit": "43", "sources": ["localtax", "registrationtax", "stamp", "specialtax", "acquisition", "newhousetax", "registrationrates", "stamprates"]}, {"text": "マイホームの3,000万円特別控除は、適用に確定申告等の手続が必要である。", "truth": true, "why": "特例適用は手続要件を満たす。", "ref": "国税庁3302", "unit": "44", "sources": ["income", "home", "specialtax", "taxloss"]}, {"text": "2026年4月1日以後に取得する土地の不動産取得税の免税点は16万円未満である。", "truth": true, "why": "免税点は「未満」。家屋は新築等66万円未満、その他34万円未満へ変更。", "ref": "地方税法73条の15の2・東京都主税局", "unit": "43", "sources": ["localtax", "registrationtax", "stamp", "specialtax", "acquisition", "newhousetax", "registrationrates", "stamprates"]}, {"text": "土地売買の所有権移転登記は、2029年3月31日までの所定の登記について登録免許税率が1.5％に軽減される。", "truth": true, "why": "2026年改正で期限延長。本則2％と軽減1.5％を区別。相続移転の本則0.4％や免税措置は別に判断。", "ref": "租税特別措置法72条・国税庁7191", "unit": "43", "sources": ["localtax", "registrationtax", "stamp", "specialtax", "acquisition", "newhousetax", "registrationrates", "stamprates"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M3-43-7", "unit": "43", "group": "税・価格評定", "bank": "mock3", "stem": "税・価格評定の総合判断（関連単元：43）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：土地登記の税率〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "2026年4月の3,000万円の紙の不動産売買契約書は、軽減後の印紙税が必ず1通100万円である。", "truth": false, "why": "1,000万円超5,000万円以下は軽減1万円。2027年3月31日まで。電子記録そのものは同じ課税文書ではない。", "ref": "租税特別措置法91条・国税庁7108", "unit": "43", "sources": ["localtax", "registrationtax", "stamp", "specialtax", "acquisition", "newhousetax", "registrationrates", "stamprates"]}, {"text": "土地売買の所有権移転登記は、2029年3月31日までの所定の登記について登録免許税率が1.5％に軽減される。", "truth": true, "why": "2026年改正で期限延長。本則2％と軽減1.5％を区別。相続移転の本則0.4％や免税措置は別に判断。", "ref": "租税特別措置法72条・国税庁7191", "unit": "43", "sources": ["localtax", "registrationtax", "stamp", "specialtax", "acquisition", "newhousetax", "registrationrates", "stamprates"]}, {"text": "転居した翌日から、その家には3,000万円特別控除を一切使えなくなる。", "truth": false, "why": "転居後にも期限付きの対象範囲がある。取り壊し後等には追加条件。", "ref": "国税庁3302", "unit": "44", "sources": ["income", "home", "specialtax", "taxloss"]}, {"text": "2026年4月1日以後も、土地の不動産取得税は16万円ちょうどなら必ず免税である。", "truth": false, "why": "免税点は「未満」。家屋は新築等66万円未満、その他34万円未満へ変更。", "ref": "地方税法73条の15の2・東京都主税局", "unit": "43", "sources": ["localtax", "registrationtax", "stamp", "specialtax", "acquisition", "newhousetax", "registrationrates", "stamprates"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-44-1", "unit": "44", "group": "税・価格評定", "bank": "practice", "stem": "譲渡所得・居住用財産の特例に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：長期短期の判定〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "マイホームの3,000万円特別控除は、所有期間の長短を問わず所定条件で適用される。", "truth": true, "why": "10年超の軽減税率の条件と混同しない。", "ref": "租税特別措置法35条・国税庁3302", "unit": "44", "sources": ["income", "home", "specialtax", "taxloss"]}, {"text": "親子や夫婦など特別な関係がある人への売却は、マイホーム3,000万円特別控除の対象外である。", "truth": true, "why": "対象となる譲渡相手にも条件がある。", "ref": "国税庁3302", "unit": "44", "sources": ["income", "home", "specialtax", "taxloss"]}, {"text": "土地建物の長短区分は、必ず売却日当日の所有期間だけで判定する。", "truth": false, "why": "基準日は1月1日。5年ちょうどは短期。", "ref": "租税特別措置法31・32条", "unit": "44", "sources": ["income", "home", "specialtax", "taxloss"]}, {"text": "譲渡所得は、譲渡収入から取得費・譲渡費用等を控除して計算する。", "truth": true, "why": "所得は利益。適用できる特別控除も別途差し引く。", "ref": "所得税法33条", "unit": "44", "sources": ["income", "home", "specialtax", "taxloss"]}], "answer": 2, "checked": "2  "2026-10-08"}, {"id": "M2-44-6", "unit": "44", "group": "税・価格評定", "bank": "mock2", "stem": "税・価格評定の総合判断（関連単元：44）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：申告をする必要〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "地価公示では建物等がある標準地でも、それがないものとしての正常な土地価格を判定する。", "truth": true, "why": "土地そのものの正常価格を把握する。", "ref": "地価公示法2条2項", "unit": "45", "sources": ["publicprice", "appraisal"]}, {"text": "マイホームの控除で所得がゼロなら、要件確認も申告も例外なく不要である。", "truth": false, "why": "特例適用は手続要件を満たす。", "ref": "国税庁3302", "unit": "44", "sources": ["income", "home", "specialtax", "taxloss"]}, {"text": "取得費が不明な場合等には、原則として譲渡収入の5％を概算取得費とすることができる。", "truth": true, "why": "概算取得費の割合は5％。実額との扱いも確認。", "ref": "租税特別措置法31条の4", "unit": "44", "sources": ["income", "home", "specialtax", "taxloss"]}, {"text": "以前住んでいた家は、原則住まなくなった日から3年経過する日の属する年の12月31日までの売却など所定条件で控除対象となる。", "truth": true, "why": "転居後にも期限付きの対象範囲がある。取り壊し後等には追加条件。", "ref": "国税庁3302", "unit": "44", "sources": ["income", "home", "specialtax", "taxloss"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M3-44-7", "unit": "44", "group": "税・価格評定", "bank": "mock3", "stem": "税・価格評定の総合判断（関連単元：44）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：住まなくなった家〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "私人の土地売買は、公示価格から1円でも違うと必ず契約無効になる。", "truth": false, "why": "指標と法的な売買価格強制を分ける。", "ref": "地価公示法1・8条", "unit": "45", "sources": ["publicprice", "appraisal"]}, {"text": "取得費が不明なら、売却収入の全額を必ず取得費として差し引ける。", "truth": false, "why": "概算取得費の割合は5％。実額との扱いも確認。", "ref": "租税特別措置法31条の4", "unit": "44", "sources": ["income", "home", "specialtax", "taxloss"]}, {"text": "以前住んでいた家は、原則住まなくなった日から3年経過する日の属する年の12月31日までの売却など所定条件で控除対象となる。", "truth": true, "why": "転居後にも期限付きの対象範囲がある。取り壊し後等には追加条件。", "ref": "国税庁3302", "unit": "44", "sources": ["income", "home", "specialtax", "taxloss"]}, {"text": "マイホームの控除で所得がゼロなら、要件確認も申告も例外なく不要である。", "truth": false, "why": "特例適用は手続要件を満たす。", "ref": "国税庁3302", "unit": "44", "sources": ["income", "home", "specialtax", "taxloss"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-45-1", "unit": "45", "group": "税・価格評定", "bank": "practice", "stem": "地価公示・不動産鑑定評価に関する次の記述のうち、正しいものはどれか。〔検討テーマ：公示の基準日〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "原価法は、将来の純収益だけを資本還元する手法である。", "truth": false, "why": "後者は収益還元法。", "ref": "鑑定評価基準総論7章", "unit": "45", "sources": ["publicprice", "appraisal"]}, {"text": "収益還元法では、経費や空室を考えず家賃総額だけをそのまま物件価格にする。", "truth": false, "why": "純収益、還元利回り・割引率等の判断が必要。", "ref": "鑑定評価基準", "unit": "45", "sources": ["publicprice", "appraisal"]}, {"text": "公示価格は、各宅建業者が自由に決めてそのまま国の公示となる。", "truth": false, "why": "国の土地鑑定委員会が判定公示する。", "ref": "地価公示法2条", "unit": "45", "sources": ["publicprice", "appraisal"]}, {"text": "地価公示の標準地価格は、毎年1月1日時点の正常な価格を基準とする。", "truth": true, "why": "7月1日は都道府県地価調査の原則基準日。", "ref": "地価公示法・国交省", "unit": "45", "sources": ["publicprice", "appraisal"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-45-2", "unit": "45", "group": "税・価格評定", "bank": "practice", "stem": "地価公示・不動産鑑定評価に関する次の記述のうち、正しいものはどれか。〔検討テーマ：判定する機関〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "原価法は、将来の純収益だけを資本還元する手法である。", "truth": false, "why": "後者は収益還元法。", "ref": "鑑定評価基準総論7章", "unit": "45", "sources": ["publicprice", "appraisal"]}, {"text": "収益還元法では、経費や空室を考えず家賃総額だけをそのまま物件価格にする。", "truth": false, "why": "純収益、還元利回り・割引率等の判断が必要。", "ref": "鑑定評価基準", "unit": "45", "sources": ["publicprice", "appraisal"]}, {"text": "地価公示の価格時点は、原則毎年7月1日である。", "truth": false, "why": "7月1日は都道府県地価調査の原則基準日。", "ref": "地価公示法・国交省", "unit": "45", "sources": ["publicprice", "appraisal"]}, {"text": "公示価格は、所定の鑑定評価を基に土地鑑定委員会が判定する。", "truth": true, "why": "国の土地鑑定委員会が判定公示する。", "ref": "地価公示法2条", "unit": "45", "sources": ["publicprice", "appraisal"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-45-3", "unit": "45", "group": "税・価格評定", "bank": "practice", "stem": "地価公示・不動産鑑定評価に関する次の記述のうち、正しいものはどれか。〔検討テーマ：原価法の考え方〕", "pre": "2026年4月1日施行法令による。特に記載がなければ function comparison(t){return`<div class="tablewrap"><table><thead><tr><th>区別するもの</th><th>要点</th></tr></thead><tbody>${t.split('／').map(x=>{const a=x.split('→');return`<tr><th>${readable(a[0])}</th><td>${readable(a.slice(1).join('→'))}</td></tr>`}).join('')}</tbody></table></div>`}
function unitpage(){const u=U[route.id];if(!u)return unitlist();return`<div class="row between">${btn('← 目次','nav:units')}<div class="row">${btn(S.unitbook.includes(u.id)?'★ 保存済み':'☆ 講義を保存','unitbook:'+u.id)}${btn('印刷','print')}</div></div><article class="lecture"><div class="pagehead"><span class="pill">${u.group}</span><h1>${u.id} ${esc(u.title)}</h1><div class="small muted">学習の目安15〜25分＋確認問題 ｜ 基準2026年4月1日 ｜ 確認2026年10月8日</div></div>${visualUnit(u)}<details class="deep-reading"><summary>詳しい講義を読む・原則と例外を確認</summary><div class="inside"><div class="section"><h2>仕組みを理解する</h2>${u.lecture.map(p=>`<p>${readable(p)}</p>`).join('')}</div><div class="section"><h2>営業の相談で考える</h2><div class="info">${readable(u.example)}</div><h3>比較して整理</h3>${comparison(u.compare)}<h3>数字・期限・条件</h3><p>${readable(u.memory)}</p><div class="alert"><strong>混同しやすい点</strong><br>${readable(u.trap)}</div></div>${u.supplement.map(([t,p])=>`<div class="section"><h2>${esc(t)}</h2><p>${readable(p)}</p></div>`).join('')}<div class="section"><h2>論点を一つずつ確かめる</h2>${u.facts.map((f,i)=>`<details><summary>${i+1}. ${esc(f.tag)}</summary><div class="inside"><p><strong class="good">原則・正しい整理</strong><br>${readable(f.yes)}</p><p>${readable(f.why)}</p><p class="small bad">誤り例：${readable(f.no)}</p><div class="source">根拠：${esc(f.ref)}</div></div></details>`).join('')}</div></div></details><div class="section"><h2>理解確認へ</h2><p>この単元の演習4問に取り組み、誤りの理由を説明できるか確かめます。</p><div class="row">${btn('確認4問を解く','start:unit:'+u.id,'class="primary"')}${btn('この単元の暗記カード','cardsunit:'+u.id)}${btn(S.read.includes(u.id)?'✓ 読了済み（解除）':'読了にする','read:'+u.id)}</div></div><h3>根拠資料</h3><p class="small muted">関連条文：${esc(u.article)}。法令リンクは取得時点の改正版を指定しています。公式資料の閲覧には通信が必要です。</p>${sources(u.sources)}<div class="row actions">${Number(u.id)>1?btn('← 前の講義','unit:'+String(Number(u.id)-1).padStart(2,'0')):''}${Number(u.id)<50?btn('次の講義 →','unit:'+String(Number(u.id)+1).padStart(2,'0')):''}</div></article>`}
function practiceMenu(){return`<div class="pagehead"><div class="eyebrow">PRACTICE / オリジナル200問</div><h1>分野別演習</h1><p class="muted">一問ごとに採点。全4選択肢の理由まで読むと理解が固まります。</p></div>${S.practice?`<div class="info">途中の${esc(S.practice.mode)}：${S.practice.pos+1} / ${S.practice.ids.length}問 <div class="row">${btn('続きから','resumepractice','class="primary"')}${btn('途中演習を終了','cancelpractice')}</div></div>`:''}<div class="grid two">${GROUPS.map(g=>{const n=DATA.questions.filter(q=>q.bank==='practice'&&q.group===g).length;return`<div class="card"><span class="pill">${n}問</span><h2>${g}</h2><div class="row">${btn('10問から','start:group:'+g,'class="primary"')}${btn('全問','start:allgroup:'+g)}</div></div>`}).join('')}<div class="card"><h2>短い時間で</h2><div class="row">${btn('全分野から10問','start:random')}${btn('15問の診断','start:diagnosis')}${btn('直近の苦手','start:weak')}</div></div></div>`}
function startPractice(type,value){if(S.exam){notify('模試の採点が終わってから演習を開始してください');go('mocks');return}let ids=[];let mode='演習';const practice=DATA.questions.filter(q=>q.bank==='practice');if(type==='unit'){ids=practice.filter(q=>q.unit===value).map(q=>q.id);mode=U[value].title+' 確認'}else if(type==='group'||type==='allgroup'){ids=practice.filter(q=>q.group===value).map(q=>q.id);mode=value;shuffle(ids);if(type==='group')ids=ids.slice(0,10)}else if(type==='diagnosis'){GROUPS.forEach(g=>ids.push(...practice.filter(q=>q.group===g).slice(0,3).map(q=>q.id)));mode='初回診断'}else if(type==='weak'){ids=weakIds();mode='苦手復習'}else if(type==='book'){ids=S.book.slice();mode='ブックマーク'}else{ids=practice.map(q=>q.id);shuffle(ids);ids=ids.slice(0,10)}if(!ids.length){notify('対象の問題がありません');return}S.practice={ids,pos:0,answers:{},flags:[],revealed:false,mode};save();go('practice',{active:true})}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function question(q,s,isExam=false){const answered=s.answers[q.id];return`<div class="wordbar">${btn(helpWords?'用語の説明：ON':'用語の説明：OFF','wordhelp','aria-pressed="'+helpWords+'"')}</div><span class="pill">${q.group}</span><span class="small muted">${q.id}</span><h2>${readable(q.stem)}</h2><p class="small muted">${readable(q.pre)}</p>${q.options.map((o,i)=>`<button class="option ${answered===i?'selected':''} ${s.revealed?(i===q.answer?'right':answered===i?'wrong':''):''}" data-action="answer:${i}" ${s.revealed?'disabled':''}><span class="badge">${i+1}</span><span>${readable(o.text)}</span></button>`).join('')}<div class="row">${btn(S.book.includes(q.id)?'★ 問題を保存済み':'☆ 問題を保存','book:'+q.id)}${isExam?btn(s.flags.includes(q.id)?'⚑ 見直し印あり':'見直し印をつける','flag'):''}</div>${s.revealed?explanations(q,answered):''}`}
function explanations(q,answer){return`<div class="info"><strong>${answer===q.answer?'正解です':'不正解です'}。正解は ${q.answer+1}</strong> <span class="small">（${q.askTruth?'正しい':'誤っている'}記述を選ぶ設問）</span></div>${q.options.map((o,i)=>`<div class="explain"><strong class="${o.truth?'good':'bad'}">${i+1}. 記述は${o.truth?'正しい':'誤り'}${i===q.answer?' ／ この設問の正解':''}</strong><p>${readable(o.text)}</p><p>${readable(o.why)}</p><div class="source">根拠：${esc(o.ref)} ・ 確認 ${q.checked}</div>${btn('講義 '+o.unit+' に戻る','unit:'+o.unit)}<details><summary class="small">根拠資料を見る</summary><div class="inside">${sources(o.sources)}</div></details></div>`).join('')}<label>間違いノート・自分の言葉で <textarea id="note" placeholder="どこを取り違えたか、次は何を確認するか">${esc(S.notes[q.id]||'')}</textarea></label>${btn('メモを保存','savenote:'+q.id)}`}
function practiceActive(){const s=S.practice;if(!s)return practiceMenu();const q=Q[s.ids[s.pos]];return`<div class="row between"><h1>${esc(s.mode)}</h1>${btn('途中保存してメニューへ','savepractice')}</div><div class="small muted">${s.pos+1} / ${s.ids.length}問</div><div class="progress"><span style="width:${s.pos/s.ids.length*100}%"></span></div><div class="card" style="margin-top:20px">${question(q,s)}<div class="row actions">${!s.revealed?btn('回答を確定・解説を見る','check','class="primary" '+(s.answers[q.id]===undefined?'disabled':'')):btn(s.pos===s.ids.length-1?'演習を終了':'次の問題 →','nextpractice','class="primary"')}</div></div>`}
function record(id,answer,mode){const h={id,answer,correct:answer===Q[id].answer,at:Date.now(),mode};S.history.push(h);return h}
function check(){let s=S.practice;if(!s||s.revealed||s.answers[s.ids[s.pos]]===undefined)return;record(s.ids[s.pos],s.answers[s.ids[s.pos]],s.mode);s.revealed=true;save();render()}
function nextPractice(){const s=S.practice;if(!s)return;if(s.pos===s.ids.length-1){const score=s.ids.filter(id=>s.answers[id]===Q[id].answer).length;route={view:'practice',completed:{score,n:s.ids.length,mode:s.mode,ids:s.ids,answers:s.answers}};if(s.mode==='初回診断')S.diagnosis={at:Date.now(),score};S.practice=null;save();render();window.scrollTo(0,0)}else{s.pos++;s.revealed=false;save();render();window.scrollTo(0,0)}}
function practiceCompleted(){const c=route.completed;return`<div class="card"><div class="eyebrow">PRACTICE RESULT</div><h1>${esc(c.mode)}を終えました</h1><div class="metric">${c.score} / ${c.n}問正解</div><p>不正解は復習ノートへ記録しました。次は解説を読んで、誤りの理由を自分の言葉にしましょう。</p><div class="row">${btn('苦手を復習','start:weak','class="primary"')}${btn('今日の学習へ','nav:home')}${btn('演習メニュー','nav:practice')}</div></div><div class="card">${GROUPS.map(g=>{const ids=c.ids.filter(id=>Q[id].group===g);return ids.length?`<p>${g}：${ids.filter(id=>c.answers[id]===Q[id].answer).length} / ${ids.length}</p>`:''}).join('')}</div>`}
function mocks(){return`<div class="pagehead"><div class="eyebrow">MOCK EXAM / 3 SETS</div><h1>50問・120分の模試</h1><p class="muted">時間配分と解き直しを練習。各回は演習とは別の50問です。</p></div><div class="info">通常50問・120分、1問1点。5問免除モードは登録講習修了者用の練習条件：免除科目5問を除いた45問・110分、採点は45点満点。換算表示は得点＋免除5点を明記します。</div>${S.exam?`<div class="card"><h2>途中の模試${S.exam.bank.slice(-1)}</h2><p>回答済み ${Object.keys(S.exam.answers).length} / ${S.exam.ids.length}問。ブラウザを閉じても時間は進みます。</p><div class="row">${btn('模試を再開','resumeexam','class="primary"')}${btn('現在の回答で採点','finishexam')}</div></div>`:''}<div class="grid">${[1,2,3].map(n=>`<div class="card"><div class="eyebrow">SET 0${n}</div><h2>模試${n}</h2><p>${['基礎と条件の確認','誤りを見抜く比較判断','全分野の最終点検'][n-1]}</p><label><input type="checkbox" id="exempt${n}" ${S.exam?'disabled':''}> 5問免除（45問・110分）</label><p>${btn('模試を開始','exam:'+n,'class="primary" '+(S.exam?'disabled':''))}</p><span class="small muted">権利14・業法20・制限8・税価格3・免除5。収録順はこの教材独自です。</span></div>`).join('')}</div><h2>過去の結果</h2>${S.mocks.length?S.mocks.slice().reverse().map((r,i)=>`<div class="card row between"><div><strong>模試${r.bank.slice(-1)}　${r.score} / ${r.ids.length}点</strong><div class="small muted">${new Date(r.at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})}${r.exempt?' ・ 5問免除':''}</div></div>${btn('結果と全問解説','result:'+(S.mocks.length-1-i))}</div>`).join(''):'<div class="empty">模試の採点後にここへ保存します。</div>'}`}
function startExam(n){if(S.exam)return;const exempt=!!$('#exempt'+n)?.checked;const ids=DATA.questions.filter(q=>q.bank==='mock'+n&&(!exempt||q.group!=='免除科目')).map(q=>q.id);const now=Date.now();S.exam={bank:'mock'+n,ids,answers:{},flags:[],pos:0,started:now,deadline:now+(exempt?110:120)*60000,exempt};save();go('mocks',{active:true})}
function timeText(ms){const sec=Math.max(0,Math.ceil(ms/1000));return`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function examActive(){const s=S.exam;if(!s)return mocks();const q=Q[s.ids[s.pos]];return`<div class="row between"><h1>模試${s.bank.slice(-1)} <span class="small">${s.exempt?'45問・110分':'50問・120分'}</span></h1><div class="timer" id="timer" aria-label="残り時間">${timeText(s.deadline-Date.now())}</div></div><div class="row between"><span class="small muted">${s.pos+1} / ${s.ids.length}問 ・ 回答済み ${Object.keys(s.answers).length} ・ 見直し ${s.flags.length}</span>${btn('途中保存して離れる','saveexam')}</div><div class="split"><div class="card">${question(q,s,true)}<div class="row actions">${btn('← 前','exampos:'+(s.pos-1),s.pos===0?'disabled':'')}${btn('回答保留・次へ','exampos:'+(s.pos+1),s.pos===s.ids.length-1?'disabled':'')}${btn('回答を消す','clearanswer')}</div></div><aside class="card sticky"><h3>問題一覧</h3><div class="small muted">緑：回答済み／金：見直し</div><div class="qnav">${s.ids.map((id,i)=>btn(i+1,'exampos:'+i,`class="${s.answers[id]!==undefined?'answered':''} ${s.flags.includes(id)?'flag':''} ${i===s.pos?'current':''}" aria-label="問題${i+1}${s.answers[id]!==undefined?' 回答済み':' 未回答'}${s.flags.includes(id)?' 見直し':''}"`)).join('')}</div><div class="row">${btn('未回答へ','jump:unanswered')}${btn('見直しへ','jump:flagged')}</div><p class="small muted">閉じても時間は進み、再開時に残り時間を計算。時間切れは自動採点します。</p>${btn('採点前の確認へ','examconfirm','class="primary"')}</aside></div>`}
function examConfirm(){const s=S.exam;return`<div class="card"><h1>この回答で採点しますか</h1><p>未回答 ${s.ids.filter(id=>s.answers[id]===undefined).length}問、見直し印 ${s.flags.length}問。未回答は0点です。採点後は今回の回答を変更できません。</p><div class="row">${btn('採点する','finishexam','class="primary"')}${btn('模試に戻る','resumeexam')}</div></div>`}
function finishExam(auto=false){const s=S.exam;if(!s)return;let score=0;for(const id of s.ids){const a=s.answers[id];if(a===Q[id].answer)score++;if(a!==undefined)record(id,a,'模試'+s.bank.slice(-1));else S.history.push({id,answer:-1,correct:false,at:Date.now(),mode:'模試'+s.bank.slice(-1)})}S.mocks.push({bank:s.bank,at:Date.now(),score,exempt:s.exempt,ids:s.ids,answers:s.answers,flags:s.flags,elapsed:Math.min(Date.now()-s.started,(s.exempt?110:120)*60000)});S.exam=null;save();go('mocks',{result:S.mocks.length-1});if(auto)notify('制限時間となったため自動採点しました')}
function result(){const r=S.mocks[route.result];if(!r)return mocks();return`<div class="card"><div class="eyebrow">MOCK RESULT</div><h1>模試${r.bank.slice(-1)}の結果</h1><div class="metric">${r.score} <small>/ ${r.ids.length}点</small></div>${r.exempt?`<p>5問免除換算：${r.score+5} / 50点（実得点 ${r.score} ＋ 免除5点）</p>`:''}<p class="muted">回答時間 ${Math.round(r.elapsed/60000)}分。自主目標は${r.exempt?35:40}点。公式合格点ではありません。</p>${GROUPS.map(g=>{const ids=r.ids.filter(id=>Q[id].group===g);return ids.length?`<p>${g}：${ids.filter(id=>r.answers[id]===Q[id].answer).length} / ${ids.length}点</p>`:''}).join('')}<div class="row">${btn('苦手を復習','start:weak','class="primary"')}${btn('模試一覧へ','nav:mocks')}</div></div><h2>全問の解説</h2><label><input type="checkbox" id="wrongonly" ${route.wrongonly?'checked':''}> 不正解・未回答だけ表示</label>${r.ids.filter(id=>!route.wrongonly||r.answers[id]!==Q[id].answer).map((id,i)=>{const q=Q[id],a=r.answers[id];return`<details><summary>${r.ids.indexOf(id)+1}. ${a===q.answer?'✓ 正解':'△ '+(a===undefined?'未回答':'不正解')} ｜ ${q.group} ｜ ${esc(U[q.unit].title)}</summary><div class="inside"><h3>${readable(q.stem)}</h3><p class="small">${readable(q.pre)}</p><p>あなたの回答：${a===undefined?'未回答':a+1}</p>${explanations(q,a)}${btn(S.book.includes(id)?'★ 保存済み':'☆ 問題を保存','book:'+id)}</div></details>`}).join('')}`}
function review(){const w=weakIds(),l=latest();const ids=route.book?S.book:route.allnotes?Object.keys(S.notes):w;return`<div class="pagehead"><div class="eyebrow">REVIEW / 理由を残す</div><h1>復習ノート</h1><p class="muted">直近の回答が不正解の問題を、間違い回数が多い順、同数なら古い順に表示。</p></div><div class="row">${btn('苦手 '+w.length+'問','review:weak')}${btn('保存 '+S.book.length+'問','review:book')}${btn('メモのある問題','review:notes')}${btn('表示対象を解き直す','start:'+(route.book?'book':'weak'),'class="primary"')}</div><p class="small muted">正解し直した問題は苦手一覧から外れます。保存とメモは残ります。</p>${ids.length?ids.map(id=>{const q=Q[id];return`<div class="card"><span class="pill">${q.group}</span><span class="small muted">${id}</span><h3>${readable(q.stem)}</h3><p class="small muted">${l[id]?new Date(l[id].at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+' ・ '+(l[id].correct?'直近は正解':'直近は不正解'):'未回答'}</p>${S.notes[id]?`<p class="notes">${esc(S.notes[id])}</p>`:''}<div class="row">${btn('解説・メモ','explain:'+id)}${btn('関連講義','unit:'+q.unit)}${btn(S.book.includes(id)?'★ 保存解除':'☆ 保存','book:'+id)}</div></div>`}).join(''):'<div class="empty">対象の問題はありません。演習の結果や保存した問題がここに集まります。</div>'}`}
function reviewExplain(){const q=Q[route.q];return`<h1>復習とメモ</h1><h2>${readable(q.stem)}</h2><p class="small">${readable(q.pre)}</p>${explanations(q,latest()[q.id]?.answer)}${btn('復習ノートに戻る','nav:review')}`}
function cards(){if(!cardState){const list=DATA.units.filter(u=>!route.unit||u.id===route.unit).flatMap(u=>u.facts.map((f,i)=>({id:u.id+'-'+i,u,f})));cardState={list,pos:0,back:false};if(route.due)cardState.list=list.filter(c=>!S.cards[c.id]||S.cards[c.id].due<=Date.now())}const c=cardState.list[cardState.pos];const due=Object.values(S.cards).filter(c=>c.due<=Date.now()).length;return`<div class="pagehead"><div class="eyebrow">FLASHCARDS / 全350枚</div><h1>暗記カード</h1><p class="muted">問いを見て説明してから答えを表示。覚えたカードは1日→3日→7日→14日後に復習。</p></div><div class="row">${btn('全カード','resetcards:all')}${btn('今日の復習対象','resetcards:due')}<select id="cardgroup" aria-label="カードの分野"><option value="">全分野</option>${GROUPS.map(g=>`<option ${route.group===g?'selected':''}>${g}</option>`).join('')}</select></div>${c?`<p class="small muted">${cardState.pos+1} / ${cardState.list.length}枚 ｜ ${c.u.group} ｜ 単元${c.u.id}</p><div class="card cardface"><span class="pill">${esc(c.f.tag)}</span><h2>${cardState.back?readable(c.f.yes):'この論点の原則・条件を説明できますか。'}</h2>${cardState.back?`<p>${readable(c.f.why)}</p><div class="source">根拠：${esc(c.f.ref)}</div>`:''}</div><div class="row">${cardState.back?btn('まだ不安','cardrate:again')+btn('覚えた','cardrate:ok','class="primary"'):btn('答えを表示','flipcard','class="primary"')}${btn('次へ','nextcard')}${btn('講義を読む','unit:'+c.u.id)}</div>`:'<div class="empty">今日の復習対象はありません。全カード又は分野を選べます。</div>'}`}
function changes(){return`<div class="pagehead"><div class="eyebrow">LAW UPDATES / 基準日を固定</div><h1>法改正と旧教材の注意点</h1><p class="muted">2026年4月1日に施行されているルールを使います。公布日と施行日は同じとは限りません。</p></div><div class="alert">改正一覧は主要論点の整理です。法改正すべての一覧ではありません。税特例は年度・要件、統計は対象期間・公表日を別々に確認します。</div>${DATA.changes.map(c=>`<div class="card"><span class="pill">${esc(c.date)}</span><h2>${esc(c.title)}</h2><div class="tablewrap"><table><tbody><tr><th>旧ルール</th><td>${esc(c.old)}</td></tr><tr><th>新ルール</th><td>${esc(c.new)}</td></tr><tr><th>試験基準との関係</th><td>${esc(c.scope)}</td></tr></tbody></table></div><div class="alert"><strong>ひっかけ例</strong><br>${esc(c.trap)}</div><div class="row">${btn('関連講義 '+c.unit,'unit:'+c.unit)}${btn('関連オリジナル問題','explain:'+c.q)}</div>${sources(c.sources)}</div>`).join('')}<div class="card"><h2>統計の最新補足</h2><p>2026年10月2日公表の2025年度末宅建業者数は133,727業者、12年連続増加。通常演習の2024年度末132,291業者とは対象年が違います。最新資料の本試験採用は断定できません。</p>${sources(['industrylatest','industrystat'])}</div>`}
function settings(){const a=stats();return`<div class="pagehead"><div class="eyebrow">RECORDS / この端末で管理</div><h1>記録・設定</h1></div><div class="grid two"><div class="card"><h2>バックアップ・復元</h2><p>PCとスマホは自動同期しません。JSONを保存し、他端末へコピーして読み込むと進捗を引き継げます。復元は現在の記録を置き換えます。</p><p>${btn('JSONバックアップを保存','export','class="primary"')}</p><label>バックアップを読み込む <input type="file" id="import" accept=".json,application/json"></label><div id="importPreview">${restoreCandidate?`<div class="alert">読み込み内容：読了${restoreCandidate.read.length}単元、回答履歴${restoreCandidate.history.length}回、模試${restoreCandidate.mocks.length}回。現在の記録を置き換えます。</div>${btn('この記録で復元','restore','class="primary"')}${btn('取り消す','cancelrestore')}`:''}</div><p class="small muted">ブラウザの履歴・サイトデータを消すと進捗も消える場合があります。ファイルの移動や別ブラウザ利用前にも保存してください。</p></div><div class="card"><h2>学習記録</h2><p>回答済み ${a.unique}問／延べ ${a.n}回／正答率 ${a.n?pct(a.ok,a.n)+'％':'未計測'}</p>${chart()}<p>初回診断：${S.diagnosis?S.diagnosis.score+' / 15問':'まだ未実施'}</p><p>暗記カード記録 ${Object.keys(S.cards).length}枚</p></div></div><div class="card"><h2>最近の学習履歴</h2>${S.history.length?`<div class="tablewrap"><table><thead><tr><th>日時</th><th>学習</th><th>問題</th><th>結果</th></tr></thead><tbody>${S.history.slice(-40).reverse().map(h=>`<tr><td>${new Date(h.at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})}</td><td>${esc(h.mode)}</td><td>${btn(h.id,'explain:'+h.id)}</td><td>${h.correct?'正解':h.answer===-1?'未回答':'不正解'}</td></tr>`).join('')}</tbody></table></div>`:'<p>まだ回答履歴はありません。</p>'}</div><div class="card"><h2>使い方と対象年度</h2><p>この公開URLをスマホやPCのブラウザーで開きます。ホーム画面に追加すればアイコンから起動できます。上部で教材の端末保存を確認すれば、通信が切れても講義・演習を使えます。初回と教材更新、公式資料リンクを開く際には通信が必要です。PCとスマホの記録はJSONバックアップで引き継ぎます。</p><p>受験年は2026年（令和8年）。試験は10月18日13〜15時。登録講習修了者は13:10〜15:00。教材基準は2026年4月1日現在施行の法令、調査確認は2026年10月8日。税の期限付き特例や統計の採用年は条件に注意してください。</p>${sources(['schedule','examstandard'])}<p class="small muted">教材はオリジナル。公式過去問や有料教材を複製していません。比較表と講義は学習用の整理で、具体的な取引・申告では個別条件や自治体の取扱いも必要です。</p><p>${btn('教材の根拠一覧','allsources')}${btn('印刷する','print')}</p></div><div class="card"><h2>記録の初期化</h2><p>初期化する場合は、先にJSONを保存してください。</p>${route.reset?`<div class="alert">読了・回答・メモ・模試などすべての端末内記録を初期化します。</div>${btn('すべて初期化する','doreset','class="danger"')}${btn('取り消す','nav:settings')}`:btn('初期化の確認へ','reset','class="danger"')}</div>`}
function allsources(){return`<h1>根拠資料一覧</h1><p>条文はe-Gov法令APIのasof=2026-04-01で選択した改正版。資料は2026年10月8日確認。保存された法令版IDは教材データにも含みます。</p>${Object.values(DATA.sources).map(s=>`<div class="card"><h3>${esc(s.title)}</h3><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">公式資料を開く</a><p class="source">${esc(s.revision||s.status)} ｜ 確認 ${s.checked}</p></div>`).join('')}`}
function render(){nav();let html;if(route.view==='home')html=home();else if(route.view==='units')html=route.id?unitpage():unitlist();else if(route.view==='practice')html=route.completed?practiceCompleted():route.active?practiceActive():practiceMenu();else if(route.view==='mocks')html=route.result!==undefined?result():route.confirm&&S.exam?examConfirm():route.active?examActive():mocks();else if(route.view==='review')html=route.q?reviewExplain():review();else if(route.view==='cards')html=cards();else if(route.view==='changes')html=changes();else if(route.view==='settings')html=route.sources?allsources():settings();$('#app').innerHTML=html}
function toggle(list,id){const i=list.indexOf(id);i<0?list.push(id):list.splice(i,1)}
document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(!target||target.disabled)return;const [a,b,...tail]=target.dataset.action.split(':');const c=tail.join(':');switch(a){case'wordhelp':helpWords=!helpWords;try{localStorage.setItem(KEY+'-wordhelp',helpWords?'on':'off')}catch(e){}render();break;case'bite':route.bite=Number(b);render();break;case'person':route.person=b;render();break;case'capacityact':route.act=b;render();break;case'nav':if(b==='cards')cardState=null;go(b);break;case'unit':go('units',{id:b});break;case'read':toggle(S.read,b);save();render();break;case'unitbook':toggle(S.unitbook,b);save();render();break;case'unitbooks':route.book=!route.book;render();break;case'start':startPractice(b,c);break;case'resumepractice':go('practice',{active:true});break;case'savepractice':save();go('practice');break;case'cancelpractice':S.practice=null;save();render();break;case'answer':{let s=route.view==='mocks'?S.exam:S.practice;if(!s||s.revealed)return;if(route.view==='mocks'&&Date.now()>=s.deadline){finishExam(true);return}s.answers[s.ids[s.pos]]=Number(b);save();render();break}case'check':check();break;case'nextpractice':nextPractice();break;case'book':toggle(S.book,b);save();render();break;case'savenote':{const note=target.parentElement.querySelector('textarea')||$('#note');if(note){S.notes[b]=note.value.slice(0,5000);save();notify('メモを保存しました')}break}case'review':go('review',{book:b==='book',allnotes:b==='notes'});break;case'explain':go('review',{q:b});break;case'exam':startExam(Number(b));break;case'resumeexam':if(S.exam)go('mocks',{active:true});break;case'saveexam':save();go('mocks');notify('回答を保存しました。制限時間は進み続けます');break;case'exampos':if(S.exam){S.exam.pos=Math.max(0,Math.min(S.exam.ids.length-1,Number(b)));save();render();window.scrollTo(0,0)}break;case'flag':if(S.exam){toggle(S.exam.flags,S.exam.ids[S.exam.pos]);save();render()}break;case'clearanswer':if(S.exam){delete S.exam.answers[S.exam.ids[S.exam.pos]];save();render()}break;case'jump':if(S.exam){const s=S.exam;const wanted=s.ids.map((id,i)=>i).filter(i=>b==='flagged'?s.flags.includes(s.ids[i]):s.answers[s.ids[i]]===undefined);const p=wanted.find(i=>i>s.pos)??wanted[0];if(p===undefined)notify('対象の問題がありません');else{s.pos=p;save();render()}}break;case'examconfirm':go('mocks',{confirm:true});break;case'finishexam':finishExam();break;case'result':go('mocks',{result:Number(b)});break;case'cardsunit':cardState=null;go('cards',{unit:b});break;case'resetcards':cardState=null;go('cards',{due:b==='due'});break;case'flipcard':if(cardState){cardState.back=true;render()}break;case'nextcard':advanceCard();break;case'cardrate':if(cardState){const id=cardState.list[cardState.pos]?.id;if(!id)break;const old=S.cards[id]||{level:0};const level=b==='ok'?Math.min(4,old.level+1):0;const wait=level?[1,3,7,14][level-1]*86400000:0;S.cards[id]={level,due:Date.now()+wait};save();advanceCard()}break;case'saveminutes':S.minutes=Number($('#minutes').value);save();render();notify('学習計画を更新しました');break;case'export':exportJSON();break;case'restore':if(restoreCandidate){S=restoreCandidate;restoreCandidate=null;cardState=null;save();go('settings');notify('バックアップから復元しました');tick()}break;case'cancelrestore':restoreCandidate=null;render();break;case'allsources':go('settings',{sources:true});break;case'print':window.print();break;case'reset':go('settings',{reset:true});break;case'doreset':S=fresh();cardState=null;save();go('home');notify('学習記録を初期化しました');break}});
function advanceCard(){if(!cardState?.list.length)return;cardState.pos=(cardState.pos+1)%cardState.list.length;cardState.back=false;render()}
document.addEventListener('input',e=>{if(e.target.id==='search'){const start=e.target.selectionStart;route.search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(start,start)}});
document.addEventListener('change',async e=>{if(e.target.id==='group'){route.group=e.target.value;render()}if(e.target.id==='wrongonly'){route.wrongonly=e.target.checked;render()}if(e.target.id==='cardgroup'){const g=e.target.value;cardState=null;route={view:'cards',group:g};cards();if(g)cardState.list=cardState.list.filter(c=>c.u.group===g);render()}if(e.target.id==='import'){const f=e.target.files[0];if(!f)return;try{if(f.size>15*1024*1024)throw Error('ファイルが大きすぎます');restoreCandidate=validate(JSON.parse(await f.text()));render();notify('内容を確認して復元ボタンを押してください')}catch(err){restoreCandidate=null;notify('復元できません：'+err.message)}}});
function exportJSON(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='宅建2026-学習記録-'+japanDay()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('学習記録をJSONで保存しました')}
function tick(){if(S.exam){const ms=S.exam.deadline-Date.now();if(ms<=0){finishExam(true);return}const el=$('#timer');if(el){el.textContent=timeText(ms);el.classList.toggle('urgent',ms<600000)}}}
setInterval(tick,1000);let activeAt=Date.now(),lastStudy=Date.now();document.addEventListener('pointerdown',()=>activeAt=Date.now());document.addEventListener('keydown',()=>activeAt=Date.now());setInterval(()=>{const now=Date.now(),delta=Math.min(now-lastStudy,15000);lastStudy=now;if(!document.hidden&&now-activeAt<180000){S.daily[japanDay()]=(S.daily[japanDay()]||0)+delta;save()}},15000);window.addEventListener('pagehide',save);render();tick();
</script><script>(()=>{
 const status=document.getElementById('offlineState'),help=document.getElementById('webHelp'),install=document.getElementById('installStudy');let installEvent=null,ready=false;
 function update(){status.textContent=ready?(navigator.onLine?'✓ 教材を端末に保存済み。通信が切れても学習できます。':'✓ オフラインで学習中。記録はこの端末に保存します。'):(navigator.onLine?'通信あり。オフライン用の教材を準備しています。':'オフライン用の保存がまだ完了していません。接続してこの画面を開き直してください。')}
 function explainInstall(){help.hidden=false;help.innerHTML='<strong>ホーム画面から開く</strong><p>iPhone：Safariの共有メニューから「ホーム画面に追加」。Android：Chromeのメニューから「ホーム画面に追加」または「アプリをインストール」を選びます。</p><p>初回は通信のある場所で開き、上の「教材を端末に保存済み」を確認してください。PCの記録は、PC側の「記録・設定」でJSONを保存してスマホへ移し、スマホ側の同じメニューで復元します。自動同期はありません。ホーム画面追加後は、そのアイコンから開いて記録を復元すると確実です。</p><p>ブラウザーのサイトデータ削除や端末の空き容量などで保存が消える場合があります。定期的にJSONバックアップを保存してください。</p>'}
 window.addEventListener('online',update);window.addEventListener('offline',update);
 window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;install.textContent='アプリをホーム画面に追加'});
 window.addEventListener('appinstalled',()=>{installEvent=null;install.textContent='スマホでの使い方'});
 install.addEventListener('click',async()=>{if(installEvent){const e=installEvent;installEvent=null;await e.prompt();await e.userChoice}else explainInstall()});
 document.getElementById('transferStudy').addEventListener('click',()=>{go('settings');explainInstall()});
 document.getElementById('reloadStudy').addEventListener('click',()=>{save();location.reload()});
 if('serviceWorker'in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){
  let controlled=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(controlled)document.getElementById('reloadStudy').hidden=false;controlled=true});
  async function checkSaved(){const names=await caches.keys();const prefix='takken2026-'+encodeURIComponent(new URL('./',location.href).href)+'-';for(const name of names.filter(n=>n.startsWith(prefix))){const c=await caches.open(name);if(await c.match(new URL('./index.html',location.href).href)){ready=true;break}}update()}
  async function waitForReady(reg){if(reg.active)return;const worker=reg.installing||reg.waiting;await new Promise((resolve,reject)=>{let timer;const finish=(error)=>{clearTimeout(timer);worker?.removeEventListener('statechange',inspect);error?reject(error):resolve()};const inspect=()=>{if(reg.active||worker?.state==='activated')finish();else if(worker?.state==='redundant')finish(new Error('教材の保存失敗'))};timer=setTimeout(()=>finish(new Error('教材の保存時間切れ')),20000);worker?.addEventListener('statechange',inspect);inspect()})}
  async function prepare(){const existing=await navigator.serviceWorker.getRegistration();if(existing?.active)await checkSaved();const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});await waitForReady(reg);await checkSaved()}
  prepare().catch(()=>{if(ready)update();else status.textContent='教材は使えます。オフライン用の保存は利用できませんでした。通信のある状態で利用し、記録はJSONで保存してください。'});
 }else status.textContent='教材は使えます。オフライン用の保存はHTTPSの公開URLで利用できます。';
})();
</script></body></html>
