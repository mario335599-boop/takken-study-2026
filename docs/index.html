: "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建業免許の有効期間は5年である。", "truth": true, "why": "免許5年、宅建士登録は更新制ではない。", "ref": "3条2項", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "知事免許業者は、その都道府県内の物件しか取り扱えない。", "truth": false, "why": "免許区分は営業対象地域を制限するものではない。", "ref": "3条の解釈", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "自らマンションを反復して賃貸するには、そのことだけで必ず宅建業免許が必要である。", "truth": false, "why": "自己賃貸は対象外。賃貸の代理又は媒介は対象になる。", "ref": "2条2号", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M1-15-5", "unit": "15", "group": "宅建業法", "bank": "mock1", "stem": "宅建業法の総合判断（関連単元：15）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：免許の更新申請〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "免許更新申請は、原則有効期間満了日の90日前から30日前までに行う。", "truth": true, "why": "期限前の更新申請が必要。適法申請後の処分待ちには効力継続の規定がある。", "ref": "3条・施行規則3条", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "大臣免許業者の免許を、物件所在地の知事が自由に取り消せる。", "truth": false, "why": "知事の指示・停止権限と免許取消し権限を混同しない。", "ref": "66条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "地方公共団体も、宅地分譲には常に知事免許が必要である。", "truth": false, "why": "適用除外の主体。民間会社一般やすべての公的法人へ広げない。", "ref": "78条", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "免許業者の承諾があれば、無免許者がその名義で宅建業を営んでよい。", "truth": false, "why": "免許制度を潜脱する名義貸しは禁止。", "ref": "13条", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M2-15-6", "unit": "15", "group": "宅建業法", "bank": "mock2", "stem": "宅建業法の総合判断（関連単元：15）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：国の取引〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "免許を受けてから1年以内に事業を開始しない場合は、原則として免許取消しの対象となる。", "truth": true, "why": "1年以上継続した休止にも取消し規定がある。", "ref": "66条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "免許更新申請は、原則有効期間満了日の90日前から30日前までに行う。", "truth": true, "why": "期限前の更新申請が必要。適法申請後の処分待ちには効力継続の規定がある。", "ref": "3条・施行規則3条", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建業者は、自己の名義をもって他人に宅建業を営ませてはならない。", "truth": true, "why": "免許制度を潜脱する名義貸しは禁止。", "ref": "13条", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "地方公共団体も、宅地分譲には常に知事免許が必要である。", "truth": false, "why": "適用除外の主体。民間会社一般やすべての公的法人へ広げない。", "ref": "78条", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M3-15-7", "unit": "15", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：15）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：名義を貸す行為〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "個人業者死亡の届出は、相続人が知った日から5年以内でよい。", "truth": false, "why": "死亡そのもので免許失効。届出期限の起算点は知った日。", "ref": "11条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "免許更新申請は、満了日の翌日から30日以内に行えば必ず間に合う。", "truth": false, "why": "期限前の更新申請が必要。適法申請後の処分待ちには効力継続の規定がある。", "ref": "3条・施行規則3条", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "地方公共団体も、宅地分譲には常に知事免許が必要である。", "truth": false, "why": "適用除外の主体。民間会社一般やすべての公的法人へ広げない。", "ref": "78条", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建業者は、自己の名義をもって他人に宅建業を営ませてはならない。", "truth": true, "why": "免許制度を潜脱する名義貸しは禁止。", "ref": "13条", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-16-1", "unit": "16", "group": "宅建業法", "bank": "practice", "stem": "免許の欠格・届出・監督に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：復権と免許〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "商号、役員、事務所等の所定の変更は、原則30日以内に免許権者へ届け出る。", "truth": true, "why": "更新を待つのではなく変更届を行う。", "ref": "9条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "復権を得た破産者も、破産だけを理由に一生宅建業免許を受けられない。", "truth": false, "why": "欠格は復権を得ない者。5年待機の刑罰等とは違う。", "ref": "5条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "拘禁刑以上の刑に処せられた者は、原則として刑の執行終了等から5年経過するまで免許欠格となる。", "truth": true, "why": "拘禁刑以上は罪名を宅建業関連に限定しない。執行猶予等は別途要件を確認。", "ref": "5条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業務停止処分は、1年以内の期間を定めて行われる。", "truth": true, "why": "指示・停止・取消しの違いと期間を整理する。", "ref": "65条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-16-2", "unit": "16", "group": "宅建業法", "bank": "practice", "stem": "免許の欠格・届出・監督に関する次の記述のうち、正しいものはどれか。〔検討テーマ：刑罰と期間〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "復権を得た破産者も、破産だけを理由に一生宅建業免許を受けられない。", "truth": false, "why": "欠格は復権を得ない者。5年待機の刑罰等とは違う。", "ref": "5条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "拘禁刑以上の刑に処せられた者は、原則として刑の執行終了等から5年経過するまで免許欠格となる。", "truth": true, "why": "拘禁刑以上は罪名を宅建業関連に限定しない。執行猶予等は別途要件を確認。", "ref": "5条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業務停止処分は、法律上最長5年間である。", "truth": false, "why": "指示・停止・取消しの違いと期間を整理する。", "ref": "65条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "役員変更は、次の免許更新まで届け出なくてよい。", "truth": false, "why": "更新を待つのではなく変更届を行う。", "ref": "9条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-16-3", "unit": "16", "group": "宅建業法", "bank": "practice", "stem": "免許の欠格・届出・監督に関する次の記述のうち、正しいものはどれか。〔検討テーマ：変更の届出〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "拘禁刑以上でも宅建業に関係のない罪なら、執行終了直後から必ず免許を受けられる。", "truth": false, "why": "拘禁刑以上は罪名を宅建業関連に限定しない。執行猶予等は別途要件を確認。", "ref": "5条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "商号、役員、事務所等の所定の変更は、原則30日以内に免許権者へ届け出る。", "truth": true, "why": "更新を待つのではなく変更届を行う。", "ref": "9条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "復権を得た破産者も、破産だけを理由に一生宅建業免許を受けられない。", "truth": false, "why": "欠格は復権を得ない者。5年待機の刑罰等とは違う。", "ref": "5条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業務停止処分は、法律上最長5年間である。", "truth": false, "why": "指示・停止・取消しの違いと期間を整理する。", "ref": "65条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-16-4", "unit": "16", "group": "宅建業法", "bank": "practice", "stem": "免許の欠格・届出・監督に関する次の記述のうち、正しいものはどれか。〔検討テーマ：業務停止の長さ〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "拘禁刑以上でも宅建業に関係のない罪なら、執行終了直後から必ず免許を受けられる。", "truth": false, "why": "拘禁刑以上は罪名を宅建業関連に限定しない。執行猶予等は別途要件を確認。", "ref": "5条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "復権を得た破産者も、破産だけを理由に一生宅建業免許を受けられない。", "truth": false, "why": "欠格は復権を得ない者。5年待機の刑罰等とは違う。", "ref": "5条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "役員変更は、次の免許更新まで届け出なくてよい。", "truth": false, "why": "更新を待つのではなく変更届を行う。", "ref": "9条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業務停止処分は、1年以内の期間を定めて行われる。", "truth": true, "why": "指示・停止・取消しの違いと期間を整理する。", "ref": "65条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M1-16-5", "unit": "16", "group": "宅建業法", "bank": "mock1", "stem": "宅建業法の総合判断（関連単元：16）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：取消しの権限〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "大臣免許業者の免許を取り消すのは、原則として国土交通大臣である。", "truth": true, "why": "知事の指示・停止権限と免許取消し権限を混同しない。", "ref": "66条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "免許取得後10年間営業を始めなくても、それを理由とする取消しはない。", "truth": false, "why": "1年以上継続した休止にも取消し規定がある。", "ref": "66条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "個人業者死亡の届出は、相続人が知った日から5年以内でよい。", "truth": false, "why": "死亡そのもので免許失効。届出期限の起算点は知った日。", "ref": "11条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建士の住所変更登録は、次の5年更新時まで待てばよい。", "truth": false, "why": "登録の変更は遅滞なく。宅建業者の変更届30日との違い。", "ref": "20条", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M2-16-6", "unit": "16", "group": "宅建業法", "bank": "mock2", "stem": "宅建業法の総合判断（関連単元：16）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：免許後の未開業〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "免許取得後10年間営業を始めなくても、それを理由とする取消しはない。", "truth": false, "why": "1年以上継続した休止にも取消し規定がある。", "ref": "66条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "大臣免許業者の免許を取り消すのは、原則として国土交通大臣である。", "truth": true, "why": "知事の指示・停止権限と免許取消し権限を混同しない。", "ref": "66条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "登録先以外の都道府県の事務所で業務に従事する者等は、要件を満たして登録移転を申請できる。", "truth": true, "why": "事務所での従事等が移転の要件。住所変更登録は必要でも移転とは別。", "ref": "19条の2", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "個人業者が死亡した場合、相続人は死亡を知った日から30日以内に届け出る。", "truth": true, "why": "死亡そのもので免許失効。届出期限の起算点は知った日。", "ref": "11条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M3-16-7", "unit": "16", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：16）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：死亡後の届出〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "試験合格証を提示すれば、登録なしでも宅建士として重要事項説明を行える。", "truth": false, "why": "宅建士の法定業務には有効な宅建士証等が必要。", "ref": "2条4号・35条", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "大臣免許業者の免許を、物件所在地の知事が自由に取り消せる。", "truth": false, "why": "知事の指示・停止権限と免許取消し権限を混同しない。", "ref": "66条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "個人業者が死亡した場合、相続人は死亡を知った日から30日以内に届け出る。", "truth": true, "why": "死亡そのもので免許失効。届出期限の起算点は知った日。", "ref": "11条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "免許取得後10年間営業を始めなくても、それを理由とする取消しはない。", "truth": false, "why": "1年以上継続した休止にも取消し規定がある。", "ref": "66条", "unit": "16", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-17-1", "unit": "17", "group": "宅建業法", "bank": "practice", "stem": "宅建士の登録・宅建士証に関する次の記述のうち、正しいものはどれか。〔検討テーマ：証の有効期間〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "試験合格直後でも、宅建士証交付前の法定講習は例外なく必須である。", "truth": false, "why": "原則講習、合格1年以内の免除をセットで理解。登録要件は別途必要。", "ref": "22条の2", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建士証の有効期間は5年である。", "truth": true, "why": "登録と証は別。有効期限を過ぎると証が必要な業務を行えない。", "ref": "22条の2", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "資格登録は、全国どの知事にも無条件で自由に申請できる。", "truth": false, "why": "試験を行った都道府県への登録が原則。移転制度は別。", "ref": "18条", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建士は、重要事項説明でも相手から請求された時だけ宅建士証を提示すればよい。", "truth": false, "why": "35条説明時は積極的提示義務。その他の取引関係者からの請求時提示とは区別。", "ref": "35条4項・22条の4", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-17-2", "unit": "17", "group": "宅建業法", "bank": "practice", "stem": "宅建士の登録・宅建士証に関する次の記述のうち、正しいものはどれか。〔検討テーマ：申請する知事〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "宅建士は、重要事項説明でも相手から請求された時だけ宅建士証を提示すればよい。", "truth": false, "why": "35条説明時は積極的提示義務。その他の取引関係者からの請求時提示とは区別。", "ref": "35条4項・22条の4", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建士登録をした人の宅建士証は、交付後永久に更新不要である。", "truth": false, "why": "登録と証は別。有効期限を過ぎると証が必要な業務を行えない。", "ref": "22条の2", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "試験合格直後でも、宅建士証交付前の法定講習は例外なく必須である。", "truth": false, "why": "原則講習、合格1年以内の免除をセットで理解。登録要件は別途必要。", "ref": "22条の2", "unit": "17", "sources": ["takken nrules", "takkenorder"]}, {"text": "資格登録は、原則として試験を受けた都道府県の知事に申請する。", "truth": true, "why": "試験を行った都道府県への登録が原則。移転制度は別。", "ref": "18条", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "M1-17-5", "unit": "17", "group": "宅建業法", "bank": "mock1", "stem": "宅建業法の総合判断（関連単元：17）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：登録事項の変更〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "登録した氏名や住所等に変更があるときは、遅滞なく変更登録を申請する。", "truth": true, "why": "登録の変更は遅滞なく。宅建業者の変更届30日との違い。", "ref": "20条", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "専任宅建士を置かない案内所では、法定の標識も常に不要である。", "truth": false, "why": "標識義務の範囲と専任設置義務の範囲は一致しない。", "ref": "50条1項", "unit": "18", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "試験合格証を提示すれば、登録なしでも宅建士として重要事項説明を行える。", "truth": false, "why": "宅建士の法定業務には有効な宅建士証等が必要。", "ref": "2条4号・35条", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建士は、単に引っ越すだけで必ず登録移転をしなければならない。", "truth": false, "why": "事務所での従事等が移転の要件。住所変更登録は必要でも移転とは別。", "ref": "19条の2", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M2-17-6", "unit": "17", "group": "宅建業法", "bank": "mock2", "stem": "宅建業法の総合判断（関連単元：17）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：登録の移転〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "継続して業務を行い宅建業の契約締結権限を有する支店等は、法定の事務所となり得る。", "truth": true, "why": "実態と権限に着目する。", "ref": "3条・施行令1条の2", "unit": "18", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建士は、単に引っ越すだけで必ず登録移転をしなければならない。", "truth": false, "why": "事務所での従事等が移転の要件。住所変更登録は必要でも移転とは別。", "ref": "19条の2", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "試験合格だけで登録も宅建士証交付も受けていない者は、宅建士として重要事項説明を行えない。", "truth": true, "why": "宅建士の法定業務には有効な宅建士証等が必要。", "ref": "2条4号・35条", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "登録した氏名や住所等に変更があるときは、遅滞なく変更登録を申請する。", "truth": true, "why": "登録の変更は遅滞なく。宅建業者の変更届30日との違い。", "ref": "20条", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M3-17-7", "unit": "17", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：17）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：合格者の説明〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "宅建士は、単に引っ越すだけで必ず登録移転をしなければならない。", "truth": false, "why": "事務所での従事等が移転の要件。住所変更登録は必要でも移転とは別。", "ref": "19条の2", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建士の住所変更登録は、次の5年更新時まで待てばよい。", "truth": false, "why": "登録の変更は遅滞なく。宅建業者の変更届30日との違い。", "ref": "20条", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "試験合格だけで登録も宅建士証交付も受けていない者は、宅建士として重要事項説明を行えない。", "truth": true, "why": "宅建士の法定業務には有効な宅建士証等が必要。", "ref": "2条4号・35条", "unit": "17", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "別会社に常勤する人の氏名を借りるだけで、常に専任宅建士の配置要件を満たす。", "truth": false, "why": "専任性の実態が必要。法令・運用上の特例は要件を確認する。", "ref": "31条の3・解釈運用", "unit": "18", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-18-1", "unit": "18", "group": "宅建業法", "bank": "practice", "stem": "事務所・専任宅建士・案内所に関する次の記述のうち、正しいものはどれか。〔検討テーマ：人数の端数〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "申込みを受ける案内所には、宅建士の配置は一切不要である。", "truth": false, "why": "事務所の5分の1と案内所の1人以上を区別。", "ref": "31条の3・施行規則", "unit": "18", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "事務所の宅建業従事者11人には、原則として専任宅建士3人以上が必要である。", "truth": true, "why": "5人に1人以上を満たすには切上げ。", "ref": "31条の3・施行令", "unit": "18", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "専任宅建士が不足しても、半年以内に補充すれば法の期限を満たす。", "truth": false, "why": "補充等の法定期間は2週間。", "ref": "31条の3", "unit": "18", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "所定の案内所等の届出は、業務終了後10日以内に行えばよい。", "truth": f 25条・営業保証金規則", "unit": "19", "sources": ["takken", "takkenrules", "takkenorder", "guaranteerules"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M1-19-5", "unit": "19", "group": "宅建業法", "bank": "mock1", "stem": "宅建業法の総合判断（関連単元：19）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：取引相手が業者〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "宅建業者である取引相手は、営業保証金からの還付を受ける者から除かれる。", "truth": true, "why": "一般取引者保護の制度。工事業者の工事代金等も取引債権とは別。", "ref": "27条", "unit": "19", "sources": ["takken", "takkenrules", "takkenorder", "guaranteerules"]}, {"text": "保証協会の認証は、どの還付請求でも法律上禁止されている。", "truth": false, "why": "協会が取引債権と額を認証する。", "ref": "64条の8", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "還付による保証金不足は、通知を受けてから2年以内に補充すればよい。", "truth": false, "why": "補充2週間。補充後の届出も必要。", "ref": "28条", "unit": "19", "sources": ["takken", "takkenrules", "takkenorder", "guaranteerules"]}, {"text": "各支店は、その支店の最寄りの供託所に営業保証金を必ず別々に供託する。", "truth": false, "why": "主たる事務所を基準にまとめて供託する。", "ref": "25条", "unit": "19", "sources": ["takken", "takkenrules", "takkenorder", "guaranteerules"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M2-19-6", "unit": "19", "group": "宅建業法", "bank": "mock2", "stem": "宅建業法の総合判断（関連単元：19）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：還付後の補充〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "営業保証金は、主たる事務所の最寄りの供託所に供託する。", "truth": true, "why": "主たる事務所を基準にまとめて供託する。", "ref": "25条", "unit": "19", "sources": ["takken", "takkenrules", "takkenorder", "guaranteerules"]}, {"text": "還付による保証金不足は、通知を受けてから2年以内に補充すればよい。", "truth": false, "why": "補充2週間。補充後の届出も必要。", "ref": "28条", "unit": "19", "sources": ["takken", "takkenrules", "takkenorder", "guaranteerules"]}, {"text": "社員資格を失った宅建業者は、原則1週間以内に営業保証金を供託しなければならない。", "truth": true, "why": "直接供託への移行期限は1週間。", "ref": "64条の15", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建業者である取引相手は、営業保証金からの還付を受ける者から除かれる。", "truth": true, "why": "一般取引者保護の制度。工事業者の工事代金等も取引債権とは別。", "ref": "27条", "unit": "19", "sources": ["takken", "takkenrules", "takkenorder", "guaranteerules"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M3-19-7", "unit": "19", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：19）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：供託する場所〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "営業保証金は、主たる事務所の最寄りの供託所に供託する。", "truth": true, "why": "主たる事務所を基準にまとめて供託する。", "ref": "25条", "unit": "19", "sources": ["takken", "takkenrules", "takkenorder", "guaranteerules"]}, {"text": "還付充当金の納付期限は、通知の日から6か月以内である。", "truth": false, "why": "2週間の不納付は社員資格喪失につながる。", "ref": "64条の10", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建業者同士の売買取引でも、買主業者は常に営業保証金から還付を受けられる。", "truth": false, "why": "一般取引者保護の制度。工事業者の工事代金等も取引債権とは別。", "ref": "27条", "unit": "19", "sources": ["takken", "takkenrules", "takkenorder", "guaranteerules"]}, {"text": "還付による保証金不足は、通知を受けてから2年以内に補充すればよい。", "truth": false, "why": "補充2週間。補充後の届出も必要。", "ref": "28条", "unit": "19", "sources": ["takken", "takkenrules", "takkenorder", "guaranteerules"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-20-1", "unit": "20", "group": "宅建業法", "bank": "practice", "stem": "保証協会・分担金に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：加入時の金額〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "保証協会加入時の分担金は、本店1,000万円、支店500万円である。", "truth": false, "why": "直接供託と分担金の額が逆。", "ref": "64条の9・施行令", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "社員との取引による還付限度は、原則としてその社員が直接供託すべき営業保証金相当額である。", "truth": true, "why": "保護額を分担金の額と混同しない。", "ref": "64条の8", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "保証協会は、苦情解決、研修、弁済業務を行う。", "truth": true, "why": "必須業務と任意業務を区別。", "ref": "64条の3", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "新たに協会の社員となる者は、加入しようとする日までに分担金を納付する。", "truth": true, "why": "加入前納付と事務所新設時の2週間を区別。", "ref": "64条の9", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-20-2", "unit": "20", "group": "宅建業法", "bank": "practice", "stem": "保証協会・分担金に関する次の記述のうち、正しいものはどれか。〔検討テーマ：納付の時期〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "新たに協会の社員となる者は、加入しようとする日までに分担金を納付する。", "truth": true, "why": "加入前納付と事務所新設時の2週間を区別。", "ref": "64条の9", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "保証協会加入時の分担金は、本店1,000万円、支店500万円である。", "truth": false, "why": "直接供託と分担金の額が逆。", "ref": "64条の9・施行令", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "保証協会の法定必須業務は、社員への住宅ローン融資だけである。", "truth": false, "why": "必須業務と任意業務を区別。", "ref": "64条の3", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "還付の限度は、常にその社員が払った分担金60万円又は30万円だけである。", "truth": false, "why": "保護額を分担金の額と混同しない。", "ref": "64条の8", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-20-3", "unit": "20", "group": "宅建業法", "bank": "practice", "stem": "保証協会・分担金に関する次の記述のうち、正しいものはどれか。〔検討テーマ：還付の限度〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "保証協会の法定必須業務は、社員への住宅ローン融資だけである。", "truth": false, "why": "必須業務と任意業務を区別。", "ref": "64条の3", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "保証協会加入時の分担金は、本店1,000万円、支店500万円である。", "truth": false, "why": "直接供託と分担金の額が逆。", "ref": "64条の9・施行令", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "社員との取引による還付限度は、原則としてその社員が直接供託すべき営業保証金相当額である。", "truth": true, "why": "保護額を分担金の額と混同しない。", "ref": "64条の8", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "分担金は、協会加入後5年以内に納付すればよい。", "truth": false, "why": "加入前納付と事務所新設時の2週間を区別。", "ref": "64条の9", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-20-4", "unit": "20", "gr ければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "社員が還付充当金の納付通知を受けたときは、通知の日から2週間以内に納付しなければならない。", "truth": true, "why": "2週間の不納付は社員資格喪失につながる。", "ref": "64条の10", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "保証協会の社員資格を失っても、保証金を供託せずいつまでも営業できる。", "truth": false, "why": "直接供託への移行期限は1週間。", "ref": "64条の15", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "弁済業務保証金から還付を受けるには、原則として保証協会の認証を受ける必要がある。", "truth": true, "why": "協会が取引債権と額を認証する。", "ref": "64条の8", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "36条の契約締結時期の制限は、未完成物件の売買又は交換に関するものである。", "truth": true, "why": "36条は売買・交換、33条広告は貸借も含む。", "ref": "36条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M3-20-7", "unit": "20", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：20）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：還付充当金の期限〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "保証協会の認証は、どの還付請求でも法律上禁止されている。", "truth": false, "why": "協会が取引債権と額を認証する。", "ref": "64条の8", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "価格条件の誇大表示は、物件品質の表示ではないので宅建業法では一切規制されない。", "truth": false, "why": "価格・支払方法等の取引条件も規制対象。", "ref": "32条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "社員が還付充当金の納付通知を受けたときは、通知の日から2週間以内に納付しなければならない。", "truth": true, "why": "2週間の不納付は社員資格喪失につながる。", "ref": "64条の10", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "保証協会の社員資格を失っても、保証金を供託せずいつまでも営業できる。", "truth": false, "why": "直接供託への移行期限は1週間。", "ref": "64条の15", "unit": "20", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-21-1", "unit": "21", "group": "宅建業法", "bank": "practice", "stem": "広告・取引態様・販売開始に関する次の記述のうち、正しいものはどれか。〔検討テーマ：誇大広告の効果〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "建築確認申請を提出しただけで、必要な確認前でも未完成建物の広告を自由に開始できる。", "truth": false, "why": "申請と処分は異なる。", "ref": "33条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "未完成物件の媒介業者は、売主でないので確認前広告の規制を受けない。", "truth": false, "why": "業者の取引態様で広告規制を除外しない。", "ref": "33条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "広告に媒介と書いた場合、注文を受けた時の取引態様明示は常に不要である。", "truth": false, "why": "広告時と注文時は別の義務。", "ref": "34条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "著しく事実と異なる広告は、契約が成立しなくても誇大広告の禁止に違反し得る。", "truth": true, "why": "禁止の対象は広告行為そのもの。", "ref": "32条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-21-2", "unit": "21", "group": "宅建業法", "bank": "practice", "stem": "広告・取引態様・販売開始に関する次の記述のうち、正しいものはどれか。〔検討テーマ：広告の開始時期〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "未完成建物の広告は、必要な建築確認等の処分があった後でなければできない。", "truth": true, "why": "申請と処分は異なる。", "ref": "33条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "未完成物件の媒介業者は、売主でないので確認前広告の規制を受けない。", "truth": false, "why": "業者の取引態様で広告規制を除外しない。", "ref": "33条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "広告に媒介と書いた場合、注文を受けた時の取引態様明示は常に不要である。", "truth": false, "why": "広告時と注文時は別の義務。", "ref": "34条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "誇大広告は、その広告を見た人と売買契約が成立した場合にだけ違反になる。", "truth": false, "why": "禁止の対象は広告行為そのもの。", "ref": "32条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-21-3", "unit": "21", "group": "宅建業法", "bank": "practice", "stem": "広告・取引態様・販売開始に関する次の記述のうち、正しいものはどれか。〔検討テーマ：注文時の明示〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "誇大広告は、その広告を見た人と売買契約が成立した場合にだけ違反になる。", "truth": false, "why": "禁止の対象は広告行為そのもの。", "ref": "32条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建業者は、広告で示していても注文を受けたときに取引態様を明らかにしなければならない。", "truth": true, "why": "広告時と注文時は別の義務。", "ref": "34条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "建築確認申請を提出しただけで、必要な確認前でも未完成建物の広告を自由に開始できる。", "truth": false, "why": "申請と処分は異なる。", "ref": "33条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "未完成物件の媒介業者は、売主でないので確認前広告の規制を受けない。", "truth": false, "why": "業者の取引態様で広告規制を除外しない。", "ref": "33条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-21-4", "unit": "21", "group": "宅建業法", "bank": "practice", "stem": "広告・取引態様・販売開始に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：媒介業者の広告〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "未完成物件の媒介業者は、売主でないので確認前広告の規制を受けない。", "truth": false, "why": "業者の取引態様で広告規制を除外しない。", "ref": "33条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "著しく事実と異なる広告は、契約が成立しなくても誇大広告の禁止に違反し得る。", "truth": true, "why": "禁止の対象は広告行為そのもの。", "ref": "32条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "未完成建物の広告は、必要な建築確認等の処分があった後でなければできない。", "truth": true, "why": "申請と処分は異なる。", "ref": "33条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建業者は、広告で示していても注文を受けたときに取引態様を明らかにしなければならない。", "truth": true, "why": "広告時と注文時は別の義務。", "ref": "34条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M1-21-5", "unit": "21", "group": "宅建業法", "bank": "mock1", "stem": "宅建業法の総合判断（関連単元：21）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：未完成の賃貸広告〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "価格条件の誇大表示は、物件品質の表示ではないので宅建業法では一切規制されない。", "truth": false, "why": "価格・支払方法等の取引条件も規制対象。", "ref": "32条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "36条の未完成物件の契約締結時期制限は、貸借契約にも売買と全く同じように適用される。", "truth": false, "why": "36条は売買・交換、33条広告は貸借も含む。", "ref": "36条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "専任媒介契約は、依頼者の申出なく業者だけの判断で必ず自動更新できる。", "truth": false, "why": "更新後も3か月以内。依頼者に不利な特約は無効となる。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "未完成建物の貸借の広告にも、必要な建築確認等の処分後という広告時期規制が適用される。", "truth": true, "why": "広告は売買、交換、貸借を含む。契約締結時期との違い。", "ref": "33条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M2-21-6", "unit": "21", "group": "宅建業法", "bank": "mock2", "stem": "宅建業法の総合判断（関連単元：21）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：契約時期の範囲〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "未完成建物の貸借の広告にも、必要な建築確認等の処分後という広告時期規制が適用される。", "truth": true, "why": "広告は売買、交換、貸借を含む。契約締結時期との違い。", "ref": "33条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "36条の未完成物件の契約締結時期制限は、貸借契約にも売買と全く同じように適用される。", "truth": false, "why": "36条は売買・交換、33条広告は貸借も含む。", "ref": "36条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "実際より著しく有利な条件だと誤認させる広告は、誇大広告禁止の対象となる。", "truth": true, "why": "価格・支払方法等の取引条件も規制対象。", "ref": "32条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "一般媒介契約には、宅建業法上の3か月という有効期間上限はない。", "truth": true, "why": "標準約款等の扱いと法律上の義務を分ける。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M3-21-7", "unit": "21", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：21）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：事実より有利な表示〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "実際より著しく有利な条件だと誤認させる広告は、誇大広告禁止の対象となる。", "truth": true, "why": "価格・支払方法等の取引条件も規制対象。", "ref": "32条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "建物の賃貸媒介契約にも、34条の2の書面義務が売買と同じく当然に適用される。", "truth": false, "why": "賃貸では別の説明・37条等の義務はあるが、この条文の対象は売買交換。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "未完成建物の賃貸広告は、広告時期規制から常に除外される。", "truth": false, "why": "広告は売買、交換、貸借を含む。契約締結時期との違い。", "ref": "33条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "36条の未完成物件の契約締結時期制限は、貸借契約にも売買と全く同じように適用される。", "truth": false, "why": "36条は売買・交換、33条広告は貸借も含む。", "ref": "36条", "unit": "21", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-22-1", "unit": "22", "group": "宅建業法", "bank": "practice", "stem": "媒介契約・一般と専任に関する次の記述のうち、正しいものはどれか。〔検討テーマ：一般媒介の依頼先〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "専属専任媒介契約の報告は、1か月に1回で法定頻度を満たす。", "truth": false, "why": "専任2週間、専属専任1週間。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "専任媒介契約は、1年の期間を定めれば法律上そのまま1年間有効となる。", "truth": false, "why": "依頼者の拘束を短くし、更新時に見直す。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "一般媒介契約では、依頼者は原則として他の業者にも重ねて媒介を依頼できる。", "truth": true, "why": "一般と専任の根本的な違い。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "専任媒介契約では、専属専任と同じく自己発見取引が必ず禁止される。", "truth": false, "why": "専任と専属専任の違い。", "ref": "34条の2・標準約款", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-22-2", "unit": "22", "group": "宅建業法", "bank": "practice", "stem": "媒介契約・一般と専任に関する次の記述のうち、正しいものはどれか。〔検討テーマ：専任の自己発見〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "専任媒介契約は、1年の期間を定めれば法律上そのまま1年間有効となる。", "truth": false, "why": "依頼者の拘束を短くし、更新時に見直す。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "一般媒介契約でも、他の宅建業者への依頼は法律で必ず禁止される。", "truth": false, "why": "一般と専任の根本的な違い。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "専任媒介契約では、依頼者が自ら発見した相手と直接取引する enorder"]}, {"text": "専任媒介契約では、専属専任と同じく自己発見取引が必ず禁止される。", "truth": false, "why": "専任と専属専任の違い。", "ref": "34条の2・標準約款", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "M1-22-5", "unit": "22", "group": "宅建業法", "bank": "mock1", "stem": "宅建業法の総合判断（関連単元：22）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：更新の申出〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "一般媒介でも、法律上一律5日以内に登録しなければならない。", "truth": false, "why": "任意登録や約款上の約束と法定義務は分ける。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "専任媒介契約の更新は、依頼者の申出によって行う。", "truth": true, "why": "更新後も3か月以内。依頼者に不利な特約は無効となる。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "一般媒介契約にも、宅建業法上必ず専任と同じ3か月上限がある。", "truth": false, "why": "標準約款等の扱いと法律上の義務を分ける。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "建物の賃貸媒介契約にも、34条の2の書面義務が売買と同じく当然に適用される。", "truth": false, "why": "賃貸では別の説明・37条等の義務はあるが、この条文の対象は売買交換。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M2-22-6", "unit": "22", "group": "宅建業法", "bank": "mock2", "stem": "宅建業法の総合判断（関連単元：22）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：一般媒介の期間〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "34条の2の媒介契約書面交付等の義務は、宅地建物の売買又は交換の媒介契約を対象とする。", "truth": true, "why": "賃貸では別の説明・37条等の義務はあるが、この条文の対象は売買交換。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "専任媒介契約の更新は、依頼者の申出によって行う。", "truth": true, "why": "更新後も3か月以内。依頼者に不利な特約は無効となる。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "一般媒介契約にも、宅建業法上必ず専任と同じ3か月上限がある。", "truth": false, "why": "標準約款等の扱いと法律上の義務を分ける。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "登録物件の契約が成立したときは、遅滞なく指定流通機構へ所定事項を通知する。", "truth": true, "why": "成約情報も適切に共有する。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "M3-22-7", "unit": "22", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：22）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：書面義務の対象〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "34条の2の媒介契約書面交付等の義務は、宅地建物の売買又は交換の媒介契約を対象とする。", "truth": true, "why": "賃貸では別の説明・37条等の義務はあるが、この条文の対象は売買交換。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "査定価格は業者の勘だけで示してよく、依頼者へ根拠を明らかにする義務はない。", "truth": false, "why": "価格についての判断根拠を示す義務がある。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "専任媒介契約は、依頼者の申出なく業者だけの判断で必ず自動更新できる。", "truth": false, "why": "更新後も3か月以内。依頼者に不利な特約は無効となる。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "一般媒介契約にも、宅建業法上必ず専任と同じ3か月上限がある。", "truth": false, "why": "標準約款等の扱いと法律上の義務を分ける。", "ref": "34条の2", "unit": "22", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-23-1", "unit": "23", "group": "宅建業法", "bank": "practice", "stem": "指定流通機構・媒介の記録に関する次の記述のうち、正しいものはどれか。〔検討テーマ：専任の登録日数〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "専任媒介の登録は、業者の休業日を除き契約締結日から7日以内に行う。", "truth": true, "why": "専任7日、専属5日。休業日除外の規定。", "ref": "34条の2・施行規則15条の10", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "専属専任媒介の登録は、業者の休業日を除き7日以内で足りる。", "truth": false, "why": "専属は依頼者の拘束が強いため5日。", "ref": "34条の2・施行規則", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "指定流通機構に登録すれば、依頼者への登録証明書面交付は不要である。", "truth": false, "why": "登録と依頼者への証明は別の義務。承諾による電磁的方法の特則あり。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "専任の買受申込みは、次の2週間ごとの定期報告まで必ず放置してよい。", "truth": false, "why": "申込み報告は定期報告と別。一般媒介でも対象。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-23-2", "unit": "23", "group": "宅建業法", "bank": "practice", "stem": "指定流通機構・媒介の記録に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：専属の登録日数〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "登録した業者は、登録を証する書面を遅滞なく依頼者に交付する必要がある。", "truth": true, "why": "登録と依頼者への証明は別の義務。承諾による電磁的方法の特則あり。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "専任媒介の登録は、業者の休業日を除き契約締結日から7日以内に行う。", "truth": true, "why": "専任7日、専属5日。休業日除外の規定。", "ref": "34条の2・施行規則15条の10", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "売買又は交換の申込みがあったときは、依頼者に遅滞なく報告しなければならない。", "truth": true, "why": "申込み報告は定期報告と別。一般媒介でも対象。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "専属専任媒介の登録は、業者の休業日を除き7日以内で足りる。", "truth": false, "why": "専属は依頼者の拘束が強いため5日。", "ref": "34条の2・施行規則", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-23-3", "unit": "23", "group": "宅建業法", "bank": "practice", "stem": "指定流通機構・媒介の記録に関する次の記述のうち、正しいものはどれか。〔検討テーマ：証明書面の交付〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "専任媒介の登録期限は、休業日を含めて一律30日以内である。", "truth": false, "why": "専任7日、専属5日。休業日除外の規定。", "ref": "34条の2・施行規則15条の10", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "専属専任媒介の登録は、業者の休業日を除き7日以内で足りる。", "truth": false, "why": "専属は依頼者の拘束が強いため5日。", "ref": "34条の2・施行規則", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "専任の買受申込みは、次の2週間ごとの定期報告まで必ず放置してよい。", "truth": false, "why": "申込み報告は定期報告と別。一般媒介 norder"]}, {"text": "査定価格は業者の勘だけで示してよく、依頼者へ根拠を明らかにする義務はない。", "truth": false, "why": "価格についての判断根拠を示す義務がある。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "登録物件が成約しても、指定流通機構への通知は法律上一切不要である。", "truth": false, "why": "成約情報も適切に共有する。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M2-23-6", "unit": "23", "group": "宅建業法", "bank": "mock2", "stem": "宅建業法の総合判断（関連単元：23）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：成約時の通知〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "一般媒介契約には、宅建業法上の指定流通機構への登録義務はない。", "truth": true, "why": "任意登録や約款上の約束と法定義務は分ける。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "登録物件が成約しても、指定流通機構への通知は法律上一切不要である。", "truth": false, "why": "成約情報も適切に共有する。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "売買の35条説明は、原則として買主となろうとする者に対して行う。", "truth": true, "why": "取得者等を保護する説明。37条書面の双方交付とは対象が違う。", "ref": "35条", "unit": "24", "sources": ["takken", "electronic", "takkenrules", "takkenorder"]}, {"text": "媒介価額について意見を述べるときは、根拠を明らかにしなければならない。", "truth": true, "why": "価格についての判断根拠を示す義務がある。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M3-23-7", "unit": "23", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：23）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：価格意見の根拠〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "一般媒介でも、法律上一律5日以内に登録しなければならない。", "truth": false, "why": "任意登録や約款上の約束と法定義務は分ける。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "媒介価額について意見を述べるときは、根拠を明らかにしなければならない。", "truth": true, "why": "価格についての判断根拠を示す義務がある。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "現在も35条書面は、宅建士が押印しない限り必ず法違反となる。", "truth": false, "why": "2022年施行の書面電子化と合わせて押印義務が廃止された。", "ref": "35条5項", "unit": "24", "sources": ["takken", "electronic", "takkenrules", "takkenorder"]}, {"text": "登録物件が成約しても、指定流通機構への通知は法律上一切不要である。", "truth": false, "why": "成約情報も適切に共有する。", "ref": "34条の2", "unit": "23", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-24-1", "unit": "24", "group": "宅建業法", "bank": "practice", "stem": "35条重要事項説明・基本手順に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：説明する時期〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "重要事項説明は、契約成立後1週間以内に行えば必ず適法である。", "truth": false, "why": "契約判断の前に必要な情報を渡す制度。", "ref": "35条", "unit": "24", "sources": ["takken", "electronic", "takkenrules", "takkenorder"]}, {"text": "重要事項説明は宅建士に行わせる必要があるが、その宅建士が専任であることまでは要しない。", "truth": true, "why": "宅建士であることと専任配置の義務は別。", "ref": "35条", "unit": "24", "sources": ["takken", "electronic", "takkenrules", "takkenorder"]}, {"text": "35条書面には、宅建士が記名しなければならない。", "truth": true, "why": "押印は不要になっても宅建士の記名は必要。", "ref": "35条5項", "unit": "24", "sources": ["takken", "electronic", "takkenrules", "takkenorder"]}, {"text": "相手方が宅建業者のときは、35条の説明は省略できるが書面交付等の義務は残る。", "truth": true, "why": "説明免除と書面義務を区別。", "ref": "35条6項", "unit": "24", "sources": ["takken", "electronic", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-24-2", "unit": "24", "group": "宅建業法", "bank": "practice", "stem": "35条重要事項説明・基本手順に関する次の記述のうち、正しいものはどれか。〔検討テーマ：担当者の資格〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "重要事項説明は宅建士に行わせる必要があるが、その宅建士が専任であることまでは要しない。", "truth": true, "why": "宅建士であることと専任配置の義務は別。", "ref": "35条", "unit": "24", "sources": ["takken", "electronic", "takkenrules", "takkenorder"]}, {"text": "35条書面は、無資格の営業担当者の記名だけで法の要件を満たす。", "truth": false, "why": "押印は不要になっても宅建士の記名は必要。", "ref": "35条5項" ken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "中古住宅は、建物状況調査未実施なら法律上必ず販売禁止となる。", "truth": false, "why": "調査実施自体を一律義務にする規定ではない。", "ref": "35条1項6号の2", "unit": "25", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "市町村から提供された水害ハザードマップがある場合、対象物件の所在地を示して説明する。", "truth": true, "why": "所在地を示す説明義務。災害安全の保証ではない。", "ref": "施行規則16条の4の3", "unit": "25", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "RC造共同住宅等の建物状況調査も、結果の説明対象期間は例外なく6か月以内である。", "truth": false, "why": "2024年4月施行改正でこの類型は2年。一般は1年。", "ref": "35条・施行規則・解釈運用", "unit": "25", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-25-2", "unit": "25", "group": "宅建業法", "bank": "practice", "stem": "重要事項・物件調査に関する次の記述のうち、正しいものはどれか。〔検討テーマ：石綿記録の扱い〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "石綿使用の有無の調査結果の記録がある場合、その内容が重要事項説明の対象となる。", "truth": true, "why": "記録の内容説明と一律調査実施義務は違う。", "ref": "35条・施行規則", "unit": "25", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "水害ハザードマップが提供されていても、物件所在地の説明は35条では常に不要である。", "truth": false, "why": "所在地を示す説明義務。災害安全の保証ではない。", "ref": "施行規則16条の4の3", "unit": "25", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "中古住宅は、建物状況調査未実施なら法律上必ず販売禁止となる。", "truth": false, "why": "調査実施自体を一律義務にする規定ではない。", "ref": "35条1項6号の2", "unit": "25", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "RC造共同住宅等の建物状況調査も、結果の説明対象期間は例外なく6か月以内である。", "truth": false, "why": "2024年4月施行改正でこの類型は2年。一般は1年。", "ref": "35条・施行規則・解釈運用", "unit": "25", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-25-3", "unit": "25", "group": "宅建業法", "bank": "practice", "stem": "重要事項・物件調査に関する次の記述のうち、正しいものはどれか。〔検討テーマ：既存住宅の調査〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"t tation", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M3-25-7", "unit": "25", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：25）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：管理者方式の改正〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "土砂災害警戒区域は特別警戒区域でない限り、35条で必ず説明不要である。", "truth": false, "why": "警戒と特別警戒の制度を分け、説明対象を勝手に狭めない。", "ref": "35条・施行規則", "unit": "25", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "移転登記の申請時期は、売買の37条書面の記載事項ではない。", "truth": false, "why": "民法の対抗要件と契約上の申請時期の明確化を結び付ける。", "ref": "37条1項", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "2026年4月1日以後、マンションが管理業者管理者方式を採用している場合の所定事項は重要事項説明の対象となる。", "truth": true, "why": "2026年施行の施行規則・解釈運用に合わせた追加事項。", "ref": "施行規則16条の2・2026年解釈運用", "unit": "25", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}, {"text": "未完成物件は現物がないため、完成時の構造について一切説明不要である。", "truth": false, "why": "図面等により完成後の姿を説明する。", "ref": "35条1項5号", "unit": "25", "sources": ["takken", "interpretation", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-26-1", "unit": "26", "group": "宅建業法", "bank": "practice", "stem": "37条書面・契約成立後に関する次の記述のうち、正しいものはどれか。〔検討テーマ：双方への交付〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "37条書面は、必ず宅建士が全項目を口頭説明しないと交付義務を果たせない。", "truth": false, "why": "法定説明は35条。37条の記名義務と分ける。", "ref": "37条3項", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "37条書面は、契約成立後1年以内ならいつ交付しても適法である。", "truth": false, "why": "固定日数ではなく遅滞なく。", "ref": "37条", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "売買を媒介した宅建業者は、37条書面を売主と買主の双方に交付等する。", "truth": true, "why": "契約内容を当事者双方で明確化する制度。", "ref": "37条1項", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "売買の37条書面に引渡し時期を書くかは、常に業者の自由である。", "truth": false, "why": "代金支払、移転登記申請時期等とともに基本事項。", "ref": "37条1項", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-26-2", "unit": "26", "group": "宅建業法", "bank": "practice", "stem": "37条書面・契約成立後に関する次の記述のうち、正しいものはどれか。〔検討テーマ：交付する時期〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "売買媒介の37条書面は、買主だけに交付等すれば常に足りる。", "truth": false, "why": "契約内容を当事者双方で明確化する制度。", "ref": "37条1項", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "37条書面は、契約成立後遅滞なく交付等しなければならない。", "truth": true, "why": "固定日数ではなく遅滞なく。", "ref": "37条", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "売買の37条書面に引渡し時期を書くかは、常に業者の自由である。", "truth": false, "why": "代金支払、移転登記申請時期等とともに基本事項。", "ref": "37条1項", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "37条書面は、必ず宅建士が全項目を口頭説明しないと交付義務を果たせない。", "truth": false, "why": "法定説明は35条。37条の記名義務と分ける。", "ref": "37条3項", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-26-3", "unit": "26", "group": "宅建業法", "bank": "practice", "stem": "37条書面・契約成立後に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：宅建士の説明〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "37条書面は、必ず宅建士が全項目を口頭説明しないと交付義務を果たせない。", "truth": false, "why": "法定説明は35条。37条の記名義務と分ける。", "ref": "37条3項", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "売買の37条書面では、物件の引渡し時期は必須記載事項である。", "truth": true, "why": "代金支払、移転登記申請時期等とともに基本事項。", "ref": "37条1項", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "売買を媒介した宅建業者は、37条書面を売主と買主の双方に交付等する。", "truth": true, "why": "契約内容を当事者双方で明確化する制度。", "ref": "37条1項", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "37条書面は、契約成立後遅滞なく交付等しなければならない。", "truth": true, "why": "固定日数ではなく遅滞なく。", "ref": "37条", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-26-4", 〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "売買の37条書面には、移転登記の申請時期を記載しなければならない。", "truth": true, "why": "民法の対抗要件と契約上の申請時期の明確化を結び付ける。", "ref": "37条1項", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業者間売買にも37条書面の交付等義務は適用される。", "truth": true, "why": "8種制限の適用除外を一般義務に広げない。", "ref": "37・78条", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "売主が宅建業者、買主が非業者なら、中古住宅にも8種制限が適用され得る。", "truth": true, "why": "完成未完成は各規定の条件や閾値で関わるが、全体を除外しない。", "ref": "各規定", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "違約金に関する定めがあっても、37条書面にその内容を記載してはならない。", "truth": false, "why": "定めがある場合の記載事項。", "ref": "37条1項", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M3-26-7", "unit": "26", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：26）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：登記時期の記載〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "業者が貸主の賃貸借にも、売買の手付20％上限が当然に適用される。", "truth": false, "why": "売買に固有の規制を賃貸へ広げない。", "ref": "38〜43条", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "違約金に関する定めがあっても、37条書面にその内容を記載してはならない。", "truth": false, "why": "定めがある場合の記載事項。", "ref": "37条1項", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業者間なら8種制限と同じく37条書面の義務も当然に免除される。", "truth": false, "why": "8種制限の適用除外を一般義務に広げない。", "ref": "37・78条", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "売買の37条書面には、移転登記の申請時期を記載しなければならない。", "truth": true, "why": "民法の対抗要件と契約上の申請時期の明確化を結び付ける。", "ref": "37条1項", "unit": "26", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-27-1", "unit": "27", "group": "宅建業法", "bank": "practice", "stem": "8種制限・他人物売買に関する次の記述のうち、正しいものはどれか。〔検討テーマ：対象となる売主〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "業者がまだ物件を所有していない場合、取得契約があっても他人物売買は一切例外なく禁止される。", "truth": false, "why": "法定の取得契約等の例外がある。停止条件付は除外される。", "ref": "33条の2", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "8種制限は、原則として宅建業者が自ら売主となる取引で買主が宅建業者でない場合に適用される。", "truth": true, "why": "売主が業者かを先に判断。媒介者の免許だけでは足りない。", "ref": "各規定・78条", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "買主も宅建業者である売買には、すべての8種制限が非業者買主と同じく適用される。", "truth": false, "why": "業者間の除外は一般的な広告・書面義務等の除外ではない。", "ref": "78条2項", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "他人物売買は、民法上も例外なく契約そのものが当然無効である。", "truth": false, "why": "売主は権利を取得して移転する義務を負う。業法上の規制とは別。", "ref": "民法561条・33条の2", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-27-2", "unit": "27", "group": "宅建業法", "bank": "practice", "stem": "8種制限・他人物売買に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：業者間の適用〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": false, "options": [{"text": "買主も宅建業者である売買には、すべての8種制限が非業者買主と同じく適用される。", "truth": false, "why": "業者間の除外は一般的な広告・書面義務等の除外ではない。", "ref": "78条2項", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "8種制限は、原則として宅建業者が自ら売主となる取引で買主が宅建業者でない場合に適用される。", "truth": true, "why": "売主が業者かを先に判断。媒介者の免許だけでは足りない。", "ref": "各規定・78条", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業者が物件を取得する契約を締結している場合等には、所定の要件の下で他人物売買制限の例外となる。", "truth": true, "why": "法定の取得契約等の例外がある。停止条件付は除外される。", "ref": "33条の2", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "他人の物の売買契約は、民法上直ちに無効になるわけではない。", "truth": true, "why": "売主は権利を取得して移転する義務を負う。業法上の規制とは別。", "ref": "民法561条・33条の2", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-27-3", "unit": "27", "group": "宅建業法", "bank": "practice", "stem": "8種制限・他人物売買に関する次の記述のうち、正しいものはどれか。〔検討テーマ：他人物売買の民法 bank": "mock1", "stem": "宅建業法の総合判断（関連単元：27）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：停止条件の注意〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "8種制限は新築専用であり、中古住宅は常に全部適用除外である。", "truth": false, "why": "完成未完成は各規定の条件や閾値で関わるが、全体を除外しない。", "ref": "各規定", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業者が貸主の賃貸借にも、売買の手付20％上限が当然に適用される。", "truth": false, "why": "売買に固有の規制を賃貸へ広げない。", "ref": "38〜43条", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "他人物売買の取得契約による例外では、停止条件付取得契約は除かれる。", "truth": true, "why": "取得の確実性を考慮した要件。", "ref": "33条の2", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "買主が自ら希望した自宅で申込みをしても、自宅だから常にクーリング・オフできる。", "truth": false, "why": "誰が場所を指定したかが重要。", "ref": "施行規則16条の5", "unit": "28", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "M2-27-6", "unit": "27", "group": "宅建業法", "bank": "mock2", "stem": "宅建業法の総合判断（関連単元：27）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：中古物件への適用〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": false, "options": [{"text": "宅建業者が自ら貸主となる建物賃貸借に、売買の8種制限はそのまま適用されない。", "truth": true, "why": "売買に固有の規制を賃貸へ広げない。", "ref": "38〜43条", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "事務所等以外で買受申込みをした場合、後に事務所で契約してもクーリング・オフが認められ得る。", "truth": true, "why": "申込みをした場所が基準となる。", "ref": "37条の2", "unit": "28", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "他人物売買の取得契約による例外では、停止条件付取得契約は除かれる。", "truth": true, "why": "取得の確実性を考慮した要件。", "ref": "33条の2", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "8種制限は新築専用であり、中古住宅は常に全部適用除外である。", "truth": false, "why": "完成未完成は各規定の条件や閾値で関わるが、全体を除外しない。", "ref": "各規定", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M3-27-7", "unit": "27", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：27）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：自社の賃貸〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "クーリング・オフでは、業者は手付を必ず没収できる。", "truth": false, "why": "解約手付の放棄とは別の保護制度。", "ref": "37条の2", "unit": "28", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "停止条件付取得契約さえ締結すれば、33条の2の取得契約例外を必ず満たす。", "truth": false, "why": "取得の確実性を考慮した要件。", "ref": "33条の2", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "8種制限は新築専用であり、中古住宅は常に全部適用除外である。", "truth": false, "why": "完成未完成は各規定の条件や閾値で関わるが、全体を除外しない。", "ref": "各規定", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "宅建業者が自ら貸主となる建物賃貸借に、売買の8種制限はそのまま適用されない。", "truth": true, "why": "売買に固有の規制を賃貸へ広げない。", "ref": "38〜43条", "unit": "27", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-28-1", "unit": "28", "group": "宅建業法", "bank": "practice", "stem": "クーリング・オフに関する次の記述のうち、誤っているものはどれか。〔検討テーマ：8日の起算〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": false, "options": [{"text": "買主が物件の引渡しを受け、かつ代金全額を支払った場合はクーリング・オフできない。", "truth": true, "why": "引渡しと全額支払の双方が必要。", "ref": "37条の2", "unit": "28", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "クーリング・オフは、解除の書面を発した時に効力を生ずる。", "truth": true, "why": "法定の発信主義で期限内の権利行使を保護。", "ref": "37条の2", "unit": "28", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "クーリング・オフの8日は、説明を受けなくても契約締結日から必ず進む。", "truth": false, "why": "契約日ではなく告知日。告知がなければ期間開始の要件を満たさない。", "ref": "37条の2", "unit": "28", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "適法なクーリング・オフに対し、業者は損害賠償又は違約金を請求できない。", "truth": true, "why": "20％上限の規定は解除権行使への請求を認めるものではない。", "ref": "37条の2", "unit": "28", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-28-2", "unit": "28", "group": "宅建業法", "bank": "practice", "stem": "クーリング・オフに関する次の記述のうち、正しいものはどれか。〔検討テー 行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": false, "options": [{"text": "喫茶店で申込み後、店舗で契約すれば、それだけで必ずクーリング・オフできなくなる。", "truth": false, "why": "申込みをした場所が基準となる。", "ref": "37条の2", "unit": "28", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "所定の割賦販売で支払遅滞を理由に解除等するには、30日以上の期間を定め書面で催告する必要がある。", "truth": true, "why": "買主保護の特則。一般売買の催告期間と混同しない。", "ref": "42条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "適法なクーリング・オフがあれば、業者は受領した手付その他の金銭を速やかに返還する。", "truth": true, "why": "解約手付の放棄とは別の保護制度。", "ref": "37条の2", "unit": "28", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "買主が自ら指定した自宅で買受申込みをした場合、原則クーリング・オフの対象外となる。", "truth": true, "why": "誰が場所を指定したかが重要。", "ref": "施行規則16条の5", "unit": "28", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M3-28-7", "unit": "28", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：28）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：手付の返還〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "適法なクーリング・オフがあれば、業者は受領した手付その他の金銭を速やかに返還する。", "truth": true, "why": "解約手付の放棄とは別の保護制度。", "ref": "37条の2", "unit": "28", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "喫茶店で申込み後、店舗で契約すれば、それだけで必ずクーリング・オフできなくなる。", "truth": false, "why": "申込みをした場所が基準となる。", "ref": "37条の2", "unit": "28", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業者売主は、手付解除を全部禁止する特約を置けば常に有効に買主を拘束できる。", "truth": false, "why": "買主保護に反する特約を認めない。", "ref": "39条3項", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "買主が自ら希望した自宅で申込みをしても、自宅だから常にクーリング・オフできる。", "truth": false, "why": "誰が場所を指定したかが重要。", "ref": "施行規則16条の5", "unit": "28", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-29-1", "unit": "29", "group": "宅建業法", "bank": "practice", "stem": "手付・違約金・割賦販売に関する次の記述のうち、正しいものはどれか。〔検討テーマ：手付の上限〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "証約手付と書けば、非業者買主の手付放棄による解除を常に排除できる。", "truth": false, "why": "買主に不利な特約は無効。", "ref": "39条2・3項", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "違約金が20％を超えると、売買契約全体が必ず無効になる。", "truth": false, "why": "無効の範囲は超過部分。", "ref": "38条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業者売主・非業者買主の売買では、代金20％を超える手付を受領できない。", "truth": true, "why": "保全しても20％受領上限は残る。", "ref": "39条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "損害賠償予定20％と違約金20％を別々に定めれば、合計40％でもすべて有効である。", "truth": false, "why": "名目を分けても合算する。", "ref": "38条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-29-2", "unit": "29", "group": "宅建業法", "bank": "practice", "stem": "手付・違約金・割賦販売に関する次の記述のうち、正しいものはどれか。〔検討テーマ：違約金の合算〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "違約金が20％を超えると、売買契約全体が必ず無効になる。", "truth": false, "why": "無効の範囲は超過部分。", "ref": "38条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "損害賠償予定と違約金の合計は、代金20％を超えて定められない。", "truth": true, "why": "名目を分けても合算する。", "ref": "38条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "証約手付と書けば、非業者買主の手付放棄による解除を常に排除できる。", "truth": false, "why": "買主に不利な特約は無効。", "ref": "39条2・3項", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業者売主は、保全措置さえすれば代金50％を手付として受領できる。", "truth": false, "why": "保全しても20％受領上限は残る。", "ref": "39条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-29-3", "unit": "29", "group": "宅建業法", "bank": "practice", "stem": "手付・違約金・割賦販売に関する次の記述のうち、正しいものはどれか。〔検討テーマ：超過した部分〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "38条の20％上限を超えた特約は、その超過部分が無効となる。", "truth": true, "why": "無効の範囲は超過部分。", "ref": "38条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業者売主は、保全措置さえすれば代金50％を手付として受領できる。", "truth": false, "why": "保全しても20％受領上限は残る。", "ref": "39条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "損害賠償予定20％と違約金20％を別々に定めれば、合計40％でもすべて有効である。", "truth": false, "why": "名目を分けても合算する。", "ref": "38条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "証約手付と書けば、非業者買主の手付放棄による解除を常に排除できる。", "truth": false, "why": "買主に不利な特約は無効。", "ref": "39条2・3項", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-29-4", "unit": "29", "group": "宅建業法", "bank": "practice", "stem": "手付・違約金・割賦販売に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：手付の性質〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": false, "options": [{"text": "証約手付と書けば、非業者買主の手付放棄による解除を常に排除できる。", "truth": false, "why": "買主に不利な特約は無効。", "ref": "39条2・3項", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業者売主・非業者買主の売買では、代金20％を超える手付を受領できない。", "truth": true, "why": "保全しても20％受領上限は残る。", "ref": "39条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "38条の20％上限を超えた特約は、その超過部分が無効となる。", "truth": true, "why": "無効の範囲は超過部分。", "ref": "38条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "損害賠償予定と違約金の合計は、代金20％を超えて定められない。", "truth": true, "why": "名目を分けても合算する。", "ref": "38条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M1-29-5", "unit": "29", "group": "宅建業法", "bank": "mock1", "stem": "宅建業法の総合判断（関連単元：29）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：売主の手付解除〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "割賦代金を1日遅延しただけで、書面催告なく常に全残額を請求できる。", "truth": false, "why": "買主保護の特則。一般売買の催告期間と混同しない。", "ref": "42条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業者が必要な保全をしなくても、買主が支払を拒めば必ず違約金を負担する。", "truth": false, "why": "支払拒絶に法定の保護がある。", "ref": "41条4項等", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "業者売主は、手付解除を全部禁止する特約を置けば常に有効に買主を拘束できる。", "truth": false, "why": "買主保護に反する特約を認めない。", "ref": "39条3項", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "売主業者が手付解除するには、原則として手付の倍額を現実に提供する。", "truth": true, "why": "現実の提供を要求する。相手方履行着手等の限界もある。", "ref": "39条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M2-29-6", "unit": "29", "group": "宅建業法", "bank": "mock2", "stem": "宅建業法の総合判断（関連単元：29）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：割賦の不払〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": false, "options": [{"text": "割賦代金を1日遅延しただけで、書面催告なく常に全残額を請求できる。", "truth": false, "why": "買主保護の特則。一般売買の催告期間と混同しない。", "ref": "42条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "売主業者が手付解除するには、原則として手付の倍額を現実に提供する。", "truth": true, "why": "現実の提供を要求する。相手方履行着手等の限界もある。", "ref": "39条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "指定保管機関による保管方式は、完成物件の手付金等保全の方法として認められる。", "truth": true, "why": "未完成は銀行等保証・保険等、完成は保管方式も可。", "ref": "41・41条の2", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "買主の手付解除を、相手方の履行着手前なのに一律禁止する不利な特約は無効である。", "truth": true, "why": "買主保護に反する特約を認めない。", "ref": "39条3項", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M3-29-7", "unit": "29", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：29）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：不利な解除特約〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "買主の手付解除を、相手方の履行着手前なのに一律禁止する不利な特約は無効である。", "truth": true, "why": "買主保護に反する特約を認めない。", "ref": "39条3項", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "未完成物件では、5％ちょうどでも必ず5％超として保全が必要である。", "truth": false, "why": "「超える」と「以上」は違う。登記等の例外や受領上限も別途判断。", "ref": "41条", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "売主業者は「倍額を払うつもり」と口頭で告げるだけで必ず手付解除できる。", "truth": false, "why": "現実の提供を要求する。相手方履行着手等の限界もある。", "ref": "39条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "割賦代金を1日遅延しただけで、書面催告なく常に全残額を請求できる。", "truth": false, "why": "買主保護の特則。一般売買の催告期間と混同しない。", "ref": "42条", "unit": "29", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-30-1", "unit": "30", "group": "宅建業法", "bank": "practice", "stem": "手付金等の保全に関する次の記述のうち、正しいものはどれか。〔検討テーマ：未完成の免除〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "必要な保全措置は、手付受領後1か月以内にすれば必ず適法である。", "truth": false, "why": "受領前に買主を保護する。", "ref": "41・41条の2", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "中間金と名付ければ、手付金等の保全対象から必ず外れる。", "truth": false, "why": "名目ではなく金銭の性質と受領時期で判断。", "ref": "41条", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "完成物件なら、手付金等が1,000万円以下であるだけで割合を問わず保全不要となる。", "truth": false, "why": "完成も割合と絶対額の両条件。", "ref": "41条の2", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "未完成物件では、手付金等の額が代金5％以下かつ1,000万円以下なら原則保全措置が免除される。", "truth": true, "why": "未完成は5％と1,000万円の両条件。", "ref": "41条", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-30-2", "unit": "30", "group": "宅建業法", "bank": "practice", "stem": "手付金等の保全に関する次の記述のうち、正しいものはどれか。〔検討テーマ：完成済の免除〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "完成物件では、手付金等が代金10％以下かつ1,000万円以下なら原則保全措置が免除される。", "truth": true, "why": "完成も割合と絶対額の両条件。", "ref": "41条の2", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "中間金と名付ければ、手付金等の保全対象 : "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "完成物件なら、手付金等が1,000万円以下であるだけで割合を問わず保全不要となる。", "truth": false, "why": "完成も割合と絶対額の両条件。", "ref": "41条の2", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "未完成物件は、手付金等が代金10％以下なら額にかかわらず保全不要である。", "truth": false, "why": "未完成は5％と1,000万円の両条件。", "ref": "41条", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M1-30-5", "unit": "30", "group": "宅建業法", "bank": "mock1", "stem": "宅建業法の総合判断（関連単元：30）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：支払拒絶の保護〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "未完成物件でも、指定保管機関の保管方式を完成物件と同じく自由に利用できる。", "truth": false, "why": "未完成は銀行等保証・保険等、完成は保管方式も可。", "ref": "41・41条の2", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "未完成物件では、5％ちょうどでも必ず5％超として保全が必要である。", "truth": false, "why": "「超える」と「以上」は違う。登記等の例外や受領上限も別途判断。", "ref": "41条", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "必要な保全措置を講じないとき、買主は手付金等の支払を拒め、その拒絶を理由に解除等をされない。", "truth": true, "why": "支払拒絶に法定の保護がある。", "ref": "41条4項等", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "築5年の未入居住宅も、品確法上は必ず新築住宅である。", "truth": false, "why": "未使用だけでなく完成後の期間要件がある。", "ref": "品確法2条", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "M2-30-6", "unit": "30", "group": "宅建業法", "bank": "mock2", "stem": "宅建業法の総合判断（関連単元：30）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：保管方式の範囲〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": false, "options": [{"text": "未完成物件で5％ちょうど、かつ1,000万円以下なら、原則として割合による保全義務の境界を超えない。", "truth": true, "why": "「超える」と「以上」は違う。登記等の例外や受領上限も別途判断。", "ref": "41条", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "未完成物件でも、指定保管機関の保管方式を完成物件と同じく自由に利用できる。", "truth": false, "why": "未完成は銀行等保証・保険等、完成は保管方式も可。", "ref": "41・41条の2", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "必要な保全措置を講じないとき、買主は手付金等の支払を拒め、その拒絶を理由に解除等をされない。", "truth": true, "why": "支払拒絶に法定の保護がある。", "ref": "41条4項等", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "品確法の法定10年責任は、すべての住宅設備のあらゆる故障を一律に対象とするものではない。", "truth": true, "why": "対象は構造耐力上主要部分・雨水浸入防止部分。別の契約責任等は検討する。", "ref": "品確法95条", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M3-30-7", "unit": "30", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：30）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：割合の境界〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "未完成物件でも、指定保管機関の保管方式を完成物件と同じく自由に利用できる。", "truth": false, "why": "未完成は銀行等保証・保険等、完成は保管方式も可。", "ref": "41・41条の2", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "未完成物件で5％ちょうど、かつ1,000万円以下なら、原則として割合による保全義務の境界を超えない。", "truth": true, "why": "「超える」と「以上」は違う。登記等の例外や受領上限も別途判断。", "ref": "41条", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "買主が宅建業者なら、品確法の新築住宅主要部分の10年責任も必ず全部免除される。", "truth": false, "why": "異なる法律の適用範囲を別々に判断する。", "ref": "78条・品確法95条", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}, {"text": "業者が必要な保全をしなくても、買主が支払を拒めば必ず違約金を負担する。", "truth": false, "why": "支払拒絶に法定の保護がある。", "ref": "41条4項等", "unit": "30", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-31-1", "unit": "31", "group": "宅建業法", "bank": "practice", "stem": "契約不適合特約・住宅瑕疵担保に関する次の記述のうち、正しいものはどれか。〔検討テーマ：中古の2年特約〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "品確法の新築住宅責任は、構造主要部分でも引渡しから1年だけである。", "truth": false, "why": "雨水浸入防止部分も対象。請負人から売主への引渡しがある場合はその時から10年。民法や40条と別の強行規定。", "ref": "品確法95条", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}, {"text": "中古住宅なら、業者売主は一般買主に対する不適合責任を常に全部免除できる。", "truth": false, "why": "中古という理由で40条が除外されない。", "ref": "40条", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}, {"text": "対象となる新築住宅売主業者は、口頭で補修を約束すれば保険も供託も一切不要である。", "truth": false, "why": "責任の存在と履行を支える資力確保は別。", "ref": "履行法11条等", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}, {"text": "業者売主・非業者買主では、種類品質の不適合通知期間を引渡しから2年以上とする特約は認められる。", "truth": true, "why": "40条の例外は2年以上。民法より不利な特約の限界。", "ref": "40条", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-31-2", "unit": "31", "group": "宅建業法", "bank": "practice", "stem": "契約不適合特約・住宅瑕疵担保に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：全部免責〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": false, "options": [{"text": "中古住宅なら、業者売主は一般買主に対する不適合責任を常に全部免除できる。", "truth": false, "why": "中古という理由で40条が除外されない。", "ref": "40条", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}, {"text": "業者売主・非業者買主では、種類品質の不適合通知期間を引渡しから2年以上とする特約は認められる。", "truth": true, "why": "40条の例外は2年以上。民法より不利な特約の限界。", "ref": "40条", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}, {"text": "新築住宅を引き渡す対象事業者は、所定の保険又は保証金供託で資力確保をする。", "truth": true, "why": "責任の存在と履行を支える資力確保は別。", "ref": "履行法11条等", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}, {"text": "新築住宅の構造耐力上主要な部分等には、品確法による原則引渡しから10年の責任がある（請負に基づく住宅は請負人から売主への引渡しが起算）。", "truth": true, "why": "雨水浸入防止部分も対象。請負人から売主への引渡しがある場合はその時から10年。民法や40条と別の強行規定。", "ref": "品確法95条", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-31-3", "unit": "31", "group": "宅建業法", "bank": "practice", "stem": "契約不適合特約・住宅瑕疵担保に関する次の記述のうち、正しいものはどれか。〔検討テーマ：新築の主要部  "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}, {"text": "新築住宅のエアコンや食洗機のどんな故障にも、品確法の法定10年責任が当然に適用される。", "truth": false, "why": "対象は構造耐力上主要部分・雨水浸入防止部分。別の契約責任等は検討する。", "ref": "品確法95条", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M3-31-7", "unit": "31", "group": "宅建業法", "bank": "mock3", "stem": "宅建業法の総合判断（関連単元：31）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：業者間との違い〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。売主は宅建業者、買主は宅建業者でない者とする。", "askTruth": true, "options": [{"text": "新築住宅のエアコンや食洗機のどんな故障にも、品確法の法定10年責任が当然に適用される。", "truth": false, "why": "対象は構造耐力上主要部分・雨水浸入防止部分。別の契約責任等は検討する。", "ref": "品確法95条", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}, {"text": "築5年の未入居住宅も、品確法上は必ず新築住宅である。", "truth": false, "why": "未使用だけでなく完成後の期間要件がある。", "ref": "品確法2条", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}, {"text": "同条件の通常売買媒介では、一方からの税込上限は132万円である。", "truth": false, "why": "2,000万円×3％＋6万円＝66万円、1.1倍＝72.6万円。", "ref": "報酬告示", "unit": "32", "sources": ["takken", "reward", "takkenrules", "takkenorder"]}, {"text": "40条の8種制限は業者間では適用除外だが、新築住宅の品確法責任は同じ理由だけで当然に除外されない。", "truth": true, "why": "異なる法律の適用範囲を別々に判断する。", "ref": "78条・品確法95条", "unit": "31", "sources": ["takken", "quality", "defect", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-32-1", "unit": "32", "group": "宅建業法", "bank": "practice", "stem": "報酬計算・売買・代理に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：速算式の条件〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "売買媒介では、原則として売主と買主それぞれから一方の上限内の報酬を受けられる。", "truth": true, "why": "賃貸の双方合計上限とは違う。", "ref": "報酬告示", "unit": "32", "sources": ["takken", "reward", "takkenrules", "takkenorder"]}, {"text": "価格100万円の売買にも、特例を使わず常に3％＋6万円の速算式を使える。", "truth": false, "why": "速算式の適用範囲は400万円超。小額は段階料率。", "ref": "報酬告示", "unit": "32", "sources": ["takken", "reward", "takkenrules", "takkenorder"]}, {"text": "売買代理の依頼者からの報酬は、原則として売買媒介の一方上限の2倍以内である。", "truth": true, "why": "相手方からも受ける場合は合計の規制がある。", "ref": "報酬告示", "unit": "32", "sources": ["takken", "reward", "takkenrules", "takkenorder"]}, {"text": "売買報酬の計算の基礎となる価格からは、物件価格に含まれる消費税等相当額を除く。", "truth": true, "why": "物件の税と報酬の税は別。", "ref": "報酬告示", "unit": "32", "sources": ["takken", "reward", "takkenrules", "takkenorder"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-32-2", "unit": "32", "group": "宅建業法", "bank": "practice", "stem": "報酬計算・売買・代理に関する次の記述のうち、正しいものはどれか。〔検討テーマ：価格の消費税〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "価格100万円の売買にも、特例を使わず常に3％＋6万円の速算式を使える。", "truth": false, "why": "速算式の適用範囲は400万円超。小額は段階料率。", "ref": "報酬告示", "unit": "32", "sources": ["takken", "reward", "takkenrules", "takkenorder"]}, {"text": "売買媒介では、売主から上限を受けたら買主からは法律上一切受けられない。", "truth": false, "why": "賃貸の双方合計上限とは違う。", "ref": "報酬告示", "unit": "32", "sources": ["takken", "reward", "takkenrules", "takkenorder"]}, {"text": "売買代理は、どんな価格でも売買媒介上限の10倍まで受けられる。", "truth": false, "why": "相手方からも受ける場合は合計の規制がある。", "ref": "報酬告示", "unit": "32", "sources": ["takken", "reward", "takkenrules", "takkenorder"]}, {"text": "売買報酬の計算の基礎となる価格からは、物件価格に含まれる消費税等相当額を除く。", "truth": true, "why": "物件の税と報酬の税は別。", "ref": "報酬告示", "unit": "32", "sources": ["takken", "reward", "takkenrules", "takkenorder"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-32-3", "unit": "32", "group": "宅建業法", "bank": "practice", "stem": "報酬計算・売買・代理に関する次の記述のうち、正しいものはどれか。〔検討テーマ：双方からの媒介報酬〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "売買媒介では、原則として売主と買主それぞれから一方の上限内の報酬を受けられる。", "truth": true, "why": "賃貸の双方合計上限とは違う。", "ref": "報酬告示", "unit": "32", "sources": ["takken", "reward", "takkenrules", "takkenorder"]}, {"text": "売買代理は、どんな価格でも売買媒介上限の10倍まで受けられる。", "truth": false, "why": "相手方からも受ける場合は合計の規制がある。", "ref": "報酬告示", "unit": "32", "sources": ["takken", "reward", "takkenrules", "takkenorde
