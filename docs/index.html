確認は、工事前に建築計画が法令に合うかを確認する制度で、土地の売買許可ではありません。工事完了後には検査があり、確認済証と検査済証は役割が異なります。2025年4月施行の見直しで、構造によらず階数2以上又は延べ面積200㎡超の建築物は原則として全国で確認対象となりました。", "用途や規模、地域、工事の種類によって対象を判断します。平屋200㎡以下の建築物でも都市計画区域等では確認対象となり得ます。単体規定は建物自体の安全・衛生を守り、集団規定は地域の土地利用を調整するものです。建築確認不要でも、建築基準法の安全基準まで免除になるわけではありません。"], "example": "都市計画区域外で木造2階建て住宅を新築。旧教材の「木造小規模だから区域外では確認不要」を使わず、改正後の階数要件を確認する。", "compare": "確認済証→工事前／検査済証→完了後／単体規定→原則全国／集団規定→原則都市計画区域等", "memory": "2025年4月改正・階数2以上又は延べ200㎡超・防火準防火外の10㎡以内増改築等に例外", "trap": "10㎡以下なら新築も防火地域も全部確認不要、ではない。", "supplement": []}, {"id": "38", "title": "道路・接道・用途制限", "group": "法令上の制限", "sources": ["building"], "article": "42〜49条", "facts": [{"tag": "接道の原則", "yes": "都市計画区域等では、建築物の敷地は原則として法の道路に2m以上接する必要がある。", "no": "建築物の敷地は、法の道路に50cm接すれば原則の接道義務を満たす。", "why": "用途・規模による条例の加重や許可等の例外を別途確認。", "ref": "43条"}, {"tag": "道路の幅員", "yes": "建築基準法の道路は、原則として幅員4m以上の所定の道路である。", "no": "人が歩ける通路なら、幅員1mでも必ず法42条の道路である。", "why": "指定・位置・既存等の要件が必要。", "ref": "42条"}, {"tag": "2項道路の後退", "yes": "2項道路の道路境界は、原則として中心線から水平距離2mの線とみなす。", "no": "2項道路では、原則として現況の道路端がそのまま法の境界となり後退不要である。", "why": "幅員4m確保のための原則。反対側が川等の場合は別。", "ref": "42条2項"}, {"tag": "道路内の建築", "yes": "道路内又は道路に突き出す建築物の建築は、原則として禁止される。", "no": "自分の所有する私道なら、法の道路内へ自由に住宅を建てられる。", "why": "所有権と公共的な道路規制は別。法定例外はある。", "ref": "44条"}, {"tag": "複数用途地域", "yes": "敷地が異なる用途地域にまたがる場合、用途制限は原則として敷地過半が属する地域の規定による。", "no": "用途制限は、敷地がまたがる場合に必ず面積加重平均して決める。", "why": "加重平均する容積率・建ぺい率との違い。", "ref": "91条"}, {"tag": "住居系の工場", "yes": "第一種低層住居専用地域では、一般的な工場の建築は原則として認められない。", "no": "第一種低層住居専用地域には、規模用途を問わずあらゆる工場を建てられる。", "why": "住宅環境を守る用途制限。小規模兼用住宅等の法定許容範囲は別。", "ref": "48条・別表2"}, {"tag": "私道の性質", "yes": "私道でも、位置指定道路等の法定要件を満たせば建築基準法の道路となる。", "no": "建築基準法の道路は、公有道路だけであり私道は絶対に含まれない。", "why": "所有主体ではなく法の道路類型で判断。", "ref": "42条"}], "lecture": ["住宅を建てる土地では、前面の通路が建築基準法の道路か、その道路へ何メートル接しているかを確認します。舗装され人が通るだけで法の道路になるわけではありません。原則は幅員4m以上の道路に敷地が2m以上接することです。私道でも所定の要件で道路となります。", "2項道路では、原則として中心線から2mを道路境界線とみなすセットバックが必要です。反対側が川や崖等なら扱いが異なります。用途地域の規制は建物の用途を調整し、敷地が複数地域にまたがる場合は敷地の過半が属する地域の規制を用います。防火地域のまたがり規則とは違うため、条文ごとに判定します。"], "example": "幅3mの2項道路に面した土地では、原則中心線から2mまで後退した部分を道路として扱う。元の測量面積のまま建ぺい率を計算すると過大になる。", "compare": "道路→原則幅4m／接道→原則2m／2項道路→原則中心線2m／用途またがり→敷地過半", "memory": "建築審査会同意等の許可例外あり・道路内建築は原則禁止", "trap": "私道はすべて建築不可、公道なら必ず建築可という判断はしない。", "supplement": []}, {"id": "39", "title": "建ぺい率・容積率・高さ", "group": "法令上の制限", "sources": ["building"], "article": "52〜56条の2", "facts": [{"tag": "建ぺい率の分子", "yes": "建ぺい率は、建築面積の敷地面積に対する割合である。", "no": "建ぺい率は、全階の延べ面積を敷地面積で割った割合である。", "why": "延べ面積の割合は容積率。", "ref": "53条"}, {"tag": "容積率の分子", "yes": "容積率は、原則として延べ面積の敷地面積に対する割合である。", "no": "容積率は、建物の高さを道路幅員で割った割合である。", "why": "面積の割合。算入除外等の特則もある。", "ref": "52条"}, {"tag": "道路による容積率", "yes": "前面道路が12m未満の場合、指定容積率に加えて道路幅員による制限も原則受ける。", "no": "指定容積率200％なら、前面道路の幅員が狭くても必ず200％いっぱいまで建てられる。", "why": "二つの上限の小さい方を適用。", "ref": "52条"}, {"tag": "住居系の計算", "yes": "指定容積率200％、前面道路4m、係数0.4の敷地では、原則道路幅員上限160％が適用される。", "no": "同条件では、指定値と道路上限を足した360％を適用する。", "why": "4×0.4＝1.6＝160％、200％との小さい方。", "ref": "52条"}, {"tag": "境界またがり", "yes": "建ぺい率の異なる区域にまたがる敷地の上限は、原則として各部分の面積による加重平均で求める。", "no": "建ぺい率は、敷地過半の地域の数値だけを必ず全敷地へ使う。", "why": "用途制限の過半ルールと区別。", "ref": "53条2項"}, {"tag": "角地の緩和", "yes": "建ぺい率の角地緩和は、特定行政庁が指定する角地等の要件を満たす場合に適用される。", "no": "二方向に通路があれば、指定要件を問わず全国で必ず建ぺい率が20％緩和される。", "why": "指定と法定緩和幅の確認が必要。", "ref": "53条3項"}, {"tag": "低層の絶対高さ", "yes": "第一種・第二種低層住居専用地域及び田園住居地域には、原則10m又は12mの絶対高さ制限がある。", "no": "低層住居専用地域では、日影規制がなければ高さは無制限である。", "why": "斜線、日影、絶対高さは別規制。法定例外は別に確認。", "ref": "55条"}], "lecture": ["建ぺい率は敷地に対する建築面積、容積率は敷地に対する延べ面積の割合です。平面の占め方と建物全体の量を分けます。容積率は指定値だけでなく前面道路幅員による上限も計算し、小さい方を使います。道路が広いから指定値を超えてよいわけではありません。", "敷地が複数地域にまたがる場合は面積で加重平均するのが基本ですが、用途制限の過半ルールとは違います。角地や防火地域等の緩和には指定や耐火性能など条件があります。斜線制限、絶対高さ、日影規制は別々の目的を持ち、単に低い住宅なら全規制不要と考えないでください。"], "example": "指定容積率200％、前面道路4m、一般的な住居系の幅員係数0.4なら道路上限160％。適用容積率は小さい160％となる。", "compare": "建ぺい率→建築面積÷敷地／容積率→延べ面積÷敷地／容積率上限→指定と道路上限の小さい方", "memory": "前面道路12m未満は幅員制限・住居系原則0.4その他原則0.6・低層等の絶対高さ10m又は12m", "trap": "角地なら全国一律で無条件に緩和、ではない。", "supplement": [["高さ・防火・日影を区別", "絶対高さ、道路斜線、隣地斜線、北側斜線、日影規制は対象地域や条件が異なります。低層地域だから隣地斜線も必ず同じ形でかかる、という判断はできません。防火地域と準防火地域にまたがる建物は、原則厳しい側の防火規制が建物全体へ及びますが、所定の区画等の例外があります。用途制限の敷地過半ルールとは別です。住宅の地階、共同住宅の共用廊下等、車庫などの容積率算定には所定の算入除外・上限があるため、延べ面積と容積率対象面積が常に同じとは限りません。計算では何の面積を問うかを先に確認してください。"]]}, {"id": "40", "title": "農地法・転用・権利移動", "group": "法令上の制限", "sources": ["farm"], "article": "2〜5条", "facts": [{"tag": "農地のまま売買", "yes": "農地を農地のまま売買する場合は、原則として農地法3条の許可が必要である。", "no": "農地を耕作目的のまま売る場合は、必ず5条の転用許可となる。", "why": "権利移動と転用の有無で分類する。", "ref": "3条"}, {"tag": "自分の農地を転用", "yes": "自己所有の農地を自ら駐車場へ転用する場合は、原則4条の対象となる。", "no": "自己所有農地の自己転用は、原則3条だけの対象である。", "why": "権利移動を伴わない転用は4条。", "ref": "4条"}, {"tag": "転用目的の購入", "yes": "農地を買って住宅敷地へ転用する場合は、原則5条の対象となる。", "no": "農地を買って転用する場合は、権利移動を無視して必ず4条だけで処理する。", "why": "権利移動と転用を併せて規制する。", "ref": "5条"}, {"tag": "市街化区域の特例", "yes": "市街化区域内の農地転用等は、所定の要件であらかじめ農業委員会へ届け出ることにより許可不要となる。", "no": "市街化区域内の農地転用は、届出も許可も一切不要である。", "why": "事前届出の要件を省略しない。3条の移動に一般化しない。", "ref": "4・5条"}, {"tag": "現況の判断", "yes": "農地かどうかは、原則として登記地目ではなく現況により判断する。", "no": "登記地目が宅地なら、現に耕作されていても絶対に農地法の農地にならない。", "why": "法の農地定義と登記地目を分ける。", "ref": "2条"}, {"tag": "相続の取得", "yes": "相続による農地取得は3条許可不要だが、所定の届出は必要となる。", "no": "農地を相続するには、例外なく取得前の3条許可が必要である。", "why": "相続等の一般承継と通常の売買を区別。", "ref": "3・3条の3"}, {"tag": "無許可の効力", "yes": "3条許可を要する権利移動を無許可で行っても、その権利移動は効力を生じない。", "no": "必要な3条許可がなくても、農地所有権移転は常に完全に有効である。", "why": "農地法の効力規定。業法違反一般の効果と混同しない。", "ref": "3条7項"}], "lecture": ["農地法は、農地の生産力を守るため、権利移動と転用を規制します。農地を農地のまま売るなら3条、自分の農地を駐車場にするなら4条、買って駐車場にするなら5条です。登記簿の地目だけでなく現況による農地判断が基本なので、地目宅地でも実際に耕作しているなら注意が必要です。", "市街化区域内の転用には農業委員会への届出による例外がありますが、3条の農地のままの売買には同じ例外を使いません。相続は3条許可不要でも、届出が必要になることがあります。許可を要する農地権利移動の無許可契約は効力を生じないという強い効果があります。"], "example": "畑を買って住宅敷地にするなら5条。売主がいったん自己転用すれば常に問題が消えると考えず、事実上の権利移動と計画を確認する。", "compare": "3条→農地のまま権利移動／4条→自己転用／5条→権利移動＋転用", "memory": "市街化区域転用は原則あらかじめ届出・相続等の届出は遅滞なく・無許可権利移動は効力なし", "trap": "市街化区域なら農地法は全部不要、という誤解に注意。", "supplement": []}, {"id": "41", "title": "国土利用計画法・届出と許可", "group": "法令上の制限", "sources": ["national"], "article": "14〜27条の10", "facts": [{"tag": "市街化区域の境界", "yes": "通常の事後届出は、市街化区域で2,000㎡以上の土地取引契約が原則対象となる。", "no": "市街化区域では、土地が10,000㎡未満なら常に事後届出不要である。", "why": "区域で閾値が違う。", "ref": "23条・施行令"}, {"tag": "非線引き区域の面積", "yes": "市街化区域以外の都市計画区域では、原則5,000㎡以上が事後届出対象となる。", "no": "市街化調整区域の通常届出面積は、一律2,000㎡以上である。", "why": "その他都市計画区域は5,000㎡。", "ref": "23条・施行令"}, {"tag": "届出をする人", "yes": "通常の事後届出は、原則として権利取得者が行う。", "no": "通常の事後届出は、売主だけが行い買主には一切義務がない。", "why": "取得者の利用目的等を把握する制度。", "ref": "23条"}, {"tag": "契約からの期間", "yes": "通常の事後届出は、契約締結日から2週間以内に行う。", "no": "通常の事後届出は、代金全額支払日から2か月以内でよい。", "why": "登記や決済日ではなく契約日。", "ref": "23条"}, {"tag": "一団の土地", "yes": "同一の利用目的に供する一団の土地を買い集める場合、所定の面積判定で合算が必要となる。", "no": "一つ一つの契約が面積基準未満なら、一団の土地でも絶対に届出対象にならない。", "why": "分割して規制を回避できない。", "ref": "23条の解釈"}, {"tag": "無届の売買", "yes": "通常の事後届出をしなかったことだけで、売買契約が当然無効になるわけではない。", "no": "通常の事後届出を怠ると、売買契約は必ず当然無効になる。", "why": "罰則等と私法効力を分ける。規制区域の許可制とは違う。", "ref": "23・47条"}, {"tag": "規制区域の方式", "yes": "規制区域内の所定の土地取引は許可制であり、通常の事後届出とは異なる。", "no": "規制区域でも、契約後2週間以内の届出さえすれば許可は一切不要である。", "why": "許可制と届出制を区別する。", "ref": "14条"}], "lecture": ["一定面積以上の土地取引は、契約後に利用目的等を届け出る制度があります。土地所有権等の移転や設定が対象で、建物だけの売買と区別します。区域ごとに面積基準が異なり、複数の小さな契約でも一団の土地なら合算して判断します。契約日を基準に届出期限を数えます。", "通常の事後届出は権利取得者が行います。届出違反の罰則と契約の私法上の効力は別です。注視区域・監視区域の事前届出、規制区域の許可は別の仕組みなので、すべて2週間以内届出とまとめないでください。許可制の無許可契約は効力を生じないという違いがあります。"], "example": "市街化区域で1,200㎡と900㎡を一つの事業のため買い集める。各契約が2,000㎡未満でも一団の土地の取得なら届出対象となり得る。", "compare": "市街化区域→2,000㎡以上／その他都市計画区域→5,000㎡以上／区域外→10,000㎡以上", "memory": "通常の事後届出は取得者・契約から2週間以内・一団の土地で判定", "trap": "建物の床面積を土地取引面積として判定しない。", "supplement": []}, {"id": "42", "title": "区画整理・盛土・その他の制限", "group": "法令上の制限", "sources": ["readjustment", "embankment", "landscape"], "article": "区画整理法・盛土規制法・景観法ほか", "facts": [{"tag": "仮換地の使用", "yes": "仮換地指定があると、所定の時点から仮換地を使用収益でき、従前地の使用収益は制限される。", "no": "仮換地指定後も、従前地と仮換地を必ず同時に無制限で使用収益できる。", "why": "一時的な土地利用の切替え。", "ref": "区画整理法99条"}, {"tag": "換地処分の効力", "yes": "換地は、原則として換地処分の公告の翌日から従前の宅地とみなされる。", "no": "換地処分の権利効果は、原則公告の1年前に自動的に生じる。", "why": "公告翌日が基本の時点。", "ref": "区画整理法104条"}, {"tag": "保留地の役割", "yes": "区画整理では、事業費に充てる等のため所定の保留地を定めることができる。", "no": "保留地は、全土地所有者へ面積を必ず同じ割合で追加するための土地だけをいう。", "why": "事業の資金等に用いる制度。", "ref": "区画整理法96条"}, {"tag": "盛土の対象", "yes": "盛土規制法は、規制区域内の一定の盛土等を土地用途にかかわらず規制する。", "no": "盛土規制法は住宅の宅地だけに適用され、農地での危険な盛土は常に対象外である。", "why": "旧制度より用途横断的な規制となった。", "ref": "盛土規制法"}, {"tag": "区域内の土地保全", "yes": "盛土規制区域の土地の所有者等には、所定の災害防止措置に関する責務がある。", "no": "盛土規制区域の土地は、工事を自分でした人以外に法定の責務が一切ない。", "why": "工事許可と土地の継続的な安全確保を区別。", "ref": "盛土規制法16・21条等"}, {"tag": "景観届出の時期", "yes": "景観計画区域内の所定の行為は、原則として着手30日前までに届出をする。", "no": "景観計画区域の所定行為の届出は、工事終了後にだけ行う。", "why": "原則30日間の着手制限。適用除外や短縮等を別途確認。", "ref": "景観法16・18条"}, {"tag": "組合の同意", "yes": "土地区画整理組合の設立認可には、原則所有者と借地権者それぞれの3分の2以上等の同意が必要である。", "no": "土地区画整理組合は、所有者一人の申出だけで他の権利者の同意なく常に設立できる。", "why": "人数要件に加えて面積要件等もある。", "ref": "区画整理法18条"}], "lecture": ["土地区画整理は道路等を整えながら土地の形を組み替える制度で、元の土地に対応する換地や工事中の仮換地を理解します。仮換地指定後は元の土地を自由に使えるわけではなく、換地処分の公告後に権利関係が移ります。保留地や減歩は事業費・公共施設のための仕組みです。", "盛土規制法は用途にかかわらず危険な盛土等を規制するため、農地だから対象外という判断はできません。規制区域内の一定の工事には許可等が必要です。景観計画区域、森林、埋蔵文化財、津波・土砂災害の区域なども取引調査の対象になるため、地域に指定があるかを自治体資料で確認する習慣につなげます。"], "example": "仮換地が指定された土地の売買では、登記簿の旧地番と現地で使う仮換地の対応を示し、どの権利を売買するかを明確にする。", "compare": "仮換地→工事中の使用収益／換地処分→公告翌日から権利効果／盛土→土地用途ではなく区域・行為・規模", "memory": "区画整理組合設立は所有者・借地権者の各2/3以上等・景観届出は原則着手30日前", "trap": "旧宅造法の名称と対象区域をそのまま使わない。地域条例も別途確認する。", "supplement": [["森林・文化財・都市計画施設", "地域森林計画の対象民有林では、所定規模を超える開発に林地開発許可が必要で、伐採届出や保安林の許可等とは別です。周知の埋蔵文化財包蔵地での所定の掘削等は原則60日前までの届出が問題になります。都市計画施設区域等内の建築は都市計画法53条許可を検討し、事業認可後は65条の制限へ段階が変わります。盛土規制法では宅地造成等工事規制区域と特定盛土等規制区域で許可・届出等の扱いが異なり、自治体の指定と工事規模を確かめます。学校・病院等の施設用地だからすべての制限が免除されるという判断は避けます。"]]}, {"id": "43", "title": "不動産取得税・固定資産税・登録免許税等", "group": "税・価格評定", "sources": ["localtax", "registrationtax", "stamp", "specialtax", "acquisition", "newhousetax", "registrationrates", "stamprates"], "article": "地方税法・登録免許税法・印紙税法", "facts": [{"tag": "取得税の課税主体", "yes": "不動産取得税は、都道府県が課す地方税である。", "no": "不動産取得税は、国だけが課す国税である。", "why": "固定資産税は原則市町村、登録免許税は国税。", "ref": "地方税法73条の2"}, {"tag": "固定資産税の基準日", "yes": "固定資産税は、原則として1月1日現在の所有者に課税される。", "no": "固定資産税の納税義務者は、毎月その月の所有者へ自動的に切り替わる。", "why": "売買時の精算契約は納税義務者の変更ではない。", "ref": "地方税法343・359条"}, {"tag": "相続と取得税", "yes": "相続による不動産取得には、原則として不動産取得税を課さない。", "no": "相続で土地を取得すると、売買と同じく必ず不動産取得税が課税される。", "why": "登記に対する登録免許税は別に判断。", "ref": "地方税法73条の7"}, {"tag": "住宅用地の特例", "yes": "小規模住宅用地の固定資産税の課税標準は、所定の範囲で価格の6分の1となる。", "no": "小規模住宅用地の固定資産税は、土地全体の価格へ一律6倍の課税標準を適用する。", "why": "原則住宅1戸につき200㎡まで等の条件。都市計画税は別割合。", "ref": "地方税法349条の3の2"}, {"tag": "取得税の新免税点", "yes": "2026年4月1日以後に取得する土地の不動産取得税の免税点は16万円未満である。", "no": "2026年4月1日以後も、土地の不動産取得税は16万円ちょうどなら必ず免税である。", "why": "免税点は「未満」。家屋は新築等66万円未満、その他34万円未満へ変更。", "ref": "地方税法73条の15の2・東京都主税局"}, {"tag": "契約書の軽減税額", "yes": "2026年4月に作成した記載金額3,000万円の紙の不動産売買契約書は、所定の軽減税額が1通1万円である。", "no": "2026年4月の3,000万円の紙の不動産売買契約書は、軽減後の印紙税が必ず1通100万円である。", "why": "1,000万円超5,000万円以下は軽減1万円。2027年3月31日まで。電子記録そのものは同じ課税文書ではない。", "ref": "租税特別措置法91条・国税庁7108"}, {"tag": "土地登記の税率", "yes": "土地売買の所有権移転登記は、2029年3月31日までの所定の登記について登録免許税率が1.5％に軽減される。", "no": "土地売買の所有権移転登記の登録免許税率1.5％は、2026年3月31日で終了し2026年4月は適用できない。", "why": "2026年改正で期限延長。本則2％と軽減1.5％を区別。相続移転の本則0.4％や免税措置は別に判断。", "ref": "租税特別措置法72条・国税庁7191"}], "lecture": ["不動産を買う時、持っている間、登記する時、契約書を作る時で税は異なります。不動産取得税は都道府県税、固定資産税は原則市町村税、登録免許税と印紙税は国税です。取得税は原則取得時、固定資産税は1月1日の所有者を基準にするため、年途中の売買での当事者間精算と納税義務は別です。", "税額の基礎は売買価格とは限りません。固定資産課税台帳の価格等を基準にし、住宅用地の課税標準の軽減など条件別の特例があります。取得税の相続による取得の非課税、登録免許税が課税される相続登記という違いも覚えます。期限付きの税率特例は年度で変わるため、教材では法定本則と明確な基本特例を中心に整理しています。"], "example": "買主が7月に買っても、その年度の固定資産税の納税義務者は原則1月1日の所有者。決済時に半年分を精算する約束は私法上の話で、自治体の納税義務が半年ずつに分かれるわけではない。", "compare": "取得税→都道府県・取得／固定資産税→市町村・保有／登録免許税→国・登記／印紙税→国・課税文書", "memory": "固定資産税標準税率1.4％・小規模住宅用地200㎡まで原則1/6・相続取得は取得税非課税", "trap": "都市計画税の1/3と固定資産税の1/6を混同しない。軽減の面積上限等の条件は必要。", "supplement": [["国税と住宅の特例の読み方", "土地の売買自体は消費税の非課税取引であり、事業者による建物譲渡や仲介サービスの課税とは分けます。住宅の貸付けも一定要件で非課税ですが、短期貸付け等の例外があります。相続税路線価は国税庁、地価公示は国の土地鑑定委員会、固定資産税評価は地方税の制度なので目的が異なります。取得税の住宅控除、新築住宅の固定資産税減額、住宅取得の登録免許税特例は、床面積、築年数・耐震、取得時期等の条件をそろえて判断します。本教材は年度改正の確認なしに期限付き税率を当てはめる計算を避け、基本の課税関係を確実に学ぶ構成です。"], ["2026年4月の取得税改正と基本税率", "本則の取得税率は4％。土地と住宅の3％特例、宅地評価土地の課税標準を価格の2分の1とする特例は2027年3月31日まで。住宅以外の建物は4％。2026年4月1日以後の免税点は土地16万円、新築・増築・改築家屋66万円、その他の家屋34万円「未満」で、ちょうどの額を免税にしない。新築住宅の1,200万円控除は床面積等の条件が必要。床面積の一般的な下限は50㎡から40㎡へ変更され、上限240㎡。地域等の例外と取得時点は公式資料で確認する。"], ["新築の固定資産税を土地特例と分ける", "固定資産税の標準税率は1.4％。住宅用地の1/6は課税標準の特例、新築住宅の1/2は建物の税額軽減で、同じ軽減ではない。一般の新築住宅は所定の住宅部分について3年間、3階建て以上の耐火・準耐火住宅等では5年間、税額を1/2にする。2026年改正で床面積下限を原則40㎡へ引下げ、適用期限を2031年3月31日へ延長。上限や住居部分などの要件がある。認定長期優良住宅の期間特例は別。2029年以後に新築する特定区域の住宅への除外は、将来の適用時点を分ける。"], ["登録免許税は床面積50㎡を維持", "土地売買の所有権移転登記は本則2％、2029年3月31日まで1.5％。相続移転は本則0.4％で限定的な免税がある。建物保存は本則0.4％。一般の自己居住用住宅の所定特例では保存0.15％、売買移転0.3％、住宅資金の抵当権設定0.1％。新築・取得の期限は2027年3月31日。床面積50㎡以上、新築・取得後1年以内の登記、市町村の証明書を申請時に添付する等の条件を満たす。取得税の40㎡をこちらへ移さない。"], ["紙の売買契約書の軽減税額", "不動産譲渡契約書は2027年3月31日まで所定の印紙税軽減がある。記載金額1,000万円超5,000万円以下なら1通につき1万円。紙の3,000万円売買契約書はこの区分になる。金額区分、文書の種類、作成日を先に判断する。文書を作らない電子契約への扱いと、電子契約を別途紙の契約書として作成する場合は区別する。"]]}, {"id": "44", "title": "譲渡所得・居住用財産の特例", "group": "税・価格評定", "sources": ["income", "home", "specialtax", "taxloss"], "article": "所得税法・租税特別措置法31〜35条", "facts": [{"tag": "長期短期の判定", "yes": "土地建物の長期譲渡所得は、譲渡年の1月1日時点で所有期間が5年を超えるものとなる。", "no": "土地建物の長短区分は、必ず売却日当日の所有期間だけで判定する。", "why": "基準日は1月1日。5年ちょうどは短期。", "ref": "租税特別措置法31・32条"}, {"tag": "利益の計算", "yes": "譲渡所得は、譲渡収入から取得費・譲渡費用等を控除して計算する。", "no": "不動産の譲渡所得は、取得費があっても常に売却代金全額と同じである。", "why": "所得は利益。適用できる特別控除も別途差し引く。", "ref": "所得税法33条"}, {"tag": "居住用控除の期間", "yes": "マイホームの3,000万円特別控除は、所有期間の長短を問わず所定条件で適用される。", "no": "マイホームの3,000万円特別控除は、所有10年超の場合だけしか使えない。", "why": "10年超の軽減税率の条件と混同しない。", "ref": "租税特別措置法35条・国税庁3302"}, {"tag": "親族への売却", "yes": "親子や夫婦など特別な関係がある人への売却は、マイホーム3,000万円特別控除の対象外である。", "no": "配偶者へ売ったマイホームにも、他の条件にかかわらず必ず3,000万円控除を使える。", "why": "対象となる譲渡相手にも条件がある。", "ref": "国税庁3302"}, {"tag": "概算取得費", "yes": "取得費が不明な場合等には、原則として譲渡収入の5％を概算取得費とすることができる。", "no": "取得費が不明なら、売却収入の全額を必ず取得費として差し引ける。", "why": "概算取得費の割合は5％。実額との扱いも確認。", "ref": "租税特別措置法31条の4"}, {"tag": "申告をする必要", "yes": "マイホームの3,000万円特別控除は、適用に確定申告等の手続が必要である。", "no": "マイホームの控除で所得がゼロなら、要件確認も申告も例外なく不要である。", "why": "特例適用は手続要件を満たす。", "ref": "国税庁3302"}, {"tag": "住まなくなった家", "yes": "以前住んでいた家は、原則住まなくなった日から3年経過する日の属する年の12月31日までの売却など所定条件で控除対象となる。", "no": "転居した翌日から、その家には3,000万円特別控除を一切使えなくなる。", "why": "転居後にも期限付きの対象範囲がある。取り壊し後等には追加条件。", "ref": "国税庁3302"}], "lecture": ["不動産を売った時の譲渡所得は、売却額そのものではなく取得費と譲渡費用等を差し引いた利益です。取得費不明なら概算取得費の制度があります。長期・短期は売却した日そのものの経過年数ではなく、譲渡年の1月1日で所有期間が5年を超えるかで判断します。給与などとは原則分離して課税します。", "マイホームの3,000万円特別控除は所有期間の長短を問わない一方、親族等への売却や適用歴など条件があります。住宅ローン控除と自由に併用できるわけではありません。10年超の居住用軽減税率等は別条件で、数字だけでなく「何を満たすとどの特例を使えるか」を確認します。期限付き特例の全条件は公式ページで確認できるよう根拠を付けています。"], "example": "2019年9月に買った土地を2025年6月に売却。2025年1月1日時点の所有期間が5年を超えるので長期として判断する。単に売却月までの年数だけで判定しない。", "compare": "長期→譲渡年1/1に5年超／短期→5年以下／利益→収入−取得費−譲渡費用−特別控除", "memory": "マイホーム控除最高3,000万円・概算取得費原則売却収入5％・特例は要件と申告が必要", "trap": "売却額3,000万円まで無税、という意味ではない。", "supplement": [["軽減税率・住宅ローン控除・損失", "マイホームの所有期間10年超等の要件を満たす軽減税率は、3,000万円特別控除と所定の条件で併用できます。住宅ローン控除は入居年等と譲渡特例の適用年との関係で併用が制限されます。居住用なら無条件に両方使えるとは言えません。買換え特例は免税ではなく課税繰延べという性質を理解します。譲渡損失の損益通算・繰越控除にも所有期間、住宅ローン、所得、譲渡期限等の条件があります。2026年4月1日法令等表示の国税庁資料で期限延長が確認できる特例でも、すべての損失に適用されるわけではありません。実務の個別申告では税務上の全条件を確認してください。"]]}, {"id": "45", "title": "地価公示・不動産鑑定評価", "group": "税・価格評定", "sources": ["publicprice", "appraisal"], "article": "地価公示法・不動産鑑定評価基準", "facts": [{"tag": "公示の基準日", "yes": "地価公示の標準地価格は、毎年1月1日時点の正常な価格を基準とする。", "no": "地価公示の価格時点は、原則毎年7月1日である。", "why": "7月1日は都道府県地価調査の原則基準日。", "ref": "地価公示法・国交省"}, {"tag": "判定する機関", "yes": "公示価格は、所定の鑑定評価を基に土地鑑定委員会が判定する。", "no": "公示価格は、各宅建業者が自由に決めてそのまま国の公示となる。", "why": "国の土地鑑定委員会が判定公示する。", "ref": "地価公示法2条"}, {"tag": "原価法の考え方", "yes": "原価法は、再調達原価に減価修正を行って価格を求める手法である。", "no": "原価法は、将来の純収益だけを資本還元する手法である。", "why": "後者は収益還元法。", "ref": "鑑定評価基準総論7章"}, {"tag": "収益の還元", "yes": "収益還元法は、将来期待される純収益の現在価値等に着目する。", "no": "収益還元法では、経費や空室を考えず家賃総額だけをそのまま物件価格にする。", "why": "純収益、還元利回り・割引率等の判断が必要。", "ref": "鑑定評価基準"}, {"tag": "比較法の補正", "yes": "取引事例比較法では、取引事情、時点、地域要因、個別要因等の比較補正を行う。", "no": "取引事例比較法は、近くの売出広告の額を何も補正せず必ず同額にする方法である。", "why": "適切な取引事例を選択して条件差を補正。", "ref": "鑑定評価基準"}, {"tag": "更地としての価格", "yes": "地価公示では建物等がある標準地でも、それがないものとしての正常な土地価格を判定する。", "no": "標準地に建物があれば、公示価格は必ず建物込みの取引総額になる。", "why": "土地そのものの正常価格を把握する。", "ref": "地価公示法2条2項"}, {"tag": "取引価格との関係", "yes": "公示価格は一般の土地取引に指標を与えるが、すべての個別売買価格を強制するものではない。", "no": "私人の土地売買は、公示価格から1円でも違うと必ず契約無効になる。", "why": "指標と法的な売買価格強制を分ける。", "ref": "地価公示法1・8条"}], "lecture": ["物件の査定では、売出価格、成約価格、公示価格、相続税路線価を同じものとして扱わないことが大切です。地価公示は標準地の1月1日時点の正常な価格を国の土地鑑定委員会が判定し公示します。建物等がある場合も土地自体の正常価格を考えるため、現況の建物付き売買価格とは違います。", "鑑定評価の基本手法は原価法、取引事例比較法、収益還元法です。再調達と減価、類似成約との比較、将来収益の現在価値という異なる見方を組み合わせます。物件の用途や市場で重視する判断によって有効な手法が変わります。個別性の強い土地では、公示価格を面積に掛けただけで正確な査定になるとは限りません。"], "example": "賃貸マンションの査定では、同じ地域の取引だけでなく収益性を考慮する。家賃収入の総額だけでなく費用や空室等を反映した純収益を基にする。", "compare": "原価法→再調達原価と減価／比較法→取引事例を補正／収益還元→純収益を現在価値へ", "memory": "地価公示1月1日・都道府県地価調査原則7月1日・土地鑑定委員会が公示価格を判定", "trap": "公示価格がそのまま全物件の強制売買価格になるわけではない。", "supplement": []}, {"id": "46", "title": "住宅金融支援機構・住宅資金", "group": "免除科目", "sources": ["finance", "flat35"], "article": "住宅金融支援機構法・機構公式案内", "facts": [{"tag": "金利の仕組み", "yes": "フラット35は、基本的に全期間固定金利の住宅ローンである。", "no": "フラット35は、必ず半年ごとに金利が変わる変動金利商品である。", "why": "金利タイプの基本。具体的水準は取扱金融機関・時期等で異なる。", "ref": "機構公式フラット35案内"}, {"tag": "民間との連携", "yes": "フラット35は、住宅金融支援機構と民間金融機関が連携して提供する。", "no": "フラット35は、民間金融機関が法律上一切関われない機構だけの制度である。", "why": "証券化支援等で民間供給を支える。", "ref": "機構法・公式案内"}, {"tag": "買取型の業務", "yes": "証券化支援の買取型では、機構が所定の住宅ローン債権を金融機関から買い取る。", "no": "買取型は、機構が全国の住宅そのものを必ず買い取る制度である。", "why": "買取対象は住宅ローン債権であり住宅所有権ではない。", "ref": "機構法13条"}, {"tag": "技術基準", "yes": "フラット35の対象住宅には、機構が定める技術基準への適合等が求められる。", "no": "フラット35は、住宅の構造や技術基準にかかわらず必ず利用できる。", "why": "借主の審査と物件基準の双方がある。", "ref": "機構公式案内"}, {"tag": "投資用への利用", "yes": "フラット35は、投資用物件の取得を目的として利用できない。", "no": "フラット35は、賃貸投資専用マンションを取得するため自由に利用できる。", "why": "住宅用途の要件。目的外利用にしない。", "ref": "機構公式案内"}, {"tag": "直接融資の存在", "yes": "住宅金融支援機構は、災害復興住宅融資など所定の直接融資業務も行う。", "no": "住宅金融支援機構は、どのような災害の場合も直接融資を一切行わない。", "why": "主力の証券化支援と限定的な直接融資を分ける。", "ref": "機構法13条・公式業務"}, {"tag": "固定金利と将来", "yes": "全期間固定金利では、市場金利が変わっても契約上の金利が自動的に市場金利へ連動するわけではない。", "no": "全期間固定金利は、市場金利が下がるたび契約金利も必ず自動的に下がる。", "why": "返済の見通しと金利変動リスクの違いを理解。", "ref": "機構公式商品説明"}], "lecture": ["住宅金融支援機構は、民間の住宅ローンを支える証券化支援などを担います。フラット35は民間金融機関と機構が連携する長期固定金利住宅ローンです。機構が全員へ無条件に直接融資するという仕組みではありません。買取型と保証型を区別し、一般の金融機関の融資との役割分担を理解します。", "返済期間を通じた固定金利は返済計画を立てやすくしますが、金利が将来下がっても契約金利が自動で同じように下がるわけではありません。借入者の審査と住宅の技術基準があり、投資用物件の購入に自由に使える制度ではありません。直接融資にも災害復興等の法定業務があるので、機構は一切直接融資をしないという断定も避けます。"], "example": "自宅購入の相談で長期返済を希望。フラット35の条件を確認し、投資用アパート購入資金と混同しない。具体的金利は月々変わるため固定暗記しない。", "compare": "証券化支援→民間ローンを支援／買取型→住宅ローン債権の買取り／保証型→所定の保険等の支援", "memory": "フラット35は全期間固定・原則自ら又は親族が住む住宅・技術基準あり", "trap": "35という名称だけからすべての借主が必ず35年借りられると推測しない。", "supplement": []}, {"id": "47", "title": "景品表示・不動産広告のルール", "group": "免除科目", "sources": ["display", "adcode", "gifts"], "article": "景品表示法・不動産の表示に関する公正競争規約", "facts": [{"tag": "徒歩の距離", "yes": "不動産広告の徒歩所要時間は、原則道路距離80mにつき1分で算出し端数を切り上げる。", "no": "徒歩所要時間は、直線距離100mにつき1分として端数を切り捨てる。", "why": "道路距離・80m・切上げの三点を確認。", "ref": "表示規約施行規則"}, {"tag": "おとりの成約済み", "yes": "成約済みで取引できない物件を集客目的で広告し続ける行為は、おとり広告に当たり得る。", "no": "成約済み物件でも、問合せ客へ別物件を勧める目的なら常に自由に広告できる。", "why": "取引不能物件による誘引を禁じる。", "ref": "景品表示法指定・表示規約"}, {"tag": "優良誤認の対象", "yes": "品質や内容が実際より著しく優良であると示す表示は、優良誤認の対象となる。", "no": "優良誤認は価格だけを対象とし、耐震性能の誇大表示には適用されない。", "why": "品質内容は優良、価格条件は有利という区別。", "ref": "景品表示法5条"}, {"tag": "新築の表示", "yes": "不動産表示規約で新築と表示するには、建築後1年未満で未入居である等の条件を満たす。", "no": "未入居なら築10年でも、規約上は無条件に新築と広告してよい。", "why": "経過期間と使用歴の双方。", "ref": "表示規約"}, {"tag": "850mの計算", "yes": "道路距離850mの徒歩所要時間は、規約基準では11分と表示する。", "no": "道路距離850mなら、徒歩時間は端数を捨てて10分と表示する。", "why": "850÷80＝10.625、切上げ11。単なる時間見積もりではない。", "ref": "表示規約施行規則"}, {"tag": "最高という表現", "yes": "最高等の特定用語は、客観的根拠等の規約上の条件なしに無制限で使えるわけではない。", "no": "最高という表現は主観なので、根拠なしでも不動産広告で常に使える。", "why": "特定用語の使用基準を確認する。", "ref": "表示規約18条"}, {"tag": "有利誤認の対象", "yes": "価格など取引条件を実際より著しく有利と誤認させる表示は、有利誤認の対象となる。", "no": "表示した値引き価格が実際より著しく有利に見えても、価格表示は景品表示法の対象外である。", "why": "品質だけでなく価格条件も保護対象。", "ref": "景品表示法5条"}], "lecture": ["広告では宅建業法だけでなく景品表示法と不動産表示の規約も確認します。おとり広告は取引できない物件や取引する意思のない物件で客を誘導する行為です。成約済みの物件を集客のため掲載し続けることも問題になります。優良誤認は品質等、有利誤認は価格等の取引条件について判断します。", "徒歩時間は道路距離80mにつき1分で端数を切り上げます。直線距離ではなく、利用できる経路を基にします。最高、抜群等の表示は客観的根拠等の条件なしに自由に使えません。規約のルールと国の法律そのものの適用を区別しながら、消費者が受ける印象を考えて広告を読む力を身につけます。"], "example": "駅から道路距離850mなら徒歩11分。信号待ち等を一律に足す計算ではなく規約の80m基準で計算し、実際の利用経路も確かめる。", "compare": "優良誤認→品質等／有利誤認→価格等／おとり→取引不能・存在しない・取引意思なし", "memory": "徒歩80m＝1分・端数切上げ・新築表示は建築後1年未満かつ未入居", "trap": "自転車なら近いことを理由に徒歩表示を短くしない。", "supplement": [["景品の上限と2025年8月改正", "不動産の景品規約では、一般の懸賞は取引価額の20倍と10万円の低い方を最高額とし、総額も予定取引総額の2％以内。懸賞によらない景品は取引価額の1/10と100万円の低い方を限度とする。取引価額は販売物件の価格と仲介手数料を常に同じ扱いにせず、提供者と取引形態で判断する。2025年8月26日施行の改正では賃貸を一定期間継続する条件の景品について、その期間の家賃を加える等の取引価額の扱いを明確化。返還される敷金等を一律に取引価額へ加えない。"]]}, {"id": "48", "title": "統計・年度を読む", "group": "免除科目", "sources": ["housingstat", "pricestat", "industrystat", "industrylatest"], "article": "国交省公表資料・2026年10月8日確認", "facts": [{"tag": "2025年計の戸数", "yes": "国交省の2025年計の新設住宅着工戸数は740,667戸である。", "no": "国交省の2025年計の新設住宅着工戸数は、2024年度末の業者数と同じ132,291戸である。", "why": "2025年計と戸数単位を確認。国交省2026年1月30日公表。", "ref": "2025年建築着工統計p2"}, {"tag": "住宅着工の動向", "yes": "2025年計の新設住宅着工戸数は前年比6.5％減で、3年連続の減少である。", "no": "2025年計の新設住宅着工は前年比6.5％増で、3年連続の増加である。", "why": "増減の符号も問われる。利用関係別も持家・貸家・分譲が減少。", "ref": "2025年建築着工統計p2"}, {"tag": "既公表の業者数", "yes": "2024年度末の宅建業者数は132,291業者である。", "no": "2024年度末の宅建業者数は740,667業者である。", "why": "年度末の業者数と暦年の住宅戸数を区別。", "ref": "2024年度施行状況調査"}, {"tag": "平均と全地点", "yes": "全国の平均地価が上昇しても、個々の地点すべてが上昇しているとは限らない。", "no": "全国平均が上昇なら、全国の全標準地が必ず値上がりしている。", "why": "平均変動率と上昇地点の割合は異なる指標。", "ref": "2026年地価公示結果"}, {"tag": "業者の増加年数", "yes": "2024年度末の宅建業者数は、11年連続で増加している。", "no": "2024年度末の宅建業者数は、11年連続で減少している。", "why": "最新補足の2025年度末12年連続増と分ける。", "ref": "2024年度施行状況調査"}, {"tag": "着工の利用関係", "yes": "2025年計の新設住宅着工は、持家・貸家・分譲住宅がいずれも減少した。", "no": "2025年計は、持家・貸家・分譲住宅がすべて増加したので全体も増加した。", "why": "主要利用関係別の方向を確認する。", "ref": "2025年建築着工統計p2"}, {"tag": "公示と調査", "yes": "地価公示は1月1日、都道府県地価調査は原則7月1日の価格時点を用いる。", "no": "地価公示と都道府県地価調査は、必ず同じ7月1日の価格だけを調べる。", "why": "名称、主体、時点をセットで判断する。", "ref": "国交省地価公示案内"}], "lecture": ["統計問題では、数字を暗記する前に「暦年か年度か」「戸数か床面積か」「全国か特定地域か」を確認します。2025年の住宅着工と2025年度の住宅着工は別です。本教材の住宅着工は2026年1月30日公表の2025年計を使用し、法令基準日後の発表だからといって統計がすべて対象外になると誤解しないでください。", "地価では全国平均が上昇してもすべての地点が上昇するわけではありません。地価公示と地価調査の基準時点を区別します。業者数は年度末のストックで、新規免許件数とは違います。2026年10月2日に公表された2025年度末の業者数は補足欄に分け、通常演習は2024年度末の既公表資料を明示して問います。実際の出題統計の採用時点は断定しません。"], "example": "広告で住宅着工が減ったという話を使うなら、2025年計74万667戸、前年比6.5％減という対象と単位を一緒に言う。別年度の増減率を混ぜない。", "compare": "2025年計→740,667戸・6.5％減・3年連続減／2024年度末業者→132,291・11年連続増／2025年度末最新補足→133,727・12年連続増", "memory": "統計の年・公表日をセット・2026年地価公示は全国全用途平均5年連続上昇", "trap": "最新公表値が必ず今年の問題に採用されるとは断定しない。", "supplement": []}, {"id": "49", "title": "土地・地形・災害の基礎", "group": "免除科目", "sources": ["terrain", "hazard"], "article": "国土地理院地形分類・気象庁防災資料", "facts": [{"tag": "後背湿地", "yes": "後背湿地は一般に低湿で、軟弱な地盤や浸水のリスクに注意が必要である。", "no": "後背湿地は、必ず台地より高く乾燥した堅固な地盤だけから成る。", "why": "河川沿いの低地の成り立ちを考える。個別調査は必要。", "ref": "国土地理院地形分類"}, {"tag": "自然堤防", "yes": "自然堤防は、河川沿いで周囲の低地よりやや高い地形として形成される。", "no": "自然堤防は、河川底だけを指し周囲より必ず低い。", "why": "洪水時の堆積等による微高地。絶対安全ではない。", "ref": "国土地理院"}, {"tag": "液状化の条件", "yes": "地下水で飽和した緩い砂質地盤等では、地震時の液状化が生じやすい。", "no": "地下水のない堅い岩盤だけが、液状化の典型的な発生場所である。", "why": "水と土粒子の構造に注目。", "ref": "気象庁・国土地理院"}, {"tag": "扇状地と土砂", "yes": "扇状地では、地形条件に応じ土石流や洪水等への注意が必要である。", "no": "扇状地という地形なら、土石流は自然法則上絶対に到達しない。", "why": "谷出口等の土砂堆積で形成される地形。", "ref": "国土地理院"}, {"tag": "旧河道の判断", "yes": "旧河道は、周囲と比べ軟弱地盤や浸水・液状化等に注意が必要な場合がある。", "no": "旧河道は、現在道路になっていれば地形上のリスクが必ず全部消える。", "why": "造成後も基盤の成り立ちを確認する。", "ref": "国土地理院"}, {"tag": "崖の調査", "yes": "崖や急斜面の周辺では、崩壊等の危険と法令上の区域指定を確認する。", "no": "崖は眺望がよければ、土砂災害に関する調査を省略して常に安全と判断できる。", "why": "利便性と安全性は別の評価軸。", "ref": "気象庁・災害資料"}, {"tag": "地図の限界", "yes": "ハザードマップで着色がないことだけで、あらゆる災害の危険がないとは断定できない。", "no": "ハザードマップで白い場所は、地震も洪水も絶対に発生しない。", "why": "対象災害と想定条件に限界がある。", "ref": "国交省ハザードマップ資料"}], "lecture": ["土地の安全性は、標高だけでなく土地の成り立ちと地盤・水の流れから考えます。自然堤防、後背湿地、旧河道、扇状地、台地はそれぞれ特徴があります。自然堤防は周囲よりやや高く比較的水はけがよい一方、後背湿地は低湿で軟弱な地盤になりやすいです。ただし地形名だけで個別の安全性を断定しません。", "液状化は水で飽和した緩い砂質地盤等で地震動により生じやすく、埋立地や旧河道などで注意します。扇状地は土石流等、崖は崩壊、低地は浸水というリスクを重ねて見ます。ハザードマップに色がないことは絶対安全の証明ではありません。現地と公的な地形図・災害情報を合わせて理解します。"], "example": "見た目が平らな住宅地でも、旧河道を埋めた場所なら地盤や浸水の課題がある。現在の外観と土地の成り立ちの両方を調べる。", "compare": "自然堤防→相対的高地／後背湿地→低湿・軟弱傾向／旧河道→浸水・軟弱等／扇状地→土砂災害にも注意", "memory": "液状化は地下水・緩い砂質等が条件・大雨の崖と谷出口に注意", "trap": "地形分類だけで個別物件の安全保証をしない。", "supplement": []}, {"id": "50", "title": "建物・構造・材料の基礎", "group": "免除科目", "sources": ["structure", "building"], "article": "国交省建築資料・建築基準法", "facts": [{"tag": "コンクリートの性質", "yes": "コンクリートは一般に圧縮に強く、引張には弱い。", "no": "コンクリートは一般に引張に強く、圧縮にはほとんど抵抗できない。", "why": "鉄筋との組合せで弱点を補う。", "ref": "国交省建築資料"}, {"tag": "鉄筋の役割", "yes": "鉄筋コンクリートでは、鉄筋が主に引張力への抵抗を補う。", "no": "RC造では、鉄筋は見た目のためだけに入れ構造上の役割がない。", "why": "圧縮と引張の役割分担が基本。", "ref": "建築構造の基礎"}, {"tag": "木造の水平力", "yes": "木造では、筋かいや構造用面材等が地震等の水平力への抵抗に寄与する。", "no": "木造の筋かいは、構造上地震力への抵抗に一切役立たない。", "why": "耐力壁等を適切に配置する。", "ref": "国交省木造耐震資料"}, {"tag": "鉄骨と高温", "yes": "鉄骨は高温になると強度等が低下するため、必要に応じ耐火被覆等を施す。", "no": "鉄骨は火災の高温でも強度が絶対に変わらず、耐火対策は常に不要である。", "why": "材料の強度と火災時の性能は別に考える。", "ref": "国交省防耐火資料"}, {"tag": "不同沈下", "yes": "不同沈下は、建物の部分によって沈下量が異なる現象である。", "no": "不同沈下は、建物全体が均一に同じ量だけ下がることだけをいう。", "why": "不均一な変形が建物に影響する。", "ref": "建築基礎・地盤資料"}, {"tag": "免震の目的", "yes": "免震は、地盤から建物への地震動の伝達を低減する仕組みである。", "no": "免震は、地盤の地震そのものを消滅させる工法である。", "why": "地震発生を止めるのではなく伝達を制御する。", "ref": "国交省耐震資料"}, {"tag": "表面結露", "yes": "室内空気に触れる表面温度が露点以下となると、表面結露が生じ得る。", "no": "表面結露は、室内湿度や表面温度と無関係に必ず発生する。", "why": "温度・水蒸気量・換気・断熱等を合わせて考える。", "ref": "建築環境の基礎"}], "lecture": ["建物の構造は、荷重をどの部材で受け、どこへ流すかを考えると理解できます。木造では筋かいや構造用面材等で水平力に抵抗し、鉄筋コンクリートではコンクリートの圧縮への強さと鉄筋の引張への強さを組み合わせます。鉄骨は軽く強い一方、高温時の性能低下に備えて耐火被覆等を用います。", "不同沈下は場所によって沈下量が違う状態で、基礎や上部構造に影響します。断熱と結露、耐震と制震・免震も目的と手段を分けます。構造種別だけで耐震性や寿命を一律に保証できません。設計、施工、維持管理、地盤という複数の要素を考える視点が、実務の説明にも役立ちます。"], "example": "RCだから鉄筋が不要なのではない。コンクリートが圧縮を、鉄筋が主に引張を負担する組合せをイメージすると、ひび割れや配筋の意味がわかる。", "compare": "RC→鉄筋＋コンクリート／S造→鉄骨／耐震→抵抗／制震→エネルギー吸収／免震→地震動の伝達低減", "memory": "コンクリートは圧縮に強く引張に弱い・鉄筋は引張を補う・鉄骨は高温対策", "trap": "構造名だけで耐震性や安全性を断定しない。", "supplement": []}], "questions": [{"id": "P-01-1", "unit": "01", "group": "権利関係", "bank": "practice", "stem": "制限行為能力・契約の入口に関する次の記述のうち、正しいものはどれか。〔検討テーマ：意思能力〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "成年被後見人が日用品を購入した場合も、後見人は常に取り消せる。", "truth": false, "why": "日用品の購入その他日常生活に関する行為には取消しの例外がある。", "ref": "9条", "unit": "01", "sources": ["civil"]}, {"text": "被保佐人の不動産処分には、保佐人の同意は一切必要ない。", "truth": false, "why": "不動産その他重要な財産に関する権利の得喪は同意を要する重要行為。", "ref": "13条", "unit": "01", "sources": ["civil"]}, {"text": "法定代理人の同意なく未成年者がした土地売却は、必ず初めから無効である。", "truth": false, "why": "取消し得る行為であって当然無効ではない。単に権利を得、義務を免れる行為等は別扱い。", "ref": "5条", "unit": "01", "sources": ["civil"]}, {"text": "意思表示をした時に意思能力がなければ、その法律行為は無効である。", "truth": true, "why": "意思能力の欠如は無効の問題であり、制限行為能力による取消しとは異なる。", "ref": "3条の2", "unit": "01", "sources": ["civil"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-01-2", "unit": "01", "group": "権利関係", "bank": "practice", "stem": "制限行為能力・契約の入口に関する次の記述のうち、正しいものはどれか。〔検討テーマ：未成年の売却〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "意思能力を欠いていても、売買契約は取り消されるまでは有効である。", "truth": false, "why": "意思能力の欠如は無効の問題であり、制限行為能力による取消しとは異なる。", "ref": "3条の2", "unit": "01", "sources": ["civil"]}, {"text": "成年被後見人が日用品を購入した場合も、後見人は常に取り消せる。", "truth": false, "why": "日用品の購入その他日常生活に関する行為には取消しの例外がある。", "ref": "9条", "unit": "01", "sources": ["civil"]}, {"text": "被保佐人の不動産処分には、保佐人の同意は一切必要ない。", "truth": false, "why": "不動産その他重要な財産に関する権利の得喪は同意を要する重要行為。", "ref": "13条", "unit": "01", "sources": ["civil"]}, {"text": "未成年者の同意のない土地売却は、原則として取り消すことができる。", "truth": true, "why": "取消し得る行為であって当然無効ではない。単に権利を得、義務を免れる行為等は別扱い。", "ref": "5条", "unit": "01", "sources": ["civil"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-01-3", "unit": "01", "group": "権利関係", "bank": "practice", "stem": "制限行為能力・契約の入口に関する次の記述のうち、正しいものはどれか。〔検討テーマ：後見と生活〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "被保佐人の不動産処分には、保佐人の同意は一切必要ない。", "truth": false, "why": "不動産その他重要な財産に関する権利の得喪は同意を要する重要行為。", "ref": "13条", "unit": "01", "sources": ["civil"]}, {"text": "成年被後見人が行った日用品の購入は、行為能力を理由には取り消せない。", "truth": true, "why": "日用品の購入その他日常生活に関する行為には取消しの例外がある。", "ref": "9条", "unit": "01", "sources": ["civil"]}, {"text": "法定代理人の同意なく未成年者がした土地売却は、必ず初めから無効である。", "truth": false, "why": "取消し得る行為であって当然無効ではない。単に権利を得、義務を免れる行為等は別扱い。", "ref": "5条", "unit": "01", "sources": ["civil"]}, {"text": "意思能力を欠いていても、売買契約は取り消されるまでは有効である。", "truth": false, "why": "意思能力の欠如は無効の問題であり、制限行為能力による取消しとは異なる。", "ref": "3条の2", "unit": "01", "sources": ["civil"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-01-4", "unit": "01", "group": "権利関係", "bank": "practice", "stem": "制限行為能力・契約の入口に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：保佐の土地処分〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "意思表示をした時に意思能力がなければ、その法律行為は無効である。", "truth": true, "why": "意思能力の欠如は無効の問題であり、制限行為能力による取消しとは異なる。", "ref": "3条の2", "unit": "01", "sources": ["civil"]}, {"text": "被保佐人の不動産処分には、保佐人の同意は一切必要ない。", "truth": false, "why": "不動産その他重要な財産に関する権利の得喪は同意を要する重要行為。", "ref": "13条", "unit": "01", "sources": ["civil"]}, {"text": "成年被後見人が行った日用品の購入は、行為能力を理由には取り消せない。", "truth": true, "why": "日用品の購入その他日常生活に関する行為には取消しの例外がある。", "ref": "9条", "unit": "01", "sources": ["civil"]}, {"text": "未成年者の同意のない土地売却は、原則として取り消すことができる。", "truth": true, "why": "取消し得る行為であって当然無効ではない。単に権利を得、義務を免れる行為等は別扱い。", "ref": "5条", "unit": "01", "sources": ["civil"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M1-01-5", "unit": "01", "group": "権利関係", "bank": "mock1", "stem": "権利関係の総合判断（関連単元：01）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：相手方の催告〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "詐欺による取消しは、悪意の第三者にも対抗できない。", "truth": false, "why": "保護されるのは善意無過失の第三者。悪意の転売先には取消しを対抗できる。", "ref": "96条3項", "unit": "02", "sources": ["civil"]}, {"text": "制限行為能力者は、能力者だと信じさせる詐術を用いても必ず取り消せる。", "truth": false, "why": "取引相手を積極的に欺いた者には行為能力の保護による取消しを認めない。", "ref": "21条", "unit": "01", "sources": ["civil"]}, {"text": "未成年者の法定代理人への追認催告は、1か月以上の期間を定めて行う。", "truth": true, "why": "法定の催告期間は1か月以上。催告先と返答の効果を一緒に確認する。", "ref": "20条", "unit": "01", "sources": ["civil"]}, {"text": "未成年者が負担のない贈与を受けるにも、例外なく法定代理人の同意が必要である。", "truth": false, "why": "単に権利を得、又は義務を免れる行為は同意不要。負担付贈与とは分ける。", "ref": "5条", "unit": "01", "sources": ["civil"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "M2-01-6", "unit": "01", "group": "権利関係", "bank": "mock2", "stem": "権利関係の総合判断（関連単元：01）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：能力を偽る行為〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "未成年者の法定代理人への追認催告は、1か月以上の期間を定めて行う。", "truth": true, "why": "法定の催告期間は1か月以上。催告先と返答の効果を一緒に確認する。", "ref": "20条", "unit": "01", "sources": ["civil"]}, {"text": "強迫による意思表示は、相手方に過失がなくても取り消せる。", "truth": true, "why": "第三者詐欺の相手方要件を強迫に持ち込まない。", "ref": "96条", "unit": "02", "sources": ["civil"]}, {"text": "制限行為能力者は、能力者だと信じさせる詐術を用いても必ず取り消せる。", "truth": false, "why": "取引相手を積極的に欺いた者には行為能力の保護による取消しを認めない。", "ref": "21条", "unit": "01", "sources": ["civil"]}, {"text": "未成年者は、負担のない贈与を受ける契約を法定代理人の同意なく行える。", "truth": true, "why": "単に権利を得、又は義務を免れる行為は同意不要。負担付贈与とは分ける。", "ref": "5条", "unit": "01", "sources": ["civil"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "M3-01-7", "unit": "01", "group": "権利関係", "bank": "mock3", "stem": "権利関係の総合判断（関連単元：01）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：権利だけを得る行為〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "未成年者の法定代理人に3日間の期限で催告すれば、沈黙は法定の追認とみなされる。", "truth": false, "why": "法定の催告期間は1か月以上。催告先と返答の効果を一緒に確認する。", "ref": "20条", "unit": "01", "sources": ["civil"]}, {"text": "将来値上がりすると心の中で期待していれば、その期待だけで必ず錯誤取消しができる。", "truth": false, "why": "単なる内心の期待では足りない。基礎事情の表示と重要性等が必要。", "ref": "95条2項", "unit": "02", "sources": ["civil"]}, {"text": "制限行為能力者は、能力者だと信じさせる詐術を用いても必ず取り消せる。", "truth": false, "why": "取引相手を積極的に欺いた者には行為能力 "id": "P-02-3", "unit": "02", "group": "権利関係", "bank": "practice", "stem": "意思表示・錯誤・詐欺・強迫に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：重要な錯誤〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "通謀虚偽表示の無効は、善意の第三者に対抗できない。", "truth": true, "why": "虚偽の外観を自ら作った当事者より、それを信じた第三者を保護する。", "ref": "94条", "unit": "02", "sources": ["civil"]}, {"text": "心裡留保でも、相手方が真意でないことを知らず知ることもできなかった場合、原則として有効である。", "truth": true, "why": "心裡留保は原則有効。相手方が知り又は知ることができた場合は無効となる。", "ref": "93条", "unit": "02", "sources": ["civil"]}, {"text": "現行民法では、重要な錯誤による意思表示は取消しではなく当然無効である。", "truth": false, "why": "2020年施行改正で錯誤の効果は無効から取消しに変わった。", "ref": "95条", "unit": "02", "sources": ["civil"]}, {"text": "第三者が詐欺をした場合、相手方がその事実を知り又は知ることができたときに取り消せる。", "truth": true, "why": "相手方にも悪意又は過失がある場合に取消しが認められる。", "ref": "96条2項", "unit": "02", "sources": ["civil"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-02-4", "unit": "02", "group": "権利関係", "bank": "practice", "stem": "意思表示・錯誤・詐欺・強迫に関する次の記述のうち、正しいものはどれか。〔検討テーマ：第三者による詐欺〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "第三者が詐欺をした場合、相手方がその事実を知り又は知ることができたときに取り消せる。", "truth": true, "why": "相手方にも悪意又は過失がある場合に取消しが認められる。", "ref": "96条2項", "unit": "02", "sources": ["civil"]}, {"text": "通謀虚偽表示の無効は、善意の第三者にも常に対抗できる。", "truth": false, "why": "虚偽の外観を自ら作った当事者より、それを信じた第三者を保護する。", "ref": "94条", "unit": "02", "sources": ["civil"]}, {"text": "冗談のつもりで行った意思表示は、相手方の認識にかかわらず常に無効である。", "truth": false, "why": "心裡留保は原則有効。相手方が知り又は知ることができた場合は無効となる。", "ref": "93条", "unit": "02", "sources": ["civil"]}, {"text": "現行民法では、重要な錯誤による意思表示は取消しではなく当然無効である。", "truth": false, "why": "2020年施行改正で錯誤の効果は無効から取消しに変わった。", "ref": "95条", "unit": "02", "sources": ["civil"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M1-02-5", "unit": "02", "group": "権利関係", "bank": "mock1", "stem": "権利関係の総合判断（関連単元：02）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：転売先の保護〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "無権代理と知らなかった相手方も、本人の追認前に契約を取り消すことはできない。", "truth": false, "why": "契約時に無権代理を知っていた相手方にはこの取消権がない。", "ref": "115条", "unit": "03", "sources": ["civil"]}, {"text": "将来値上がりすると心の中で期待していれば、その期待だけで必ず錯誤取消しができる。", "truth": false, "why": "単なる内心の期待では足りない。基礎事情の表示と重要性等が必要。", "ref": "95条2項", "unit": "02", "sources": ["civil"]}, {"text": "第三者の強迫による意思表示は、相手方が悪意の場合だけ取り消せる。", "truth": false, "why": "第三者詐欺の相手方要件を強迫に持ち込まない。", "ref": "96条", "unit": "02", "sources": ["civil"]}, {"text": "詐欺による取消しは、善意かつ無過失の第三者に対抗できない。", "truth": true, "why": "保護されるのは善意無過失の第三者。悪意の転売先には取消しを対抗できる。", "ref": "96条3項", "unit": "02", "sources": ["civil"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M2-02-6", "unit": "02", "group": "権利関係", "bank": "mock2", "stem": "権利関係の総合判断（関連単元：02）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：脅迫と取消し〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "基礎とした事情に関する錯誤では、その事情が法律行為の基礎とされていることの表示が必要である。", "truth": true, "why": "単なる内心の期待では足りない。基礎事情の表示と重要性等が必要。", "ref": "95条2項", "unit": "02", "sources": ["civil"]}, {"text": "詐欺による取消しは、善意かつ無過失の第三者に対抗できない。", "truth": true, "why": "保護されるのは善意無過失の第三者。悪意の転売先には取消しを対抗できる。", "ref": "96条3項", "unit": "02", "sources": ["civil"]}, {"text": "本人の追認は、別段の意思表示がなければ契約時に遡って効力を生ずるが、第三者の権利を害せない。", "truth": true, "why": "遡及が原則で、第三者保護が限界になる。", "ref": "116条", "unit": "03", "sources": ["civil"]}, {"text": "第三者の強迫による意思表示は、相手方が悪意の場合だけ取り消せる。", "truth": false, "why": "第三者詐欺の相手方要件を強迫に持ち込まない。", "ref": "96条", "unit": "02", "sources": ["civil"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M3-02-7", "unit": "02", "group": "権利関係", "bank": "mock3", "stem": "権利関係の総合判断（関連単元：02）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：動機の食い違い〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "詐欺による取消しは、悪意の第三者にも対抗できない。", "truth": false, "why": "保護されるのは善意無過失の第三者。悪意の転売先には取消しを対抗できる。", "ref": "96条3項", "unit": "02", "sources": ["civil"]}, {"text": "基礎とした事情に関する錯誤では、その事情が法律行為の基礎とされていることの表示が必要である。", "truth": true, "why": "単なる内心の期待では足りない。基礎事情の表示と重要性等が必要。", "ref": "95条2項", "unit": "02", "sources": ["civil"]}, {"text": "第三者の強迫による意思表示は、相手方が悪意の場合だけ取り消せる。", "truth": false, "why": "第三者詐欺の相手方要件を強迫に持ち込まない。", "ref": "96条", "unit": "02", "sources": ["civil"]}, {"text": "本人があらかじめ許諾しても、双方代理は例外なく無権代理になる。", "truth": false, "why": "債務の履行と本人の事前許諾は例外。単なる便宜だけで例外にはならない。", "ref": "108条", "unit": "03", "sources": ["civil"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-03-1", "unit": "03", "group": "権利関係", "bank": "practice", "stem": "代理・無権代理・表見代理に関する次の記述のうち、正しいものはどれか。〔検討テーマ：代理の法律効果〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "権限内で本人のためにすることを示した代理行為の効果は、原則として本人に直接帰属する。", "truth": true, "why": "代理人を経由して権利が移るのではなく、本人が契約当事者になる。", "ref": "99条", "unit": "03", "sources": ["civil"]}, {"text": "未成年者を売買の代理人に選任すると、その代理行為は年齢だけを理由に常に取り消せる。", "truth": false, "why": "代理人の行為能力と本人の行為能力は区別する。", "ref": "102条", "unit": "03", "sources": ["civil"]}, {"text": "無権代理の相手方は、本人に追認の催告をすることが法律上禁止される。", "truth": false, "why": "相手方を不安定な状態から解放するため催告権がある。", "ref": "114条", "unit": "03", "sources": ["civil"]}, {"text": "無権代理の追認催告に本人が沈黙した場合、追認したものとみなされる。", "truth": false, "why": "制限行為能力の法定代理人への催告と逆の効果。", "ref": "114条", "unit": "03", "sources": ["civil"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-03-2", "unit": "03", "group": "権利関係", "bank": "practice", "stem": "代理・無権代理・表見代理に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：代理人の能力〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "無権代理の相手方は、本人に相当の期間を定めて追認するか催告できる。", "truth": true, "why": "相手方を不安定な状態から解放するため催告権がある。", "ref": "114条", "unit": "03", "sources": ["civil"]}, {"text": "追認の催告に本人が期間内に確答しないときは、追認を拒絶したものとみなされる。", "truth": true, "why": "制限行為能力の法定代理人への催告と逆の効果。", "ref": "114条", "unit": "03", "sources": ["civil"]}, {"text": "未成年者を売買の代理人に選任すると、その代理行為は年齢だけを理由に常に取り消せる。", "truth": false, "why": "代理人の行為能力と本人の行為能力は区別する。", "ref": "102条", "unit": "03", "sources": ["civil"]}, {"text": "権限内で本人のためにすることを示した代理行為の効果は、原則として本人に直接帰属する。", "truth": true, "why": "代理人を経由して権利が移るのではなく、本人が契約当事者になる。", "ref": "99条", "unit": "03", "sources": ["civil"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-03-3", "unit": "03", "group": "権利関係", "bank": "practice", "stem": "代理・無権代理・表見代理に関する次の記述のうち、正しいものはどれか。〔検討テーマ：本人の返事待ち〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "未成年者を売買の代理人に選任すると、その代理行為は年齢だけを理由に常に取り消せる。", "truth": false, "why": "代理人の行為能力と本人の行為能力は区別する。", "ref": "102条", "unit": "03", "sources": ["civil"]}, {"text": "無権代理の相手方は、本人に相当の期間を定めて追認するか催告できる。", "truth": true, "why": "相手方を不安定な状態から解放するため催告権がある。", "ref": "114条", "unit": "03", "sources": ["civil"]}, {"text": "無権代理の追認催告に本人が沈黙した場合、追認したものとみなされる。", "truth": false, "why": "制限行為能力の法定代理人への催告と逆の効果。", "ref": "114条", "unit": "03", "sources": ["civil"]}, {"text": "適法な代理による売買の効果は、まず代理人に帰属し、その後本人に移転する。", "truth": false, "why": "代理人を経由して権利が移るのではなく、本人が契約当事者になる。", "ref": "99条", "unit": "03", "sources": ["civil"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-03-4", "unit": "03", "group": "権利関係", "bank": "practice", "stem": "代理・無権代理・表見代理に関する次の記述のうち、正しいものはどれか。〔検討テーマ：沈黙の効果〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "追認の催告に本人が期間内に確答しないときは、追認を拒絶したものとみなされる。", "truth": true, "why": "制限行為能力の法定代理人への催告と逆の効果。", "ref": "114条", "unit": "03", "sources": ["civil"]}, {"text": "無権代理の相手方は、本人に追認の催告をすることが法律上禁止される。", "truth": false, "why": "相手方を不安定な状態から解放するため催告権がある。", "ref": "114条", "unit": "03", "sources": ["civil"]}, {"text": "適法な代理による売買の効果は、まず代理人に帰属し、その後本人に移転する。", "truth": false, "why": "代理人を経由して権利が移るのではなく、本人が契約当事者になる。", "ref": "99条", "unit": "03", "sources": ["civil"]}, {"text": "未成年者を売買の代理人に選任すると、その代理行為は年齢だけを理由に常に取り消せる。", "truth": false, "why": "代理人の行為能力と本人の行為能力は区別する。", "ref": "102条", "unit": "03", "sources": ["civil"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M1-03-5", "unit": "03", "group": "権利関係", "bank": "mock1", "stem": "権利関係の総合判断（関連単元：03）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：相手方の取消し〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "無権代理であることを契約時に知らなかった相手方は、本人の追認前なら契約を取り消せる。", "truth": true, "why": "契約時に無権代理を知っていた相手方にはこの取消権がない。", "ref": "115条", "unit": "03", "sources": ["civil"]}, {"text": "本人があらかじめ許諾しても、双方代理は例外なく無権代理になる。", "truth": false, "why": "債務の履行と本人の事前許諾は例外。単なる便宜だけで例外にはならない。", "ref": "108条", "unit": "03", "sources": ["civil"]}, {"text": "債務者が債務を承認しても、消滅時効には一切影響しない。", "truth": false, "why": "一部弁済等が承認と評価される場合もある。具体的事実の判断が必要。", "ref": "152条", "unit": "04", "sources": ["civil"]}, {"text": "無権代理の追認は必ず追認時からだけ有効であり、契約時に遡らない。", "truth": false, "why": "遡及が原則で、第三者保護が限界になる。", "ref": "116条", "unit": "03", "sources": ["civil"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M2-03-6", "unit": "03", "group": "権利関係", "bank": "mock2", "stem": "権利関係の総合判断（関連単元：03）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：追認の時点〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "無権代理であることを契約時に知らなかった相手方は、本人の追認前なら契約を取り消せる。", "truth": true, "why": "契約時に無権代理を知っていた相手方にはこの取消権がない。", "ref": "115条", "unit": "03", "sources": ["civil"]}, {"text": "無権代理の追認は必ず追認時からだけ有効であり、契約時に遡らない。", "truth": false, "why": "遡及が原則で、第三者保護が限界になる。", "ref": "116条", "unit": "03", "sources": ["civil"]}, {"text": "時効の利益は、あらかじめ放棄できない。", "truth": true, "why": "時効完成前の利益の事前放棄は禁止。完成後とは分ける。", "ref": "146条", "unit": "04", "sources": ["civil"]}, {"text": "双方代理は原則禁止されるが、本人があらかじめ許諾した行為等は例外となる。", "truth": true, "why": "債務の履行と本人の事前許諾は例外。単なる便宜だけで例外にはならない。", "ref": "108条", "unit": "03", "sources": ["civil"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M3-03-7", "unit": "03", "group": "権利関係", "bank": "mock3", "stem": "権利関係の総合判断（関連単元：03）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：双方の代理〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "無権代理の追認は必ず追認時からだけ有効であり、契約時に遡らない。", "truth": false, "why": "遡及が原則で、第三者保護が限界になる。", "ref": "116条", "unit": "03", "sources": ["civil"]}, {"text": "双方代理は原則禁止されるが、本人があらかじめ許諾した行為等は例外となる。", "truth": true, "why": "債務の履行と本人の事前許諾は例外。単なる便宜だけで例外にはならない。", "ref": "108条", "unit": "03", "sources": ["civil"]}, {"text": "無権代理と知らなかった相手方も、本人の追認前に契約を取り消すことはできない。", "truth": false, "why": "契約時に無権代理を知っていた相手方にはこの取消権がない。", "ref": "115条", "unit": "03", "sources": ["civil"]}, {"text": "所有権も使用しなければ、一般債権と同じく5年で当然に消滅する。", "truth": false, "why": "他人による取得時効は別問題。所有権それ自体の消滅時効とは異なる。", "ref": "166条2項", "unit": "04", "sources": ["civil"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-04-1", "unit": "04", "group": "権利関係", "bank": "practice", "stem": "時効・期間・権利の消滅に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：一般債権の時効〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "所有の意思をもつ平穏公然の占有が始まった時に善意無過失なら、10年で所有権を時効取得し得る。", "truth": true, "why": "10年には善意と無過失の双方が必要。", "ref": "162条", "unit": "04", "sources": ["civil"]}, {"text": "一般債権は、権利行使できると知った時から必ず20年間は時効にならない。", "truth": false, "why": "主観的起算点5年と客観的起算点10年の二本立て。", "ref": "166条", "unit": "04", "sources": ["civil"]}, {"text": "催告があると、その時から6か月を経過するまで時効の完成が猶予される。", "truth": true, "why": "催告は完成猶予であり更新ではない。", "ref": "150条", "unit": "04", "sources": ["civil"]}, {"text": "時効は、当事者等が援用しなければ裁判所がそれに基づいて裁判できない。", "truth": true, "why": "期間経過と訴訟での援用を分ける。", "ref": "145条", "unit": "04", "sources": ["civil"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-04-2", "unit": "04", "group": "権利関係", "bank": "practice", "stem": "時効・期間・権利の消滅に関する次の記述のうち、正しいものはどれか。〔検討テーマ：取得時効の短期〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "裁判所は時効期間の経過を発見したら、援用がなくても必ず時効を適用する。", "truth": false, "why": "期間経過と訴訟での援用を分ける。", "ref": "145条", "unit": "04", "sources": ["civil"]}, {"text": "催告状を送れば、時効期間は常に最初から5年間に更新される。", "truth": false, "why": "催告は完成猶予であり更新ではない。", "ref": "150条", "unit": "04", "sources": ["civil"]}, {"text": "所有の意思をもつ平穏公然の占有が始まった時に善意無過失なら、10年で所有権を時効取得し得る。", "truth": true, "why": "10年には善意と無過失の双方が必要。", "ref": "162条", "unit": "04", "sources": ["civil"]}, {"text": "一般債権は、権利行使できると知った時から必ず20年間は時効にならない。", "truth": false, "why": "主観的起算点5年と客観的起算点10年の二本立て。", "ref": f": "233条3項", "unit": "06", "sources": ["civil"]}, {"text": "隣地の竹木の根が境界線を越えるときは、土地所有者がその根を切り取れる。", "truth": true, "why": "根と枝は規律が異なる。枝に関する例外を根にそのまま当てはめない。", "ref": "233条4項", "unit": "06", "sources": ["civil"]}, {"text": "抵当権に対抗できない一定の建物賃借人は、買受けから6か月間の明渡猶予を受けられる。", "truth": true, "why": "民法395条は一定の建物使用者を対象にする。土地賃貸借に一般化しない。", "ref": "395条", "unit": "07", "sources": ["civil"]}, {"text": "共有物分割をしない旨の契約は、5年以内の期間で定められる。", "truth": true, "why": "不分割契約は5年以内、更新もその時から5年以内。", "ref": "256条", "unit": "06", "sources": ["civil"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M3-06-7", "unit": "06", "group": "権利関係", "bank": "mock3", "stem": "権利関係の総合判断（関連単元：06）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：越境した根〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "根抵当権は極度額を超えて無制限に債権を担保する。", "truth": false, "why": "極度額が担保責任の上限。普通抵当の特定債権への付従性と対比する。", "ref": "398条の2・398条の3", "unit": "07", "sources": ["civil"]}, {"text": "隣地の竹木の根が境界線を越えるときは、土地所有者がその根を切り取れる。", "truth": true, "why": "根と枝は規律が異なる。枝に関する例外を根にそのまま当てはめない。", "ref": "233条4項", "unit": "06", "sources": ["civil"]}, {"text": "共有物の分割を永久に禁止する契約を、民法の原則どおり自由に締結できる。", "truth": false, "why": "不分割契約は5年以内、更新もその時から5年以内。", "ref": "256条", "unit": "06", "sources": ["civil"]}, {"text": "越境した枝は、催告や急迫事情などに関係なく土地所有者が常に直ちに切除できる。", "truth": false, "why": "催告後不履行、所有者又は所在不明、急迫事情等の法定要件が必要。", "ref": "233条3項", "unit": "06", "sources": ["civil"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-07-1", "unit": "07", "group": "権利関係", "bank": "practice", "stem": "抵当権・担保・物上代位に関する次の記述のうち、正しいものはどれか。〔検討テーマ：家の使用継続〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "抵当権者は、保険金が所有者へ払い渡された後でも差押え不要で常に物上代位できる。", "truth": false, "why": "払渡し等前の差押えにより代替価値を確保する。", "ref": "372条・304条", "unit": "07", "sources": ["civil"]}, {"text": "抵当権の優先順位は、融資金額の大きい順に決まる。", "truth": false, "why": "金額の大小ではなく登記の先後が原則。", "ref": "373条", "unit": "07", "sources": ["civil"]}, {"text": "抵当権設定者は、原則として抵当不動産の占有を移さず使用を続けられる。", "truth": true, "why": "抵当権は非占有型の担保権。", "ref": "369条", "unit": "07", "sources": ["civil"]}, {"text": "抵当権設定時に更地であった土地に後から家を建てれば、土地競売時に必ず法定地上権が成立する。", "truth": false, "why": "設定時の建物存在と同一所有等が必要。更地への後築とは違う。", "ref": "388条", "unit": "07", "sources": ["civil"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-07-2", "unit": "07", "group": "権利関係", "bank": "practice", "stem": "抵当権・担保・物上代位に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：火災保険金〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "抵当権設定者は、原則として抵当不動産の占有を移さず使用を続けられる。", "truth": true, "why": "抵当権は非占有型の担保権。", "ref": "369条", "unit": "07", "sources": ["civil"]}, {"text": "同一不動産に複数の抵当権がある場合、その順位は原則として登記の前後による。", "truth": true, "why": "金額の大小ではなく登記の先後が原則。", "ref": "373条", "unit": "07", "sources": ["civil"]}, {"text": "抵当権者は、保険金が所有者へ払い渡された後でも差押え不要で常に物上代位できる。", "truth": false, "why": "払渡し等前の差押えにより代替価値を確保する。", "ref": "372条・304条", "unit": "07", "sources": ["civil"]}, {"text": "抵当権設定時に土地と建物が同一所有者に属し、実行で所有者が異なった場合、法定地上権が成立し得る。", "truth": true, "why": "設定時の建物存在と同一所有等が必要。更地への後築とは違う。", "ref": "388条", "unit": "07", "sources": ["civil"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-07-3", "unit": "07", "group": "権利関係", "bank": "practice", "stem": "抵当権・担保・物上代位に関する次の記述のうち、正しいものはどれか。〔検討テーマ：建物を残す権利〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "抵当権は、必ず銀行に住宅の占有を移さなければ成立しない。", "truth": false, "why": "抵当権は非占有型の担保権。", "ref": "369条", "unit": "07", "sources": ["civil"]}, {"text": "抵当権設定時に土地と建物が同一所有者に属し、実行で所有者が異なった場合、法定地上権が成立し得る。", "truth": true, "why": "設定時の建物存在と同一所有等が必要。更地への後築とは違う。", "ref": "388条", "unit": "07", "sources": ["civil"]}, {"text": "抵当権の優先順位は、融資金額の大きい順に決まる。", "truth": false, "why": "金額の大小ではなく登記の先後が原則。", "ref": "373条", "unit": "07", "sources": ["civil"]}, {"text": "抵当権者は、保険金が所有者へ払い渡された後でも差押え不要で常に物上代位できる。", "truth": false, "why": "払渡し等前の差押えにより代替価値を確保する。", "ref": "372条・304条", "unit": "07", "sources": ["civil"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-07-4", "uni "why": "主債務契約が諾成でも保証契約には方式が必要。", "ref": "446条", "unit": "08", "sources": ["civil", "rate"]}, {"text": "個人根保証契約は、極度額を定めなければ効力を生じない。", "truth": true, "why": "個人保証人に想定外の無限定責任を負わせないための要件。", "ref": "465条の2", "unit": "08", "sources": ["civil", "rate"]}, {"text": "連帯保証人には、催告の抗弁権と検索の抗弁権がない。", "truth": true, "why": "連帯保証は催告・検索の抗弁がない。保証自体の付従性とは別。", "ref": "454条", "unit": "08", "sources": ["civil", "rate"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-08-2", "unit": "08", "group": "権利関係", "bank": "practice", "stem": "債務不履行・保証・弁済・相殺に関する次の記述のうち、正しいものはどれか。〔検討テーマ：保証書の形式〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "保証契約は、書面又は内容を記録した電磁的記録によらなければ効力を生じない。", "truth": true, "why": "主債務契約が諾成でも保証契約には方式が必要。", "ref": "446条", "unit": "08", "sources": ["civil", "rate"]}, {"text": "金銭債務は、不可抗力があれば常に遅延損害金を免れる。", "truth": false, "why": "金銭債務について民法419条が特則を置く。", "ref": "419条", "unit": "08", "sources": ["civil", "rate"]}, {"text": "連帯保証人も普通保証人と同じく、まず主債務者へ請求せよと催告の抗弁を主張できる。", "truth": false, "why": "連帯保証は催告・検索の抗弁がない。保証自体の付従性とは別。", "ref": "454条", "unit": "08", "sources": ["civil", "rate"]}, {"text": "個人が家賃を根保証する場合、極度額を定めなくても常に有効である。", "truth": false, "why": "個人保証人に想定外の無限定責任を負わせないための要件。", "ref": "465条の2", "unit": "08", "sources": ["civil", "rate"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-08-3", "unit": "08", "group": "権利関係", "bank": "practice", "stem": "債務不履行・保証・弁済・相殺に関する次の記述のうち、正しいものはどれか。〔検討テーマ：個人の根保証〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "保証契約は口頭だけでも、書面と同じく必ず有効である。", "truth": false, "why": "主債務契約が諾成でも保証契約には方式が必要。", "ref": "446条", "unit": "08", "sources": ["civil", "rate"]}, {"text": "個人根保証契約は、極度額を定めなければ効力を生じない。", "truth": true, "why": "個人保証人に想定外の無限定責任を負わせないための要件。", "ref": "465条の2", "unit": "08", "sources": ["civil", "rate"]}, {"text": "金銭債務は、不可抗力があれば常に遅延損害金を免れる。", "truth": false, "why": "金銭債務について民法419条が特則を置く。", "ref": "419条", "unit": "08", "sources": ["civil", "rate"]}, {"text": "連帯保証人も普通保証人と同じく、まず主債務者へ請求せよと催告の抗弁を主張できる。", "truth": false, "why": "連帯保証は催告・検索の抗弁がない。保証自体の付従性とは別。", "ref": "454条", "unit": "08", "sources": ["civil", "rate"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-08-4", "unit": "08", "group": "権利関係", "bank": "practice", "stem": "債務不履行・保証・弁済・相殺に関する次の記述のうち、正しいものはどれか。〔検討テーマ：連帯保証の抗弁〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "連帯保証人には、催告の抗弁権と検索の抗弁権がない。", "truth": true, "why": "連帯保証は催告・検索の抗弁がない。保証自体の付従性とは別。", "ref": "454条", "unit": "08", "sources": ["civil", "rate"]}, {"text": "金銭債務は、不可抗力があれば常に遅延損害金を免れる。", "truth": false, "why": "金銭債務について民法419条が特則を置く。", "ref": "419条", "unit": "08", "sources": ["civil", "rate"]}, {"text": "保証契約は口頭だけでも、書面と同じく必ず有効である。", "truth": false, "why": "主債務契約が諾成でも保証契約には方式が必要。", "ref": "446条", "unit": "08", "sources": ["civil", "rate"]}, {"text": "個人が家賃を根保証する場合、極度額を定めなくても常に有効である。", "truth": false, "why": "個人保証人に想定外の無限定責任を負わせないための要件。", "ref": "465条の2", "unit": "08", "sources": ["civil", "rate"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M1-08-5", "unit": "08", "group": "権利関係", "bank": "mock1", "stem": "権利関係の総合判断（関連単元：08）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：2026年の利率〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "全部履行不能でも、解除には必ず相当期間の催告をしなければならない。", "truth": false, "why": "催告をしても目的が達成できないため無催告解除の類型となる。", "ref": "542条", "unit": "09", "sources": ["civil"]}, {"text": "相殺の意思表示には、任意の停止条件を自由に付けられる。", "truth": false, "why": "相殺適状の要件と相殺の意思表示を分ける。", "ref": "506条", "unit": "08", "sources": ["civil", "rate"]}, {"text": "債権者が受領を拒むと、債務者は供託をしても永久に債務を免れない。", "truth": false, "why": "供託は弁済の代替手段となる。受領拒否等の要件が必要。", "ref": "494条", "unit": "08", "sources": ["civil", "rate"]}, {"text": "2026年4月1日から2029年3月31日までの法定利率は年3％である。", "truth": true, "why": "法務省公表の第3期法定利率は年3％のまま。約定利率とは区別する。", "ref": "404条・法務省告示説明", "unit": "08", "sources": ["civil", "rate"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M2-08-6", "unit": "08", "group": "権利関係", "bank": "mock2", "stem": "権利関係の総合判断（関連単元：08）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：相殺の通知〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "債権者が受領を拒む場合等に、債務者は法定要件の下で弁済供託によって債務を免れられる。", "truth": true, "why": "供託は弁済の代替手段となる。受領拒否等の要件が必要。", "ref": "494条", "unit": "08", "sources": ["civil", "rate"]}, {"text": "相殺の意思表示には、任意の停止条件を自由に付けられる。", "truth": false, "why": "相殺適状の要件と相殺の意思表示を分ける。", "ref": "506条", "unit": "08", "sources": ["civil", "rate"]}, {"text": "2026年4月1日から2029年3月31日までの法定利率は年3％である。", "truth": true, "why": "法務省公表の第3期法定利率は年3％のまま。約定利率とは区別する。", "ref": "404条・法務省告示説明", "unit": "08", "sources": ["civil", "rate"]}, {"text": "売主は、知りながら告げなかった事実については、免責特約があっても責任を免れない。", "truth": true, "why": "免責特約にも法定の限界がある。", "ref": "572条", "unit": "09", "sources": ["civil"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M3-08-7", "unit": "08", "group": "権利関係", "bank": "mock3", "stem": "権利関係の総合判断（関連単元：08）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：受領できない債権者〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "債権者が受領を拒む場合等に、債務者は法定要件の下で弁済供託によって債務を免れられる。", "truth": true, "why": "供託は弁済の代替手段となる。受領拒否等の要件が必要。", "ref": "494条", "unit": "08", "sources": ["civil", "rate"]}, {"text": "2026年4月1日から法定利率は自動的に年5％へ戻った。", "truth": false, "why": "法務省公表の第3期法定利率は年3％のまま。約定利率とは区別する。", "ref": "404条・法務省告示説明", "unit": "08", "sources": ["civil", "rate"]}, {"text": "代金減額請求は、追完の可能性にかかわらず常に催告なしでのみ行う。", "truth": false, "why": "原則催告が必要。追完不能等には無催告減額の例外がある。", "ref": "563条", "unit": "09", "sources": ["civil"]}, {"text": "相殺の意思表示には、任意の停止条件を自由に付けられる。", "truth": false, "why": "相殺適状の要件と相殺の意思表示を分ける。", "ref": "506条", "unit": "08", "sources": ["civil", "rate"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-09-1", "unit": "09", "group": "権利関係", "bank": "practice", "stem": "売買・解除・契約不適合に関する次の記述のうち、正しいものはどれか。〔検討テーマ：修理の請求〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "種類又は品質の不適合の通知期限は、民法上例外なく引渡しから1年である。", "truth": false, "why": "起算点は知った時。売主の悪意又は重過失の場合は通知期間の制限が適用されない。", "ref": "566条", "unit": "09", "sources": ["civil"]}, {"text": "引き渡された物が種類・品質・数量について契約に適合しない場合、買主は原則として追完を請求できる。", "truth": true, "why": "追完は修補、代替物、不足分の引渡し等。買主の帰責事由がある場合は別。", "ref": "562条", "unit": "09", "sources": ["civil"]}, {"text": "契約の解除には、例外なく債務者の故意又は過失が必要である。", "truth": false, "why": "解除と損害賠償で帰責事由の扱いが違う。軽微な不履行では催告解除できない。", "ref": "541条", "unit": "09", "sources": ["civil"]}, {"text": "解約手付による解除は、相手方が履行に着手した後も買主が自由にできる。", "truth": false, "why": "判断は解除する者自身ではなく相手方の履行着手。", "ref": "557条", "unit": "09", "sources": ["civil"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-09-2", "unit": "09", "group": "権利関係", "bank": "practice", "stem": "売買・解除・契約不適合に関する次の記述のうち、正しいものはどれか。〔検討テーマ：催告後の解除〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "解約手付による解除は、相手方が履行に着手した後も買主が自由にできる。", "truth": false, "why": "判断は解除する者自身ではなく相手方の履行着手。", "ref": "557条", "unit": "09", "sources": ["civil"]}, {"text": "債務不履行の催告解除は、債務者に帰責事由がない場合でも要件を満たせば可能である。", "truth": true, "why": "解除と損害賠償で帰責事由の扱いが違う。軽微な不履行では催告解除できない。", "ref": "541条", "unit": "09", "sources": ["civil"]}, {"text": "契約不適合があっても、買主は修補や代替物の引渡しを一切請求できない。", "truth": false, "why": "追完は修補、代替物、不足分の引渡し等。買主の帰責事由がある場合は別。", "ref": "562条", "unit": "09", "sources": ["civil"]}, {"text": "種類又は品質の不適合の通知期限は、民法上例外なく引渡しから1年である。", "truth": false, "why": "起算点は知った時。売主の悪意又は重過失の場合は通知期間の制限が適用されない。", "ref": "566条", "unit": "09", "sources": ["civil"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "P-09-3", "unit": "09", "group": "権利関係", "bank": "practice", "stem": "売買・解除・契約不適合に関する次の記述のうち、正しいものはどれか。〔検討テーマ：通知の起算点〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "解約手付による解除は、相手方が履行に着手した後も買主が自由にできる。", "truth": false, "why": "判断は解除する者自身ではなく相手方の履行着手。", "ref": "557条", "unit": "09", "sources": ["civil"]}, {"text": "契約の解除には、例外なく債務者の故意又は過失が必要である。", "truth": false, "why": "解除と損害賠償で帰責事由の扱いが違う。軽微な不履行では催告解除できない。", "ref": "541条", "unit": "09", "sources": ["civil"]}, {"text": "契約不適合があっても、買主は修補や代替物の引渡しを一切請求できない。", "truth": false, "why": "追完は修補、代替物、不足分の引渡し等。買主の帰責事由がある場合は別。", "ref": "562条", "unit": "09", "sources": ["civil"]}, {"text": "種類又は品質の不適合は、原則として買主が知った時から1年以内に売主へ通知する必要がある。", "truth": true, "why": "起算点は知った時。売主の悪意又は重過失の場合は通知期間の制限が適用されない。", "ref": "566条", "unit": "09", "sources": ["civil"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-09-4", "unit": "09", "group": "権利関係", "bank": "practice", "stem": "売買・解除・契約不適合に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：手付と履行着手〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "種類又は品質の不適合は、原則として買主が知った時から1年以内に売主へ通知する必要がある。", "truth": true, "why": "起算点は知った時。売主の悪意又は重過失の場合は通知期間の制限が適用されない。", "ref": "566条", "unit": "09", "sources": ["civil"]}, {"text": "引き渡された物が種類・品質・数量について契約に適合しない場合、買主は原則として追完を請求できる。", "truth": true, "why": "追完は修補、代替物、不足分の引渡し等。買主の帰責事由がある場合は別。", "ref": "562条", "unit": "09", "sources": ["civil"]}, {"text": "債務不履行の催告解除は、債務者に帰責事由がない場合でも要件を満たせば可能である。", "truth": true, "why": "解除と損害賠償で帰責事由の扱いが違う。軽微な不履行では催告解除できない。", "ref": "541条", "unit": "09", "sources": ["civil"]}, {"text": "解約手付による解除は、相手方が履行に着手した後も買主が自由にできる。", "truth": false, "why": "判断は解除する者自身ではなく相手方の履行着手。", "ref": "557条", "unit": "09", "sources": ["civil"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M1-09-5", "unit": "09", "group": "権利関係", "bank": "mock1", "stem": "権利関係の総合判断（関連単元：09）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：全部履行不能〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "代金減額請求は、追完の可能性にかかわらず常に催告なしでのみ行う。", "truth": false, "why": "原則催告が必要。追完不能等には無催告減額の例外がある。", "ref": "563条", "unit": "09", "sources": ["civil"]}, {"text": "売主が雨漏りを知りながら黙っていても、免責特約があれば必ず免責される。", "truth": false, "why": "免責特約にも法定の限界がある。", "ref": "572条", "unit": "09", "sources": ["civil"]}, {"text": "生命又は身体の侵害でも、短期消滅時効は必ず知った時から3年である。", "truth": false, "why": "被害者保護のため5年とする特則。", "ref": "724条の2", "unit": "10", "sources": ["civil"]}, {"text": "債務全部の履行が不能となったとき、債権者は原則として催告なく解除できる。", "truth": true, "why": "催告をしても目的が達成できないため無催告解除の類型となる。", "ref": "542条", "unit": "09", "sources": ["civil"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M2-09-6", "unit": "09", "group": "権利関係", "bank": "mock2", "stem": "権利関係の総合判断（関連単元：09）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：知っていた不具合〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "共同不法行為の各加害者は、原則として連帯して損害賠償責任を負う。", "truth": true, "why": "被害者に対する連帯責任と加害者間の内部負担は別。", "ref": "719条", "unit": "10", "sources": ["civil"]}, {"text": "買主は原則として相当期間を定めて追完を催告し、期間内に追完がなければ不適合に応じた代金減額を請求できる。", "truth": true, "why": "原則催告が必要。追完不能等には無催告減額の例外がある。", "ref": "563条", "unit": "09", "sources": ["civil"]}, {"text": "債務全部の履行が不能となったとき、債権者は原則として催告なく解除できる。", "truth": true, "why": "催告をしても目的が達成できないため無催告解除の類型となる。", "ref": "542条", "unit": "09", "sources": ["civil"]}, {"text": "売主が雨漏りを知りながら黙っていても、免責特約があれば必ず免責される。", "truth": false, "why": "免責特約にも法定の限界がある。", "ref": "572条", "unit": "09", "sources": ["civil"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M3-09-7", "unit": "09", "group": "権利関係", "bank": "mock3", "stem": "権利関係の総合判断（関連単元：09）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：減額と追完〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "買主は原則として相当期間を定めて追完を催告し、期間内に追完がなければ不適合に応じた代金減額を請求できる。", "truth": true, "why": "原則催告が必要。追完不能等には無催告減額の例外がある。", "ref": "563条", "unit": "09", "sources": ["civil"]}, {"text": "使用者が被害者へ賠償すると、被用者に対する求償は法律上すべて禁止される。", "truth": false, "why": "求償は認められ得るが、信義則による制限等の個別判断がある。", "ref": "715条3項", "unit": "10", "sources": ["civil"]}, {"text": "全部履行不能でも、解除には必ず相当期間の催告をしなければならない。", "truth": false, "why": "催告をしても目的が達成できないため無催告解除の類型となる。", "ref": "542条", "unit": "09", "sources": ["civil"]}, {"text": "売主が雨漏りを知りながら黙っていても、免責特約があれば必ず免責される。", "truth": false, "why": "免責特約にも法定の限界がある。", "ref": "572条", "unit": "09", "sources": ["civil"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-10-1", "unit": "10", "group": "権利関係", "bank": "practice", "stem": "不法行為・損害賠償に関する次の記述のうち、正しいものはどれか。〔検討テーマ：基本の責任〕", "pre": "2026年 た場合は、通知から6か月後に終了を対抗できる。", "ref": "38条6項", "unit": "13", "sources": ["lease", "civil"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M2-12-6", "unit": "12", "group": "権利関係", "bank": "mock2", "stem": "権利関係の総合判断（関連単元：12）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：公正証書の意味〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "賃貸借が終了して賃貸物を返還したとき、貸主は未払債務を差し引いた敷金を返還する。", "truth": true, "why": "敷金は担保であり、残債務を控除した残額を返す。", "ref": "民法622条の2", "unit": "13", "sources": ["lease", "civil"]}, {"text": "事業用定期借地権は、普通の私署契約書だけで公正証書と同じく設定できる。", "truth": false, "why": "事業用は公正証書必須。一般定期との方式差を覚える。", "ref": "23条3項", "unit": "12", "sources": ["lease"]}, {"text": "普通借地の更新拒絶には、土地利用の必要性、従前の経過、利用状況、財産給付の申出等を考慮した正当事由が必要である。", "truth": true, "why": "契約終了の主張だけでは足りず正当事由が必要。", "ref": "6条", "unit": "12", "sources": ["lease"]}, {"text": "事業用定期借地権は、居住用建物の所有を目的として設定できない。", "truth": true, "why": "事業という語より「居住用を除く建物」の要件が重要。", "ref": "23条", "unit": "12", "sources": ["lease"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M3-12-7", "unit": "12", "group": "権利関係", "bank": "mock3", "stem": "権利関係の総合判断（関連単元：12）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：更新を拒む地主〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "退去時は、通常損耗や経年変化も民法の原則により借主が必ず全額負担する。", "truth": false, "why": "特約の有効性は別途検討。原則と特約を分ける。", "ref": "民法621条", "unit": "13", "sources": ["lease", "civil"]}, {"text": "事業用定期借地権は、普通の私署契約書だけで公正証書と同じく設定できる。", "truth": false, "why": "事業用は公正証書必須。一般定期との方式差を覚える。", "ref": "23条3項", "unit": "12", "sources": ["lease"]}, {"text": "賃貸マンション経営は事業なので、居住用マンションにも事業用定期借地権を設定できる。", "truth": false, "why": "事業という語より「居住用を除く建物」の要件が重要。", "ref": "23条", "unit": "12", "sources": ["lease"]}, {"text": "普通借地の更新拒絶には、土地利用の必要性、従前の経過、利用状況、財産給付の申出等を考慮した正当事由が必要である。", "truth": true, "why": "契約終了の主張だけでは足りず正当事由が必要。", "ref": "6条", "unit": "12", "sources": ["lease"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-13-1", "unit": "13", "group": "権利関係", "bank": "practice", "stem": "借家・定期借家・賃貸借に関する次の記述の 額を無条件で返還しなければならない。", "truth": false, "why": "敷金は担保であり、残債務を控除した残額を返す。", "ref": "民法622条の2", "unit": "13", "sources": ["lease", "civil"]}, {"text": "期間1年以上の定期借家では、貸主は原則満了の1年前から6か月前までに終了通知をする。", "truth": true, "why": "通知を遅れてした場合は、通知から6か月後に終了を対抗できる。", "ref": "38条6項", "unit": "13", "sources": ["lease", "civil"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "M2-13-6", "unit": "13", "group": "権利関係", "bank": "mock2", "stem": "権利関係の総合判断（関連単元：13）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：敷金の返還〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "通常の使用収益による損耗と経年変化は、民法の原則では借主の原状回復義務から除かれる。", "truth": true, "why": "特約の有効性は別途検討。原則と特約を分ける。", "ref": "民法621条", "unit": "13", "sources": ["lease", "civil"]}, {"text": "敷金は、未払家賃があっても常に全額を無条件で返還しなければならない。", "truth": false, "why": "敷金は担保であり、残債務を控除した残額を返す。", "ref": "民法622条の2", "unit": "13", "sources": ["lease", "civil"]}, {"text": "期間1年以上の定期借家では、貸主は原則満了の1年前から6か月前までに終了通知をする。", "truth": true, "why": "通知を遅れてした場合は、通知から6か月後に終了を対抗できる。", "ref": "38条6項", "unit": "13", "sources": ["lease", "civil"]}, {"text": "建替え決議の多数要件は原則区分所有者と議決権の各5分の4以上で、所定の客観的事由がある場合に緩和される。", "truth": true, "why": "総数基準の原則5分の4を維持。耐震性不足等の法定事由で各4分の3等へ緩和する。", "ref": "62条", "unit": "14", "sources": ["condo", "condochanges"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M3-13-7", "unit": "13", "group": "権利関係", "bank": "mock3", "stem": "権利関係の総合判断（関連単元：13）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：通常損耗〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "敷金は、未払家賃があっても常に全額を無条件で返還しなければならない。", "truth": false, "why": "敷金は担保であり、残債務を控除した残額を返す。", "ref": "民法622条の2", "unit": "13", "sources": ["lease", "civil"]}, {"text": "期間1年以上の定期借家でも、終了通知は満了前日に行えば常に満了時の終了を対抗できる。", "truth": false, "why": "通知を遅れてした場合は、通知から6か月後に終了を対抗できる。", "ref": "38条6項", "unit": "13", "sources": ["lease", "civil"]}, {"text": "通常の使用収益による損耗と経年変化は、民法の原則では借主の原状回復義務から除かれる。", "truth": true, "why": "特約の有効性は別途検討。原則と特約を分ける。", "ref": "民法621条", "unit": "13", "sources": ["lease", "civil"]}, {"text": "改正後は出席者基準になったので、規約変更に法定の定足数は一切ない。", "truth": false, "why": "出席者基準と定足数はセット。規約で法定原則より重い定足数を定められる。", "ref": "31条", "unit": "14", "sources": ["condo", "condochanges"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-14-1", "unit": "14", "group": "権利関係", "bank": "practice", "stem": "区分所有・マンションの決議に関する次の記述のうち、正しいものはどれか。〔検討テーマ：共用廊下の扱い〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "2026年4月1日以後も規約変更の賛成要件は、例外なく全区分所有者と全議決権の各4分の3以上のままである。", "truth": false, "why": "改正により出席者基準へ。定足数や特別影響者の承諾を省略してはいけない。", "ref": "31条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "中古マンションの買主は、前の所有者の時代の規約に一切拘束されない。", "truth": false, "why": "売買で取得した買主も規約等の効力を受ける。", "ref": "46条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "構造上区分所有者全員の共用に供される廊下は、専有部分の目的とならない。", "truth": true, "why": "法定共用部分は構造上の共用性により専有部分にできない。", "ref": "4条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "マンションの敷地利用権は、規約の定めに関係なく常に専有部分と自由に分離処分できる。", "truth": false, "why": "分離処分禁止が原則で、規約による別段の定め等には例外がある。", "ref": "22条", "unit": "14", "sources": ["condo", "condochanges"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-14-2", "unit": "14", "group": "権利関係", "bank": "practice", "stem": "区分所有・マンションの決議に関する次の記述のうち、正しいものはどれか。〔検討テーマ：規約変更の母数〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "2026年4月1日以後の法定原則では、規約変更は所定の定足数の下で出席した区分所有者と議決権の各4分の3以上で決する。", "truth": true, "why": "改正により出席者基準へ。定足数や特別影響者の承諾を省略してはいけない。", "ref": "31条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "中古マンションの買主は、前の所有者の時代の規約に一切拘束されない。", "truth": false, "why": "売買で取得した買主も規約等の効力を受ける。", "ref": "46条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "マンションの敷地利用権は、規約の定めに関係なく常に専有部分と自由に分離処分できる。", "truth": false, "why": "分離処分禁止が原則で、規約による別段の定め等には例外がある。", "ref": "22条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "共用廊下は、規約で定めれば必ず一人の専有部分に変更できる。", "truth": false, "why": "法定共用部分は構造上の共用性により専有部分にできない。", "ref": "4条", "unit": "14", "sources": ["condo", "condochanges"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-14-3", "unit": "14", "group": "権利関係", "bank": "practice", "stem": "区分所有・マンションの決議に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：敷地利用権の分離〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "マンションの敷地利用権は、規約の定めに関係なく常に専有部分と自由に分離処分できる。", "truth": false, "why": "分離処分禁止が原則で、規約による別段の定め等には例外がある。", "ref": "22条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "2026年4月1日以後の法定原則では、規約変更は所定の定足数の下で出席した区分所有者と議決権の各4分の3以上で決する。", "truth": true, "why": "改正により出席者基準へ。定足数や特別影響者の承諾を省略してはいけない。", "ref": "31条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "構造上区分所有者全員の共用に供される廊下は、専有部分の目的とならない。", "truth": true, "why": "法定共用部分は構造上の共用性により専有部分にできない。", "ref": "4条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "規約及び集会の決議は、区分所有者の特定承継人にも効力を生ずる。", "truth": true, "why": "売買で取得した買主も規約等の効力を受ける。", "ref": "46条", "unit": "14", "sources": ["condo", "condochanges"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "P-14-4", "unit": "14", "group": "権利関係", "bank": "practice", "stem": "区分所有・マンションの決議に関する次の記述のうち、正しいものはどれか。〔検討テーマ：買主への規約効力〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "共用廊下は、規約で定めれば必ず一人の専有部分に変更できる。", "truth": false, "why": "法定共用部分は構造上の共用性により専有部分にできない。", "ref": "4条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "マンションの敷地利用権は、規約の定めに関係なく常に専有部分と自由に分離処分できる。", "truth": false, "why": "分離処分禁止が原則で、規約による別段の定め等には例外がある。", "ref": "22条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "規約及び集会の決議は、区分所有者の特定承継人にも効力を生ずる。", "truth": true, "why": "売買で取得した買主も規約等の効力を受ける。", "ref": "46条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "2026年4月1日以後も規約変更の賛成要件は、例外なく全区分所有者と全議決権の各4分の3以上のままである。", "truth": false, "why": "改正により出席者基準へ。定足数や特別影響者の承諾を省略してはいけない。", "ref": "31条", "unit": "14", "sources": ["condo", "condochanges"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "M1-14-5", "unit": "14", "group": "権利関係", "bank": "mock1", "stem": "権利関係の総合判断（関連単元：14）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：保存行為〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "未成年者の法定代理人に3日間の期限で催告すれば、沈黙は法定の追認とみなされる。", "truth": false, "why": "法定の催告期間は1か月以上。催告先と返答の効果を一緒に確認する。", "ref": "20条", "unit": "01", "sources": ["civil"]}, {"text": "共用部分の保存行為は、原則として各共有者ができるが、規約で別段の定めを置ける。", "truth": true, "why": "保存、管理、著しい変更、建替えを分ける。", "ref": "18条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "改正後は出席者基準になったので、規約変更に法定の定足数は一切ない。", "truth": false, "why": "出席者基準と定足数はセット。規約で法定原則より重い定足数を定められる。", "ref": "31条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "2026年改正で、すべての建替えは出席者の単純過半数だけで可能になった。", "truth": false, "why": "総数基準の原則5分の4を維持。耐震性不足等の法定事由で各4分の3等へ緩和する。", "ref": "62条", "unit": "14", "sources": ["condo", "condochanges"]}], "answer": 1, "checked": "2026-10-08"}, {"id": "M2-14-6", "unit": "14", "group": "権利関係", "bank": "mock2", "stem": "権利関係の総合判断（関連単元：14）に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：建替えの原則〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options": [{"text": "2026年改正で、すべての建替えは出席者の単純過半数だけで可能になった。", "truth": false, "why": "総数基準の原則5分の4を維持。耐震性不足等の法定事由で各4分の3等へ緩和する。", "ref": "62条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "改正後の規約変更では、法定原則として区分所有者数と議決権それぞれの過半数が出席する必要がある。", "truth": true, "why": "出席者基準と定足数はセット。規約で法定原則より重い定足数を定められる。", "ref": "31条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "共用部分の保存行為は、原則として各共有者ができるが、規約で別段の定めを置ける。", "truth": true, "why": "保存、管理、著しい変更、建替えを分ける。", "ref": "18条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "制限行為能力者が行為能力者だと信じさせるため詐術を用いた場合、当該行為を取り消せない。", "truth": true, "why": "取引相手を積極的に欺いた者には行為能力の保護による取消しを認めない。", "ref": "21条", "unit": "01", "sources": ["civil"]}], "answer": 0, "checked": "2026-10-08"}, {"id": "M3-14-7", "unit": "14", "group": "権利関係", "bank": "mock3", "stem": "権利関係の総合判断（関連単元：14）に関する次の記述のうち、正しいものはどれか。〔検討テーマ：欠席者と定足数〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "2026年改正で、すべての建替えは出席者の単純過半数だけで可能になった。", "truth": false, "why": "総数基準の原則5分の4を維持。耐震性不足等の法定事由で各4分の3等へ緩和する。", "ref": "62条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "共用部分の保存行為は、必ず建替えと同じ総数5分の4の決議が必要である。", "truth": false, "why": "保存、管理、著しい変更、建替えを分ける。", "ref": "18条", "unit": "14", "sources": ["condo", "condochanges"]}, {"text": "未成年者が負担のない贈与を受けるにも、例外なく法定代理人の同意が必要である。", "truth": false, "why": "単に権利を得、又は義務を免れる行為は同意不要。負担付贈与とは分ける。", "ref": "5条", "unit": "01", "sources": ["civil"]}, {"text": "改正後の規約変更では、法定原則として区分所有者数と議決権それぞれの過半数が出席する必要がある。", "truth": true, "why": "出席者基準と定足数はセット。規約で法定原則より重い定足数を定められる。", "ref": "31条", "unit": "14", "sources": ["condo", "condochanges"]}], "answer": 3, "checked": "2026-10-08"}, {"id": "P-15-1", "unit": "15", "group": "宅建業法", "bank": "practice", "stem": "宅建業の範囲・免許に関する次の記述のうち、正しいものはどれか。〔検討テーマ：賃貸の取引形態〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": true, "options": [{"text": "宅建業免許の有効期間は、宅建士登録と同じく無期限である。", "truth": false, "why": "免許5年、宅建士登録は更新制ではない。", "ref": "3条2項", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "知事免許業者は、その都道府県内の物件しか取り扱えない。", "truth": false, "why": "免許区分は営業対象地域を制限するものではない。", "ref": "3条の解釈", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "自ら所有建物を賃貸する行為は、宅建業法の宅建業に含まれない。", "truth": true, "why": "自己賃貸は対象外。賃貸の代理又は媒介は対象になる。", "ref": "2条2号", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}, {"text": "二つ以上の都道府県に所在する物件を扱うだけで、必ず大臣免許が必要である。", "truth": false, "why": "判断基準は物件所在地ではなく事務所設置。", "ref": "3条", "unit": "15", "sources": ["takken", "takkenrules", "takkenorder"]}], "answer": 2, "checked": "2026-10-08"}, {"id": "P-15-2", "unit": "15", "group": "宅建業法", "bank": "practice", "stem": "宅建業の範囲・免許に関する次の記述のうち、誤っているものはどれか。〔検討テーマ：免許を分ける場所〕", "pre": "2026年4月1日施行法令による。特に記載がなければ法定の原則で判断する。", "askTruth": false, "options":
